<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Timeline Diff</title>
<style>
:root,[data-theme="dark"]{--bg:#1e1e1e;--card:#2a2a2a;--text:#dcd8d0;--border:#333;--green:#8fbc5a;--red:#ff4444;--yellow:#d4a017;--accent:#b58900;--base01:#97978a;--base2:#2a2a2a;--base3:#1e1e1e;--hover-bg:rgba(255,255,255,0.08);--sel-bg:rgba(255,255,255,0.16)}
[data-theme="light"]{--bg:#fdf6e3;--card:#eee8d5;--text:#073642;--border:#d3cbb7;--green:#859900;--red:#dc322f;--yellow:#b58900;--accent:#cb4b16;--base01:#97978a;--base2:#eee8d5;--base3:#fdf6e3;--hover-bg:rgba(0,0,0,0.06);--sel-bg:rgba(0,0,0,0.13)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--base01);border-radius:3px}
::selection{background:#ffd302;color:#000}
[data-theme="dark"] ::selection{background:#ffd302;color:#000}
input::selection, textarea::selection{background:#ffd302;color:#000}

/* ═══ TITLE ROW ═══ */
#title-row{height:36px;background:var(--card);display:flex;align-items:center;padding:0 8px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0;-webkit-app-region:drag}
#input-wrap{flex:1;position:relative;display:flex;align-items:center;min-width:0}
#title-row .title-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 34px 3px 8px;border-radius:4px;font-size:11px;font-family:Tahoma,ui-monospace,monospace;outline:none;-webkit-app-region:no-drag;min-width:0}
#title-row .title-input:hover{border-color:var(--yellow)}
#title-row .title-input:focus{border-color:var(--yellow)}
#title-row .win-btn{-webkit-app-region:no-drag;width:28px;height:26px;border:none;background:transparent;color:var(--base01);font-size:14px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#title-row .win-btn:hover{background:var(--border)}
.hist-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:26px;font-size:11px;color:var(--base01);border-radius:3px;z-index:2;font-weight:700}
.hist-btn:hover{color:var(--yellow);background:var(--bg)}
#drag-handle{width:56px;height:100%;display:flex;align-items:center;justify-content:center;opacity:.55;flex-shrink:0}
#drag-handle:hover{opacity:1}
.fuzzy-dropdown{position:absolute;top:100%;left:0;right:0;z-index:300;margin-top:2px}
.fuzzy-dropdown-list{background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,0.5);max-height:260px;overflow-y:auto}
.fuzzy-item{padding:5px 10px;font-size:11px;font-family:Tahoma,ui-monospace,monospace;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px}
.fuzzy-item:last-child{border-bottom:none}
.fuzzy-item:hover{background:var(--hover-bg)}
.fuzzy-item.active{background:var(--sel-bg)}
.fuzzy-item .fi-icon{flex-shrink:0;font-size:11px}

/* ═══ CUSTOM DROPDOWN ═══ */
.v-dropdown{position:relative;flex:1;max-width:420px;min-width:120px;cursor:pointer;user-select:none}
.v-dropdown-btn{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px;font-family:Tahoma,ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.v-dropdown-btn:hover{border-color:var(--yellow)}
.v-dropdown-btn::after{content:' ▼';font-size:9px;margin-left:auto;color:var(--base01)}
/* 展开时按钮与列表共用一个虚线框 */
.v-dropdown.open .v-dropdown-btn{border:1px dashed var(--base01);border-bottom:1px dashed var(--base01);border-radius:4px 4px 0 0}
.v-dropdown-list{display:none;position:absolute;top:100%;left:0;right:0;max-height:260px;overflow-y:auto;background:var(--card);border:1px dashed var(--base01);border-top:none;border-radius:0 0 4px 4px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
.v-dropdown.open .v-dropdown-list{display:block}
.v-dropdown-item{padding:4px 8px;font-size:11px;font-family:Tahoma,ui-monospace,monospace;font-weight:400;cursor:pointer;white-space:nowrap;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px;position:relative}
.v-dropdown-item:last-child{border-bottom:none}
.v-dropdown-item:hover{background:var(--hover-bg)}
.v-dropdown-item.selected{background:var(--sel-bg)}
.v-dropdown-item .v-stat-green,.v-dropdown-btn .v-stat-green{color:var(--green);font-weight:700}
.v-dropdown-item .v-stat-red,.v-dropdown-btn .v-stat-red{color:var(--red);font-weight:700;margin-left:0.2em}
.v-date-md{font-weight:700}
.v-dropdown-item .v-copy-btn{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:18px;border:1px solid var(--border);border-radius:3px;background:var(--card);color:var(--text);font-size:10px;cursor:pointer;line-height:1;padding:0}
.v-dropdown-item:hover .v-copy-btn{display:block}
.v-dropdown-item .v-copy-btn:hover{background:var(--yellow);color:#000}
.v-dropdown-item .v-marker{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:3px}
.v-dropdown-item .v-marker.before{background:var(--yellow);color:#000}
.v-dropdown-item .v-marker.after{background:#4a6b2a;color:#fff}
.v-dropdown-item .v-marker.first{background:var(--accent);color:#fff}
.v-dropdown-item .v-marker.last{background:var(--red);color:#fff}
/* 来源标签 — 虚线框强调 */
.v-source-tag{border:1px dashed var(--base01);border-radius:3px;padding:1px 6px;font-size:11px;font-weight:400;margin-left:5px;white-space:nowrap;letter-spacing:0.3px}
/* f 楼层数字用主题金色 */
.v-fnum{color:#e0553a}

/* ═══ VERSION BAR ═══ */
#version-bar{height:44px;background:var(--card);display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.version-panel{flex:1;display:flex;align-items:center;padding:0 10px;gap:6px}
.version-panel:first-child{border-right:1px solid var(--border)}
.version-panel .v-label{font-size:10px;color:var(--base01);text-transform:uppercase;white-space:nowrap;min-width:36px}

/* ═══ ACTIONS BAR ═══ */
#actions-bar{height:32px;background:var(--card);display:flex;align-items:center;padding:0 8px;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0}
.act-btn{font-size:10px;padding:3px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}
.act-btn:hover{background:var(--border)}
.act-btn.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.act-btn.accept{background:var(--green);color:#fff;border-color:var(--green);display:none}
.act-btn.accept.visible{display:inline-block}
.act-btn.danger{background:var(--red);color:#fff;border-color:var(--red);display:none}
.act-btn.danger.visible{display:inline-block}
.act-sep{width:1px;height:16px;background:var(--border);margin:0 4px}

/* ═══ DIFF CONTAINER ═══ */
#diff-container{flex:1;overflow:hidden}

/* ═══ STATUSBAR ═══ */
#statusbar{height:22px;background:var(--card);display:flex;align-items:center;padding:0 10px;font-size:10px;color:var(--base01);border-top:1px solid var(--border);flex-shrink:0}
#statusbar .stat{font-family:Tahoma,ui-monospace,monospace}
#statusbar .stat.added{color:var(--green)}
#statusbar .stat.deleted{color:var(--red)}

/* ═══ EMPTY STATE ═══ */
#empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--base01);font-size:13px}

/* ═══ BIG CLOSE BUTTON ═══ */
#big-close{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:2px solid var(--red);background:var(--card);color:var(--red);font-size:24px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all .15s}
#big-close:hover{background:var(--red);color:#fff;transform:translateX(-50%) scale(1.1)}
</style>
<script>
(function(){var p=new URLSearchParams(location.search);var t=p.get('theme')||'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');})();
</script>
</head>
<body>

<!-- ★ 标题行 -->
<div id="title-row">
  <span style="font-size:13px;flex-shrink:0;-webkit-app-region:no-drag">📄</span>
  <div id="input-wrap" style="flex:1;position:relative;display:flex;align-items:center;-webkit-app-region:no-drag">
    <input class="title-input" id="title-input" placeholder="文件路径…" autocomplete="off" spellcheck="false">
    <button class="win-btn hist-btn" id="btn-history" title="搜索历史">▼</button>
    <div id="fuzzy-dropdown" class="fuzzy-dropdown" style="display:none">
      <div class="fuzzy-dropdown-list" id="fuzzy-list"></div>
    </div>
  </div>
  <div id="drag-handle" title="拖拽移动窗口">
    <svg id="drag-cross" width="22" height="22" viewBox="0 0 22 22" style="pointer-events:none;display:block">
      <line x1="4" y1="11" x2="18" y2="11" stroke="var(--base01)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="11" y1="4" x2="11" y2="18" stroke="var(--base01)" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="6,8 4,11 6,14" fill="none" stroke="var(--base01)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="16,8 18,11 16,14" fill="none" stroke="var(--base01)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="8,6 11,4 14,6" fill="none" stroke="var(--base01)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="8,16 11,18 14,16" fill="none" stroke="var(--base01)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <button class="win-btn" id="btn-max" title="最大化" style="-webkit-app-region:no-drag">□</button>
</div>

<div id="version-bar">
  <div class="version-panel">
    <span class="v-label">左 (旧)</span>
    <div class="v-dropdown" id="dd-left">
      <div class="v-dropdown-btn" id="dd-left-btn">—</div>
      <div class="v-dropdown-list" id="dd-left-list"></div>
    </div>
    <span class="v-marker" id="marker-left" style="display:none"></span>
    <input type="hidden" id="sel-left">
  </div>
  <div class="version-panel">
    <span class="v-label">右 (新)</span>
    <div class="v-dropdown" id="dd-right">
      <div class="v-dropdown-btn" id="dd-right-btn">—</div>
      <div class="v-dropdown-list" id="dd-right-list"></div>
    </div>
    <span class="v-marker" id="marker-right" style="display:none"></span>
    <input type="hidden" id="sel-right">
  </div>
</div>

<div id="actions-bar">
  <button class="act-btn" id="btn-full" title="显示全文 vs 仅差异">📋 全文</button>
  <button class="act-btn" id="btn-hide-unchanged" title="折叠相同段落">📌 差异</button>
  <div class="act-sep"></div>
  <button class="act-btn accept" id="btn-accept-left" title="将当前差异从左侧移到右侧">← 移到右</button>
  <button class="act-btn accept" id="btn-save-last" title="保存右侧内容到文件" style="display:none">💾 保存</button>
</div>

<div id="diff-container"></div>

<div id="statusbar">
  <span class="stat added" id="stat-added">+0</span>
  <span class="stat deleted" id="stat-deleted">-0</span>
  <span class="stat" id="stat-changes">0 处修改</span>
  <span class="stat" id="stat-mode">并排</span>
</div>

<div id="empty-state">加载中…</div>

<button id="big-close">✕</button>
<div id="big-close-tip" style="position:fixed;display:none;z-index:9999;background:#000;color:#ffd302;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700;font-family:Tahoma,system-ui,-apple-system,sans-serif;pointer-events:none;white-space:nowrap;border:2px solid #ffd302;box-shadow:0 2px 12px rgba(0,0,0,0.8);line-height:1.4">= Right Click</div>

<script src="/qqq-app/timeline/diff-window.js"></script>
</body>
</html>
