<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Timeline Diff</title>
<style>
:root{--bg:#1e1e1e;--card:#2a2a2a;--text:#d4d0c8;--border:#333;--green:#8fbc5a;--red:#ff4444;--yellow:#d4a017;--blue:#4fc1ff;--base01:#93a1a1;--base2:#2a2a2a;--base3:#1e1e1e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ═══ TITLEBAR ═══ */
#titlebar{height:36px;background:var(--card);display:flex;align-items:center;padding:0 12px;-webkit-app-region:drag;border-bottom:1px solid var(--border);flex-shrink:0}
#titlebar .file-icon{font-size:14px;margin-right:6px}
#titlebar .file-path{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace}
#titlebar .win-btn{-webkit-app-region:no-drag;width:32px;height:28px;border:none;background:transparent;color:var(--base01);font-size:14px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
#titlebar .win-btn:hover{background:var(--border)}
#titlebar .win-btn.close:hover{background:#e81123;color:#fff}

/* ═══ FILE SWITCHER ═══ */
#file-bar{height:36px;background:var(--card);display:flex;align-items:center;padding:0 8px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
#file-bar .fl-label{font-size:10px;color:var(--base01);white-space:nowrap}
#file-bar .fl-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:4px;font-size:11px;font-family:ui-monospace,monospace;outline:none}
#file-bar .fl-input:focus{border-color:var(--blue)}
#file-bar .fl-count{font-size:10px;color:var(--base01);white-space:nowrap}
#file-bar .fl-btn{font-size:10px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer}
#file-bar .fl-btn:hover{background:var(--border)}
/* 下拉建议列表 */
#file-suggestions{position:absolute;top:72px;left:8px;right:8px;max-height:240px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:0 0 6px 6px;z-index:100;display:none;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
#file-suggestions .fs-item{padding:5px 10px;font-family:ui-monospace,monospace;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px}
#file-suggestions .fs-item:hover{background:var(--border)}
#file-suggestions .fs-item.deleted{color:var(--base01)}
#file-suggestions .fs-item.deleted .fs-name{text-decoration:line-through}
#file-suggestions .fs-item .fs-icon{font-size:12px;flex-shrink:0}
#file-suggestions .fs-item .fs-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#file-suggestions .fs-item .fs-ts{font-size:9px;color:var(--base01);flex-shrink:0}
.highlight{background:var(--yellow);color:#000;border-radius:2px;padding:0 1px}

/* ═══ VERSION BAR ═══ */
#version-bar{height:44px;background:var(--card);display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.version-panel{flex:1;display:flex;align-items:center;padding:0 10px;gap:6px}
.version-panel:first-child{border-right:1px solid var(--border)}
.version-panel .v-label{font-size:10px;color:var(--base01);text-transform:uppercase;white-space:nowrap;min-width:36px}
.version-panel .v-select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-size:11px;font-family:ui-monospace,monospace;max-width:280px;cursor:pointer}
.version-panel .v-select:focus{outline:none;border-color:var(--blue)}
.version-panel .v-marker{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0}
.v-marker.before{background:var(--yellow);color:#000}
.v-marker.after{background:var(--green);color:#fff}
.v-marker.first{background:var(--blue);color:#fff}
.v-marker.last{background:var(--red);color:#fff}

/* ═══ ACTIONS BAR ═══ */
#actions-bar{height:32px;background:var(--card);display:flex;align-items:center;padding:0 8px;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0}
.act-btn{font-size:10px;padding:3px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}
.act-btn:hover{background:var(--border)}
.act-btn.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.act-btn.accept{background:var(--green);color:#fff;border-color:var(--green);display:none}
.act-btn.accept.visible{display:inline-block}
.act-btn.danger{background:var(--red);color:#fff;border-color:var(--red);display:none}
.act-btn.danger.visible{display:inline-block}
.act-sep{width:1px;height:16px;background:var(--border);margin:0 4px}

/* ═══ DIFF CONTAINER ═══ */
#diff-container{flex:1;overflow:hidden}

/* ═══ STATUSBAR ═══ */
#statusbar{height:22px;background:var(--card);display:flex;align-items:center;padding:0 10px;font-size:10px;color:var(--base01);border-top:1px solid var(--border);flex-shrink:0;gap:12px}
#statusbar .stat{font-family:ui-monospace,monospace}
#statusbar .stat.added{color:var(--green)}
#statusbar .stat.deleted{color:var(--red)}

/* ═══ EMPTY STATE ═══ */
#empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--base01);font-size:13px}
</style>
</head>
<body>

<div id="titlebar">
  <span class="file-icon" id="file-icon">📄</span>
  <span class="file-path" id="file-path">—</span>
  <button class="win-btn" id="btn-max" title="Maximize">□</button>
  <button class="win-btn close" id="btn-close" title="Close">×</button>
</div>

<div id="file-bar">
  <span class="fl-label">📂 文件</span>
  <input class="fl-input" id="file-search" placeholder="搜索追踪文件 (模糊匹配)…" autocomplete="off">
  <span class="fl-count" id="file-count">0 个</span>
  <button class="fl-btn" id="btn-restore-file" title="还原已删除文件" style="display:none">↩ 还原</button>
</div>
<div id="file-suggestions"></div>

<div id="version-bar">
  <div class="version-panel">
    <span class="v-label">左 (旧)</span>
    <select class="v-select" id="sel-left"></select>
    <span class="v-marker" id="marker-left" style="display:none"></span>
  </div>
  <div class="version-panel">
    <span class="v-label">右 (新)</span>
    <select class="v-select" id="sel-right"></select>
    <span class="v-marker" id="marker-right" style="display:none"></span>
  </div>
</div>

<div id="actions-bar">
  <button class="act-btn" id="btn-full" title="显示全文 vs 仅差异">📋 全文</button>
  <button class="act-btn" id="btn-hide-unchanged" title="折叠相同段落">📌 差异</button>
  <div class="act-sep"></div>
  <button class="act-btn accept" id="btn-accept-left" title="将当前差异从左侧移到右侧">← 移到右</button>
  <button class="act-btn accept" id="btn-save-last" title="保存右侧内容到文件" style="display:none">💾 保存</button>
</div>

<div id="diff-container"></div>

<div id="statusbar">
  <span class="stat added" id="stat-added">+0</span>
  <span class="stat deleted" id="stat-deleted">-0</span>
  <span class="stat" id="stat-changes">0 处修改</span>
  <span class="stat" id="stat-mode">并排</span>
</div>

<div id="empty-state">加载中…</div>

<script src="/qqq-app/timeline/diff-window.js"></script>
</body>
</html>
