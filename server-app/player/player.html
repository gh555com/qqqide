<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>qd (qqqide) Player</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#dcd8d0;}
  /* ── 编队按钮调色（core/squad-btn.js 复用：主窗变量名同源——本窗为深色独立主题） ── */
  /* ★ 键位标准色 q（2026-10-03 q319 用户定案；色值全局唯一源 = 本行 --key-q）：一切「键位标注」唯一色——
     键帽字符（.ovmb-kcap / .pl-kc）/ x0.5~x4 倍率数字（.pl-zn）/ dock N·P（.ovmb-npl）/ A-B 双标记（.ovmb-abmark）恒用此色；
     键帽边框与底色恒金不变；打勾与选中态恒金 #ffd301（金色 = 状态、q = 键位——两个语义不再混用）。
     media-engine.js 侧一律引用 var(--key-q)（禁第二处硬编码色值）。 */
  :root{--border-color:#3a3a3a;--text-primary:#e8e8e0;--text-secondary:#9a958c;--background-color:#161616;--gold-hover-bg:rgba(255,211,1,0.15);--key-q:#ff7e8a;}
  /* ───────────────────────────────────────────────────────────────────────
     播放器窗外观 = 内置播放器卡同款（2026-10-02 q319 定案）：
     30px 头部条（logo + 轨名 + [!媒体信息圆形钮][x0.5~x4 拉伸][Default默认播放器][编队][📌置顶][—最小化][▢最大化/还原][✕关闭]）+ body = 引擎壳层；窗头即拖拽带。
     ★ v12（2026-10-02）：头部最左加 qd logo（唯一源 ../assets/qqqide.png 16×16 + invert(1)——与 IDE 左上角
     「qd (qqqide)」菜单文字前同款；纯装饰 pointer-events:none、随拖拽带）；头部五钮恒直角（无圆角——边界清晰）。
     ─────────────────────────────────────────────────────────────────────── */
  /* ★ 窗口外观（2026-10-02 q319 定案；v16 直角）：零圆角（IDE 传统 100% 直角）+ 渐变环——播放器 = IDE 之外滴独立窗口序列，
     ★ 双角鎏金环（2026-10-03 q319 用户定案）：左上橙 + 右下橙（同 #ffa02a）+ 中段真无色平台带（transparent 32%→68%）——
     平台带须覆盖左下/右上角位（角位参数 = (x+y)/(W+H)：宽窗 TR≈0.61~0.66 / BL≈0.34~0.39）；禁删平台带/禁回单停靠点；
     ★ 底盘页面自绘（第 3 层 = #0b0b0b border-box，必留）：win32 窗口底盘（Electron backgroundColor）在系统高对比度机器上
     被染成系统窗色（实机 olive #d6bf02）——环淡出段贴着它显成杂色边框（实报「橙色边框失鎏金感」真根因）；页面自绘后
     一切低透明段渐隐为黑、与系统主题彻底解耦；禁删第三层/禁回裸窗口底盘；
     与暗主题内置面板同原语（shell-base.css「内嵌弹窗统一边界块」技法：内层 padding-box 铺面板本色 + 外层 border-box
     铺渐变 + 1px 透明边框露环）；圆角已全废（真机探针实证：radius 0 时系统不叠加圆角——背窗取色法，corner 恒方；禁回圆角）。 */
  #pl-root{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;-webkit-app-region:no-drag;
    border-radius:0;border:1px solid transparent;
    background:linear-gradient(#0b0b0b,#0b0b0b) padding-box, linear-gradient(135deg,#ffa02a,transparent 32%,transparent 68%,#ffa02a) border-box, linear-gradient(#0b0b0b,#0b0b0b) border-box;}
  /* ── 拖拽区契约（2026-10-02 v9）：底座恒 no-drag；仅两处可拖窗——
     ① 头部条 #pl-head ② 播放区空背景 .ovmb-maincol。引擎 UI（控制条/dock/弹面板/媒体/转码条）恒 no-drag。
     ★ DOM 序 = 覆盖序：no-drag 控件必须排在覆盖它的 drag 元素之后（后兄弟/后代恒赢）；
       新增任何悬浮元素必须同步登记 no-drag，否则点击被拖拽区吞掉（WM_NCHITTEST 验证法）。 ── */
  #pl-head{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;flex:0 0 auto;
    background:rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.09);user-select:none;-webkit-app-region:drag;}
  /* ★ qd logo（v12）：头部最左、一切标题文字之前——与 IDE 左上角同款（同源文件 + 暗色 invert(1)）；纯装饰（不进 no-drag 登记面） */
  #pl-logo{width:16px;height:16px;flex:0 0 auto;object-fit:contain;filter:invert(1);pointer-events:none;}
  #pl-title{flex:1 1 auto;min-width:0;font-size:12px;color:#cfcbc2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;}
  #pl-tools{display:flex;align-items:center;gap:4px;flex:0 0 auto;-webkit-app-region:no-drag;}
  #pl-tools *{-webkit-app-region:no-drag;}
  /* ★ 直角定案（v12）：头部五钮（编队/置顶/—/▢/✕）恒直角——禁回圆角（边界清晰，用户定案）
     ★ 可见边框（2026-10-02 用户定案）：一切按钮恒绘 1px 淡边——可点范围一眼可见（禁回 border:none 透明钮） */
  .pl-hbtn{width:22px;height:22px;padding:0;border:1px solid rgba(255,255,255,0.22);border-radius:0;background:rgba(255,255,255,0.08);color:#cfcbc2;
    box-sizing:border-box;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;outline:none;flex:0 0 auto;
    position:relative;transition:background .12s,color .12s,border-color .12s;}
  .pl-hbtn:hover{background:rgba(255,255,255,0.22);color:#fff;border-color:rgba(255,255,255,0.42);}
  .pl-hbtn.pl-close:hover{background:rgba(220,50,47,0.6);color:#fff;border-color:rgba(255,255,255,0.42);}
  /* ★ 置顶状态 = 右下角打勾（2026-10-02 用户定案）；★ 勾亮 = 本体外框同转金（2026-10-03 用户定案：外框色 100% = 勾色 #ffd301；未勾 = 暗淡外框）——无勾 = 未置顶
     ★ 角标贴靠本体（2026-10-02 用户定案）：right:0/bottom:-1px——勾恒贴本钮右下角（旧 -2/-3 悬空于两钮之间致「勾给谁」歧义）
     ★ 勾清晰度配方（2026-10-02 用户定案）：加重勾 ✔(U+2714)/12px/400 + 全向 1px 暗描边——任何底色（含悬停亮底）恒清晰；
       角标全族（置顶 / x0.5~x4 / 循环 / 随机 / 追踪——9 钮同配方；勾亮 = 本体外框同转金；Default 恒不打勾〔2026-10-03 定案〕）media-engine.js .ovmb-dswck 同步同改 */
  #pl-pin::after{content:'\2714';position:absolute;right:0;bottom:-1px;font-size:12px;font-weight:400;line-height:1;color:#ffd301;display:none;pointer-events:none;
    text-shadow:0 -1px 0 rgba(0,0,0,.95),0 1px 0 rgba(0,0,0,.95),-1px 0 0 rgba(0,0,0,.95),1px 0 0 rgba(0,0,0,.95),-1px -1px 0 rgba(0,0,0,.85),1px -1px 0 rgba(0,0,0,.85),-1px 1px 0 rgba(0,0,0,.85),1px 1px 0 rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.7);}
  #pl-pin.pl-pin-on::after{display:block;}
  #pl-pin.pl-pin-on{border-color:#ffd301;}
  /* ★ Default 按钮（2026-10-03 定案）：设为系统默认播放器——文字钮恒「Default」；★ 恒不打勾——无状态角标、无解除逻辑
     （其他播放器可随时覆盖我们——打勾/取消均无意义）——按钮恒 = 「设为默认」，可反复点击随时重夺 */
  .pl-htxt{width:auto;min-width:52px;height:22px;padding:0 9px;border:1px solid rgba(255,255,255,0.22);border-radius:0;background:rgba(255,255,255,0.08);color:#cfcbc2;
    box-sizing:border-box;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;outline:none;flex:0 0 auto;
    position:relative;transition:background .12s,color .12s,border-color .12s;font-family:Tahoma,system-ui,sans-serif;}
  .pl-htxt:hover{background:rgba(255,255,255,0.22);color:#fff;border-color:rgba(255,255,255,0.42);}
  .pl-htxt:disabled{opacity:.55;}
  /* ★ 窗口拉伸比例钮 x0.5~x4（2026-10-03 q319 用户定案）：位于 Default 左侧——快捷键 1/2/3/4（x0.5 = 「1 左侧键」(`) 或回车；键位在引擎键位表）；
     x1 = 视频像素物理 1:1（win32 DSF=1 天然无视系统缩放）；点击直改窗口尺寸使画面恰为 视频分辨率×N（闭式解一发落点——2026-10-03 提速重写）；
     ★ 一切视频装载即自动 x1（引擎 loadedmetadata 触发——启动值）；右下角 ✓ = 当前生效档（实测几何反推——手动改窗即自动消隐）；
     钮面「x」中性色/倍率标准色 q（= 键位标注，Tahoma 非加粗）；★ x0.5 例外（2026-10-03 用户定案）：0.5 非键位 → 倍率恒白 + 旁挂键帽「`」（金框不变、字符 = 标准色 q；1 左侧键）；音轨/未就绪禁用（引擎回推 avail） */
  .pl-hzoom{width:auto;min-width:24px;padding:0 4px;font-size:11px;letter-spacing:0;font-family:Tahoma,system-ui,sans-serif;}
  .pl-hzoom::after{content:'\2714';position:absolute;right:0;bottom:-1px;font-size:12px;font-weight:400;line-height:1;color:#ffd301;display:none;pointer-events:none;
    text-shadow:0 -1px 0 rgba(0,0,0,.95),0 1px 0 rgba(0,0,0,.95),-1px 0 0 rgba(0,0,0,.95),1px 0 0 rgba(0,0,0,.95),-1px -1px 0 rgba(0,0,0,.85),1px -1px 0 rgba(0,0,0,.85),-1px 1px 0 rgba(0,0,0,.85),1px 1px 0 rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.7);}
  .pl-hzoom.pl-zoom-on::after{display:block;}
  .pl-hzoom.pl-zoom-on{border-color:#ffd301;}
  .pl-hzoom:disabled{opacity:.4;}
  .pl-hzoom:disabled:hover{background:rgba(255,255,255,0.08);color:#cfcbc2;border-color:rgba(255,255,255,0.22);}
  /* ★ 数字 = 快捷键标注（2026-10-02 用户定案）：xN 钮中「x」恒中性色、「N」金色（Tahoma 非加粗——与 dock N/P 同语言）；
     x0.5 例外（2026-10-03 用户定案）：0.5 非键位恒白（.pl-znw）+ 旁挂键帽「`」（.pl-kc——金框/底色不变、字符 = 标准色 q）；键帽子样式与 .ovmb-kcap 同语言（金边 + 底边 2px 键体感） */
  .pl-zn{color:var(--key-q);}
  .pl-znw{color:#fff;}
  .pl-kc{display:inline-flex;align-items:center;justify-content:center;margin-left:3px;min-width:14px;height:14px;padding:0 3px;border-radius:3px;border:1px solid rgba(255,211,1,0.5);border-bottom-width:2px;background:rgba(255,211,1,0.12);color:var(--key-q);font-size:10px;line-height:1;font-weight:400;font-family:Tahoma,Verdana,sans-serif;box-sizing:border-box;pointer-events:none;}
  /* ★ 媒体信息钮 [!]（2026-10-03 q319 用户定案）：头部唯一圆形钮（圆形中间一个「!」，位于 x0.5 左侧）——
     悬停 = 即时详情框（光标移开即隐）；点击 = 同截图「📂 Roam 定位」——强制召回最相关 IDE + 在其 Roam 定位到正在播放的原文件。
     配色守「金 = 状态」语义（本体中性色同 .pl-hbtn）；圆形为本钮专属形状（用户点名——其余头部钮恒直角）。 */
  .pl-hinfo{border-radius:50%;font-family:Tahoma,system-ui,sans-serif;font-size:13px;font-weight:700;}
  /* ★ 媒体信息悬浮框（2026-10-03 q319）：[!] 悬停即时显示 / 移开即隐；右缘随钮、贴头部条下缘；
     纯展示（pointer-events:none——绝不挡任何点击；指针不达 → 不可滚动，overflow:hidden 语义明确）；
     内容 = 主进程 ffprobe 详情（编码信息在上、时间垫底）；技术值恒英文原样，标签走 i18n（shell.player.info.*）。 */
  #pl-mibox{position:fixed;z-index:99960;display:none;pointer-events:none;-webkit-app-region:no-drag;
    width:min(440px,calc(100vw - 16px));max-height:calc(100vh - 44px);overflow:hidden;box-sizing:border-box;
    background:#101010;border:1px solid rgba(255,211,1,0.42);border-radius:9px;box-shadow:0 12px 34px rgba(0,0,0,0.65);
    padding:9px 11px;font:11.5px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;color:#e8e6e0;}
  #pl-mibox.pl-mishow{display:block;}
  #pl-mibox .pl-mi-sec{font-size:11px;font-weight:700;color:#ffd301;margin:7px 0 2px;letter-spacing:.6px;}
  #pl-mibox .pl-mi-sec:first-child{margin-top:0;}
  #pl-mibox .pl-mi-row{display:flex;gap:8px;align-items:baseline;}
  #pl-mibox .pl-mi-k{flex:0 0 auto;min-width:62px;color:#9a958c;white-space:nowrap;}
  #pl-mibox .pl-mi-v{flex:1 1 auto;min-width:0;word-break:break-all;font-family:Consolas,'Courier New',monospace;font-size:11.5px;font-variant-numeric:tabular-nums;}
  #pl-mibox .pl-mi-note{color:#ffb46b;}
  /* ★ 确认框（Default）：暗色卡片 + 主操作右；遮罩/Esc/点外 = 取消；开框期拖拽带让路（no-drag） */
  .pl-ask-wrap{position:absolute;inset:0;z-index:99995;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);-webkit-app-region:no-drag;}
  .pl-ask-wrap.pl-ask-show{display:flex;}
  .pl-ask-wrap *{-webkit-app-region:no-drag;}
  .pl-ask{width:min(430px,86vw);background:#141414;border:1px solid rgba(255,160,42,0.55);box-shadow:0 10px 40px rgba(0,0,0,0.6);
    padding:16px 16px 12px;box-sizing:border-box;font:13px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif;color:#e8e6e0;user-select:text;}
  .pl-ask h3{margin:0 0 8px;font-size:14px;color:#ffd301;font-weight:600;}
  .pl-ask .pl-ask-body{white-space:pre-line;color:#c9c5bc;font-size:12.5px;}
  .pl-ask .pl-ask-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .pl-ask button{border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#e8e6e0;font-size:12.5px;padding:5px 14px;cursor:pointer;font-family:inherit;}
  .pl-ask button:hover{background:rgba(255,255,255,0.16);}
  .pl-ask button.pl-ask-primary{border-color:rgba(255,211,1,0.55);background:rgba(255,211,1,0.14);color:#ffd301;}
  .pl-ask button.pl-ask-primary:hover{background:rgba(255,211,1,0.28);}
  .pl-ask button:disabled{opacity:.5;}
  /* 最大化 ⇄ 还原 双图标（display 切换，禁换节点——换 innerHTML 会吞点击） */
  #pl-min svg,#pl-max svg{display:block;pointer-events:none;}
  #pl-max .pl-ic-restore{display:none;}
  #pl-max.pl-maxed .pl-ic-max{display:none;}
  #pl-max.pl-maxed .pl-ic-restore{display:block;}
  /* ★ 右下角 resize grip（2026-10-02 q319 定案；与主窗 IDE 右下角滴两条斜线 100% 同语言）：36×36 命中区 + 两条金斜线——
     拖拽 = pointer capture + rAF 节流 → bridge.window.resizeGrip（主进程 clamp min/max + setBounds，左上角固定）；
     唯一可见的改窗口大小入口（宿主域 handler = shell/player-host.ts registerHostShellIpc） */
  #pl-rgrip{position:fixed;bottom:0;right:0;width:36px;height:36px;z-index:80;-webkit-app-region:no-drag;cursor:nwse-resize;background:transparent;touch-action:none;}
  #pl-rgrip svg{display:block;width:100%;height:100%;pointer-events:none;}
  #pl-rgrip line{stroke:#ffd301;stroke-width:2;stroke-linecap:round;}
  /* 编队按钮槽（squad-btn.js 注入；按钮自带内联样式） */
  #pl-squad{display:inline-flex;align-items:center;flex:0 0 auto;-webkit-app-region:no-drag;}
  /* v12 直角 + 2026-10-02 可见边框同规：收编 squad-btn 内联圆角/暗边/透明底（仅本窗生效，IDE 主窗不受影响） */
  #pl-squad .qqq-squad-btn{border-radius:0 !important;border-color:rgba(255,255,255,0.22) !important;background:rgba(255,255,255,0.08) !important;}
  #pl-squad .qqq-squad-btn:hover{background:rgba(255,255,255,0.22) !important;border-color:rgba(255,255,255,0.42) !important;}
  #pl-body{position:relative;flex:1 1 auto;min-height:0;display:flex;}
  #pl-body .ovmb-maincol{-webkit-app-region:drag;}   /* 播放区空背景可拖窗（v15 后 = 音频盒四周；视频满铺 → 拖窗走头部条） */
  #pl-body .ovmb, #pl-body .ovmb *{-webkit-app-region:no-drag;}
  #pl-body .ovmb-uirow, #pl-body .ovmb-uirow *{-webkit-app-region:no-drag;}
  #pl-body video, #pl-body audio{-webkit-app-region:no-drag;}
  #pl-body .ovmb-txbar{-webkit-app-region:no-drag;}
  /* ★ 弹面板开启期拖拽带让路（2026-10-02）：面板开着时头部条/播放区空背景临时 no-drag——
     OS 层才能把点击送达 DOM（拖拽带被当标题栏会吞点击，「点面板外关闭」在它上面失效）；
     类由 squad-btn（squad-dd-open）与引擎浮层（ovmb-floatopen）维护，面板关闭即复位。 */
  html.ovmb-floatopen #pl-head, html.ovmb-floatopen #pl-body .ovmb-maincol,
  html.squad-dd-open #pl-head, html.squad-dd-open #pl-body .ovmb-maincol{-webkit-app-region:no-drag;}
  /* 空态（异常兜底：会话为空时） */
  #pl-empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#8f8b83;font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.7;}
  #pl-empty .pl-note{font-size:26px;line-height:1;color:#ffd301;opacity:.75;}
  /* 迷你 qoast（引擎宿主适配：与主窗 qoast 同语义） */
  .pl-qoast-wrap{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);z-index:99990;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:92%;-webkit-app-region:no-drag;}
  .pl-qoast-wrap *{-webkit-app-region:no-drag;}
  .pl-qoast{background:rgba(20,20,20,0.95);border:1px solid rgba(255,255,255,0.18);color:#e8e6e0;font:12px/1.5 system-ui,-apple-system,sans-serif;border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,0.5);pointer-events:auto;max-width:100%;box-sizing:border-box;}
  .pl-qoast button{border:1px solid rgba(255,211,1,0.5);background:rgba(255,211,1,0.14);color:#ffd301;border-radius:6px;padding:2px 8px;font-size:12px;flex:0 0 auto;cursor:pointer;}
  .pl-qoast button:hover{background:rgba(255,211,1,0.3);}
  /* ── qd 无轨滚动条（shell-base.css「内嵌弹窗统一块」同标准——本窗为独立文档镜像，同 goods mdview 先例）

    fps: ['shell.player.info.lbl.fps', '帧率'], pixfmt: ['shell.player.info.lbl.pixfmt', '像素格式'],
    field: ['shell.player.info.lbl.field', '扫描方式'], color: ['shell.player.info.lbl.color', '色彩'],
    vbitrate: ['shell.player.info.lbl.bitrate', '码率'], abitrate: ['shell.player.info.lbl.bitrate', '码率'],
    refs: ['shell.player.info.lbl.refs', '参考帧'], channels: ['shell.player.info.lbl.channels', '声道'],
    samplerate: ['shell.player.info.lbl.samplerate', '采样率'], samplefmt: ['shell.player.info.lbl.samplefmt', '采样格式'],
    container: ['shell.player.info.lbl.container', '容器'], duration: ['shell.player.info.lbl.duration', '时长'],
    bitrate: ['shell.player.info.lbl.totalbitrate', '总码率'], streams: ['shell.player.info.lbl.streams', '流'],
    extra: ['shell.player.info.lbl.extra', '附加流'], encoder: ['shell.player.info.lbl.encoder', '编码器'],
    filename: ['shell.player.info.lbl.filename', '文件名'], location: ['shell.player.info.lbl.location', '位置'],
    size: ['shell.player.info.lbl.size', '大小'], mtime: ['shell.player.info.lbl.mtime', '修改时间'],
    ctime: ['shell.player.info.lbl.ctime', '创建时间']
  };
  function _miClear() { try { while (miBox.firstChild) { miBox.removeChild(miBox.firstChild); } } catch (_) { } }
  function _miNote(text) {
    var d = document.createElement('div'); d.className = 'pl-mi-note'; d.textContent = text;
    miBox.appendChild(d);
  }
  function _miRow(labelId, val) {
    var r = document.createElement('div'); r.className = 'pl-mi-row';
    var k = document.createElement('span'); k.className = 'pl-mi-k';
    var lab = _MI_LBL[labelId];
    k.textContent = lab ? _tt(lab[0], lab[1]) : '';
    var v = document.createElement('span'); v.className = 'pl-mi-v'; v.textContent = String(val == null ? '' : val);
    r.appendChild(k); r.appendChild(v);
    return r;
  }
  function _miRender(path) {
    if (!miBox) { return; }
    _miClear();
    var e = _miCache[path];
    if (!e || e.state === 'loading') { _miNote(_tt('shell.player.info.loading', '正在读取媒体信息…')); return; }
    if (e.state !== 'ok' || !e.payload || !e.payload.sections) { _miNote(_tt('shell.player.info.failed', '无法读取媒体信息')); return; }
    if (e.payload.probe && e.payload.probe !== 'ok') { _miNote(_tt('shell.player.info.probeNA', '编码信息不可用（媒体组件未就绪）')); }
    var firstExtra = true;
    for (var si = 0; si < e.payload.sections.length; si++) {
      var s = e.payload.sections[si];
      if (!s || !s.rows || !s.rows.length) { continue; }
      var sec = _MI_SEC[s.id];
      if (sec) {
        var h = document.createElement('div'); h.className = 'pl-mi-sec'; h.textContent = _tt(sec[0], sec[1]);
        miBox.appendChild(h);
      }
      for (var ri = 0; ri < s.rows.length; ri++) {
        var row = s.rows[ri];
        if (!row) { continue; }
        if (row.id === 'extra') { miBox.appendChild(_miRow(firstExtra ? 'extra' : '', row.v)); firstExtra = false; }
        else { miBox.appendChild(_miRow(row.id, row.v)); }
      }
    }
  }
  function _miPlace() {
    try {
      var head = document.getElementById('pl-head');
      var hr = head.getBoundingClientRect();
      var br = infoBtn.getBoundingClientRect();
      var w = miBox.offsetWidth || 0;
      var vw = window.innerWidth || 0;
      var left = Math.round(br.right - w);          // 右缘对齐按钮右缘
      if (left < 8) { left = 8; }
      if (left > vw - w - 8) { left = Math.max(8, vw - w - 8); }
      miBox.style.left = left + 'px';
      miBox.style.top = Math.round(hr.bottom + 5) + 'px';
    } catch (_) { }
  }
  function _miShow() {
    if (!miBox) { return; }
    var path = _miPath();
    if (!path) {
      _miClear();
      _miNote(_tt('shell.player.info.noFile', '没有正在播放的媒体文件'));
      _miOpenPath = '';
      miBox.classList.add('pl-mishow');
      _miPlace();
      return;
    }
    _miOpenPath = path;
    _miRender(path);
    miBox.classList.add('pl-mishow');
    _miPlace();
    _miFetch(path, function () { try { if (_miOpenPath === path && miBox.classList.contains('pl-mishow')) { _miRender(path); } } catch (_) { } });
  }
  function _miHide() { try { miBox.classList.remove('pl-mishow'); _miOpenPath = ''; } catch (_) { } }
  if (infoBtn && miBox) {
    try { infoBtn.title = _tt('shell.player.info.title', '媒体信息'); } catch (_) { }
    infoBtn.addEventListener('mouseenter', function () { _miShow(); });
    infoBtn.addEventListener('mouseleave', function () { _miHide(); });
    infoBtn.addEventListener('click', function () {
      var p = _miPath();
      if (!p) { _qoast(_tt('shell.player.info.noFile', '没有正在播放的媒体文件'), { type: 'warn' }); return; }
      try {
        var r = (bridge && bridge.player && bridge.player.reveal) ? bridge.player.reveal(p) : null;   // 同截图「Roam 定位」裁决链（恒指原文件）
        if (r && r.then) { r.then(function (res) { if (res && res.ok === false) { _qoast(_tt('shell.dl.revealFail', '无法定位该文件'), { type: 'error' }); } }).catch(function () { }); }
      } catch (_) { }
    });
    window.addEventListener('blur', function () { _miHide(); });
    window.addEventListener('resize', function () { try { if (miBox.classList.contains('pl-mishow')) { _miPlace(); } } catch (_) { } });
  }

  // ── 系统默认播放器（2026-10-03 定案：单向可反复——无打勾角标、无解除逻辑）──
  //   「Default」→ 确认框 → 全量接管（apply）。其他播放器可随时覆盖我们 → 打勾/取消均无意义；
  //   按钮恒 = 「设为默认」，可一遍又一遍重夺。
  var defAskEl = document.getElementById('pl-defask');
  var defAskTitle = document.getElementById('pl-defask-title');
  var defAskBody = document.getElementById('pl-defask-body');
  var defAskYes = document.getElementById('pl-defask-yes');
  var defAskNo = document.getElementById('pl-defask-no');
  var defBusy = false;

  function _defCloseAsk() { try { defAskEl.classList.remove('pl-ask-show'); } catch (_) { } }
  function _defOpenAsk() {
    try {
      defAskTitle.textContent = _tt('shell.player.defAskTitle', '是否作为系统默认播放器？');
      defAskBody.textContent = _tt('shell.player.defAskBody', '将接管本机全部音视频格式的默认打开方式：双击媒体文件直接用 qd 播放器打开。\n若被其他播放器覆盖，再点一次 Default 即可重新拿回。');
      defAskYes.textContent = _tt('shell.player.defYes', '是，接管');
      defAskNo.textContent = _tt('shell.player.defNo', '取消');
      defAskEl.classList.add('pl-ask-show');
    } catch (_) { }
  }
  function _defBusyDone() {
    defBusy = false;
    try { defAskYes.disabled = false; defBtn.disabled = false; defBtn.textContent = 'Default'; } catch (_) { }
  }
  function _defRun() {
    if (defBusy) { return; }
    if (!bridge || !bridge.fileAssoc || !bridge.fileAssoc.apply) {
      _qoast(_tt('shell.player.needRestart', '播放器需要重启实例后可用'), { type: 'error' });
      return;
    }
    defBusy = true;
    try { defAskYes.disabled = true; defBtn.disabled = true; defBtn.textContent = '\u2026'; } catch (_) { }
    bridge.fileAssoc.apply().then(function (r) {
      _defBusyDone();
      if (!r || !r.ok) {
        if (r && r.code === 'unsupported') { _qoast(_tt('shell.player.defUnsupported', '当前系统暂不支持此功能'), { type: 'error' }); }
        else { _qoast(_tt('shell.player.defFail', '操作失败：{e}', { e: (r && (r.code || r.reason)) || '?' }), { type: 'error' }); }
        return;
      }
      var taken = r.taken || 0, total = r.total || 0;
      if (total > 0 && taken >= total) {
        _qoast(_tt('shell.player.defDoneAll', '全部 {n} 类媒体文件已接管 ✓', { n: total }));
      } else {
        _qoast(_tt('shell.player.defPartial', '已接管 {n}/{m} 类；其余被系统保护拦截', { n: taken, m: total }), {
          type: 'warn', duration: 6000,
          action: { label: _tt('shell.player.defSettings', '打开系统设置'), onClick: function () { try { bridge.fileAssoc.settings(); } catch (_) { } } }
        });
      }
    }).catch(function () {
      _defBusyDone();
      _qoast(_tt('shell.player.defFail', '操作失败：{e}', { e: 'bridge' }), { type: 'error' });
    });
  }
  var defBtn = document.getElementById('pl-def');
  try { defBtn.addEventListener('mousedown', function (e) { e.preventDefault(); }); } catch (_) { }   // 焦点卫生（同头部钮）
  try {
    defBtn.addEventListener('click', function () { _defOpenAsk(); });
    defAskYes.addEventListener('click', function () { _defCloseAsk(); _defRun(); });
    defAskNo.addEventListener('click', function () { _defCloseAsk(); });
    defAskEl.addEventListener('click', function (e) { if (e.target === defAskEl) { _defCloseAsk(); } });
  } catch (_) { }

  // ── 主题（跟随 qqq.theme.v1 镜像；播放器恒深色基调）──
  try {
    var th = localStorage.getItem('qqq.theme.v1');
    document.documentElement.setAttribute('data-theme', /light/i.test(String(th)) ? 'light' : 'dark');
  } catch (_) { document.documentElement.setAttribute('data-theme', 'dark'); }

  if (!bridge || !bridge.player || !bridge.player.getSession || !ME) {
    _setTitle(_tt('shell.player.title', '播放器'));
    _showEmpty(true);
    emptyTextEl.textContent = _tt('shell.player.needRestart', '播放器需要重启实例后可用');
    return;
  }

  // ★ 加入播放列表（2026-10-02 q319）：主进程推送（Roam 右键行 → 本窗为最近活跃目标）→ 引擎纯追加
  //   不动当前轨、不打断播放（append autoplay 恒 false）；追加后立即落盘（防断电丢新项）
  try {
    if (bridge.player.onAppend) {
      bridge.player.onAppend(function (payload) {
        try {
          if (!eng) { return; }   // 会话装载中：主进程已先行入档，getSession 自然带上（禁回写防覆盖）
          var items = (payload && payload.items) || [];
          if (!items.length) { return; }
          eng.append(items, false);
          _save(true);
        } catch (_) { }
      });
    }
  } catch (_) { }

  // ── 启动：取本窗会话（autoplay = 全新打开 true / 启动恢复 false——恢复恒暂停态）──
  bridge.player.getSession().then(function (r) {
    var st = (r && r.session) || {};
    var list = Array.isArray(st.list) ? st.list : [];
    pinned = st.pinned !== false;
    pinBtn.classList.toggle('pl-pin-on', pinned);
    if (list.length) {
      openMedia({
        list: list, index: st.index || 0,
        play: !!(r && r.autoplay),
        rate: st.rate, loop: st.loop, shuffle: st.shuffle, follow: st.follow,
        volume: st.volume, muted: st.muted, dockSide: st.dockSide
      });
    } else {
      _setTitle(_tt('shell.player.title', '播放器'));
      _showEmpty(true);
    }
  }).catch(function () { _setTitle(_tt('shell.player.title', '播放器')); _showEmpty(true); });
})();
</script>
