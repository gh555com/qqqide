// ═══ 从 houses 数组计算文件变更统计（持久化到 floorPayload.fileStats） ═══
function _computeFileStats(houses) {
  houses = houses || [];
  var fileSet = {};
  var added = 0;
  var deleted = 0;
  for (var hi = 0; hi < houses.length; hi++) {
    var tools = houses[hi].tools || [];
    for (var ti = 0; ti < tools.length; ti++) {
      var t = tools[ti];
      var path = '';
      if (typeof t.args === 'string') {
        try { var p = JSON.parse(t.args); path = p.path || p.filePath || ''; } catch(_) {}
      } else if (t.args && typeof t.args === 'object') {
        path = t.args.path || t.args.filePath || '';
      }
      if (t.name === 'write_file' || t.name === 'create_file') {
        if (path) fileSet[path] = true;
        var content = '';
        if (typeof t.args === 'string') {
          try { var pp = JSON.parse(t.args); content = pp.content || ''; } catch(_) {}
        } else if (t.args && t.args.content) {
          content = t.args.content;
        }
        if (content) added += (content.match(/\n/g) || []).length + 1;
      } else if (t.name === 'edit_file') {
        if (path) fileSet[path] = true;
        var edits = [];
        if (typeof t.args === 'string') {
          try { var ep = JSON.parse(t.args); edits = ep.edits || []; } catch(_) {}
        } else if (t.args && t.args.edits) {
          edits = t.args.edits;
        }
        for (var ei = 0; ei < edits.length; ei++) {
          var findLines = (edits[ei].find || '').split('\n').length;
          var replaceLines = (edits[ei].replace || '').split('\n').length;
          added += replaceLines;
          deleted += findLines;
        }
      } else if (t.name === 'delete_file') {
        if (path) fileSet[path] = true;
      }
    }
  }
  return { fileCount: Object.keys(fileSet).length, added: added, deleted: deleted };
}

async function _saveAgentQuestData(questId, ag, floorStartIdx) {
  if (!questId || !ag) return;
  var floorNum = ag._ctx.totalFloors;
  console.log('[quests] saveQuestData(' + questId + ') floor=' + floorNum);

  // ═══ 1) 先写 floor 数据（原子操作：写 floor + 更新 quest.floors[]） ═══
  if (typeof floorStartIdx === 'number' && floorNum > 0) {
    var fullConv = ag.conversation ? ag.conversation.slice() : [];
    var floorConv = fullConv.slice(floorStartIdx);
    var floorPayload = {
      question: (ag._lastUserInput && ag._lastUserInput.text) || '',
      conversation: floorConv,
      houses: (ag._houses || []).slice(),
      costWge: ag._floorCostWge,
      lastUserInput: ag._lastUserInput,
      allTxtPath: ag._currentAllTxtPath || _allTxtPath || '',
      fileStats: _computeFileStats(ag._houses),
      createdAt: Date.now()
    };
    await questStore.saveFloor(questId, floorNum, floorPayload);
  }

  // ═══ 2) 再写 quest 级元数据（save 内部保留 saveFloor 已写的 floors[]） ═══
  var metaPayload = {
    ctx: ag._ctx,
    totalCostGe: ag.totalCostGe,
    lastApiPromptTokens: ag._lastApiPromptTokens || 0,
    floorTimings: ag._floorTimings || [],
    serverDrift: ag._serverDrift || 0,
    queue: ag._queue || [],
    rulesVersion: ag._rulesVersion || '',
    persistentCount: ag._persistentCount || 0
  };
  await questStore.touch(questId);
  await questStore.save(questId, metaPayload);

  // generate floor txt ONLY for active quest (not background agents)
  if (ag._housesPromise) {
    try { await ag._housesPromise; } catch (_) { }
  }
  if (ag === _activeAgent && questId === questActiveId) {
    await generateFloorTxt().catch(function(){});
    // 追加到 quest 级 search_quest.txt（全文检索用：时间线 + Q + A）
    _appendToSearchQuest(questId, floorNum).catch(function(){});
  }
}

async function saveQuestData(floorStartIdx) {
  return _saveAgentQuestData(questActiveId, _activeAgent, floorStartIdx);
}

// ═══ 楼层 txt 归档：单 all.txt，完整时间线（分隔线区分 USER/HOUSE/ROOM/ANSWER） ═══
async function generateFloorTxt() {
  var root = questStore.getProjectRoot();
  if (!root) return;
  var houses = agent._houses;
  if (!houses || houses.length === 0) return;
  var floorNum = agent._ctx.totalFloors;
  var questId = questActiveId;
  if (!questId) return;

  // 优先使用已存储的精确路径（与流式写入一致），回退到旧行为
  var allTxtPath = agent._currentAllTxtPath || _allTxtPath || '';
  var dir = '';
  if (allTxtPath) {
    dir = allTxtPath.replace(/\/all\.txt$/, '/');
  } else {
    var quests = await questStore.list();
    var questEntry = quests.find(function(q) { return q.id === questId; }) || null;
    var rawQTitle = (questEntry && questEntry.title && questEntry.title !== 'New Chat') ? questEntry.title : questId;
    var qDirName = _makeName('q', questEntry && questEntry.numericId ? questEntry.numericId : 0, rawQTitle);
    var ui = agent._lastUserInput;
    var uiText = (ui && ui.text) ? ui.text.replace(/\n/g, ' ').trim() : '';
    var fDirName = _makeName('f', floorNum, uiText || '');
    dir = root + '/qqq/quests/' + qDirName + '/' + fDirName + '/';
  }
  try {
    if (!(window.parent && window.parent.qqqideBridge && window.parent.qqqideBridge.fs)) return;
    var bridge = window.parent.qqqideBridge;
    await bridge.fs.mkdir(dir);
    var now = new Date();
    var pad = function(n) { return String(n).padStart(2, '0'); };
    var ts = function(d) {
      if (!d) d = now;
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    };
    var timing = agent._floorTiming;
    var lines = [];

    // ═══ 计算 body size ═══
    var fmtK = function(bytes) { return (bytes / 1024).toFixed(3) + 'k'; };
    var userText = (ui && ui.text) ? ui.text.trim() : '';
    var visionText = (ui && ui.vision) ? ui.vision.trim() : '';
    var askBytes = userText ? new TextEncoder().encode(userText).length : 0;
    var sourceBytes = visionText ? new TextEncoder().encode(visionText).length : 0;
    var promptBytes = 0;
    var ruleBytes = 0;
    var memoryBytes = 0;
    var conv = agent.conversation;
    for (var ci = 0; ci < conv.length; ci++) {
      var cm = conv[ci];
      if (!cm || typeof cm.content !== 'string') continue;
      var cb = new TextEncoder().encode(cm.content).length;
      if (cm._persistent) {
        if (typeof SYSTEM_PROMPT !== 'undefined' && cm.content.indexOf(SYSTEM_PROMPT) === 0) {
          promptBytes += cb;
        } else {
          ruleBytes += cb;
        }
      } else if (cm.role === 'user' && cm._floor === floorNum) {
        memoryBytes += Math.max(0, cb - askBytes - sourceBytes);
      } else {
        memoryBytes += cb;
      }
    }
    var totalBytes = askBytes + sourceBytes + promptBytes + ruleBytes + memoryBytes;

    // ═══ floor 头 ═══
    var floorTs = timing && timing.floorStartServerMs ? new Date(timing.floorStartServerMs) : now;
    lines.push('floor.' + floorNum + '   ' + ts(floorTs));
    lines.push('');
    lines.push('(body ' + fmtK(totalBytes) + ': ask ' + fmtK(askBytes) + ' + rule ' + fmtK(ruleBytes) + ' + Source code ' + fmtK(sourceBytes) + ' + prompt ' + fmtK(promptBytes) + ' + memory ' + fmtK(memoryBytes) + ')');
    lines.push('');
    if (userText) { lines.push(userText); lines.push(''); }
    if (visionText) { lines.push(visionText); lines.push(''); }

    // ═══ HOUSE + ROOM 块 ═══
    for (var hi = 0; hi < houses.length; hi++) {
      var h = houses[hi];
      var houseTs = h.ts ? new Date(h.ts) : now;
      lines.push('════ HOUSE ' + h.index + ' ════ ' + ts(houseTs) + ' [' + h.ms + 'ms] ════');


      if (h.reasoning) {
        lines.push('<thinking>');
        lines.push(h.reasoning);
        lines.push('</thinking>');
        lines.push('');
      }

      if (h.tools && h.tools.length > 0) {
        for (var ti = 0; ti < h.tools.length; ti++) {
          var t = h.tools[ti];
          var argsStr = (typeof t.args === 'string') ? t.args : JSON.stringify(t.args || {});
          lines.push('  ── ROOM ' + h.index + '.' + (ti + 1) + '  ' + t.name + '(' + argsStr + ') ──');
          if (h.toolResults && h.toolResults[ti]) {
            lines.push(h.toolResults[ti]);
            lines.push('');
          }
        }
      }

      if (h.type === 'final' && h.answer) {
        lines.push('  <answer>');
        lines.push(h.answer);
        lines.push('  </answer>');
      }

      lines.push('');
    }

    // ═══ floor stats + az 区（每层楼私有） ═══
    if (timing) {
      lines.push('════ floor ' + floorNum + ' stats ════');
      lines.push('network: ' + (timing.networkMs ? timing.networkMs.toFixed(0) : '0') + 'ms  AI: ' + (timing.deepseekMs ? timing.deepseekMs.toFixed(0) : '0') + 'ms  tool: ' + (timing.toolMs ? timing.toolMs.toFixed(0) : '0') + 'ms  cost: ' + (agent._floorCostWge / 10000).toFixed(4) + ' ge');
      // az 区文本化
      var _floorDataForAz = { houses: houses, allTxtPath: _allTxtPath, costWge: agent._floorCostWge };
      var _questMetaForAz = { floorTimings: agent._floorTimings || [] };
      var _azLines2 = _buildAzText(floorNum, _floorDataForAz, _questMetaForAz);
      for (var _azi2 = 0; _azi2 < _azLines2.length; _azi2++) {
        lines.push(_azLines2[_azi2]);
      }
    }

    // 写入前检查总大小（唯一真理守卫 4MB）
    if (!_guardAllTxtSize(lines)) return;
    var _txtContent = lines.join('\n');
    await bridge.fs.write(dir + 'all.txt', _txtContent);
    console.log('[quests] floor txt: ' + dir + 'all.txt (' + lines.length + ' lines)');
    // 若用户正打开此文件，刷新编辑器到最终版
    if (_allTxtOpenInEditor) {
      var _finalContent = lines.join('\n');
      _postToHost({ type: 'qqq-editor-refresh', path: dir + 'all.txt', content: _finalContent });
    }
  } catch (e) {
    console.warn('[quests] generateFloorTxt failed:', e);
  }
}

// ═══ 追加到 quest 级 search_quest.txt（全文检索：时间线 + Q + A，跨楼层拼接）═══
// ═══ 构建 az 区文本（每层楼私有：A1 统计 + 时钟 + 文件变更） ═══
function _buildAzText(floorNum, floorData, questMeta) {
  var lines = [];
  var houses = floorData.houses || [];
  var hCount = houses.length;
  var rCount = 0;
  for (var hi = 0; hi < houses.length; hi++) {
    if (houses[hi].tools) rCount += houses[hi].tools.length;
  }

  // A1 行1: Floor / House / Room
  var allTxtSize = '';
  if (floorData.allTxtPath && floorData.allTxtPath.length > 0) {
    allTxtSize = ' [all.txt: ' + floorData.allTxtPath.split('/').pop() + ']';
  }
  lines.push('az> Floor ' + floorNum + '  House ' + hCount + '  Room ' + rCount + allTxtSize);

  // A1 行2: 文件变更统计（使用统一 _computeFileStats）
  var fs = _computeFileStats(houses);
  if (fs.fileCount > 0 || fs.added > 0 || fs.deleted > 0) {
    lines.push('az> FILE ' + fs.fileCount + '   ROW +' + fs.added + ' -' + fs.deleted);
  }

  // 时钟：楼层耗时 + network/deepseek/tool 分项
  var timings = (questMeta && questMeta.floorTimings) || [];
  for (var tii = 0; tii < timings.length; tii++) {
    if (timings[tii].floorIndex === floorNum) {
      var t = timings[tii];
      var durS = Math.round((t.durationMs || 0) / 1000);
      var min = Math.floor(durS / 60);
      var sec = durS % 60;
      var netS = Math.round((t.networkMs || 0) / 1000);
      var dsS = Math.round((t.deepseekMs || 0) / 1000);
      var toolS = Math.round((t.toolMs || 0) / 1000);
      lines.push('az> ⏱ ' + min + 'm' + (sec < 10 ? '0' : '') + sec + 's  Net:' + netS + 's  AI:' + dsS + 's  Tool:' + toolS + 's');
      break;
    }
  }

  // 成本
  if (floorData.costWge) {
    var ge = (floorData.costWge / 10000).toFixed(4);
    lines.push('az> 💰 ' + ge + ' ge');
  }

  return lines;
}

async function _appendToSearchQuest(questId, floorNum) {
  if (!questId || !floorNum) return;
  var root = questStore.getProjectRoot();
  if (!root) return;
  var bridge = window.parent && window.parent.qqqideBridge;
  if (!bridge) return;

  try {
    // 读 floor 数据（唯一真理 SQLite）
    var floorData = await questStore.loadFloor(questId, floorNum);
    if (!floorData) return;
    var questMeta = await questStore.load(questId);

    // 解析 quest 目录路径：优先从 floor 数据推导，回退到磁盘搜索
    var questDir = '';
    if (floorData.allTxtPath) {
      // 从 all.txt 路径反推：.../quests/q{n}.xxx/f{n}.xxx/all.txt → .../quests/q{n}.xxx/
      var parts = floorData.allTxtPath.replace(/\\/g, '/').split('/');
      var questIdx = parts.indexOf('quests');
      if (questIdx >= 0 && questIdx + 1 < parts.length) {
        questDir = parts.slice(0, questIdx + 2).join('/') + '/';
      }
    }
    if (!questDir) {
      // 回退：磁盘搜索以 questId 为前缀的目录
      var questsDir = root + '/qqq/quests/';
      try {
        var entries = await bridge.fs.list(questsDir);
        for (var ei = 0; ei < entries.length; ei++) {
          if (entries[ei].name.startsWith(questId + '.') && entries[ei].isDir) {
            questDir = questsDir + entries[ei].name + '/';
            break;
          }
        }
      } catch (_) {}
    }
    if (!questDir) return;  // 无法解析目录，静默跳过
    var searchPath = questDir + 'search_quest.txt';

    // 提取时间戳
    var now = new Date();
    var pad2 = function(n) { return String(n).padStart(2, '0'); };
    var ts = function(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };
    var floorTs = now;
    if (questMeta && questMeta.floorTimings) {
      for (var ti = 0; ti < questMeta.floorTimings.length; ti++) {
        var ft = questMeta.floorTimings[ti];
        if (ft.floorIndex === floorNum && ft.finishedAt) {
          floorTs = new Date(new Date(ft.finishedAt).getTime() - (ft.durationMs || 0));
          break;
        }
      }
    }

    // 标记行，用于去重检测
    var marker = '═════ Floor ' + floorNum + ' ═════';

    // 读已有内容（若存在），检查是否已写过本层楼
    var existing = '';
    try { existing = await bridge.fs.read(searchPath); } catch (_) {}
    if (existing.indexOf(marker) >= 0) return;  // 已存在，跳过

    // 提取 AI 最终回答（最后一个 final 类型 house 的 answer）
    var houses = floorData.houses || [];
    var answer = '';
    for (var hi = houses.length - 1; hi >= 0; hi--) {
      if (houses[hi].type === 'final' && houses[hi].answer) {
        answer = houses[hi].answer;
        break;
      }
    }

    // 构建条目
    var lines = [];
    if (existing) lines.push('');  // 与上一楼层间隔一行
    lines.push(marker + '   ' + ts(floorTs));
    lines.push('■ Q: ' + (floorData.question || ''));
    lines.push('■ A: ' + (answer || '(no answer)'));
    
    // ═══ az 区文本化（每层楼私有 A1 + 时钟数据） ═══
    var _azLines = _buildAzText(floorNum, floorData, questMeta);
    for (var _azi = 0; _azi < _azLines.length; _azi++) {
      lines.push(_azLines[_azi]);
    }
    lines.push('');

    // 确保目录存在
    try { await bridge.fs.mkdir(questDir); } catch (_) {}

    // 追加写入
    var newContent = existing + lines.join('\n');
    await bridge.fs.write(searchPath, newContent);
    console.log('[search_quest] appended floor ' + floorNum + ' → ' + searchPath + ' (' + newContent.length + ' chars)');
  } catch (e) {
    console.warn('[search_quest] failed:', e && e.message);
  }
}

var _switching = false;  // 互斥锁：防止快速双击 tab 导致并发切任务
// ═══ 从 questStore 恢复 agent 全量状态（conversation + metadata） ═══
async function _restoreAgentFromStore(questId, ag) {
  if (!questId || !ag) return;
  try {
    var data = await questStore.load(questId);
    var allFloors = await questStore.loadAllFloors(questId);

    // 重建 conversation：聚合所有楼层
    ag.conversation = [];
    for (var fi = 0; fi < allFloors.length; fi++) {
      var fConv = allFloors[fi].data.conversation;
      if (fConv && fConv.length) {
        for (var mi = 0; mi < fConv.length; mi++) {
          ag.conversation.push(fConv[mi]);
        }
      }
    }

    // 修复断裂的 tool_calls
    if (ag._repairOrphanedToolCalls) {
      ag._repairOrphanedToolCalls();
    }

    // 恢复 metadata
    if (data) {
      ag._ctx = data.ctx || { narrative: '', facts: [], floorSummaries: [], treasures: [], totalFloors: 0 };
      ag.totalCostGe = data.totalCostGe || 0;
      ag._lastApiPromptTokens = data.lastApiPromptTokens || 0;
      ag._floorTimings = data.floorTimings || [];
      ag._serverDrift = data.serverDrift || 0;
      _queue = data.queue || [];
      ag._rulesVersion = data.rulesVersion || '';
      ag._persistentCount = data.persistentCount || 0;
    } else {
      ag._ctx = { narrative: '', facts: [], floorSummaries: [], treasures: [], totalFloors: 0 };
      ag.totalCostGe = 0;
      ag._lastApiPromptTokens = 0;
      ag._floorTimings = [];
      ag._serverDrift = 0;
      _queue = [];
    }
    console.log('[quests] restored agent state for ' + questId + ': ' + ag.conversation.length + ' msgs');
  } catch (e) {
    console.warn('[quests] _restoreAgentFromStore error:', e && e.message);
  }
}

async function switchQuest(id) {
  if (id === questActiveId) return;
  if (_switching) return;  // 上一次切换未完成，忽略
  _switching = true;
  try {
    // ═══ 所有权检查：已被其他面板持有 → 跳转焦点 ═══
    var owner = await questStore.getOwner(id);
    if (owner && owner.windowId !== _windowId) {
      // 通知拥有者面板获得焦点
      _broadcast('focus-request', id, { targetWindow: owner.windowId });
      // 显示提示
      try {
        if (parent && parent.qqqideQoast) parent.qqqideQoast.show(
          '📌 该 Quest 已在另一面板打开，已自动跳转',
          { type: 'info', duration: 3000 }
        );
      } catch (_) {}
      _switching = false;
      return;  // 终止切换
    }
    // 无人持有 → 声明所有权
    if (!owner) {
      var claimResult = await questStore.claimOwner(id, _windowId);
      if (claimResult.claimed) {
        _broadcast('owner-claimed', id);
      } else if (claimResult.currentOwner && claimResult.currentOwner !== _windowId) {
        // 竞态：刚被别人抢走
        _broadcast('focus-request', id, { targetWindow: claimResult.currentOwner });
        _switching = false;
        return;
      }
    }
    _readonlyQuest = false;
    _readonlyOwner = null;
    setInputReadonly(false);

    // ═══ 保存旧 quest UI 状态（不 abort 后台流！） ═══
    if (questActiveId) {
      // 停止当前楼层计时器
      if (_floorTimerId) { clearInterval(_floorTimerId); _floorTimerId = null; }
      // 保存 UI 快照到 agent（agent 引用更新到 agentPool 内，Card DOM 保留原样）
      saveQuestUIState(questActiveId);
      _stopAutoSave();
      if (_activeAgent) {
        await _saveAgentQuestData(questActiveId, _activeAgent, _activeAgent._floorStartIdx);
      }
      _activeAiDiv = null;
    }

    // ═══ Card Pool 切换（纯 CSS 显隐，零 DOM 销毁） ═══
    await cardPool.switchTo(id);

    questActiveId = id;
    await questStore.setActiveId(id);
    // ★ 同步到唯一真理配置
    if (typeof onlyStore !== 'undefined' && onlyStore.isInited()) {
      onlyStore.set('ai.activeQuestId', id);
      onlyStore.set('ai.window.' + _windowId + '.activeQuestId', id);
    }

    // ═══ 交换 active agent ═══
    _activeAgent = _getOrCreateAgent(id);

    // ═══ 恢复 agent 状态（conversation + metadata） ═══
    await _restoreAgentFromStore(id, _activeAgent);

    // 恢复当前 quest 的流式状态（如果 Card 中有在建楼）
    var card = cardPool.getCard(id);
    if (card && card.buildingFloor !== null) {
      var bDOM = card.floorDOM[card.buildingFloor];
      if (bDOM && bDOM.aiEl) {
        _activeAiDiv = bDOM.aiEl;
        _activeAgent._activeAiDiv = bDOM.aiEl;
        if (_activeAgent._floorStartPerf) {
          _floorStartPerf = _activeAgent._floorStartPerf;
        }
        // 恢复时钟
        if (bDOM.aiEl._clockBlock && !_floorTimerId) {
          startFloorTimer(bDOM.aiEl, true);
        }
      }
    } else {
      _activeAiDiv = null;
      _floorTimerId = null;
      _floorStartPerf = 0;
    }
    _allTxtPath = _activeAgent._allTxtPath || '';

    restoreQuestUIState(id);
    updateCostDisplay();
    updateCtxBtn();
    await renderTabs();
  } finally { _switching = false; }
}

// ── 生成 quest/floor 文件夹名：q{n}.{安全化文本} 或 f{n}.{安全化文本} ──
// 用户消息前 100 字节，经过五层安全处理，保证任何语言/符号全部安全
function _makeName(prefix, num, text) {
  var MAX_BYTES = 100;
  if (!text) return prefix + num;

  // ① 字节截断：UTF-8 编码 → 截前 MAX_BYTES 字节 → 回退到完整 UTF-8 序列 → 解码（零乱码）
  var bytes = new TextEncoder().encode(text);
  var end = Math.min(MAX_BYTES, bytes.length);
  // UTF-8: 0xxxxxxx=ASCII, 11xxxxxx=多字节起始, 10xxxxxx=延续字节
  // 若截断点落在延续字节，回退到上一个起始字节
  while (end > 0 && (bytes[end] & 0xC0) === 0x80) { end--; }
  var truncated = bytes.slice(0, end);
  var decoded = new TextDecoder().decode(truncated);

  // ② 字符安全化：替换一切非安全字符为下划线
  //    保留：字母、数字、中文、日文、韩文、阿拉伯文、泰文、西里尔文等所有 Unicode 文字
  //    保留：空格、连字符、下划线、点号（中间位置）
  //    替换：控制字符、Windows 非法字符、emoji 修饰符、不可见字符
  var sanitized = decoded
    .replace(/[\x00-\x1f\x7f-\x9f]/g, '')  // 控制字符 → 删除
    .replace(/[\\/:*?"<>|]/g, '_')            // Windows 非法字符 → _
    .replace(/[\u200B-\u200D\uFEFF\u200E\u200F]/gu, '') // 零宽字符 → 删除
    .replace(/\s+/g, ' ')                      // 合并连续空白
    .trim();

  // ③ 首尾安全：去除首尾点号（Windows 自动去除，会导致同名）
  sanitized = sanitized.replace(/^\.+/, '').replace(/\.+$/, '');

  // ④ 保留名保护：CON/PRN/AUX/NUL/COM1-9/LPT1-9 → 加前缀 _
  var upper = sanitized.toUpperCase();
  var RESERVED = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/;
  if (RESERVED.test(upper) || RESERVED.test(upper.replace(/\..*/, ''))) {
    sanitized = '_' + sanitized;
  }

  // ⑤ 空名保护：若 sanitize 后为空，只用数字
  if (!sanitized) return prefix + num;

  return prefix + num + '.' + sanitized;
}
// ── 创建 quest 文件夹（含嵌套 floor 目录）──
async function _ensureQuestDir(root, qName, fName) {
  var bridge = window.parent && window.parent.qqqideBridge;
  if (!bridge || !bridge.fs) return;
  var qDir = root + '/qqq/quests/' + qName;
  var fDir = qDir + '/' + fName + '/';
  // 逐级建目录
  var parts = fDir.replace(/\\/g, '/').split('/').filter(function(p) { return p; });
  var accum = '';
  for (var pi = 0; pi < parts.length; pi++) {
    accum += (accum ? '/' : '') + parts[pi];
    try { await bridge.fs.mkdir(accum); } catch (_) {}
  }
  return { qDir: qDir, fDir: fDir };
}

async function createNewQuest() {

async function deleteQuest(id) {
  var quests = await questStore.list();
  if (quests.length <= 1) { await createNewQuest(); return; }
  await questStore.deleteQuest(id);
  delete questUIStates[id];
  // 释放所有权
  try { await questStore.releaseOwner(id, _windowId); } catch(_) {}
  _broadcast('owner-released', id);
  // ═══ 清理 agent pool + Card Pool ═══
  if (agentPool[id]) {
    try { agentPool[id].abort(); } catch(_) {}
    delete agentPool[id];
  }
  cardPool.removeCard(id);
  if (questActiveId === id) {
    quests = await questStore.list();
    questActiveId = quests[0].id;
    await questStore.setActiveId(questActiveId);
    _activeAgent = _getOrCreateAgent(questActiveId);
    await cardPool.switchTo(questActiveId);
    await _restoreAgentFromStore(questActiveId, _activeAgent);
    restoreQuestUIState(questActiveId);
  }
  await renderTabs();
}

// 上下文血量
var CTX_MAX_TOKENS = 1000000; // DeepSeek v4 1M 上下文窗口
var _estCache = { val: 0, convLen: -1, ctxHash: '' };
function estimateTokens() {
  if (!_activeAgent) return 0;
  var conv = agent.conversation;
  var ctx = agent._ctx;
  // 简单缓存：conv 长度 + ctx 摘要未变则复用
  var ctxHash = ctx ? (ctx.totalFloors + '|' + (ctx.facts ? ctx.facts.length : 0) + '|' + (ctx.floorSummaries ? ctx.floorSummaries.length : 0)) : '';
  if (_estCache.convLen === conv.length && _estCache.ctxHash === ctxHash && _estCache.val > 0) {
    return _estCache.val;
  }
  var total = 0;
  var CHAR_PER_TOKEN = 3.0;
  for (var i = 0; i < conv.length; i++) {
    var c = conv[i].content;
    if (typeof c === 'string') total += c.length / CHAR_PER_TOKEN;
    if (conv[i].tool_calls && Array.isArray(conv[i].tool_calls)) {
      try { total += JSON.stringify(conv[i].tool_calls).length / CHAR_PER_TOKEN; } catch (_) {}
    }
    total += 10; // role overhead
  }
  // 系统提示词
  if (typeof SYSTEM_PROMPT !== 'undefined') total += SYSTEM_PROMPT.length / CHAR_PER_TOKEN;
  // 工具定义 schema（每次 API 调用都带
  if (typeof TOOL_DEFINITIONS !== 'undefined') {
    try { total += JSON.stringify(TOOL_DEFINITIONS).length / CHAR_PER_TOKEN; } catch (_) {}
  }
  // 动态上下文 — 镜像 _buildDynamicContext 的输出（只计实际发送的量）
  if (ctx) {
    var dynText = '';
    if (ctx.narrative) {
      dynText += '[DYNAMIC CONTEXT]\nCONVERSATION CONTEXT (compressed history):\n' + ctx.narrative;
    }
    if (ctx.facts && ctx.facts.length > 0) {
      var facts = ctx.facts.slice(-10);
      dynText += '\n\nRELEVANT FACTS FROM EARLIER (' + facts.length + '/' + ctx.facts.length + ' total):\n';
      for (var fi = 0; fi < facts.length; fi++) {
        dynText += '- [' + (facts[fi].type || '') + '] ' + (facts[fi].content || '') + '\n';
      }
    }
    if (ctx.floorSummaries && ctx.floorSummaries.length > 0) {
      var summaries = ctx.floorSummaries.slice(-15);
      dynText += '\n\nFLOOR CHECKPOINTS:\n';
      for (var si = 0; si < summaries.length; si++) {
        dynText += '📌 ' + (summaries[si].summary || '') + '\n';
      }
    }
    if (ctx.treasures && ctx.treasures.length > 0) {
      var treasures = ctx.treasures.slice(-10);
      dynText += '\n\nKEY DISCOVERIES:\n';
      for (var ti = 0; ti < treasures.length; ti++) {
        dynText += '💎 ' + (treasures[ti].content || '') + '\n';
      }
    }
    total += dynText.length / CHAR_PER_TOKEN;
  }
  var result = Math.round(total);
  _estCache = { val: result, convLen: conv.length, ctxHash: ctxHash };
  return result;
}

var _queueFallback = [];
var _queuePaused = false; // 暂停自动消费
var _queueSaveTimer = null; // debounce 保存（500ms）
var QUEUE_MAX = 50; // 队列最大长度
Object.defineProperty(window, '_queue', {
  get: function() { return _activeAgent ? _activeAgent._queue : _queueFallback; },
  set: function(v) { if (_activeAgent) _activeAgent._queue = v; else _queueFallback = v; },
  enumerable: true, configurable: true
});

// debounce 保存队列（500ms 内多次操作合并为一次写盘）
function _debounceSaveQueue() {
  if (_queueSaveTimer) clearTimeout(_queueSaveTimer);
  _queueSaveTimer = setTimeout(function() {
    _queueSaveTimer = null;
    saveQuestData().catch(function(){});
  }, 500);
}

// 触发队列发送：从当前 agent 队列取第一条 → 填入输入框 → 发送
// 如果输入框有用户正在编辑的内容 → 暂停队列保护用户输入
function _triggerQueueSend() {
  var _q = _queue;
  if (!_q || _q.length === 0) { renderQueueStrip(); return; }
  // 保护：输入框有用户正在编辑的内容（非纯空白） → 自动暂停
  // 用 innerText 判断更准确（排除不可见 <br> 等标签噪音）
  var inputText = ($input.innerText || '').trim();
  if (inputText) {
    _queuePaused = true;
    renderQueueStrip();
    return;
  }
  var _totalBefore = _q.length;
  var next = _q.shift();
  var _remaining = _q.length;
  renderQueueStrip();
  _debounceSaveQueue();
  // 恢复富文本（保留 file chips 等 HTML 结构）
  $input.innerHTML = next.html || next.text;
  // 队列状态提示（发送完成后由 _continueQueue 移除）
  var _qStatus = document.createElement('div');
  _qStatus.className = 'msg msg-status';
  _qStatus.id = 'queue-sending-status';
  _qStatus.style.color = 'var(--blue)';
  _qStatus.textContent = '📮 排队发送中 (' + (_remaining + 1) + '/' + _totalBefore + ')';
  $messages.appendChild(_qStatus);
  scrollToBottom(true);
  setTimeout(function() { sendMessage(); }, 300);
}

function renderQueueStrip() {
  $queueStrip.innerHTML = '';
  if (_queue.length === 0) { $queueStrip.style.display = 'none'; return; }
  $queueStrip.style.display = 'block';

  // ── 头部控制栏 ──
  var header = document.createElement('div');
  header.className = 'queue-header';
  var countEl = document.createElement('span');
  countEl.className = 'queue-header-count';
  countEl.textContent = '📮 队列 (' + _queue.length + ')';
  header.appendChild(countEl);

  var spacer = document.createElement('span');
  spacer.style.cssText = 'flex:1';
  header.appendChild(spacer);

  // 暂停/继续按钮
  var pauseBtn = document.createElement('button');
  pauseBtn.className = 'queue-header-btn';
  pauseBtn.textContent = _queuePaused ? '▶ 继续' : '⏸ 暂停';
  pauseBtn.title = _queuePaused ? '恢复自动发送' : '暂停自动发送';
  pauseBtn.onclick = function(e) {
    e.stopPropagation();
    _queuePaused = !_queuePaused;
    renderQueueStrip();
    // 从暂停恢复 + 队列非空 + AI 空闲 → 立即触发消费
    if (!_queuePaused && _queue.length > 0 && !streaming && !_sending) {
      _triggerQueueSend();
    }
  };
  header.appendChild(pauseBtn);

  // 清空按钮
  var clearBtn = document.createElement('button');
  clearBtn.className = 'queue-header-btn';
  clearBtn.textContent = '🗑 清空';
  clearBtn.title = '清空所有排队消息';
  clearBtn.onclick = function(e) {
    e.stopPropagation();
    _queue.length = 0;
    renderQueueStrip();
    _debounceSaveQueue();
  };
  header.appendChild(clearBtn);
  $queueStrip.appendChild(header);

  // ── 卡片列表 ──
  for (var i = 0; i < _queue.length; i++) {
    (function(q, idx) {
      var card = document.createElement('div');
      card.className = 'queue-card';
      var preview = q.text.slice(0, 80) + (q.text.length > 80 ? '...' : '');
      card.textContent = (idx + 1) + '. ' + preview;
      card.title = '点击编辑或删除';
      card.onclick = function() {
        if (card.classList.contains('queue-card-expanded')) return;
        card.classList.add('queue-card-expanded');
        card.innerHTML = '';
        var ta = document.createElement('textarea');
        ta.value = q.text;
        card.appendChild(ta);
        var actions = document.createElement('div');
        actions.className = 'qcard-actions';

        var modBtn = document.createElement('button');
        modBtn.textContent = '保存';
        modBtn.onclick = function(e) {
          e.stopPropagation();
          q.text = ta.value;
          q.html = ta.value; // 纯文本编辑，html 同步
          renderQueueStrip();
          _debounceSaveQueue();
        };

        var delBtn = document.createElement('button');
        delBtn.textContent = '删除';
        delBtn.onclick = function(e) {
          e.stopPropagation();
          _queue.splice(idx, 1);
          renderQueueStrip();
          _debounceSaveQueue();
        };

        var cancelBtn = document.createElement('button');
        cancelBtn.textContent = '取消';
        cancelBtn.onclick = function(e) {
          e.stopPropagation();
          renderQueueStrip();
        };

        actions.appendChild(modBtn);
        actions.appendChild(delBtn);
        actions.appendChild(cancelBtn);
        card.appendChild(actions);
      };
      $queueStrip.appendChild(card);
    })(_queue[i], i);
  }

  // ── 底部状态 ──
  var footer = document.createElement('div');
  footer.className = 'queue-footer';
  if (_queuePaused) {
    footer.textContent = '⏸ 已暂停 · 队列中 ' + _queue.length + ' 条消息等待手动发送';
  } else if (_sending || streaming) {
    footer.textContent = '⏳ AI 回复完成后自动发送下一条';
  } else {
    footer.textContent = '📤 下一条：' + _queue[0].text.slice(0, 60) + (_queue[0].text.length > 60 ? '...' : '');
  }
  $queueStrip.appendChild(footer);
}

function drawPie(canvas, timing) {
  // 跳过无变化重绘（计时器每秒触发但数据未必更新
  if (_lastPieTiming && timing &&
      _lastPieTiming.networkMs === timing.networkMs &&
      _lastPieTiming.deepseekMs === timing.deepseekMs &&
      _lastPieTiming.toolMs === timing.toolMs) return;
  _lastPieTiming = timing ? { networkMs: timing.networkMs, deepseekMs: timing.deepseekMs, toolMs: timing.toolMs } : null;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  var n = timing.networkMs || 0;
  var d = timing.deepseekMs || 0;
  var t = timing.toolMs || 0;
  var total = timing.totalMs || (n + d + t);
  if (total <= 0) { ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(w/2, h/2, w/2-3, 0, Math.PI*2); ctx.fill(); canvas._segments = null; return; }
  // unaccounted time all goes to Tool (yellow)
  t = Math.max(0, total - n - d);
  var parts = [
    { val: d, color: '#859900', label: 'AI', key: 'deepseek' },
    { val: n, color: '#cb4b16', label: 'Network', key: 'network' },
    { val: t, color: '#e6b800', label: 'Tool',    key: 'tool' }
  ];
  var start = -Math.PI / 2;
  var segments = [];
  for (var i = 0; i < parts.length; i++) {
    if (parts[i].val <= 0) continue;
    var slice = (parts[i].val / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(w/2, h/2);
    ctx.arc(w/2, h/2, w/2-3, start, start + slice);
    ctx.fillStyle = parts[i].color;
    ctx.fill();
    segments.push({ startAngle: start, endAngle: start + slice, label: parts[i].label, key: parts[i].key, ms: parts[i].val, color: parts[i].color });
    start += slice;
  }
  canvas._segments = segments;
  canvas._total = total;
}

function _initClockBlock(aiDiv) {

  }
  var _pieShown = false;

  _floorTimerId = setInterval(function() {
    var elapsed = performance.now() - _floorStartPerf;
    var totalS = Math.floor(elapsed / 1000);
    var min = Math.floor(totalS / 60);

    clockMin.textContent = min + 'm';
    clockSec.textContent = ':' + (sec < 10 ? '0' : '') + sec + 's';
    var at = agent._floorTiming;
    var n = (at && at.networkMs) || 0;
    var d = (at && at.deepseekMs) || 0;
    var t = (at && at.toolMs) || 0;
    // 数据到了 → 显示饼图
    if (!_pieShown && (n > 0 || d > 0 || t > 0)) { _pieShown = true; canvas.style.visibility = 'visible'; }
    if (!_pieShown) return;  // 数据未到时保持初始绿色，不切换颜色

// 智能匹配：空格=AND，单 token=字符级模糊子序列
function _matchQuest(query, title) {
  if (!query) return true;
  var tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return true;
  var lower = title.toLowerCase();
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    // 字符级子序列匹配：t 的每个字符必须按顺序出现在 lower 中
    var pos = 0;
    var matched = true;
    for (var ci = 0; ci < t.length; ci++) {
      pos = lower.indexOf(t[ci], pos);
      if (pos === -1) { matched = false; break; }
      pos++;
    }
    if (!matched) return false;
  }
  return true;
}

  var displayCount = Math.min(filtered.length, _questDropLimit);

  lines.push('════ HOUSE ' + h.index + ' ════ ' + _ts(houseTs) + ' [' + h.ms + 'ms] ════');

async function _appendToFile(path, text) {
  var bridge = window.parent && window.parent.qqqideBridge;
  if (!bridge) return false;
  try {
    // 读取现有内容，追加后写回（因为 fs.write 是全量覆盖）
    var existing = '';
    try { existing = await bridge.fs.read(path); } catch(_) {}
    var updated = existing + text;
    await bridge.fs.write(path, updated);
    return true;
  } catch(e) {
    console.warn('[all-txt] append failed:', e && e.message);
    return false;
  }
}

// ═══ 唯一真理 all.txt 大小守卫（4MB） ═══
var _ALL_TXT_MAX_MB = 4;
var _allTxtBlocked = false;      // 本 floor 已触发拦截 → 后续写入全部跳过
var _allTxtBlockedQoastTs = 0;   // qoast 节流时间戳

function _guardAllTxtSize(lines) {
  if (_allTxtBlocked) return false;  // 已拦截，不再重复计算
  var content = lines.join('\n');
  var sizeBytes = new Blob([content]).size;
  var sizeMB = sizeBytes / (1024 * 1024);
  if (sizeMB <= _ALL_TXT_MAX_MB) return true;

  // 超限：标记拦截 + 日志 + qoast（30s 节流）
  _allTxtBlocked = true;
  console.error('[all-txt] BLOCKED: ' + sizeMB.toFixed(1) + 'MB exceeds ' + _ALL_TXT_MAX_MB + 'MB limit — archive paused this floor');
  var now = Date.now();
  if (now - _allTxtBlockedQoastTs > 30000) {
    _allTxtBlockedQoastTs = now;
    try { if (parent && parent.qqqideQoast) parent.qqqideQoast.show(
      '⚠️ all.txt ' + sizeMB.toFixed(1) + 'MB 超过 ' + _ALL_TXT_MAX_MB + 'MB 上限，归档已暂停（SQLite 完好）',
      { type: 'error', duration: 8000 }
    ); } catch(_) {}
  }
  return false;
}

// Safe write with external-edit conflict guard
async function _safeWriteAllTxt(path, lines, lastMtime) {
  var bridge = window.parent && window.parent.qqqideBridge;
  if (!bridge) return false;
  // 唯一真理大小守卫（4MB）
  if (!_guardAllTxtSize(lines)) return false;
  try {
    var content = lines.join('\n');
    var stat = await bridge.fs.stat(path).catch(function() { return null; });
    if (lastMtime > 0 && stat && stat.mtimeMs && Math.abs(stat.mtimeMs - lastMtime) > 100) {
      console.warn('[all-txt] externally modified, skipping write');
      return false;
    }
    await bridge.fs.write(path, content);
    return true;
  } catch (e) {
    console.warn('[all-txt] write failed:', e && e.message);
    return false;
  }
}

// Start A1 polling + streaming all.txt writes（全量写盘，5秒节流）
// 放弃增量追加：house 的 toolResults 在创建后才异步填充，增量会丢数据。
// 单层楼 all.txt < 500KB，全量写入足够快。
function _startAllTxtStream(aiDiv, allTxtPath, agent, floorNum, userContent, visionContent) {
  _stopAllTxtStream();
  _allTxtBlocked = false;  // 新 floor 重置拦截标记
  var lastWriteMs = 0;
  var lastHouseCount = 0;
  var lastRoomCount = 0;

  _allTxtPollTimer = setInterval(function() {
    // 页面隐藏时跳过（节省 CPU + IPC）
    if (document.hidden) return;
    if (!agent._houses) return;
    var hCount = agent._houses.length;
    var rCount = _countRooms(agent._houses);

    var a1 = aiDiv._a1Block || _allTxtA1Block;
    if (a1 && a1._r1fn) {
      _updateA1Row1(a1, floorNum, hCount, rCount);
    }

    var now = Date.now();
    var hasNew = hCount > lastHouseCount || rCount > lastRoomCount;
    // 10秒节流 或 有新 house → 全量写入（保证 toolResults 不丢）
    if (now - lastWriteMs > 10000 || hasNew) {
      lastWriteMs = now;
      lastHouseCount = hCount;
      lastRoomCount = rCount;

      var uiText = '';
      if (agent._lastUserInput && agent._lastUserInput.text) {
        uiText = agent._lastUserInput.text.replace(/\n/g, ' ').trim();
      }
      var vtText = (agent._lastUserInput && agent._lastUserInput.vision) ? agent._lastUserInput.vision.trim() : '';
      var headerLines = _buildFloorHeaderLines(agent, floorNum, uiText, vtText, agent._floorTiming);
      var allLines = headerLines.slice();
      var houses = agent._houses;
      for (var hi = 0; hi < houses.length; hi++) {
        allLines = allLines.concat(_buildHouseLines(houses[hi]));
      }
      _safeWriteAllTxt(allTxtPath, allLines, 0).then(function(ok) {
        if (ok) {
          _updateA1Size(a1, floorNum, hCount, rCount, allTxtPath);
          if (_allTxtOpenInEditor) {
            var bridge2 = window.parent && window.parent.qqqideBridge;
            if (bridge2) {
              bridge2.fs.read(allTxtPath).then(function(content) {
                _postToHost({ type: 'qqq-editor-refresh', path: allTxtPath, content: content });
              }).catch(function(){});
            }
          }
        }
      }).catch(function(){});
    }
    _updateA1Row2(a1, agent);
  }, 1000);
}

// 更新 a1 第一行的文件大小显示
function _updateA1Size(a1, floorNum, hCount, rCount, allTxtPath) {
  var b2 = window.parent && window.parent.qqqideBridge;
  if (!b2 || !a1 || !a1._r1fn) return;

// Finalize all.txt after floor completes（追加 stats 尾部 + 停止流）
async function _finalizeAllTxt(aiDiv, allTxtPath, agent, floorNum, timing) {
  _stopAllTxtStream();
  if (!allTxtPath) return;
  var bridge = window.parent && window.parent.qqqideBridge;
  if (!bridge) return;
  try {
    // 追加 floor stats
    var statsLines = _buildFloorStatsLines(timing || agent._floorTiming, floorNum, agent);
    if (statsLines.length > 0) {
      var statsText = '\n' + statsLines.join('\n') + '\n';
      await _appendToFile(allTxtPath, statsText);
    }
    // 更新 a1 文件大小
    var st = await bridge.fs.stat(allTxtPath).catch(function(){ return null; });
    var a1 = aiDiv._a1Block;
    if (a1 && a1._r1fn && st && st.size) {
      var hCount = agent._houses ? agent._houses.length : 0;
      var rCount = _countRooms(agent._houses);
      _updateA1Row1(a1, floorNum, hCount, rCount, st.size);
    }
    // Final Monaco refresh
    if (_allTxtOpenInEditor) {
      var content = await bridge.fs.read(allTxtPath).catch(function(){ return ''; });
      parent.postMessage({ type: 'qqq-editor-refresh', path: allTxtPath, content: content }, '*');
    }
    console.log('[all-txt] finalized: ' + allTxtPath);
  } catch (e) {
    console.warn('[all-txt] finalize failed:', e && e.message);
  }
}

function _stopAllTxtStream() {
  if (_allTxtPollTimer) { clearInterval(_allTxtPollTimer); _allTxtPollTimer = null; }
  _allTxtA1Block = null;
  _allTxtPath = null;
  _stopAllTxtLive();  // 停止编辑器实时刷新（无副作用，仅清理可能残留的定时器）
}

var _fileStatsCache = {}; // { floorKey: { files:Set, added:0, deleted:0, lastTs:0 } }
function _updateA1Row2(block, agent) {
  if (!block || !block._r2 || !agent) return;
  var houses = agent._houses;
  if (!houses) return;
  var now = Date.now();
  // 使用 block 标识作为缓存 key
  var cacheKey = block._aiDiv ? block._aiDiv._allTxtPath || 'unknown' : 'unknown';
  var cache = _fileStatsCache[cacheKey];
  if (!cache) {
    cache = { files: {}, added: 0, deleted: 0, lastTs: 0 };
    _fileStatsCache[cacheKey] = cache;
  }
  // 5秒聚合：只统计新 house
  if (now - cache.lastTs < 5000 && cache._seenHouses >= houses.length) return;
  cache.lastTs = now;
  cache._seenHouses = houses.length;
  // 使用统一 _computeFileStats
  var fs = _computeFileStats(houses);
  if (fs.fileCount > 0 || fs.added > 0 || fs.deleted > 0) {
    cache.files = {}; cache.added = fs.added; cache.deleted = fs.deleted;
  }
  if (block._r2a) _a1AnimateNum(block._r2a, 'FILE ' + fs.fileCount);
  if (block._r2b) _a1AnimateNum(block._r2b, '   ROW +' + fs.added + ' -' + fs.deleted);
}

// ═══ 语言检测 ═══
function _detectLanguage(text) {
  if (!text) return 'english';
  var sample = text.slice(0, 200);
  var total = sample.length;
  if (total === 0) return 'english';
  // 阿拉伯字符
  var arabic = 0;
  for (var i = 0; i < sample.length; i++) {
    var c = sample.charCodeAt(i);
    if (c >= 0x0600 && c <= 0x06FF) arabic++;
  }
  if (arabic / total > 0.15) return 'arabic';
  // CJK
  var cjk = 0;
  for (var i2 = 0; i2 < sample.length; i2++) {
    var c2 = sample.charCodeAt(i2);
    if ((c2 >= 0x4E00 && c2 <= 0x9FFF) || (c2 >= 0x3400 && c2 <= 0x4DBF) ||
        (c2 >= 0xF900 && c2 <= 0xFAFF) || (c2 >= 0x3040 && c2 <= 0x309F) ||
        (c2 >= 0x30A0 && c2 <= 0x30FF) || (c2 >= 0xAC00 && c2 <= 0xD7AF)) cjk++;
  }
  if (cjk / total > 0.15) {
    // 细分：日文有假名，韩文有谚文
    var hiragana = 0, hangul = 0;
    for (var i3 = 0; i3 < sample.length; i3++) {
      var c3 = sample.charCodeAt(i3);
      if (c3 >= 0x3040 && c3 <= 0x309F) hiragana++;
      if (c3 >= 0xAC00 && c3 <= 0xD7AF) hangul++;
    }
    if (hangul > 0) return 'korean';
    if (hiragana > 0) return 'japanese';
    return 'chinese';
  }
  // 西里尔
  var cyrillic = 0;
  for (var i4 = 0; i4 < sample.length; i4++) {
    var c4 = sample.charCodeAt(i4);
    if (c4 >= 0x0400 && c4 <= 0x04FF) cyrillic++;
  }
  if (cyrillic / total > 0.15) return 'russian';
  return 'english';
}

// ═══════════════════════════════════════════════════════════════
// 审计 + 翻译（唯一真理：SQLite）
//   [审计] → SQLite floor 数据 → 生成 chat.txt → 写盘 → X 区域打开
//   [翻译] → 读 chat.txt → AI 翻译自然语言 → chat.{lang}.txt → 写盘打开
// ═══════════════════════════════════════════════════════════════

var _auditBusy = false;
var _translateBusy = false;
var _auditLastLang = null;

// ── 从 SQLite floor 数据生成 chat.txt（纯本地，0 API 调用）──
function _generateChatTxt(floorData, questMeta, floorNum) {
  var lines = [];
  var now = new Date();
  var pad2 = function(n) { return String(n).padStart(2, '0'); };
  var ts = function(d) { return d ? d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) : ts(now); };

  // floor header（使用楼层开始时间 = finishedAt - durationMs）
  var floorTs = now;
  var timing = null;
  if (questMeta && questMeta.floorTimings) {
    for (var ti = 0; ti < questMeta.floorTimings.length; ti++) {
      if (questMeta.floorTimings[ti].floorIndex === floorNum) {
        timing = questMeta.floorTimings[ti];
        if (timing.finishedAt) {
          floorTs = new Date(new Date(timing.finishedAt).getTime() - (timing.durationMs || 0));
        }
        break;
      }
    }
  }
  lines.push('floor.' + floorNum + '   ' + ts(floorTs));
  lines.push('');

  // user question
  var question = (floorData && floorData.question) || '';
  if (question) { lines.push(question); lines.push(''); }

  // body size calc
  var userBytes = question ? new TextEncoder().encode(question).length : 0;
  var convBytes = 0;
  var conv = (floorData && floorData.conversation) || [];
  for (var ci = 0; ci < conv.length; ci++) {
    if (conv[ci] && typeof conv[ci].content === 'string') {
      convBytes += new TextEncoder().encode(conv[ci].content).length;
    }
  }
  lines.push('(body ' + (userBytes / 1024).toFixed(3) + 'k: ask ' + (userBytes / 1024).toFixed(3) + 'k + conv ' + (convBytes / 1024).toFixed(3) + 'k)');
  lines.push('');

  // houses
  var houses = (floorData && floorData.houses) || [];
  var TRUNCATE_TOOL_RESULT = 300; // 工具结果截断到 300 字符
  for (var hi = 0; hi < houses.length; hi++) {
    var h = houses[hi];
    var hTs = h.ts ? new Date(h.ts) : now;
    lines.push('════ HOUSE ' + h.index + ' ════ ' + ts(hTs) + ' [' + (h.ms || 0) + 'ms] ════');

    // thinking（保留，这是审计的核心价值）
    if (h.reasoning) {
      lines.push('<thinking>');
      lines.push(h.reasoning);
      lines.push('</thinking>');
      lines.push('');
    }

    // tools
    if (h.tools && h.tools.length > 0) {
      for (var ti2 = 0; ti2 < h.tools.length; ti2++) {
        var t = h.tools[ti2];
        var argsStr = (typeof t.args === 'string') ? t.args : JSON.stringify(t.args || {});
        lines.push('  ── ROOM ' + h.index + '.' + (ti2 + 1) + '  ' + t.name + '(' + argsStr + ') ──');
        if (h.toolResults && h.toolResults[ti2]) {
          var result = String(h.toolResults[ti2]);
          if (result.length > TRUNCATE_TOOL_RESULT) {
            result = result.slice(0, TRUNCATE_TOOL_RESULT) + '… [' + result.length + ' chars total]';
          }
          lines.push(result);
          lines.push('');
        }
      }
    }

    // answer
    if (h.type === 'final' && h.answer) {
      lines.push('  <answer>');
      lines.push(h.answer);
      lines.push('  </answer>');
    }

    lines.push('');
  }

  // floor stats
  if (timing) {
    lines.push('════ floor ' + floorNum + ' stats ════');
    lines.push('network: ' + (timing.networkMs ? timing.networkMs.toFixed(0) : '0') + 'ms  AI: ' + (timing.deepseekMs ? timing.deepseekMs.toFixed(0) : '0') + 'ms  tool: ' + (timing.toolMs ? timing.toolMs.toFixed(0) : '0') + 'ms  cost: ' + ((floorData.costWge || 0) / 10000).toFixed(4) + ' ge');
  }

  return lines.join('\n');
}

// ── 审计：从 SQLite 生成 chat.txt → 写盘 → 打开 ──
async function _onAuditClick(block) {
  if (_auditBusy) return;
  _auditBusy = true;

// ── 翻译：增量翻译 + 内存拼接，无变化则只打开 ──
var _translateCache = {};  // { chatPath: { sourceContent, translatedContent, lang } }

async function _onTranslateClick(block) {
  if (_translateBusy) return;
  _translateBusy = true;
  var btn = block._translateBtn;
  var origText = btn ? btn.textContent : '翻译';
  if (btn) { btn.textContent = '…'; btn.disabled = true; }

  try {
    var lang = block._auditLang || 'zh';
    var chatPath = block._path.replace(/all\.txt$/, 'chat.txt');
    var translatedPath = chatPath.replace(/\.txt$/, '.' + lang + '.txt');
    var bridge = window.parent && window.parent.qqqideBridge;
    if (!bridge) { _translateBusy = false; if (btn) { btn.textContent = origText; btn.disabled = false; } return; }

    // 读当前 chat.txt（若不存在则先生成）
    var chatContent = '';
    try { chatContent = await bridge.fs.read(chatPath); } catch (_) {}
    if (!chatContent) {
      var questId = block._questId;
      var floorNum = block._floorNum;
      if (questId && floorNum) {
        var floorData = await questStore.loadFloor(questId, floorNum);
        var questMeta = await questStore.load(questId);
        if (floorData) {
          chatContent = _generateChatTxt(floorData, questMeta, floorNum);
          await bridge.fs.write(chatPath, chatContent);
        }
      }
      if (!chatContent) { _translateBusy = false; if (btn) { btn.textContent = origText; btn.disabled = false; } return; }
    }

    // 检查缓存：语言变了 → 全量重译
    var cache = _translateCache[chatPath];
    if (cache && cache.lang !== lang) {
      console.log('[translate] language changed (' + cache.lang + ' → ' + lang + '), full retranslation');
      cache = null;
    }

    // 无变化 → 只打开已有文件
    if (cache && cache.sourceContent === chatContent) {
      console.log('[translate] no change, opening existing ' + translatedPath);
      var _exists = false;
      try { var _st = await bridge.fs.stat(translatedPath); _exists = !!_st; } catch (_) {}
      if (_exists) {
        _postToHost({ type: 'qqq-file-open-right', path: translatedPath, readOnly: true });
        if (btn) { btn.textContent = '✓'; btn.disabled = false; }
        setTimeout(function() { if (btn) btn.textContent = '翻译'; }, 1500);
        _translateBusy = false;
        return;
      }
      // 文件被删了 → 继续走全量翻译
    }

    // 增量翻译：只翻译新增部分
    var toTranslate, isIncremental;
    if (cache && cache.sourceContent && chatContent.startsWith(cache.sourceContent)) {
      var newPart = chatContent.slice(cache.sourceContent.length);
      if (newPart.trim()) {
        toTranslate = newPart;
        isIncremental = true;
        console.log('[translate] incremental: ' + newPart.length + ' new chars');
      } else {
        // 完全相同（理论上不会到这里，但兜底）
        _postToHost({ type: 'qqq-file-open-right', path: translatedPath, readOnly: true });
        if (btn) { btn.textContent = '✓'; btn.disabled = false; }
        setTimeout(function() { if (btn) btn.textContent = '翻译'; }, 1500);
        _translateBusy = false;
        return;
      }
    } else {
      toTranslate = chatContent;
      isIncremental = false;
      console.log('[translate] full translation: ' + chatContent.length + ' chars');
    }

    // 调 AI 翻译
    var translatedPart = await _translateViaAI(toTranslate, lang, isIncremental);

    // 拼接结果
    var finalTranslated;
    if (isIncremental && cache && cache.translatedContent) {
      finalTranslated = cache.translatedContent + translatedPart;
    } else {
      finalTranslated = translatedPart;
    }

    // 更新缓存
    _translateCache[chatPath] = {
      sourceContent: chatContent,
      translatedContent: finalTranslated,
      lang: lang
    };

    // 写 chat.{lang}.txt
    await bridge.fs.write(translatedPath, finalTranslated);
    console.log('[translate] written: ' + translatedPath + ' (' + finalTranslated.length + ' chars)');

    // 在 X 区域打开
    _postToHost({ type: 'qqq-file-open-right', path: translatedPath, readOnly: true });

    if (btn) { btn.textContent = '✓'; btn.disabled = false; }
    setTimeout(function() { if (btn) btn.textContent = '翻译'; }, 1500);
  } catch (e) {
    console.warn('[translate] failed:', e && e.message);
    if (btn) { btn.textContent = origText; btn.disabled = false; }
  } finally {
    _translateBusy = false;
  }
}

// ── AI 翻译核心 ──
async function _translateViaAI(text, targetLang, isIncremental) {
  var langNames = {
    'zh': 'Simplified Chinese (简体中文)', 'zh-tw': 'Traditional Chinese (繁體中文)',
    'en': 'English', 'ja': 'Japanese (日本語)', 'de': 'German (Deutsch)',
    'ko': 'Korean (한국어)', 'ru': 'Russian (Русский)', 'ar': 'Arabic (العربية)',
    'es': 'Spanish (Español)', 'fr': 'French (Français)',
    'pt-BR': 'Portuguese (Português)', 'hi': 'Hindi (हिन्दी)', 'vi': 'Vietnamese (Tiếng Việt)'
  };
  var langName = langNames[targetLang] || targetLang;
  var prompt;
  if (isIncremental) {
    prompt = 'This is a CONTINUATION of a chat log. Translate ONLY the following new text to ' + langName + '.\n' +
      'CRITICAL: Preserve ALL structure markers unchanged: "════ HOUSE", "floor.", "<thinking>", "</thinking>", "<answer>", "</answer>", "── ROOM".\n' +
      'Keep ALL code, file paths, JSON, numbers, and technical terms unchanged.\n' +
      'Translate ONLY the natural language content.\n' +
      'Output ONLY the translated text — no explanations.\n\n' + text;
  } else {
    prompt = 'Translate the natural language parts of this chat log to ' + langName + '.\n' +
      'CRITICAL: Preserve ALL structure markers unchanged: "════ HOUSE", "floor.", "<thinking>", "</thinking>", "<answer>", "</answer>", "── ROOM".\n' +
      'Keep ALL code, file paths, JSON, numbers, and technical terms unchanged.\n' +
      'Translate ONLY the natural language content (thinking text, answers, user messages).\n' +
      'Output the COMPLETE file with original structure, only the language parts translated.\n\n' + text;
  }

  var token = getToken();
  if (!token) {
    console.warn('[translate] no token, returning original');
    return text;
  }

  var resp = await fetch(GATEWAY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({
      model: 'flash',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: Math.min(Math.ceil(text.length * 1.5) + 200, 32000),
      temperature: 0.1,
      thinking: { type: 'disabled' },
      stream: false
    })
  });

  if (!resp.ok) {
    var errBody = '';
    try { errBody = await resp.text(); } catch (_) {}
    throw new Error('Translation API returned ' + resp.status + ': ' + errBody.slice(0, 100));
  }

  var data = await resp.json();
  var content = (data && data.choices && data.choices[0] && data.choices[0].message)
    ? data.choices[0].message.content
    : null;

  if (!content || content.trim().length === 0) {
    throw new Error('Translation returned empty');
  }

  console.log('[translate] translated: ' + text.length + ' → ' + content.length + ' chars (' + langName + ')');
  return content;
}

  updateQueueBtn();
  var text = getInputText().trim();
  var chipPaths = getInputChipPaths();
  if (!text && chipPaths.length === 0) { _sending = false; updateQueueBtn(); return; }

  var token = getToken();
  if (!token) {
    addMessageEl('error', '请先在顶部输入 Token 并点击 Save');
    _sending = false;
    updateQueueBtn();
    return;
  }

  // Build user content with attached file chips (read actual content)
  var userContent = text;
  var allPaths = chipPaths;
  if (allPaths.length > 0) {
    var contentParts = [];
    for (var pi = 0; pi < allPaths.length; pi++) {
      var p = allPaths[pi];
      try {
        var bridge = _getBridge();
        if (!bridge) { contentParts.push('[Attached: ' + p + ']\n(bridge unavailable)'); continue; }
        var isDir = false;
        var statInfo = null;
        try {
          statInfo = await bridge.fs.stat(p);
          if (statInfo && statInfo.isDir) isDir = true;
        } catch(e) {}
        if (isDir) {
          try {
            var entries = await bridge.fs.list(p);
            var tree = entries.slice(0, 200).map(function(e) { return (e.isDir ? '\u{1F4C1} ' : '   ') + e.name; }).join('\n');
            var suffix = entries.length > 200 ? '\n... (' + entries.length + ' total entries, showing first 200)' : '';
            contentParts.push('[Directory: ' + p + ']\n' + tree + suffix);
          } catch(e) { contentParts.push('[Directory: ' + p + ']\n(read error: ' + e.message + ')'); }
        } else {
          var m = p.toLowerCase().match(/\\.([a-z0-9]+)$/);
          var ext = m ? m[1] : '';
          var BIN_EXT = ['mp3','wav','flac','m4a','aac','ogg','opus','wma','ape',
                         'mp4','avi','mkv','mov','wmv','flv','webm','m4v','mpg','mpeg','ts','3gp',
                         'png','jpg','jpeg','gif','bmp','webp','svg','ico','tiff','tif','heic','avif',
                         'zip','rar','7z','tar','gz','xz','bz2',
                         'pdf','doc','docx','xls','xlsx','ppt','pptx',
                         'exe','msi','dll','so','dylib','bin','dat',
                         'ttf','otf','woff','woff2','eot',
                         'vsix','jar','class','wasm'];
          var isBinary = BIN_EXT.indexOf(ext) !== -1;
          if (isBinary) {
            var sizeStr = statInfo && statInfo.size ? formatBytes(statInfo.size) : '?';
            var mtimeStr = statInfo && statInfo.mtime ? new Date(statInfo.mtime).toLocaleString() : '?';
            contentParts.push('[File: ' + p + ']\n- type: .' + ext + ' (binary)\n- size: ' + sizeStr + '\n- mtime: ' + mtimeStr);
          } else {
            try {
              var content = await bridge.fs.read(p);
              var MAX_SIZE = 50 * 1024;
              if (content.length > MAX_SIZE) {
                var head = content.substring(0, 20 * 1024);
                var tail = content.substring(content.length - 20 * 1024);
                content = head + '\n\n... [truncated: ' + content.length + ' bytes total, showing first/last 20KB] ...\n\n' + tail;
              }
              contentParts.push('[File: ' + p + ']\n```\n' + content + '\n```');
            } catch(e) { contentParts.push('[File: ' + p + ']\n(read error: ' + e.message + ')'); }
          }
        }
      } catch(e) { contentParts.push('[Attached: ' + p + ']\n(error: ' + e.message + ')'); }

        }
        
        // 始终保存数据（确保后台完成的 agent 数据也不丢）
        await _saveAgentQuestData(_capturedQuestId, _capturedAgent, _capturedAgent._floorStartIdx);
        
        // ═══ Card Pool：封顶在建楼 + 6+1 裁剪 ═══
        cardPool.completeBuildingFloor(_capturedQuestId, floorNum);
        
        // Card Pool 架构：DOM 永不脱离，无需 _rebuildUIForQuest
        // _divDetached 条件已失效（Card DOM 不会被 remove）
        if (_activeAgent === _capturedAgent && _divDetached) {
          // 罕见回退：Card Pool 未初始化时 div 确实脱离
          console.warn('[onDone] div detached but card pool not available, skipping rebuild');
        }
        
        // ═══ 完成 all.txt：追加 floor stats + 停止流 ═══
        var _ftxtPath = (_targetDiv2 && _targetDiv2._allTxtPath) || _allTxtPath;
        await _finalizeAllTxt(_targetDiv2 || aiDiv, _ftxtPath, _capturedAgent, floorNum, timing);
        if (_activeAgent === _capturedAgent) {
          updateCtxBtn();
          if (!_queuePaused) {
            _triggerQueueSend();
          } else {
            renderQueueStrip();
          }
        }
      },

      onCost: async function(cost, total) {
        if (_activeAgent === _capturedAgent) {
          var costNum = parseFloat(cost);
          if (!isNaN(costNum)) {
            _windowTotalCostGe += costNum;
          }
          _updateCostDisplay();
          _fetchBalanceIfNeeded();
          // ═══ 实时更新 az 区成本显示（精确值来自 gh555.com） ═══
          var _targetDiv3 = (aiDiv && aiDiv.isConnected) ? aiDiv : (_capturedAgent._activeAiDiv || aiDiv);
          if (_targetDiv3 && _targetDiv3._clockCost) {
            var _floorGe = (_capturedAgent._floorCostWge / 10000).toFixed(4);
            _targetDiv3._clockCost.textContent = _floorGe + ' ge';
            _targetDiv3._clockCost.style.display = 'inline';
          }
        }
      },
      onError: function(msg) {
        _stopAutoSave();  // 流式出错，停止增量保存
        if (_activeAgent === _capturedAgent) {
          // ★ 若本层已成功完成（onDone 已调用），跳过 onError 的破坏性清理
          //    避免重复调用 stopFloorTimer() 导致饼图变黄、计时丢失
          if (aiDiv && aiDiv._floorCompleted) {
            console.log('[onError] floor already completed, skipping destructive cleanup');
            setStreaming(false);
            _continueQueue();
            return;
          }
          // 错误消息支持换行（\n → <br>）
          var _errDiv = addMessageEl('error', msg);
          // 如果错误建议刷新，添加可点击的刷新按钮
          if (msg.indexOf('刷新') >= 0) {
            var _actRow = document.createElement('div');
            _actRow.style.cssText = 'margin-top:8px;display:flex;gap:8px;';
            var _refreshBtn = document.createElement('button');
            _refreshBtn.textContent = '🔄 刷新面板';
            _refreshBtn.style.cssText = 'padding:4px 14px;font-size:12px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-primary);cursor:pointer;';
            _refreshBtn.onclick = function() { window.location.reload(); };
            var _dismissBtn = document.createElement('button');
            _dismissBtn.textContent = '我知道了';
            _dismissBtn.style.cssText = 'padding:4px 14px;font-size:12px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-primary);cursor:pointer;';
            _dismissBtn.onclick = function() { _actRow.remove(); };
            _actRow.appendChild(_refreshBtn);
            _actRow.appendChild(_dismissBtn);
            _errDiv.appendChild(_actRow);
          }
          _stopAllTxtStream();
          stopFloorTimer();
          setStreaming(false);
          _continueQueue();
        }
      }
    });
  } catch (err) {
    if (err && err.name !== 'AbortError') {
      addMessageEl('error', err.message || 'Unknown error');
      _continueQueue();
    }
  } finally {
    // 确保即使 abort 也能清理流式状态（仅清理 captured agent 的 DOM 引用）
    _stopAutoSave();
    _stopAllTxtStream();
    if (_activeAgent === _capturedAgent) {
      if (_floorTimerId) { clearInterval(_floorTimerId); _floorTimerId = null; }
      if (_activeAiDiv) {
        // 中断/异常时，时钟应落到停止态（黑色），避免残留绿色
        var _elapsed = performance.now() - _floorStartPerf;
        var _totalS = Math.floor(_elapsed / 1000);
        var _min = Math.floor(_totalS / 60);
        var _sec = _totalS % 60;
        var _stopColor = document.documentElement.getAttribute('data-theme') === 'dark' ? '#fff' : '#000';
        if (_activeAiDiv._clockMin) {
          _activeAiDiv._clockMin.textContent = _min + 'm';
          _activeAiDiv._clockSec.textContent = ':' + (_sec < 10 ? '0' : '') + _sec + 's';
          _activeAiDiv._clockMin.style.color = _stopColor;
          _activeAiDiv._clockSec.style.color = _stopColor;
        }
        _activeAiDiv._renderScheduled = false;
        _activeAiDiv = null;
      }
    }
    _capturedAgent._sending = false;
    _capturedAgent._streaming = false;
    // 同步全局状态（如果 captured agent 仍是 active agent）
    if (_activeAgent === _capturedAgent) {
      setStreaming(false);
    }
  }
}

// 队列错误恢复：发送失败不阻塞后续排队消息
function _continueQueue() {
  // 清除排队状态提示
  var _qs = document.getElementById('queue-sending-status');
  if (_qs) _qs.remove();
  if (_queuePaused) return;
  _triggerQueueSend();
}

// ---- Contenteditable helpers ----
// getInputText — keep chip order, replace chips with \u201cpath\u201d
function getInputText() {
  var text = '';
  var nodes = $input.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.nodeType === 3) { text += n.textContent; }
    else if (n.nodeName === 'BR') { text += '\n'; }
    else if (n.classList && n.classList.contains('file-chip')) {
      text += '\u201c' + (n.dataset.path || '') + '\u201d';
    }
    else { text += n.textContent; }
  }
  return text;
}
// getInputPlainText — pure text, skip chips (for AI content building)
function getInputPlainText() {
  var text = '';
  var nodes = $input.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.nodeType === 3) { text += n.textContent; }
    else if (n.nodeName === 'BR') { text += '\n'; }
    else if (n.classList && n.classList.contains('file-chip')) { /* skip */ }
    else { text += n.textContent; }
  }
  return text;
}

function getInputChipPaths() {
  const paths = [];
  $input.querySelectorAll('.file-chip').forEach(chip => {
    if (chip.dataset.path) paths.push(chip.dataset.path);
  });
  return paths;
}

function chipBasename(p) {
  const parts = p.replace(/\\/g, '/').split('/').filter(Boolean);
  return parts[parts.length - 1] || p;
}

// ═══ 记住 $input 内最后光标位置（用于焦点面板文件附加） ═══
var _lastInputSelection = null;
$input.addEventListener('keyup', function() { _saveInputSelection(); });
$input.addEventListener('mouseup', function() { _saveInputSelection(); });
$input.addEventListener('focus', function() { if (_lastInputSelection) _restoreInputSelection(); });
function _saveInputSelection() {
  var sel = window.getSelection();
  if (sel.rangeCount > 0 && $input.contains(sel.anchorNode)) {
    _lastInputSelection = { range: sel.getRangeAt(0).cloneRange() };
  }
}
function _restoreInputSelection() {
  if (!_lastInputSelection) return;
  try {
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(_lastInputSelection.range.cloneRange());
  } catch(_) {}
}

function insertChipAtCursor(filePath) {
  const chip = document.createElement('span');
  chip.className = 'file-chip';
  chip.contentEditable = 'false';
  chip.dataset.path = filePath;
  const isDir = !filePath.match(/\.[a-zA-Z0-9]+$/);
  chip.innerHTML =
    '<span class="chip-icon">' + (isDir ? '📁' : '📄') + '</span>' +
    '<span class="chip-name">' + escHtml(chipBasename(filePath)) + '</span>' +
    '<span class="chip-rm">×</span>';
  chip.querySelector('.chip-rm').addEventListener('click', function() { chip.remove(); });
  chip.title = filePath;

  // 优先用当前选区，否则用上次记住的光标位置
  $input.focus();
  var sel = window.getSelection();
  if (sel.rangeCount > 0 && $input.contains(sel.anchorNode)) {
    // 光标在 $input 内 → 直接插
    var range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(chip);
    range.setStartAfter(chip);
    range.setEndAfter(chip);
    sel.removeAllRanges();
    sel.addRange(range);
  } else if (_lastInputSelection && _lastInputSelection.range) {
    // 光标在别处 → 恢复到上次位置再插
    _restoreInputSelection();
    var sel2 = window.getSelection();
    if (sel2.rangeCount > 0 && $input.contains(sel2.anchorNode)) {
      var range2 = sel2.getRangeAt(0);
      range2.deleteContents();
      range2.insertNode(chip);
      range2.setStartAfter(chip);
      range2.setEndAfter(chip);
      sel2.removeAllRanges();
      sel2.addRange(range2);
    } else {
      $input.appendChild(chip);
    }
  } else {
    // 无任何光标记录 → 末尾附加
    $input.appendChild(chip);
  }
  _saveInputSelection();
}

// Expose for direct cross-frame access (same origin)
window.qqqideAiAttach = insertChipAtCursor;

// Listen for file attachment from parent (AI viewport via postMessage)
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'qqq-ai-attach') {
    if (!_hasMainProject()) { _triggerSelectMainProject(); return; }
    const path = e.data.path;
    if (path) {
      insertChipAtCursor(path);
    }
  }
});

// Also listen for CustomEvent on document (in case dispatched in same page)
document.addEventListener('qqq-ai-attach', function(e) {
  if (e.detail && e.detail.path) {
    insertChipAtCursor(e.detail.path);
  }
});

// ═══ 僚机接收主窗口发来的文件附加（IPC sync host-message） ═══
(function initWingmanAttachListener() {
  if (_wingmanIndex == null) return;
  var sb = _getSyncBridge();
  if (!sb) { setTimeout(initWingmanAttachListener, 500); return; }
  sb.onMessage(function(channel, data) {
    if (channel !== 'host-message' || !data) return;
    if (data.type === 'qqq-ai-attach' && data.path) {
      insertChipAtCursor(data.path);
    }
  });
})();

// ═══ 面板快捷键：仅焦点在面板且不在编辑框时生效 ═══
document.addEventListener('keydown', function(e) {
  if (!_panelFocused) return;
  if (document.activeElement === $input || document.activeElement.closest('#input-area')) return;
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
  var key = e.key;
  if (key === '1') {
    e.preventDefault();
    $messages.scrollBy({ top: -$messages.clientHeight * 0.35, behavior: 'smooth' });
  } else if (key === '2') {
    e.preventDefault();
    $messages.scrollBy({ top: $messages.clientHeight * 0.35, behavior: 'smooth' });
  } else if (key === 'q' || key === 'w') {
    e.preventDefault();
    // 找到所有楼层用户消息
    var card = cardPool ? cardPool.getActive() : null;
    var container = card ? card._contentWrap : $messages;
    var userMsgs = container.querySelectorAll('.msg-user');
    if (userMsgs.length === 0) return;
    // 找到当前视口中心最近的楼层
    var viewCenter = $messages.scrollTop + $messages.clientHeight / 2;
    var currentIdx = -1;
    var minDist = Infinity;
    for (var ui = 0; ui < userMsgs.length; ui++) {
      var msgTop = userMsgs[ui].offsetTop;
      // offsetTop 相对于 offsetParent；需要累加到 container 级别
      var el = userMsgs[ui];
      var absTop = 0;
      while (el && el !== container) {
        absTop += el.offsetTop || 0;
        el = el.offsetParent;
      }
      var dist = Math.abs(viewCenter - absTop);
      if (dist < minDist) { minDist = dist; currentIdx = ui; }
    }
    if (currentIdx < 0) return;
    var targetIdx = key === 'q' ? Math.max(0, currentIdx - 1) : Math.min(userMsgs.length - 1, currentIdx + 1);
    if (targetIdx === currentIdx && key === 'w' && currentIdx < userMsgs.length - 1) targetIdx = currentIdx + 1;
    if (targetIdx === currentIdx && key === 'q' && currentIdx > 0) targetIdx = currentIdx - 1;
    if (targetIdx !== currentIdx) {
      var target = userMsgs[targetIdx];
      target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
});

// ═══ 自动跟焦：输入框获得焦点时广播活跃面板 ═══
$input.addEventListener('focus', function() {
  var panel = _wingmanIndex != null ? _wingmanIndex : 0;  // 僚机=-1/1, 主窗口=0
  if (_isStandalone) {
    // 僚机：通过 IPC sync 广播
    var sb = _getSyncBridge();
    if (sb) { sb.broadcast('host-message', { type: 'qqq-ai-panel-focused', panel: panel }); }
  } else {
    // 主窗口 iframe：通过 parent.postMessage
    try { parent.postMessage({ type: 'qqq-ai-panel-focused', panel: 0 }, '*'); } catch(_) {}
  }
});

// ═══ Full-window overlay (via parent.postMessage / IPC sync) ═══
function openLightbox(src, base64) {
  _postToHost({ type: 'qqqide-overlay', action: 'open-image', src: src, base64: base64 || null });
}

function closeLightbox() {
  _postToHost({ type: 'qqqide-overlay', action: 'close' });
}

// Escape key handled by parent overlay; also listen locally as fallback
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeLightbox();
  }
});

// 窗口关闭时释放主进程项目映射
window.addEventListener('beforeunload', function() {
  var root = questStore.getProjectRoot();
  if (root) {
    try {
      if (window.parent && window.parent.qqqideBridge && window.parent.qqqideBridge.window) {
        window.parent.qqqideBridge.window.releaseProject(root).catch(function () { });
      }
    } catch (_) { }
  }
});

  // ═══ 暴露给 card-pool.js 跨模块访问 ═══
  window._initA1Block = _initA1Block;
  window._initClockBlock = _initClockBlock;
  window.renderMarkdown = renderMarkdown;
  window.getUserDisplayContent = getUserDisplayContent;
  window._countRooms = _countRooms;
  window._updateA1Row1 = _updateA1Row1;
  window.drawPie = drawPie;
  window._showPieTooltip = _showPieTooltip;
  window._hidePieTooltip = _hidePieTooltip;

})();
</script>
