<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>qqq AI</title>
<style>
/* 配色变量由父窗口 qqq-theme.js 注入；独立运行时使用 fallback */
:root {
  --background-color:#fdf6e3;--card-bg:#eee8d5;--text-primary:#7a7874;--border-color:#d3c6aa;
  --base03:#002b36;--base02:#073642;--base01:#777777;--base00:#7a7874;
  --base0:#7a7874;--base1:#a8a6a2;--base2:#eee8d5;--base3:#fdf6e3;
  --yellow:#b58900;--orange:#cb4b16;--red:#dc322f;--magenta:#d33682;
  --violet:#6c71c4;--blue:#e8a030;--cyan:#2aa198;--green:#859900;
}
[data-theme="dark"] {
  --background-color:#1e1e1e;--card-bg:#2a2a2a;--text-primary:#d4d0c8;--border-color:#333333;
  --base03:#fdf6e3;--base02:#eee8d5;--base01:#93a1a1;--base00:#c8c4b8;
  --base0:#a8a49c;--base1:#6a6660;--base2:#2a2a2a;--base3:#1e1e1e;
  --yellow:#d4a017;--orange:#e07020;--red:#ff4444;--magenta:#c06080;
  --violet:#a08060;--blue:#d4a017;--cyan:#5abfb5;--green:#8fbc5a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{forced-color-adjust:none!important}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text-primary);background:var(--background-color);height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
#top-bar{padding:6px 10px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:8px;font-size:11px}
#top-bar .label{opacity:.7}
#top-bar input{flex:1;padding:2px 6px;background:var(--card-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:3px;font-size:11px}
#top-bar button{padding:2px 8px;cursor:pointer;border:1px solid var(--border-color);border-radius:3px;background:var(--card-bg);font-size:11px}
#tab-bar{display:flex;align-items:center;gap:2px;padding:2px 6px;border-bottom:1px solid var(--border-color);background:var(--card-bg);overflow-x:auto;scrollbar-width:none}
#tab-bar::-webkit-scrollbar{display:none}
#tabs{display:flex;gap:2px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;border:1px solid var(--border-color);border-radius:3px 3px 0 0;background:var(--bg);cursor:pointer;white-space:nowrap;max-width:160px;user-select:none}
.tab.active{background:var(--base3);border-bottom-color:var(--base3);font-weight:600}
.tab .tab-title{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tab .tab-del{opacity:.4;font-size:14px;line-height:1;padding:0 1px;cursor:pointer}
.tab .tab-del:hover{opacity:1;color:var(--red)}
#tab-new{padding:1px 6px;font-size:16px;line-height:1;cursor:pointer;border:1px solid var(--border-color);border-radius:3px;background:var(--bg);color:var(--base01);flex-shrink:0}
#tab-new:hover{color:var(--text-primary);background:var(--base3)}
#messages{overflow-y:auto;padding:12px;scrollbar-width:thin;min-height:0}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-thumb{background:var(--base01);border-radius:3px}
.msg{margin-bottom:10px;line-height:1.5}
.msg-user{background:var(--card-bg);border-radius:8px;padding:8px 12px}
.msg-ai{padding:8px 0;word-break:break-word}
.msg-ai h1,.msg-ai h2,.msg-ai h3{margin:8px 0 4px;line-height:1.3}
.msg-ai h1{font-size:1.25em}.msg-ai h2{font-size:1.12em}.msg-ai h3{font-size:1.05em}
.msg-ai p{margin:4px 0}
.msg-ai ul,.msg-ai ol{margin:4px 0 4px 20px}
.msg-ai li{margin:2px 0}
.msg-ai code{background:var(--card-bg);color:var(--text-primary);padding:1px 4px;border-radius:3px;font-family:ui-monospace,Consolas,monospace;font-size:.9em;border:1px solid var(--border-color)}
.msg-ai table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px}
.msg-ai th,.msg-ai td{border:1px solid var(--border-color);padding:4px 8px;text-align:left}
.msg-ai th{background:var(--card-bg);font-weight:600}
.msg-ai tr:nth-child(even){background:var(--background-color)}
.msg-ai pre{background:var(--card-bg);color:var(--text-primary);padding:8px 10px;border-radius:4px;overflow-x:auto;margin:6px 0;white-space:pre-wrap;word-break:break-all;border:1px solid var(--border-color)}
.msg-ai pre code{background:none;padding:0;color:inherit}
.msg-ai blockquote{border-left:3px solid var(--border-color);padding-left:10px;margin:4px 0;opacity:.85}
.msg-ai hr{border:none;border-top:1px solid var(--border-color);margin:8px 0}
.msg-ai a{color:var(--blue);text-decoration:none}
.msg-ai a:hover{text-decoration:underline}
.msg-error{color:var(--red);padding:4px 0;font-size:12px}
.msg-status{font-size:11px;opacity:.6;padding:2px 0;font-style:italic}
#input-area{border-top:1px solid var(--border-color);padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--card-bg)}
#image-strip{display:none;overflow-x:hidden;flex-wrap:wrap;padding:4px 0;gap:6px}
#image-strip::-webkit-scrollbar{height:4px}
#image-strip::-webkit-scrollbar-thumb{background:var(--base01);border-radius:2px}
.img-thumb-wrap{display:inline-flex;flex-direction:column;align-items:center;position:relative;width:96px;height:96px;border-radius:4px;overflow:hidden;border:1px solid var(--border-color);margin-right:6px;vertical-align:top}
.img-thumb-wrap img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.img-thumb-num{position:absolute;top:2px;left:2px;background:rgba(0,0,0,0.75);color:#fff;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:3px;cursor:pointer;user-select:none;z-index:2}
.img-thumb-num:hover{background:var(--green)}
.img-thumb-del{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.img-thumb-embed{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border:none;border-radius:3px;font-size:9px;padding:1px 6px;cursor:pointer}
.msg-img-wrap{display:inline-block;position:relative;vertical-align:top;margin:4px 6px 0 0}
.msg-img-wrap img{max-height:120px;border-radius:4px;margin:0}
.msg-img-badge{position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.75);color:#fff;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:3px;cursor:pointer;user-select:none;z-index:1}
.msg-img-badge:hover{background:var(--green)}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;cursor:grab;overflow-x:hidden}
#lightbox.active{display:block}
#lightbox.dragging{cursor:grabbing}
#lightbox-img{position:absolute;transform-origin:0 0;border-radius:6px;user-select:none;-webkit-user-drag:none;max-width:90vw;max-height:90vh;object-fit:contain}
#lightbox-actions{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10001}
#lightbox-actions button{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:4px;padding:6px 14px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px)}
#lightbox-actions button:hover{background:rgba(255,255,255,0.3)}
#input-row{display:flex;gap:6px;overflow:hidden}
#input{flex:1;min-width:0;background:var(--card-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:4px;padding:8px 10px;font-size:13px;font-family:inherit;min-height:36px;max-height:150px;overflow-y:auto;overflow-x:hidden;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;outline:none}
#input:focus{outline:1px solid var(--blue)}
#input:empty::before{content:attr(data-placeholder);color:var(--base01);opacity:.5;pointer-events:none}
#btn-row{display:flex;gap:6px;align-items:center}
#btn-row button{background:var(--card-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px;height:30px}
#btn-row button:hover{background:var(--base3)}
#btn-row button:disabled{opacity:.3;cursor:default}
#send-btn.stop{background:var(--red);color:#fff;border-color:var(--red);opacity:1}
#guide-btn,#queue-btn{padding:4px 8px}
#guide-btn svg,#queue-btn svg{display:block}
.tier-group{display:flex;align-items:center;gap:4px;margin-right:12px}
#btn-row .tier-btn{width:22px;height:22px;padding:0;border:1px solid var(--border-color);border-radius:2px;background:var(--card-bg);color:var(--text-primary);cursor:pointer;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;user-select:none;line-height:1}
#btn-row .tier-btn:hover{background:var(--base3)}
#btn-row .tier-btn.sel{background:var(--red);color:#000;font-weight:800;font-size:13px}
.tier-bar{display:flex;gap:1px}
.file-chip{display:inline-flex;align-items:center;gap:3px;background:var(--base3);border:1px solid var(--border-color);border-radius:3px;padding:1px 6px;margin:0 2px;font-size:11px;color:var(--text-primary);vertical-align:middle;cursor:default;white-space:nowrap;user-select:none;-webkit-user-select:none;max-width:200px}
.file-chip .chip-icon{font-size:10px;flex-shrink:0}
.file-chip .chip-name{overflow:hidden;text-overflow:ellipsis}
.file-chip .chip-rm{cursor:pointer;opacity:.5;font-size:14px;line-height:1;flex-shrink:0;padding:0 1px}
.file-chip .chip-rm:hover{opacity:1;color:var(--red)}
.ctx-files{font-size:11px;opacity:.7;padding:4px 0;border-bottom:1px solid var(--border-color)}
.ctx-files span{background:var(--card-bg);padding:1px 6px;border-radius:3px;margin-right:4px}
/* 楼层时钟 + 饼图（居中，每层末尾） */
.floor-timing{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 8px;font-size:11px;opacity:0.6;user-select:none}
.floor-timing .clock{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
.floor-timing canvas{width:14px;height:14px;border-radius:50%}
/* 排队信封 */
#queue-strip{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 4px}
.queue-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none}
.queue-card:hover{background:var(--base3)}
.queue-card-expanded{max-width:none;white-space:normal;cursor:default}
.queue-card textarea{width:100%;min-height:60px;font-size:12px;padding:4px;border:1px solid var(--border-color);border-radius:3px;background:var(--background-color);color:var(--text-primary);resize:vertical}
.queue-card .qcard-actions{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
.queue-card .qcard-actions button{padding:2px 8px;font-size:11px;border:1px solid var(--border-color);border-radius:3px;cursor:pointer}
/* 上下文压缩面板 */
#ctx-panel{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center}
.ctx-panel-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.ctx-panel-box{position:relative;background:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;padding:20px;max-width:420px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.ctx-panel-body{font-size:13px;line-height:1.6}
.ctx-panel-body p{margin:0 0 8px}
.ctx-panel-body ol{margin:4px 0 8px 20px}
.ctx-panel-body li{margin:2px 0}
.ctx-panel-actions{display:flex;gap:24px;justify-content:flex-end;margin-top:16px}
.ctx-panel-actions button{padding:6px 18px;font-size:12px;border:1px solid var(--border-color);border-radius:4px;cursor:pointer}
#ctx-compress{background:var(--yellow);color:#fff;border-color:var(--yellow)}
#ctx-cancel{background:var(--card-bg)}
</style>
<script>
// 主题同步：从父窗口 qqq-theme.js 唯一真理配色机器继承
(function(){
  'use strict';
  const D = document.documentElement;
  function sync(dark) {
    if (dark) D.setAttribute('data-theme', 'dark');
    else D.removeAttribute('data-theme');
  }
  // 初始同步
  try {
    if (parent && parent.qqqTheme) {
      sync(parent.qqqTheme.isDark());
    } else if (parent) {
      sync(parent.document.documentElement.getAttribute('data-theme') === 'dark');
    }
  } catch(_) {}
  // 始终监听 postMessage
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqq-theme-change') sync(e.data.dark);
  });
})();
</script>

<script>
(function(){
'use strict';

const GATEWAY_URL = 'https://gh555.com/api/v3/ai/chat';

// State
var streaming = false;
var _sending = false;  // atomic guard: 防止 Enter 连按重复发送
var _renderPending = false;
var _scrollPending = false;

// DOM
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('send-btn');
const $tokenInput = document.getElementById('token-input');
const $tokenSave = document.getElementById('token-save');
const $costLabel = document.getElementById('cost-label');
const $guideBtn = document.getElementById('guide-btn');
const $queueBtn = document.getElementById('queue-btn');
const $ctxBtn = document.getElementById('ctx-btn');
const $queueStrip = document.getElementById('queue-strip');

// ── 智能等级选择（per-quest） ──
var selectedTier = 6; // 默认 6=Pro+Max，restoreQuestUIState 会覆盖

function updateTierButtons(tierIndex) {
  document.querySelectorAll('.tier-btn').forEach(function(b) { b.classList.remove('sel'); });
  if (tierIndex === null || tierIndex === 0) {
    document.getElementById('tier-a').classList.add('sel');
  } else {
    var btn = document.querySelector('.tier-btn[data-tier="' + tierIndex + '"]');
    if (btn) btn.classList.add('sel');
  }
}

function selectTier(tierIndex) {
  selectedTier = tierIndex;
  updateTierButtons(tierIndex);
  if (questActiveId) {
    if (!questUIStates[questActiveId]) questUIStates[questActiveId] = {};
    questUIStates[questActiveId].selectedTier = tierIndex;
  }
}

// 初始化选中态
(function initTierUI() {
  selectTier(6); // default, will be overridden by restoreQuestUIState
})();

document.getElementById('tier-a').onclick = function() { selectTier(null); };
document.querySelectorAll('.tier-btn[data-tier]').forEach(function(btn) {
  btn.onclick = function() { selectTier(parseInt(btn.dataset.tier)); };
});

// Token management
function getToken() { return localStorage.getItem('qqq-ai-token') || ''; }
function saveToken(t) { localStorage.setItem('qqq-ai-token', t); }
$tokenInput.value = getToken() ? '••••••••' : '';
$tokenSave.onclick = function() {
  const v = $tokenInput.value.trim();
  if (v && v !== '••••••••') { saveToken(v); $tokenInput.value = '••••••••'; }
};

// Auto-resize not needed for contenteditable (it auto-grows)

// Enter to send
$input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
// ═══ 字符级 Undo/Redo（从 q3/ai 移植，适配 contenteditable） ═══
(function initCharUndo(input) {
  var state = { history: [input.innerHTML || ''], index: 0, isProgrammatic: false };
  input.addEventListener('input', function() {
    if (state.isProgrammatic) { state.isProgrammatic = false; return; }
    var v = input.innerHTML;
    if (state.index < state.history.length - 1) state.history = state.history.slice(0, state.index + 1);
    if (v !== state.history[state.history.length - 1]) { state.history.push(v); state.index = state.history.length - 1; }
  });
  input.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault(); e.stopPropagation();
      if (state.index > 0) {
        state.index--;
        state.isProgrammatic = true;
        input.innerHTML = state.history[state.index];
        // Restore cursor to end
        var range = document.createRange();
        range.selectNodeContents(input);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
      e.preventDefault(); e.stopPropagation();
      if (state.index < state.history.length - 1) {
        state.index++;
        state.isProgrammatic = true;
        input.innerHTML = state.history[state.index];
        var range = document.createRange();
        range.selectNodeContents(input);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }
  });
})($input);

// ═══ 多图管理 ═══
var pendingImages = []; // [{id, base64, dataUrl}]
var MAX_IMAGES = 20;

function addImage(dataUrl, base64) {
  if (pendingImages.length >= MAX_IMAGES) return;
  var id = pendingImages.length + 1;
  pendingImages.push({ id: id, base64: base64, dataUrl: dataUrl });
  renderImageStrip();
}

function removeImage(idx) {
  pendingImages.splice(idx, 1);
  pendingImages.forEach(function(img, i) { img.id = i + 1; });
  renderImageStrip();
}

function renderImageStrip() {
  var strip = document.getElementById('image-strip');
  strip.innerHTML = '';
  if (pendingImages.length === 0) {
    strip.style.display = 'none';
    return;
  }
  strip.style.display = 'flex';
  pendingImages.forEach(function(img, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'img-thumb-wrap';
    var imgEl = document.createElement('img');
    imgEl.src = img.dataUrl;
    wrap.appendChild(imgEl);
    var num = document.createElement('span');
    num.className = 'img-thumb-num';

// 粘贴图片（> 2MB 自动压缩到 2048px 宽）/ 纯文本粘贴
$input.addEventListener('paste', function(e) {
  // 纯文本粘贴：如果有文本，先获取纯文本再处理图片
  var plainText = '';
  try {
    plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
  } catch(_) {}

  // 检查是否有图片
  var hasImage = false;
  var items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (item.type.indexOf('image/') === 0) {
      hasImage = true;
      e.preventDefault();
      var file = item.getAsFile();
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        if (file.size > 2 * 1024 * 1024) {
          var img = new Image();
          img.onload = function() {
            var MAX_W = 2048;
            var scale = img.width > MAX_W ? MAX_W / img.width : 1;
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            var compressed = canvas.toDataURL('image/jpeg', 0.85);
            addImage(compressed, compressed.split(',')[1]);
          };
          img.src = dataUrl;
        } else {
          addImage(dataUrl, dataUrl.split(',')[1]);
        }
      };
      reader.readAsDataURL(file);
      break;
    }
  }
  // 无图片粘贴：强制纯文本（阻止富文本）
  if (!hasImage && plainText) {
    e.preventDefault();
    document.execCommand('insertText', false, plainText);
  }
});

// Markdown renderer (lightweight)
function renderMarkdown(src) {
  if (!src) return '';
  const codeBlocks = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push('<pre><code class="lang-' + (lang||'') + '">' + escHtml(code) + '</code></pre>');
    return '\x00CB' + idx + '\x00';
  });
  s = escHtml(s);
  // Restore code blocks
  s = s.replace(/\x00CB(\d+)\x00/g, function(_, i) { return codeBlocks[+i]; });
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // HR
  s = s.replace(/^---+$/gm, '<hr>');
  // Bold, italic
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Tables (must run before lists to avoid confusing | with list markers)
  s = s.replace(/(?:
|^)(\|.+\|)
\|[-:\s|]+\|
((?:\|.+\|
?)*)/g, function(_, header, rows) {
    if (!header || rows === undefined) return _;
    const ths = header.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<th>' + c.trim() + '</th>'; }).join('');
    const trs = rows.split('\n').filter(function(r) { return r.trim(); }).map(function(r) {
      const tds = r.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('');
      return '<tr>' + tds + '</tr>';
    }).join('');
    return '<table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
  });
  // Lists
  s = s.replace(/^[*\-+] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Paragraphs
  s = s.replace(/\n\n/g, '</p><p>');
  s = '<p>' + s + '</p>';
  s = s.replace(/<p><\/p>/g, '');
  // Line breaks
  s = s.replace(/\n/g, '<br>');
  return s;
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatBytes(n) {
  if (!n || n < 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0; let v = n;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + ' ' + u[i];
}

// 项目文件锁：防止同一主文件夹被多个窗口打开
var _currentLockPath = null;
var _lockHeartbeatId = null;
var LOCK_STALE_MS = 60000;  // 锁超过 60s 未刷新视为僵尸锁
var LOCK_HEARTBEAT_MS = 30000;  // 每 30s 刷新一次

// 绑定主文件夹 → 项目级持久化 + 文件锁防双开
async function bindMainProject() {
  if (!window.parent || !window.parent.qqqAiViewport) return;
  var main = window.parent.qqqAiViewport.getMainProject();
  if (!main || !main.path) {
    console.log('[quests] bindMainProject: no main project yet');
    return;
  }
  var root = main.path.replace(/\\/g, '/').replace(/\/$/, '');
  var lockPath = root + '/qqq/.lock';
  // 如果 lockPath 没变，不需要重新锁定
  if (_currentLockPath === lockPath) {
    console.log('[quests] bindMainProject: already locked ' + root);
    return;
  }
  // 检查是否已被其他窗口锁定
  try {
    var statInfo = await window.parent.qqqBridge.fs.stat(lockPath);
    if (statInfo) {
      var lockRaw = await window.parent.qqqBridge.fs.read(lockPath);
      var lockData = JSON.parse(lockRaw);
      var age = Date.now() - (lockData.atime || 0);
      if (age < LOCK_STALE_MS) {
        console.warn('[quests] bindMainProject BLOCKED: project locked by another window (age=' + (age/1000).toFixed(1) + 's)');
        addMessageEl('error', '⚠️ 该项目已被另一个 QQQ 窗口打开，无法重复绑定。');
        return;
      }
      console.log('[quests] bindMainProject: stale lock cleared (age=' + (age/1000).toFixed(1) + 's)');
      try { await window.parent.qqqBridge.fs.remove(lockPath); } catch (_) {}
    }
  } catch (_) { /* lock 不存在，正常流程 */ }
  // 释放旧锁（切换主文件夹时）
  await _releaseLock();
  // 写入新锁（qqq:fs:write 已内置 auto-mkdir，不再需要显式 mkdir）
  var lockContent = JSON.stringify({ pid: 0, atime: Date.now() });
  try {
    await window.parent.qqqBridge.fs.write(lockPath, lockContent);
    _currentLockPath = lockPath;
  } catch (_) { /* 锁写失败非致命 */ }
  // 启动心跳
  _lockHeartbeatId = setInterval(async function () {
    try { await window.parent.qqqBridge.fs.write(lockPath, JSON.stringify({ pid: 0, atime: Date.now() })); } catch (_) {}
  }, LOCK_HEARTBEAT_MS);
  questStore.setProjectRoot(main.path);
  console.log('[quests] bindMainProject: locked ' + root);
}

async function _releaseLock() {
  if (_lockHeartbeatId) { clearInterval(_lockHeartbeatId); _lockHeartbeatId = null; }
  if (_currentLockPath) {
    try { await window.parent.qqqBridge.fs.remove(_currentLockPath); } catch (_) {}
    _currentLockPath = null;
  }
}

// 窗口关闭时释放锁
window.addEventListener('beforeunload', function () {
  if (_currentLockPath && window.parent && window.parent.qqqBridge) {
    try { window.parent.qqqBridge.fs.remove(_currentLockPath); } catch (_) {}
  }
});

// ═══ 楼层 txt 归档：rooms.txt + thinking.txt ═══
async function generateFloorTxt() {
  var root = questStore.getProjectRoot();
  if (!root) return;
  var houses = agent._houses;
  if (!houses || houses.length === 0) return;
  var floorNum = agent._ctx.totalFloors;
  var questId = questActiveId;
  if (!questId) return;
  var quests = await questStore.list();
  var questIdx = quests.findIndex(function(q) { return q.id === questId; });
  var qNum = questIdx >= 0 ? (questIdx + 1) : 0;
  var questEntry = questIdx >= 0 ? quests[questIdx] : null;
  var rawQTitle = (questEntry && questEntry.title && questEntry.title !== 'New Chat') ? questEntry.title : questId;
  var qTitle = rawQTitle.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 88);
  var qDirName = 'q' + qNum + '.' + qTitle;
  var firstSummary = houses.length > 0 ? (houses[0].summary || '') : '';
  if (!firstSummary) {
    for (var hk = 0; hk < houses.length; hk++) {
      if (houses[hk].summary) { firstSummary = houses[hk].summary; break; }
    }
  }
  var fSummary = firstSummary.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 88);
  var fDirName = 'f' + floorNum + (fSummary ? '.' + fSummary : '');
  var dir = root + '/qqq/quests/' + qDirName + '/' + fDirName + '/';
  try {
    if (window.parent && window.parent.qqqBridge && window.parent.qqqBridge.fs) {
      var bridge = window.parent.qqqBridge;
      var parts = dir.replace(/\\/g, '/').split('/').filter(function(p) { return p; });
      var accum = '';
      for (var pi = 0; pi < parts.length; pi++) {
        accum += (accum ? '/' : '') + parts[pi];
        try { await bridge.fs.mkdir(accum); } catch (_) { }
      }
      var roomsLines = [];
      var now = new Date();
      var ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

      // ── 用户输入 ──
      var ui = agent._lastUserInput;
      if (ui) {
        var userText = (ui.text || '').trim();
        var visionText = (ui.vision || '').trim();
        if (userText) {
          roomsLines.push('══════ USER ══════');
          roomsLines.push(userText);
          roomsLines.push('');
        }
        if (visionText) {
          roomsLines.push('══════ VISION ══════');
          roomsLines.push(visionText);
          roomsLines.push('');
        }
      }

      // ── HOUSEs ──
      for (var hi = 0; hi < houses.length; hi++) {
        var h = houses[hi];
        roomsLines.push('━━━━━━━━━━ HOUSE ' + h.index + ' — ' + ts + ' ━━━━━━━━━━');
        roomsLines.push((h.summary || '(no summary)') + '  [' + h.ms + 'ms]');
        if (h.tools && h.tools.length > 0) {
          for (var ti = 0; ti < h.tools.length; ti++) {
            var t = h.tools[ti];
            roomsLines.push('  ── ROOM ' + h.index + '.' + (ti + 1) + '  ' + t.name + '(' + t.args + ') ──');
            if (h.toolResults && h.toolResults[ti]) {
              roomsLines.push('  Result (' + h.toolResults[ti].length + ' chars):');
              roomsLines.push(h.toolResults[ti]);
            }
          }
        }
        if (h.type === 'final') {
          if (h.answer) {
            roomsLines.push('  ANSWER (' + h.answer.length + ' chars):');
            roomsLines.push(h.answer);
          } else {
            roomsLines.push('  (final answer)');
          }
        }
        roomsLines.push('');
      }

      // ── Floor stats ──
      var timing = agent._floorTiming;
      if (timing) {
        roomsLines.push('── floor ' + floorNum + ' stats ──');
        var totalWork = (timing.deepseekMs || 0) + (timing.toolMs || 0);
        roomsLines.push('network: ' + (timing.networkMs ? timing.networkMs.toFixed(0) : '0') + 'ms, deepseek: ' + (timing.deepseekMs ? timing.deepseekMs.toFixed(0) : '0') + 'ms, tool: ' + (timing.toolMs ? timing.toolMs.toFixed(0) : '0') + 'ms, cost: ' + (agent._floorCostWge / 10000).toFixed(4) + ' ge');
      }

      await bridge.fs.write(dir + 'rooms.txt', roomsLines.join('\n'));

      // ── thinking.txt ──
      var thinkingLines = [];
      for (var hj = 0; hj < houses.length; hj++) {
        var hh = houses[hj];
        if (hh.reasoning) {
          thinkingLines.push('━━━━━━━━━━ HOUSE ' + hh.index + ' — ' + ts + ' ━━━━━━━━━━');
          thinkingLines.push(hh.reasoning);
          thinkingLines.push('');
        }
      }
      if (thinkingLines.length > 0) {
        await bridge.fs.write(dir + 'thinking.txt', thinkingLines.join('\n'));
      }

      // ── chat.txt (full narrative: user + houses with reasoning + rooms + answer) ──
      var chatLines = [];
      if (ui) {
        var uText = (ui.text || '').trim();
        var vText = (ui.vision || '').trim();
        if (uText) {
          chatLines.push('══════════ USER ══════════');
          chatLines.push(uText);
          chatLines.push('');
        }
        if (vText) {
          chatLines.push('══════════ VISION ══════════');
          chatLines.push(vText);
          chatLines.push('');
        }
      }
      for (var hci = 0; hci < houses.length; hci++) {
        var hc = houses[hci];
        chatLines.push('━━ HOUSE ' + hc.index + ' — ' + ts + ' [' + hc.ms + 'ms] ━━');
        if (hc.reasoning) {
          chatLines.push(hc.reasoning);
          chatLines.push('');
        }
        if (hc.tools && hc.tools.length > 0) {
          for (var tci = 0; tci < hc.tools.length; tci++) {
            var tc = hc.tools[tci];
            chatLines.push('  ── ROOM ' + hc.index + '.' + (tci + 1) + '  ' + tc.name + '(' + tc.args + ') ──');
            if (hc.toolResults && hc.toolResults[tci]) {
              chatLines.push('  ' + hc.toolResults[tci]);
            }
          }
          chatLines.push('');
        }
        if (hc.type === 'final') {
          chatLines.push('  ANSWER:');
          chatLines.push(hc.answer || '');
          chatLines.push('');
        }
      }
      if (timing) {
        chatLines.push('── floor ' + floorNum + ' stats ──');
        var totalWork2 = (timing.deepseekMs || 0) + (timing.toolMs || 0);
        chatLines.push('network: ' + (timing.networkMs ? timing.networkMs.toFixed(0) : '0') + 'ms, deepseek: ' + (timing.deepseekMs ? timing.deepseekMs.toFixed(0) : '0') + 'ms, tool: ' + (timing.toolMs ? timing.toolMs.toFixed(0) : '0') + 'ms, cost: ' + (agent._floorCostWge / 10000).toFixed(4) + ' ge');
      }
      await bridge.fs.write(dir + 'chat.txt', chatLines.join('\n'));

      console.log('[quests] floor txt generated: ' + dir);
    }
  } catch (e) {
    console.warn('[quests] generateFloorTxt failed:', e);
  }
}

// 上下文血条
var CTX_MAX_TOKENS = 1000000; // DeepSeek v4 1M 上下文窗口

function estimateTokens() {
  var total = 0;
  var conv = agent.conversation;
  var CHAR_PER_TOKEN = 3.0;
  for (var i = 0; i < conv.length; i++) {
    var c = conv[i].content;
    if (typeof c === 'string') total += c.length / CHAR_PER_TOKEN;
    if (conv[i].tool_calls && Array.isArray(conv[i].tool_calls)) {
      try { total += JSON.stringify(conv[i].tool_calls).length / CHAR_PER_TOKEN; } catch (_) {}
    }
    total += 10; // role overhead
  }
  // 系统提示词
  if (typeof SYSTEM_PROMPT !== 'undefined') total += SYSTEM_PROMPT.length / CHAR_PER_TOKEN;
  // 工具定义 schema（每次 API 调用都带）
  if (typeof TOOL_DEFINITIONS !== 'undefined') {
    try { total += JSON.stringify(TOOL_DEFINITIONS).length / CHAR_PER_TOKEN; } catch (_) {}
  }
  // 动态上下文 — 镜像 _buildDynamicContext 的输出（只计实际发送的量）
  if (agent._ctx) {
    var ctx = agent._ctx;
    var dynText = '';
    if (ctx.narrative) {
      dynText += '[DYNAMIC CONTEXT]\nCONVERSATION CONTEXT (compressed history):\n' + ctx.narrative;
    }
    if (ctx.facts && ctx.facts.length > 0) {
      // _buildDynamicContext 用 _retrieveRelevantFacts 取 top 10；无 query 时取最后 10 条近似
      var facts = ctx.facts.slice(-10);
      dynText += '\n\nRELEVANT FACTS FROM EARLIER (' + facts.length + '/' + ctx.facts.length + ' total):\n';
      for (var fi = 0; fi < facts.length; fi++) {
        dynText += '- [' + (facts[fi].type || '') + '] ' + (facts[fi].content || '') + '\n';
      }
    }
    if (ctx.floorSummaries && ctx.floorSummaries.length > 0) {
      var summaries = ctx.floorSummaries.slice(-15);
      dynText += '\n\nFLOOR CHECKPOINTS:\n';
      for (var si = 0; si < summaries.length; si++) {
        dynText += '📌 ' + (summaries[si].summary || '') + '\n';
      }
    }
    if (ctx.treasures && ctx.treasures.length > 0) {
      var treasures = ctx.treasures.slice(-10);
      dynText += '\n\nKEY DISCOVERIES:\n';
      for (var ti = 0; ti < treasures.length; ti++) {
        dynText += '💎 ' + (treasures[ti].content || '') + '\n';
      }
    }
    total += dynText.length / CHAR_PER_TOKEN;
  }
  return Math.round(total);
}

var _activeClocks = [];
function startFloorClock(wrap, agent) {
  var clockEl = wrap.querySelector('.clock');
  var canvas = wrap.querySelector('canvas');
  if (!clockEl || !canvas) return;
  _activeClocks.push({ wrap: wrap, clock: clockEl, canvas: canvas, agent: agent, dead: false });
  // 旧楼层停止更新但保留显示
  for (var i = 0; i < _activeClocks.length - 1; i++) {
    _activeClocks[i].dead = true;
  }
}

function drawPie(canvas, timing) {
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  var n = timing.networkMs || 0;
  var d = timing.deepseekMs || 0;
  var t = timing.toolMs || 0;
  var total = n + d + t;
  if (total <= 0) { ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(w/2, h/2, w/2-2, 0, Math.PI*2); ctx.fill(); return; }
  var parts = [
    { val: d, color: '#859900' },
    { val: n, color: '#cb4b16' },
    { val: t, color: '#b58900' }
  ];
  var start = -Math.PI / 2;
  for (var i = 0; i < parts.length; i++) {
    var slice = (parts[i].val / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(w/2, h/2);
    ctx.arc(w/2, h/2, w/2-2, start, start + slice);
    ctx.fillStyle = parts[i].color;
    ctx.fill();
    start += slice;
  }
}

// 每秒刷新活跃时钟
setInterval(function() {
  // 清理已死的时钟条目 + 检查是否有活的
  var hasLive = false;
  for (var i = _activeClocks.length - 1; i >= 0; i--) {
    if (_activeClocks[i].dead) { _activeClocks.splice(i, 1); continue; }
    hasLive = true;
    var c = _activeClocks[i];
    var elapsed = performance.now() - c.agent._floorTiming.floorStartPerf;
    var totalS = Math.floor(elapsed / 1000);
    var min = Math.floor(totalS / 60);
    var sec = totalS % 60;
    c.clock.textContent = min + ':' + (sec < 10 ? '0' : '') + sec;
    drawPie(c.canvas, c.agent._floorTiming);
  }
  if (!hasLive) return;
}, 1000);

async function sendMessage() {
  if (_sending) return;  // 原子锁：阻止重复调用
  _sending = true;
  var text = getInputText().trim();
  var chipPaths = getInputChipPaths();
  if (!text && chipPaths.length === 0) { _sending = false; return; }
  if (streaming) { _sending = false; return; }

  var token = getToken();
  if (!token) {
    addMessageEl('error', '请先在顶部输入 Token 并点击 Save');
    return;
  }

  // Build user content with attached file chips (read actual content)
  var userContent = text;
  var allPaths = chipPaths;
  if (allPaths.length > 0) {
    var contentParts = [];
    for (var pi = 0; pi < allPaths.length; pi++) {
      var p = allPaths[pi];
      try {
        var bridge = parent.qqqBridge;
        if (!bridge) { contentParts.push('[Attached: ' + p + ']\n(bridge unavailable)'); continue; }
        var isDir = false;
        var statInfo = null;
        try {
          statInfo = await bridge.fs.stat(p);
          if (statInfo && statInfo.isDir) isDir = true;
        } catch(e) {}
        if (isDir) {
          try {
            var entries = await bridge.fs.list(p);
            var tree = entries.slice(0, 200).map(function(e) { return (e.isDir ? '\u{1F4C1} ' : '   ') + e.name; }).join('\n');
            var suffix = entries.length > 200 ? '\n... (' + entries.length + ' total entries, showing first 200)' : '';
            contentParts.push('[Directory: ' + p + ']\n' + tree + suffix);
          } catch(e) { contentParts.push('[Directory: ' + p + ']\n(read error: ' + e.message + ')'); }
        } else {
          var m = p.toLowerCase().match(/\\.([a-z0-9]+)$/);
          var ext = m ? m[1] : '';
          var BIN_EXT = ['mp3','wav','flac','m4a','aac','ogg','opus','wma','ape',
                         'mp4','avi','mkv','mov','wmv','flv','webm','m4v','mpg','mpeg','ts','3gp',
                         'png','jpg','jpeg','gif','bmp','webp','svg','ico','tiff','tif','heic','avif',
                         'zip','rar','7z','tar','gz','xz','bz2',
                         'pdf','doc','docx','xls','xlsx','ppt','pptx',
                         'exe','msi','dll','so','dylib','bin','dat',
                         'ttf','otf','woff','woff2','eot',
                         'vsix','jar','class','wasm'];
          var isBinary = BIN_EXT.indexOf(ext) !== -1;
          if (isBinary) {
            var sizeStr = statInfo && statInfo.size ? formatBytes(statInfo.size) : '?';
            var mtimeStr = statInfo && statInfo.mtime ? new Date(statInfo.mtime).toLocaleString() : '?';
            contentParts.push('[File: ' + p + ']\n- type: .' + ext + ' (binary)\n- size: ' + sizeStr + '\n- mtime: ' + mtimeStr);
          } else {
            try {
              var content = await bridge.fs.read(p);
              var MAX_SIZE = 50 * 1024;
              if (content.length > MAX_SIZE) {
                var head = content.substring(0, 20 * 1024);
                var tail = content.substring(content.length - 20 * 1024);
                content = head + '\n\n... [truncated: ' + content.length + ' bytes total, showing first/last 20KB] ...\n\n' + tail;
              }
              contentParts.push('[File: ' + p + ']\n```\n' + content + '\n```');
            } catch(e) { contentParts.push('[File: ' + p + ']\n(read error: ' + e.message + ')'); }
          }
        }
      } catch(e) { contentParts.push('[Attached: ' + p + ']\n(error: ' + e.message + ')'); }
    }
    userContent = text + (contentParts.length ? '\n\n' + contentParts.join('\n\n') : '');
  }

  // 构建用户消息显示（含图片缩略图）
  var userMsgEl = addMessageEl('user', text + (chipPaths.length ? '\n' + chipPaths.map(function(p) { return '\u{1F4CE} ' + p; }).join('\n') : ''));
  if (pendingImages.length > 0) {
    var imgRow = document.createElement('div');
    imgRow.style.cssText = 'margin-top:6px;';
    pendingImages.forEach(function(img) {
      var wrap = document.createElement('span');
      wrap.className = 'msg-img-wrap';
      var imgEl = document.createElement('img');
      imgEl.src = img.dataUrl;
      imgEl.dataset.base64 = img.base64;
      wrap.appendChild(imgEl);
      var badge = document.createElement('span');
      badge.className = 'msg-img-badge';
      badge.textContent = '#' + img.id;
      badge.onclick = function() { openLightbox(img.dataUrl, img.base64); };
      wrap.appendChild(badge);
      imgRow.appendChild(wrap);
    });
    userMsgEl.appendChild(imgRow);
  }

  // 收集图片数据
  var images = pendingImages.length > 0 ? pendingImages.map(function(img) { return { id: img.id, base64: img.base64 }; }) : null;

  $input.innerHTML = '';
  pendingImages = [];
  renderImageStrip();
  $input.focus();

  // ---- Agentic loop ----
  setStreaming(true);
    var aiDiv = addMessageEl('ai', '');
  try {
    await agent.send(userContent, {
      images: images,
      token: token,
      tier: selectedTier ? TIER_LIST[selectedTier] : null,
      onToken: function(chunk) {
        aiDiv._text = (aiDiv._text || '') + chunk;
        if (!_renderPending) {
          _renderPending = true;
          requestAnimationFrame(function() {
            aiDiv.innerHTML = renderMarkdown(aiDiv._text);
            _renderPending = false;
          });
        }
        if (!_scrollPending) {
          _scrollPending = true;
          requestAnimationFrame(function() {
            $messages.scrollTop = $messages.scrollHeight;
            _scrollPending = false;
          });
        }
      },

      onDone: async function(content, timing) {
        aiDiv._text = content;
        aiDiv.innerHTML = renderMarkdown(content);
        // 注入楼层时钟 + 饼图
        if (timing && (timing.networkMs > 0 || timing.deepseekMs > 0 || timing.toolMs > 0)) {
          var clockWrap = document.createElement('div');
          clockWrap.className = 'floor-timing';
          clockWrap.innerHTML = '<span class="clock">0:00</span><canvas width="28" height="28"></canvas>';
          aiDiv.parentNode.insertBefore(clockWrap, aiDiv.nextSibling);
          startFloorClock(clockWrap, agent);
        }
        scrollToBottom();
        await saveQuestData();
        await autoRenameQuest();
        updateCtxBtn();
        // 自动消费排队
        if (_queue.length > 0) {
          var next = _queue.shift();
          renderQueueStrip();
          $input.textContent = next.text;
          setTimeout(function() { sendMessage(); }, 200);
        }
      },
      onCost: async function(cost, total) {
        $costLabel.textContent = cost + ' / ' + total.toFixed(4) + ' ge';
      },
      onError: function(msg) {
        addMessageEl('error', msg);
      }
    });
  } catch (err) {
    if (err && err.name !== 'AbortError') {
      addMessageEl('error', err.message || 'Unknown error');
    }
  } finally {
    _sending = false;
    setStreaming(false);
  }
}

// ---- Contenteditable helpers ----
function getInputText() {
  // Extract plain text from contenteditable, ignoring chip elements
  let text = '';
  $input.childNodes.forEach(n => {
    if (n.nodeType === 3) { text += n.textContent; }
    else if (n.nodeName === 'BR') { text += '\n'; }
    else if (n.classList && n.classList.contains('file-chip')) { /* skip chips */ }
    else { text += n.textContent; }
  });
  return text;
}

function getInputChipPaths() {
  const paths = [];
  $input.querySelectorAll('.file-chip').forEach(chip => {
    if (chip.dataset.path) paths.push(chip.dataset.path);
  });
  return paths;
}

function chipBasename(p) {
  const parts = p.replace(/\\/g, '/').split('/').filter(Boolean);
  return parts[parts.length - 1] || p;
}

function insertChipAtCursor(filePath) {
  const chip = document.createElement('span');
  chip.className = 'file-chip';
  chip.contentEditable = 'false';
  chip.dataset.path = filePath;
  const isDir = !filePath.match(/\.[a-zA-Z0-9]+$/);
  chip.innerHTML =
    '<span class="chip-icon">' + (isDir ? '📁' : '📄') + '</span>' +
    '<span class="chip-name">' + escHtml(chipBasename(filePath)) + '</span>' +
    '<span class="chip-rm">×</span>';
  chip.querySelector('.chip-rm').addEventListener('click', function() { chip.remove(); });
  chip.title = filePath;

  // Insert at cursor position in contenteditable
  $input.focus();
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    // Only insert if cursor is inside #input
    if ($input.contains(range.startContainer)) {
      range.deleteContents();
      range.insertNode(chip);
      // Move cursor after chip
      range.setStartAfter(chip);
      range.setEndAfter(chip);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      $input.appendChild(chip);
    }
  } else {
    $input.appendChild(chip);
  }
}

// Expose for direct cross-frame access (same origin)
window.qqqAiAttach = insertChipAtCursor;

// Listen for file attachment from parent (AI viewport via postMessage)
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'qqq-ai-attach') {
    const path = e.data.path;
    if (path) {
      insertChipAtCursor(path);
    }
  }
});

// Also listen for CustomEvent on document (in case dispatched in same page)
document.addEventListener('qqq-ai-attach', function(e) {
  if (e.detail && e.detail.path) {
    insertChipAtCursor(e.detail.path);
  }
});

// ═══ Lightbox（缩放 / 拖拽 / 双击重置） ═══
var lightbox = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightbox-img');
var lightboxBase64 = null;
var lbScale = 1, lbX = 0, lbY = 0;
var lbNatW = 0, lbNatH = 0;
var lbDrag = false, lbDragStartX = 0, lbDragStartY = 0, lbDragOriginX = 0, lbDragOriginY = 0;
var lbDidDrag = false;

function lbApply() {
  lightboxImg.style.transform = 'translate(' + lbX + 'px,' + lbY + 'px) scale(' + lbScale + ')';
}

function lbFitCenter() {
  var vw = lightbox.clientWidth, vh = lightbox.clientHeight;
  var pad = 40;
  var fitScale = Math.min((vw - pad * 2) / lbNatW, (vh - pad * 2) / lbNatH, 1);
  lbScale = fitScale;
  lbX = (vw - lbNatW * lbScale) / 2;
  lbY = (vh - lbNatH * lbScale) / 2;
  lbApply();
}

function openLightbox(src, base64) {
  lightboxBase64 = base64 || src.split(',')[1] || null;
  lightboxImg.onload = function() {
    lbNatW = lightboxImg.naturalWidth;
    lbNatH = lightboxImg.naturalHeight;
    lbFitCenter();
  };
  lightboxImg.src = src;
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
  lightbox.classList.remove('dragging');
  lightboxBase64 = null;
  lbDrag = false;
}

lightbox.addEventListener('wheel', function(e) {
  e.preventDefault();
  var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  var newScale = Math.min(Math.max(lbScale * factor, 0.05), 30);
  lbX = e.clientX - (e.clientX - lbX) * (newScale / lbScale);
  lbY = e.clientY - (e.clientY - lbY) * (newScale / lbScale);
  lbScale = newScale;
  lbApply();
}, { passive: false });

lightbox.addEventListener('mousedown', function(e) {
  if (e.target.tagName === 'BUTTON') return;
  lbDrag = true;
  lbDidDrag = false;
  lbDragStartX = e.clientX; lbDragStartY = e.clientY;
  lbDragOriginX = lbX; lbDragOriginY = lbY;
  lightbox.classList.add('dragging');
});
window.addEventListener('mousemove', function(e) {
  if (!lbDrag) return;
  lbX = lbDragOriginX + (e.clientX - lbDragStartX);
  lbY = lbDragOriginY + (e.clientY - lbDragStartY);
  if (Math.abs(e.clientX - lbDragStartX) > 3 || Math.abs(e.clientY - lbDragStartY) > 3) lbDidDrag = true;
  lbApply();
});
window.addEventListener('mouseup', function() {
  if (lbDrag) { lbDrag = false; lightbox.classList.remove('dragging'); }
});

lightboxImg.addEventListener('dblclick', function(e) {
  e.stopPropagation();
  lbFitCenter();
});

lightbox.addEventListener('click', function(e) {
  if (lbDidDrag) { lbDidDrag = false; return; }
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

document.getElementById('lb-copy').addEventListener('click', function() {
  if (!lightboxBase64) return;
  try {
    var bridge = parent.qqqBridge;
    if (bridge && bridge.qz && bridge.qz.copyImage) {
      bridge.qz.copyImage(lightboxBase64);
    } else {
      // Fallback: copy to clipboard via navigator
      var byteString = atob(lightboxBase64);
      var ab = new ArrayBuffer(byteString.length);
      var ia = new Uint8Array(ab);
      for (var i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
      var blob = new Blob([ab], { type: 'image/png' });
      var item = new ClipboardItem({ 'image/png': blob });
      navigator.clipboard.write([item]).catch(function() {});
    }
  } catch(_) {}
});

})();
</script>
</body>
