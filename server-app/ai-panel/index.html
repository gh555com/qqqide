<!DOCTYPE html>

<style>
/* 配色变量由父窗口 qqq-theme.js 注入；独立运行时使用 fallback */
:root {
  --background-color:#fdf6e3;--card-bg:#eee8d5;--text-primary:#7a7874;--border-color:#d3c6aa;
  --base03:#002b36;--base02:#073642;--base01:#777777;--base00:#7a7874;
  --base0:#7a7874;--base1:#a8a6a2;--base2:#eee8d5;--base3:#fdf6e3;
  --yellow:#b58900;--orange:#cb4b16;--red:#dc322f;--magenta:#d33682;
  --violet:#6c71c4;--blue:#e8a030;--cyan:#2aa198;--green:#859900;
}
[data-theme="dark"] {
  --background-color:#1e1e1e;--card-bg:#2a2a2a;--text-primary:#d4d0c8;--border-color:#333333;
  --base03:#fdf6e3;--base02:#eee8d5;--base01:#93a1a1;--base00:#c8c4b8;
  --base0:#a8a49c;--base1:#6a6660;--base2:#2a2a2a;--base3:#1e1e1e;
  --yellow:#d4a017;--orange:#e07020;--red:#ff4444;--magenta:#c06080;
  --violet:#a08060;--blue:#d4a017;--cyan:#5abfb5;--green:#8fbc5a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{forced-color-adjust:none!important;width:100%}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text-primary);background:var(--background-color);width:100%;height:100vh;display:grid;grid-template-columns:100%;grid-template-rows:auto auto 1fr auto;overflow:hidden}
#top-bar{padding:4px 8px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:5px;font-size:11px;flex-wrap:nowrap;overflow-x:hidden}
#top-bar .label{opacity:.7}
#top-bar input{width:22px;flex:none;padding:1px 4px;background:var(--card-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:3px;font-size:10px}

#tab-bar{display:flex;align-items:center;gap:2px;padding:2px 6px;border-bottom:1px solid var(--border-color);background:var(--card-bg);overflow-x:hidden}
#tab-bar::-webkit-scrollbar{display:none}
#tabs{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
.tab{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;border:1px solid var(--border-color);border-radius:3px 3px 0 0;background:var(--bg);cursor:pointer;white-space:nowrap;max-width:160px;user-select:none}
.tab.active{background:var(--base3);border-bottom-color:var(--base3);font-weight:600}
.tab .tab-title{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tab .tab-del{opacity:.4;font-size:14px;line-height:1;padding:0 1px;cursor:pointer}
.tab .tab-del:hover{opacity:1;color:var(--red)}
#tab-new{padding:1px 6px;font-size:16px;line-height:1;cursor:pointer;border:1px solid var(--border-color);border-radius:3px;background:var(--bg);color:var(--base01);flex-shrink:0}

.msg-user{background:var(--card-bg);border-radius:8px;padding:8px 12px;overflow-x:hidden;overflow-wrap:break-word;word-break:break-word}

.table-wrap{position:relative;overflow-x:hidden;margin:6px 0;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg)}.table-wrap:hover .table-view-btn{opacity:1}.table-view-btn{display:inline-block;cursor:pointer;font-size:11px;color:var(--blue);padding:4px 8px;opacity:0.6;user-select:none;border-bottom:1px solid var(--border-color);width:100%}.table-view-btn:hover{opacity:1;background:var(--base3)}.table-inner{overflow-x:hidden;padding:4px 8px}.table-inner table{width:100%;font-size:11px}.table-inner th,.table-inner td{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ctx-files{font-size:11px;opacity:.7;padding:4px 0;border-bottom:1px solid var(--border-color)}.ctx-files{font-size:11px;opacity:.7;padding:4px 0;border-bottom:1px solid var(--border-color)}

.ctx-panel-actions{display:flex;gap:24px;justify-content:flex-end;margin-top:16px}

</style>

<script>
// 主题同步：从父窗口 qqq-theme.js 唯一真理配色机器继承
(function(){
  'use strict';
  const D = document.documentElement;
  function sync(dark) {
    if (dark) D.setAttribute('data-theme', 'dark');
    else D.removeAttribute('data-theme');
  }
  // 初始同步
  try {
    if (parent && parent.qqqTheme) {
      sync(parent.qqqTheme.isDark());
    } else if (parent) {
      sync(parent.document.documentElement.getAttribute('data-theme') === 'dark');
    }
  } catch(_) {}
  // 始终监听 postMessage
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqq-theme-change') sync(e.data.dark);
  });

  // i18n sync: translate from parent window
  function translateUi() {
    try {
      if (parent && parent.window && parent.window.i18n) {
        parent.window.i18n.updateDom(document);
        // Custom placeholder attr for contenteditable (not <input>)
        var els = document.querySelectorAll('[data-i18n-placeholder-attr]');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          var key = el.getAttribute('data-i18n-placeholder-attr');
          if (key) el.setAttribute('data-placeholder', parent.window.i18n.t(key));
        }
      }
    } catch(_) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', translateUi);
  } else {
    translateUi();
  }
  // Re-translate on language change
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqq-lang-change') translateUi();
  });
})();
</script>

<script>
(function(){
'use strict';

const GATEWAY_URL = 'https://gh555.com/api/v3/ai/chat';

// State
var streaming = false;
var _sending = false;  // atomic guard: 防止 Enter 连按重复发送
var _renderPending = false;
var _scrollPending = false;

// DOM
const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('send-btn');
const $tokenInput = document.getElementById('token-input');
const $tokenSave = document.getElementById('token-save');
const $costLabel = document.getElementById('cost-label');
const $guideBtn = document.getElementById('guide-btn');
const $queueBtn = document.getElementById('queue-btn');
const $ctxBtn = document.getElementById('ctx-btn');
const $queueStrip = document.getElementById('queue-strip');

// ── 智能等级选择（per-quest） ──
var selectedTier = 6; // 默认 6=Pro+Max，restoreQuestUIState 会覆盖

function updateTierButtons(tierIndex) {
  document.querySelectorAll('.tier-btn').forEach(function(b) { b.classList.remove('sel'); });
  if (tierIndex === null || tierIndex === 0) {
    document.getElementById('tier-a').classList.add('sel');
  } else {
    var btn = document.querySelector('.tier-btn[data-tier="' + tierIndex + '"]');
    if (btn) btn.classList.add('sel');
  }
}

function selectTier(tierIndex) {
  selectedTier = tierIndex;
  updateTierButtons(tierIndex);
  if (questActiveId) {
    if (!questUIStates[questActiveId]) questUIStates[questActiveId] = {};
    questUIStates[questActiveId].selectedTier = tierIndex;
  }
}

// 初始化选中态
(function initTierUI() {
  selectTier(6); // default, will be overridden by restoreQuestUIState
})();

document.getElementById('tier-a').onclick = function() { selectTier(null); };
document.querySelectorAll('.tier-btn[data-tier]').forEach(function(btn) {
  btn.onclick = function() { selectTier(parseInt(btn.dataset.tier)); };
});

// Token management
function getToken() { return localStorage.getItem('qqq-ai-token') || ''; }
function saveToken(t) { localStorage.setItem('qqq-ai-token', t); }
$tokenInput.value = getToken() ? '••••••••' : '';
$tokenSave.onclick = function() {
  const v = $tokenInput.value.trim();
  if (v && v !== '••••••••') { saveToken(v); $tokenInput.value = '••••••••'; }
};

// Auto-resize not needed for contenteditable (it auto-grows)

// Enter to send
$input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
// ═══ 字符级 Undo/Redo（从 q3/ai 移植，适配 contenteditable） ═══
(function initCharUndo(input) {
  var state = { history: [input.innerHTML || ''], index: 0, isProgrammatic: false };
  input.addEventListener('input', function() {
    if (state.isProgrammatic) { state.isProgrammatic = false; return; }
    var v = input.innerHTML;
    if (state.index < state.history.length - 1) state.history = state.history.slice(0, state.index + 1);
    if (v !== state.history[state.history.length - 1]) { state.history.push(v); state.index = state.history.length - 1; }
  });
  input.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault(); e.stopPropagation();
      if (state.index > 0) {
        state.index--;
        state.isProgrammatic = true;
        input.innerHTML = state.history[state.index];
        // Restore cursor to end
        var range = document.createRange();
        range.selectNodeContents(input);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
      e.preventDefault(); e.stopPropagation();
      if (state.index < state.history.length - 1) {
        state.index++;
        state.isProgrammatic = true;
        input.innerHTML = state.history[state.index];
        var range = document.createRange();
        range.selectNodeContents(input);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }
  });
})($input);

// ═══ 多图管理 ═══
var pendingImages = []; // [{id, base64, dataUrl}]
var MAX_IMAGES = 20;

function addImage(dataUrl, base64) {
  if (pendingImages.length >= MAX_IMAGES) return;
  var id = pendingImages.length + 1;
  pendingImages.push({ id: id, base64: base64, dataUrl: dataUrl });
  renderImageStrip();
}

function removeImage(idx) {
  pendingImages.splice(idx, 1);
  pendingImages.forEach(function(img, i) { img.id = i + 1; });
  renderImageStrip();
}

function renderImageStrip() {
  var strip = document.getElementById('image-strip');
  strip.innerHTML = '';
  if (pendingImages.length === 0) {
    strip.style.display = 'none';
    return;
  }
  strip.style.display = 'flex';
  pendingImages.forEach(function(img, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'img-thumb-wrap';
    var imgEl = document.createElement('img');
    imgEl.src = img.dataUrl;
    wrap.appendChild(imgEl);
    var num = document.createElement('span');
    num.className = 'img-thumb-num';
    num.textContent = '#' + img.id;
    num.onclick = function(e) { e.stopPropagation(); openLightbox(img.dataUrl, img.base64); };
    wrap.appendChild(num);
    var del = document.createElement('button');
    del.className = 'img-thumb-del';
    del.textContent = '\u00d7';
    del.onclick = function() { removeImage(idx); };
    wrap.appendChild(del);
    var embed = document.createElement('button');
    embed.className = 'img-thumb-embed';
    embed.textContent = (parent && parent._i) ? parent._i('ai.embedImage', '嵌入') : '嵌入';
    embed.onclick = function() {
      $input.focus();
      document.execCommand('insertText', false, '[图#' + img.id + ']');
    };
    wrap.appendChild(embed);
    strip.appendChild(wrap);
  });
}

// 粘贴图片（> 2MB 自动压缩到 2048px 宽）/ 纯文本粘贴
$input.addEventListener('paste', function(e) {
  // 纯文本粘贴：如果有文本，先获取纯文本再处理图片
  var plainText = '';
  try {
    plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
  } catch(_) {}

  // 检查是否有图片
  var hasImage = false;
  var items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (item.type.indexOf('image/') === 0) {
      hasImage = true;
      e.preventDefault();
      var file = item.getAsFile();
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        if (file.size > 2 * 1024 * 1024) {
          var img = new Image();
          img.onload = function() {
            var MAX_W = 2048;
            var scale = img.width > MAX_W ? MAX_W / img.width : 1;
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            var compressed = canvas.toDataURL('image/jpeg', 0.85);
            addImage(compressed, compressed.split(',')[1]);
          };
          img.src = dataUrl;
        } else {
          addImage(dataUrl, dataUrl.split(',')[1]);
        }
      };
      reader.readAsDataURL(file);
      break;
    }
  }
  // 无图片粘贴：强制纯文本（阻止富文本）
  if (!hasImage && plainText) {
    e.preventDefault();
    document.execCommand('insertText', false, plainText);
  }
});

// Markdown renderer (lightweight)
function renderMarkdown(src) {
  if (!src) return '';
  const codeBlocks = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push('<pre><code class="lang-' + (lang||'') + '">' + escHtml(code) + '</code></pre>');
    return '\x00CB' + idx + '\x00';
  });
  s = escHtml(s);
  // Restore code blocks
  s = s.replace(/\x00CB(\d+)\x00/g, function(_, i) { return codeBlocks[+i]; });
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // HR
  s = s.replace(/^---+$/gm, '<hr>');
  // Bold, italic
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Tables (must run before lists to avoid confusing | with list markers)
  s = s.replace(/(?:\n|^)(\|.+\|)\n\|[-:\s|]+\|\n((?:\|.+\|\n?)*)/g, function(_, header, rows) {
    if (!header || rows === undefined) return _;
    const ths = header.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<th>' + c.trim() + '</th>'; }).join('');
    const trs = rows.split('\n').filter(function(r) { return r.trim(); }).map(function(r) {
      const tds = r.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('');
      return '<tr>' + tds + '</tr>';
    }).join('');
    // Wrap table with view button to prevent horizontal scrollbar
    var colCount = (ths.match(/<th>/g) || []).length;
    var rawTable = '<table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
    var tblId = window._tableStore.length;
    window._tableStore.push(rawTable);
    return '<div class="table-wrap">' +
      '<span class="table-view-btn" onclick="viewTable(' + tblId + ')" title="在全窗口查看表格">⊞ 查看表格 (' + colCount + '列)</span>' +
      '<div class="table-inner">' + rawTable + '</div></div>';
  });
  // Lists
  s = s.replace(/^[*\-+] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Paragraphs
  s = s.replace(/\n\n/g, '</p><p>');
  s = '<p>' + s + '</p>';
  s = s.replace(/<p><\/p>/g, '');
  // Line breaks
  s = s.replace(/\n/g, '<br>');
  return s;
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatBytes(n) {
  if (!n || n < 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0; let v = n;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + ' ' + u[i];
}

// doStreamRender: 1fps event-driven incremental render (no polling, no full-text accumulation)

function doStreamRender() {

  var aiDiv = _activeAiDiv;

  if (!aiDiv) { return; }
  if (!aiDiv._dirty) { aiDiv._renderScheduled = false; return; }

  aiDiv._renderScheduled = false;

  var rendered = aiDiv._renderedCount || 0;

  var paras = aiDiv._paras || [];

  // Render completed paragraphs (once, then release string for GC)

  while (rendered < paras.length) {

    var pEl = document.createElement('div');

    pEl.innerHTML = renderMarkdown(paras[rendered]);

    aiDiv._contentWrap.appendChild(pEl);

    paras[rendered] = null;  // release for GC

    rendered++;

  }

  aiDiv._renderedCount = rendered;

  // Last (in-progress) paragraph: re-render in dedicated slot

  if (!aiDiv._lastParaEl) {

    aiDiv._lastParaEl = document.createElement('div');

    aiDiv._contentWrap.appendChild(aiDiv._lastParaEl);

  }

  aiDiv._lastParaEl.innerHTML = renderMarkdown(aiDiv._buf || '');

  aiDiv._dirty = false;

  // If new content arrived during render, schedule next tick

  if (aiDiv._dirty) {

    aiDiv._renderScheduled = true;

    setTimeout(doStreamRender, 1000);

  }

}

function _userAtBottom() {
  var threshold = 60; // px tolerance
  return $messages.scrollHeight - $messages.scrollTop - $messages.clientHeight < threshold;
}


function addMessageEl(role, content) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  if (role === 'ai') {
    div.innerHTML = renderMarkdown(content);
  } else if (role === 'error') {
    div.textContent = content;
  } else {
    div.textContent = content;
  }
  $messages.appendChild(div);
  scrollToBottom(role === 'user'); // force scroll for user messages, respect scroll for AI
  return div;
}

// 项目文件锁：防止同一主文件夹被多个窗口打开
var _currentLockPath = null;
var _lockHeartbeatId = null;
var LOCK_STALE_MS = 60000;  // 锁超过 60s 未刷新视为僵尸锁
var LOCK_HEARTBEAT_MS = 30000;  // 每 30s 刷新一次

// 绑定主文件夹 → 项目级持久化 + 文件锁防双开
async function bindMainProject() {
  if (!window.parent || !window.parent.qqqAiViewport) return;
  var main = window.parent.qqqAiViewport.getMainProject();
  if (!main || !main.path) {
    console.log('[quests] bindMainProject: no main project yet');
    return;
  }
  var root = main.path.replace(/\\/g, '/').replace(/\/$/, '');
  var lockPath = root + '/qqq/.lock';
  // 如果 lockPath 没变，不需要重新锁定
  if (_currentLockPath === lockPath) {
    console.log('[quests] bindMainProject: already locked ' + root);
    return;
  }
  // 检查是否已被其他窗口锁定
  try {
    var statInfo = await window.parent.qqqBridge.fs.stat(lockPath);
    if (statInfo) {
      var lockRaw = await window.parent.qqqBridge.fs.read(lockPath);
      var lockData = JSON.parse(lockRaw);
      var age = Date.now() - (lockData.atime || 0);
      if (age < LOCK_STALE_MS) {
        console.warn('[quests] bindMainProject BLOCKED: project locked by another window (age=' + (age/1000).toFixed(1) + 's)');
        addMessageEl('error', '⚠️ 该项目已被另一个 QQQ 窗口打开，无法重复绑定。');
        return;
      }
      console.log('[quests] bindMainProject: stale lock cleared (age=' + (age/1000).toFixed(1) + 's)');
      try { await window.parent.qqqBridge.fs.remove(lockPath); } catch (_) {}
    }
  } catch (_) { /* lock 不存在，正常流程 */ }
  // 释放旧锁（切换主文件夹时）
  await _releaseLock();
  // 写入新锁（qqq:fs:write 已内置 auto-mkdir，不再需要显式 mkdir）
  var lockContent = JSON.stringify({ pid: 0, atime: Date.now() });
  try {
    await window.parent.qqqBridge.fs.write(lockPath, lockContent);
    _currentLockPath = lockPath;
  } catch (_) { /* 锁写失败非致命 */ }
  // 启动心跳
  _lockHeartbeatId = setInterval(async function () {
    try { await window.parent.qqqBridge.fs.write(lockPath, JSON.stringify({ pid: 0, atime: Date.now() })); } catch (_) {}
  }, LOCK_HEARTBEAT_MS);
  questStore.setProjectRoot(main.path);
  console.log('[quests] bindMainProject: locked ' + root);
}

async function _releaseLock() {
  if (_lockHeartbeatId) { clearInterval(_lockHeartbeatId); _lockHeartbeatId = null; }
  if (_currentLockPath) {
    try { await window.parent.qqqBridge.fs.remove(_currentLockPath); } catch (_) {}
    _currentLockPath = null;
  }
}

// 窗口关闭时释放锁
window.addEventListener('beforeunload', function () {
  if (_currentLockPath && window.parent && window.parent.qqqBridge) {
    try { window.parent.qqqBridge.fs.remove(_currentLockPath); } catch (_) {}
  }
});

// ═══ 楼层 txt 归档：rooms.txt + thinking.txt ═══
async function generateFloorTxt() {
  var root = questStore.getProjectRoot();
  if (!root) return;
  var houses = agent._houses;
  if (!houses || houses.length === 0) return;
  var floorNum = agent._ctx.totalFloors;
  var questId = questActiveId;
  if (!questId) return;
  var quests = await questStore.list();
  var questIdx = quests.findIndex(function(q) { return q.id === questId; });
  var qNum = questIdx >= 0 ? (questIdx + 1) : 0;
  var questEntry = questIdx >= 0 ? quests[questIdx] : null;
  var rawQTitle = (questEntry && questEntry.title && questEntry.title !== 'New Chat') ? questEntry.title : questId;
  var qTitle = rawQTitle.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 88);
  var qDirName = 'q' + qNum + '.' + qTitle;
  var firstSummary = houses.length > 0 ? (houses[0].summary || '') : '';
  if (!firstSummary) {
    for (var hk = 0; hk < houses.length; hk++) {
      if (houses[hk].summary) { firstSummary = houses[hk].summary; break; }
    }
  }
  var fSummary = firstSummary.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 88);
  var fDirName = 'f' + floorNum + (fSummary ? '.' + fSummary : '');
  var dir = root + '/qqq/quests/' + qDirName + '/' + fDirName + '/';
  try {
    if (window.parent && window.parent.qqqBridge && window.parent.qqqBridge.fs) {
      var bridge = window.parent.qqqBridge;
      var parts = dir.replace(/\\/g, '/').split('/').filter(function(p) { return p; });
      var accum = '';
      for (var pi = 0; pi < parts.length; pi++) {
        accum += (accum ? '/' : '') + parts[pi];
        try { await bridge.fs.mkdir(accum); } catch (_) { }
      }
      var roomsLines = [];
      var now = new Date();
      var ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

      // ── 用户输入 ──
      var ui = agent._lastUserInput;
      if (ui) {
        var userText = (ui.text || '').trim();
        var visionText = (ui.vision || '').trim();
        if (userText) {
          roomsLines.push('══════ USER ══════');
          roomsLines.push(userText);
          roomsLines.push('');
        }
        if (visionText) {
          roomsLines.push('══════ VISION ══════');
          roomsLines.push(visionText);
          roomsLines.push('');
        }
      }

      // ── HOUSEs ──
      for (var hi = 0; hi < houses.length; hi++) {
        var h = houses[hi];
        roomsLines.push('━━━━━━━━━━ HOUSE ' + h.index + ' — ' + ts + ' ━━━━━━━━━━');
        roomsLines.push((h.summary || '(no summary)') + '  [' + h.ms + 'ms]');
        if (h.tools && h.tools.length > 0) {
          for (var ti = 0; ti < h.tools.length; ti++) {
            var t = h.tools[ti];
            roomsLines.push('  ── ROOM ' + h.index + '.' + (ti + 1) + '  ' + t.name + '(' + t.args + ') ──');
            if (h.toolResults && h.toolResults[ti]) {
              roomsLines.push('  Result (' + h.toolResults[ti].length + ' chars):');
              roomsLines.push(h.toolResults[ti]);
            }
          }
        }
        if (h.type === 'final') {
          if (h.answer) {
            roomsLines.push('  ANSWER (' + h.answer.length + ' chars):');
            roomsLines.push(h.answer);
          } else {
            roomsLines.push('  (final answer)');
          }
        }
        roomsLines.push('');
      }

      // ── Floor stats ──
      var timing = agent._floorTiming;
      if (timing) {

var CTX_MAX_TOKENS = 1000000; // DeepSeek v4 1M 上下文窗口

function estimateTokens() {
  var total = 0;
  var conv = agent.conversation;
  var CHAR_PER_TOKEN = 3.0;
  for (var i = 0; i < conv.length; i++) {
    var c = conv[i].content;
    if (typeof c === 'string') total += c.length / CHAR_PER_TOKEN;
    if (conv[i].tool_calls && Array.isArray(conv[i].tool_calls)) {
      try { total += JSON.stringify(conv[i].tool_calls).length / CHAR_PER_TOKEN; } catch (_) {}
    }
    total += 10; // role overhead
  }
  // 系统提示词
  if (typeof SYSTEM_PROMPT !== 'undefined') total += SYSTEM_PROMPT.length / CHAR_PER_TOKEN;
  // 工具定义 schema（每次 API 调用都带）
  if (typeof TOOL_DEFINITIONS !== 'undefined') {
    try { total += JSON.stringify(TOOL_DEFINITIONS).length / CHAR_PER_TOKEN; } catch (_) {}
  }
  // 动态上下文 — 镜像 _buildDynamicContext 的输出（只计实际发送的量）
  if (agent._ctx) {
    var ctx = agent._ctx;
    var dynText = '';
    if (ctx.narrative) {
      dynText += '[DYNAMIC CONTEXT]\nCONVERSATION CONTEXT (compressed history):\n' + ctx.narrative;
    }
    if (ctx.facts && ctx.facts.length > 0) {
      // _buildDynamicContext 用 _retrieveRelevantFacts 取 top 10；无 query 时取最后 10 条近似
      var facts = ctx.facts.slice(-10);
      dynText += '\n\nRELEVANT FACTS FROM EARLIER (' + facts.length + '/' + ctx.facts.length + ' total):\n';
      for (var fi = 0; fi < facts.length; fi++) {
        dynText += '- [' + (facts[fi].type || '') + '] ' + (facts[fi].content || '') + '\n';
      }
    }
    if (ctx.floorSummaries && ctx.floorSummaries.length > 0) {
      var summaries = ctx.floorSummaries.slice(-15);
      dynText += '\n\nFLOOR CHECKPOINTS:\n';
      for (var si = 0; si < summaries.length; si++) {
        dynText += '📌 ' + (summaries[si].summary || '') + '\n';
      }
    }
    if (ctx.treasures && ctx.treasures.length > 0) {
      var treasures = ctx.treasures.slice(-10);
      dynText += '\n\nKEY DISCOVERIES:\n';
      for (var ti = 0; ti < treasures.length; ti++) {
        dynText += '💎 ' + (treasures[ti].content || '') + '\n';
      }
    }
    total += dynText.length / CHAR_PER_TOKEN;
  }
  return Math.round(total);
}

// ── 楼层时钟 + 饼图（嵌在豆腐块内部，每个楼层私有，1m:43s 格式）──
var _floorTimerId = null;
var _floorStartPerf = 0;
var _floorCurrentTiming = null;
var _activeAiDiv = null;  // 当前正在流式输出的 AI 豆腐块

function fmtTime(ms) { var s = Math.round(ms / 1000); return Math.floor(s / 60) + 'm:' + (s % 60) + 's'; }

// ── pie tooltip via parent window (break out of iframe clipping) ──
function _showPieTooltip(html, cx, cy) {
  if (!parent) return;
  parent.postMessage({ type: 'qqq-pie-tooltip', action: 'show', html: html, clientX: cx, clientY: cy }, '*');
}
function _hidePieTooltip() {
  if (!parent) return;
  parent.postMessage({ type: 'qqq-pie-tooltip', action: 'hide' }, '*');
}

function drawPie(canvas, timing) {
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  var n = timing.networkMs || 0;
  var d = timing.deepseekMs || 0;
  var t = timing.toolMs || 0;
  var w2 = timing.waitMs || 0;
  var total = n + d + t + w2;
  if (total <= 0) { ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(w/2, h/2, w/2-3, 0, Math.PI*2); ctx.fill(); canvas._segments = null; return; }
  var parts = [
    { val: d, color: '#859900', label: 'DeepSeek', key: 'deepseek' },
    { val: n, color: '#cb4b16', label: 'Network', key: 'network' },
    { val: t, color: '#b58900', label: 'Tool',    key: 'tool' },
    { val: w2, color: '#888',   label: 'Wait',    key: 'wait' }
  ];
  var start = -Math.PI / 2;
  var segments = [];
  for (var i = 0; i < parts.length; i++) {
    if (parts[i].val <= 0) continue;
    var slice = (parts[i].val / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(w/2, h/2);
    ctx.arc(w/2, h/2, w/2-3, start, start + slice);
    ctx.fillStyle = parts[i].color;
    ctx.fill();
    segments.push({ startAngle: start, endAngle: start + slice, label: parts[i].label, ms: parts[i].val, color: parts[i].color });
    start += slice;
  }
  canvas._segments = segments;
  canvas._total = total;
}

function _initClockBlock(aiDiv) {
  var block = document.createElement('div');
  block.className = 'msg-ai-clock';
  block.innerHTML = '<span class="clock">0m:0s</span><canvas width="140" height="140"></canvas>';
  aiDiv.appendChild(block);
  aiDiv._clockBlock = block;
  aiDiv._clockSpan = block.querySelector('.clock');
  aiDiv._clockCanvas = block.querySelector('canvas');
  // pie hover: postMessage to parent window (break out of iframe clip)
  var canvas = aiDiv._clockCanvas;
  canvas.addEventListener('mousemove', function(e) {
    if (!canvas._segments || !canvas._total) { _hidePieTooltip(); return; }
    var parts = [
      { key: 'network',  color: '#cb4b16', label: 'Net' },
      { key: 'tool',     color: '#b58900', label: 'Tool' },
      { key: 'deepseek', color: '#859900', label: 'DS' },
      { key: 'wait',     color: '#888',    label: 'Wait' }
    ];
    var segs = canvas._segments;
    var map = {};
    for (var si = 0; si < segs.length; si++) { map[segs[si].key] = segs[si]; }
    var html = '';
    for (var pi = 0; pi < parts.length; pi++) {
      var p = parts[pi];
      var s = map[p.key];
      var ms = s ? s.ms : 0;
      html += '<span style="display:inline-flex;align-items:center;gap:8px;margin-right:16px">'
        + '<svg width="20" height="20" style="flex-shrink:0"><circle cx="10" cy="10" r="9" fill="' + p.color + '"/></svg>'
        + '<span style="color:#fff">' + fmtTime(ms) + '</span></span>';
    }
    _showPieTooltip(html, e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', function() { _hidePieTooltip(); });
}

function startFloorTimer(aiDiv) {
  _activeAiDiv = aiDiv;
  _floorStartPerf = performance.now();
  _floorCurrentTiming = null;
  _initClockBlock(aiDiv);
  var clock = aiDiv._clockSpan;
  var canvas = aiDiv._clockCanvas;
  clock.textContent = '0m:0s';
  drawPie(canvas, { networkMs: 0, deepseekMs: 0, toolMs: 0 });
  _floorTimerId = setInterval(function() {
    var elapsed = performance.now() - _floorStartPerf;
    var totalS = Math.floor(elapsed / 1000);
    var min = Math.floor(totalS / 60);
    var sec = totalS % 60;
    clock.textContent = min + 'm:' + sec + 's';
    var at = agent._floorTiming;
    var n = (at && at.networkMs) || 0;
    var d = (at && at.deepseekMs) || 0;
    var t = (at && at.toolMs) || 0;
    var accounted = n + d + t;
    var wait = Math.max(0, elapsed - accounted);
    drawPie(canvas, { networkMs: n, deepseekMs: d, toolMs: t, waitMs: wait });
  }, 1000);
}

function stopFloorTimer(timing) {
  if (_floorTimerId) { clearInterval(_floorTimerId); _floorTimerId = null; }
  _floorCurrentTiming = timing;
  var elapsed = performance.now() - _floorStartPerf;
  var totalS = Math.floor(elapsed / 1000);
  var min = Math.floor(totalS / 60);
  var sec = totalS % 60;
  var aiDiv = _activeAiDiv;
  if (aiDiv && aiDiv._clockSpan && aiDiv._clockCanvas) {
    aiDiv._clockSpan.textContent = min + 'm:' + sec + 's';
    var tm = timing || { networkMs: 0, deepseekMs: 0, toolMs: 0 };
    var accounted = (tm.networkMs || 0) + (tm.deepseekMs || 0) + (tm.toolMs || 0);
    tm.waitMs = Math.max(0, elapsed - accounted);
    drawPie(aiDiv._clockCanvas, tm);
  }
  _activeAiDiv = null;
  // Save floor timing to quest data
  var durationMs = Math.round(elapsed);
  var record = {
    floorIndex: agent._ctx.totalFloors,
    durationMs: durationMs,
    networkMs: timing.networkMs || 0,
    deepseekMs: timing.deepseekMs || 0,
    toolMs: timing.toolMs || 0,
    finishedAt: new Date().toISOString()
  };
  agent._floorTimings = agent._floorTimings || [];
  agent._floorTimings.push(record);
}

function rebuildMessagesFromConversation() {
  $messages.innerHTML = '';
  var frag = document.createDocumentFragment();
  var conv = agent.conversation;

  // ★ Build floor→timing map so each floor's tofu block owns its 1:1 stopped clock + pie
  var floorTimingMap = {};
  var timings = agent._floorTimings || [];
  for (var ti = 0; ti < timings.length; ti++) {
    floorTimingMap[timings[ti].floorIndex] = timings[ti];
  }

  var _pieEls = [];  // collect canvas+timing pairs for pie rendering after DOM attach

  for (var i = 0; i < conv.length; i++) {
    var msg = conv[i];
    if (!msg) continue;
    if (msg.role === 'user') {
      var el = document.createElement('div');
      el.className = 'msg msg-user';
      var content = typeof msg.content === 'string' ? msg.content : '';
      // Strip injected rules blocks (global.txt / project.txt) from display
      var rulesRefs = [];
      var gRe = /\[GLOBAL RULES[\s\S]*?\[END GLOBAL RULES\]/g;
      var pRe = /\[PROJECT RULES[\s\S]*?\[END PROJECT RULES\]/g;
      if (gRe.test(content)) { rulesRefs.push('📄 global.txt'); content = content.replace(gRe, ''); }
      if (pRe.test(content)) { rulesRefs.push('📄 project.txt'); content = content.replace(pRe, ''); }
      // Clean up --- separators left from rules injection
      content = content.replace(/^\s*---\s*\n?/gm, '').trim();
      var displayContent = content;
      if (rulesRefs.length > 0) {
        displayContent = content + '\n' + rulesRefs.join(' ') + '\n\n';
      }
      el.innerHTML = '<div class="msg-header">You</div>' + renderMarkdown(displayContent);
      frag.appendChild(el);
    } else if (msg.role === 'assistant') {
      var el2 = document.createElement('div');
      el2.className = 'msg msg-ai';
      var content2 = typeof msg.content === 'string' ? msg.content : '';
      el2.innerHTML = '<div>' + renderMarkdown(content2) + '</div>';  // content wrapper
      frag.appendChild(el2);

      // ★ Stopped clock INSIDE the tofu block: only on last message of each floor
      var floor = msg._floor;
      var nextMsg = conv[i + 1];
      var isFloorEnd = !nextMsg || nextMsg._floor !== floor;
      if (isFloorEnd && floorTimingMap[floor]) {
        var t = floorTimingMap[floor];
        var totalS = Math.floor((t.durationMs || 0) / 1000);
        var min = Math.floor(totalS / 60);
        var sec = totalS % 60;
        var clockBlock = document.createElement('div');
        clockBlock.className = 'msg-ai-clock';
        clockBlock.innerHTML = '<span class="clock">' + min + 'm:' + sec + 's</span><canvas width="140" height="140"></canvas>';
        el2.appendChild(clockBlock);
        _pieEls.push({ canvas: clockBlock.querySelector('canvas'), timing: t });
      }
    }
  }
  $messages.appendChild(frag);

  // Draw all pie charts (must happen after DOM insertion so canvas has layout)
  for (var pi = 0; pi < _pieEls.length; pi++) {
    var pc = _pieEls[pi].canvas;
    drawPie(pc, _pieEls[pi].timing);
    if (!pc._hasTooltip) {
      pc._hasTooltip = true;
      pc.addEventListener('mousemove', function(e) {
        if (!this._segments || !this._total) { _hidePieTooltip(); return; }
        var parts = [{key:'network',color:'#cb4b16',label:'Net'},{key:'tool',color:'#b58900',label:'Tool'},{key:'deepseek',color:'#859900',label:'DS'}];
        var segs = this._segments, map = {};
        for (var si = 0; si < segs.length; si++) { map[segs[si].key] = segs[si]; }
        var html = '';
        for (var pj = 0; pj < parts.length; pj++) {
          var pp = parts[pj], ss = map[pp.key], ms = ss ? ss.ms : 0;
          html += '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px">'
            + '<svg width="10" height="10" style="flex-shrink:0"><circle cx="5" cy="5" r="4.5" fill="' + pp.color + '"/></svg>'
            + '<span style="color:#fff">' + fmtTime(ms) + '</span></span>';
        }
        _showPieTooltip(html, e.clientX, e.clientY);
      });
      pc.addEventListener('mouseleave', function() { _hidePieTooltip(); });
    }
  }

  scrollToBottom(true);
}

        if (!bridge) { console.log('[rules] bridge unavailable'); _rulesBtnBusy = false; return; }

        // 1) global.txt — app-root level, opens in middle group
        var appRoot = await bridge.app.root();
        var appRootClean = appRoot.replace(/\\/g, '/').replace(/\/$/, '');
        var globalPath = appRootClean + '/userData/global.txt';
        var globalExists = await bridge.fs.exists(globalPath);
        if (!globalExists) {
            await bridge.fs.write(globalPath, '# qqq AI Global Rules\n# Write rules here that apply to ALL projects.\n# They will be injected at the start of every new conversation.\n# Rules are only sent once (first turn) — AI remembers them from conversation history.\n');
        }
        parent.postMessage({ type: 'qqq-file-open', path: globalPath }, '*');

        // 2) project.txt — project-root level, opens in right group（每次都实时查，不用缓存）
        var projRoot = questStore.getProjectRoot();
        if (projRoot) {
            var projRootClean = projRoot.replace(/\\/g, '/').replace(/\/$/, '');
            var projDir = projRootClean + '/qqq/quests/alphal/rule';
            var projPath = projDir + '/project.txt';
            var projExists = await bridge.fs.exists(projPath);
            if (!projExists) {
                try { await bridge.fs.mkdir(projDir, { recursive: true }); } catch (_) {}
                await bridge.fs.write(projPath, '# qqq AI Project Rules\n# Write rules here that apply ONLY to this project.\n# They will be injected at the start of every new conversation.\n# Rules are only sent once (first turn) — AI remembers them from conversation history.\n');
            }
            parent.postMessage({ type: 'qqq-file-open-right', path: projPath }, '*');
        } else {
            console.log('[rules] no project root, skipping project.txt');
        }

        // reload rules after user edits
        setTimeout(function() {
            loadQqqRules();
            if (typeof loadProjectRules === 'function') {
                loadProjectRules(projRoot);
            }
            }, 3000);
    } catch(e) {
        console.log('[rules] edit error:', e);
    }
    _rulesBtnBusy = false;
};

function stopStream() {
  if (agent._compressing) return;  // 压缩期间不响应中止
  try { agent.abort(); } catch(_) {}
  if (_activeAiDiv) _activeAiDiv._renderScheduled = false;
  _sending = false;
  setStreaming(false);
}

async function sendMessage() {
  if (_sending) return;  // 原子锁：阻止重复调用
  _sending = true;
  var text = getInputText().trim();
  var chipPaths = getInputChipPaths();
  if (!text && chipPaths.length === 0) { _sending = false; return; }
  if (streaming) { _sending = false; return; }

  var token = getToken();
  if (!token) {
    addMessageEl('error', '请先在顶部输入 Token 并点击 Save');
    return;
  }

  // Build user content with attached file chips (read actual content)
  var userContent = text;
  var allPaths = chipPaths;
  if (allPaths.length > 0) {
    var contentParts = [];
    for (var pi = 0; pi < allPaths.length; pi++) {
      var p = allPaths[pi];
      try {
        var bridge = parent.qqqBridge;
        if (!bridge) { contentParts.push('[Attached: ' + p + ']\n(bridge unavailable)'); continue; }
        var isDir = false;
        var statInfo = null;
        try {
          statInfo = await bridge.fs.stat(p);
          if (statInfo && statInfo.isDir) isDir = true;
        } catch(e) {}
        if (isDir) {
          try {
            var entries = await bridge.fs.list(p);
            var tree = entries.slice(0, 200).map(function(e) { return (e.isDir ? '\u{1F4C1} ' : '   ') + e.name; }).join('\n');
            var suffix = entries.length > 200 ? '\n... (' + entries.length + ' total entries, showing first 200)' : '';
            contentParts.push('[Directory: ' + p + ']\n' + tree + suffix);
          } catch(e) { contentParts.push('[Directory: ' + p + ']\n(read error: ' + e.message + ')'); }
        } else {
          var m = p.toLowerCase().match(/\\.([a-z0-9]+)$/);
          var ext = m ? m[1] : '';
          var BIN_EXT = ['mp3','wav','flac','m4a','aac','ogg','opus','wma','ape',
                         'mp4','avi','mkv','mov','wmv','flv','webm','m4v','mpg','mpeg','ts','3gp',
                         'png','jpg','jpeg','gif','bmp','webp','svg','ico','tiff','tif','heic','avif',
                         'zip','rar','7z','tar','gz','xz','bz2',
                         'pdf','doc','docx','xls','xlsx','ppt','pptx',
                         'exe','msi','dll','so','dylib','bin','dat',
                         'ttf','otf','woff','woff2','eot',
                         'vsix','jar','class','wasm'];
          var isBinary = BIN_EXT.indexOf(ext) !== -1;
          if (isBinary) {
            var sizeStr = statInfo && statInfo.size ? formatBytes(statInfo.size) : '?';
            var mtimeStr = statInfo && statInfo.mtime ? new Date(statInfo.mtime).toLocaleString() : '?';
            contentParts.push('[File: ' + p + ']\n- type: .' + ext + ' (binary)\n- size: ' + sizeStr + '\n- mtime: ' + mtimeStr);
          } else {
            try {
              var content = await bridge.fs.read(p);
              var MAX_SIZE = 50 * 1024;
              if (content.length > MAX_SIZE) {
                var head = content.substring(0, 20 * 1024);
                var tail = content.substring(content.length - 20 * 1024);
                content = head + '\n\n... [truncated: ' + content.length + ' bytes total, showing first/last 20KB] ...\n\n' + tail;
              }
              contentParts.push('[File: ' + p + ']\n```\n' + content + '\n```');
            } catch(e) { contentParts.push('[File: ' + p + ']\n(read error: ' + e.message + ')'); }
          }
        }
      } catch(e) { contentParts.push('[Attached: ' + p + ']\n(error: ' + e.message + ')'); }
    }
    userContent = text + (contentParts.length ? '\n\n' + contentParts.join('\n\n') : '');
  }

  // 构建用户消息显示（含图片缩略图）
  var userMsgEl = addMessageEl('user', text);
  if (pendingImages.length > 0) {
    var imgRow = document.createElement('div');
    imgRow.style.cssText = 'margin-top:6px;';
    pendingImages.forEach(function(img) {
      var wrap = document.createElement('span');
      wrap.className = 'msg-img-wrap';
      var imgEl = document.createElement('img');
      imgEl.src = img.dataUrl;
      imgEl.dataset.base64 = img.base64;
      wrap.appendChild(imgEl);
      var badge = document.createElement('span');
      badge.className = 'msg-img-badge';
      badge.textContent = '#' + img.id;
      badge.onclick = function() { openLightbox(img.dataUrl, img.base64); };
      wrap.appendChild(badge);
      imgRow.appendChild(wrap);
    });
    userMsgEl.appendChild(imgRow);
  }

  // 收集图片数据
  var images = pendingImages.length > 0 ? pendingImages.map(function(img) { return { id: img.id, base64: img.base64 }; }) : null;

  $input.innerHTML = '';
  pendingImages = [];
  renderImageStrip();
  $input.focus();

  // ---- Agentic loop ----
  setStreaming(true);
  var aiDiv = addMessageEl('ai', '');
  // ★ 内容层与钟表层分离：内容层接收流式输出，钟表层嵌在底部不被覆盖
  var contentWrap = document.createElement('div');
  aiDiv.appendChild(contentWrap);
  aiDiv._contentWrap = contentWrap;
  startFloorTimer(aiDiv);
  try {
    await agent.send(userContent, {
      images: images,
      token: token,
      tier: selectedTier ? TIER_LIST[selectedTier] : null,
      onToken: function(chunk) {
        // Paragraph buffer: never accumulate full _text. Only chunk-level split.
        aiDiv._buf = (aiDiv._buf || '') + chunk;
        var parts = aiDiv._buf.split('\n\n');
        aiDiv._paras = aiDiv._paras || [];
        for (var pi = 0; pi < parts.length - 1; pi++) {
          aiDiv._paras.push(parts[pi]);
        }
        aiDiv._buf = parts[parts.length - 1];
        aiDiv._dirty = true;
        if (!aiDiv._renderScheduled) {
          aiDiv._renderScheduled = true;
          setTimeout(doStreamRender, 1000);
        }
        if (!_scrollPending) {
          _scrollPending = true;
          requestAnimationFrame(function() {
            $messages.scrollTop = $messages.scrollHeight;
            _scrollPending = false;
          });
        }
      },

      onDone: async function(content, timing) {
        aiDiv._renderScheduled = false;
        aiDiv._paras = null;
        aiDiv._buf = null;
        aiDiv._lastParaEl = null;
        aiDiv._renderedCount = 0;
        aiDiv._dirty = false;
        aiDiv._contentWrap.innerHTML = renderMarkdown(content);
        if (window._tableStore && window._tableStore.length > 50) {
          window._tableStore = window._tableStore.slice(-30);
        }
        stopFloorTimer(timing || { networkMs: 0, deepseekMs: 0, toolMs: 0 });
        scrollToBottom();
        await saveQuestData();
        await autoRenameQuest();
        updateCtxBtn();
        if (_queue.length > 0) {
          var next = _queue.shift();
          renderQueueStrip();
          $input.textContent = next.text;
          setTimeout(function() { sendMessage(); }, 200);
        }
      },

      onCost: async function(cost, total) {
        $costLabel.textContent = cost + ' / ' + total.toFixed(4) + ' ge';
      },
      onError: function(msg) {
        addMessageEl('error', msg);
      }
    });
  } catch (err) {
    if (err && err.name !== 'AbortError') {
      addMessageEl('error', err.message || 'Unknown error');
    }
  } finally {
    _sending = false;
    setStreaming(false);
  }
}

// ---- Contenteditable helpers ----
// getInputText — keep chip order, replace chips with \u201cpath\u201d
function getInputText() {
  var text = '';
  var nodes = $input.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.nodeType === 3) { text += n.textContent; }
    else if (n.nodeName === 'BR') { text += '\n'; }
    else if (n.classList && n.classList.contains('file-chip')) {
      text += '\u201c' + (n.dataset.path || '') + '\u201d';
    }
    else { text += n.textContent; }
  }
  return text;
}
// getInputPlainText — pure text, skip chips (for AI content building)
function getInputPlainText() {
  var text = '';
  var nodes = $input.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.nodeType === 3) { text += n.textContent; }
    else if (n.nodeName === 'BR') { text += '\n'; }
    else if (n.classList && n.classList.contains('file-chip')) { /* skip */ }
    else { text += n.textContent; }
  }
  return text;
}

function getInputChipPaths() {
  const paths = [];
  $input.querySelectorAll('.file-chip').forEach(chip => {
    if (chip.dataset.path) paths.push(chip.dataset.path);
  });
  return paths;
}

function chipBasename(p) {
  const parts = p.replace(/\\/g, '/').split('/').filter(Boolean);
  return parts[parts.length - 1] || p;
}

function insertChipAtCursor(filePath) {
  const chip = document.createElement('span');
  chip.className = 'file-chip';
  chip.contentEditable = 'false';
  chip.dataset.path = filePath;
  const isDir = !filePath.match(/\.[a-zA-Z0-9]+$/);
  chip.innerHTML =
    '<span class="chip-icon">' + (isDir ? '📁' : '📄') + '</span>' +
    '<span class="chip-name">' + escHtml(chipBasename(filePath)) + '</span>' +
    '<span class="chip-rm">×</span>';
  chip.querySelector('.chip-rm').addEventListener('click', function() { chip.remove(); });
  chip.title = filePath;

  // Insert at cursor position in contenteditable
  $input.focus();
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    // Only insert if cursor is inside #input
    if ($input.contains(range.startContainer)) {
      range.deleteContents();
      range.insertNode(chip);
      // Move cursor after chip
      range.setStartAfter(chip);
      range.setEndAfter(chip);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      $input.appendChild(chip);
    }
  } else {
    $input.appendChild(chip);
  }
}

// Expose for direct cross-frame access (same origin)
window.qqqAiAttach = insertChipAtCursor;

// Listen for file attachment from parent (AI viewport via postMessage)
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'qqq-ai-attach') {
    const path = e.data.path;
    if (path) {
      insertChipAtCursor(path);
    }
  }
});

// Also listen for CustomEvent on document (in case dispatched in same page)
document.addEventListener('qqq-ai-attach', function(e) {
  if (e.detail && e.detail.path) {
    insertChipAtCursor(e.detail.path);
  }
});

// ═══ Full-window overlay (via parent.postMessage, breaks out of iframe) ═══
function openLightbox(src, base64) {
  if (parent) {
    parent.postMessage({ type: 'qqq-ai-overlay', action: 'open-image', src: src, base64: base64 || null }, '*');
  }
}

function closeLightbox() {
  if (parent) {
    parent.postMessage({ type: 'qqq-ai-overlay', action: 'close' }, '*');
  }
}

// Escape key handled by parent overlay; also listen locally as fallback
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeLightbox(); }
});

})();
</script>
