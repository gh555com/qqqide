<script>
(function(){
'use strict';
var topWin=window.top||window,L=topWin.__qqq_console_lines=topWin.__qqq_console_lines||[],ML=30000;
function _ser(v,d,s){
 if(d>10)return'[...]';if(v===null)return'null';if(v===undefined)return'undefined';
 var t=typeof v;if(t==='string')return v.length>50000?v.slice(0,50000)+'...':v;
 if(t==='number'||t==='boolean')return String(v);if(t==='bigint')return v.toString()+'n';if(t==='symbol')return v.toString();
 if(t==='function')return'[fn:'+(v.name||'?')+']';if(!v||typeof v!=='object')return String(v);
 if(s.has(v))return'[Circular]';s.add(v);
 try{
  if(v instanceof Error)return(v.stack||v.message||'').slice(0,50000);
  if(Array.isArray(v)){var a=v.slice(0,100).map(function(x){return _ser(x,d+1,s)});return'['+a.join(',')+(v.length>100?',...':'')+']';}
  if(v instanceof Map){var e=[];var i=0;v.forEach(function(v,k){if(++i>50){e.push('...');return;}e.push(_ser(k,d+1,s)+'=>'+_ser(v,d+1,s))});return'Map('+v.size+'){'+e.join(',')+'}';}
  if(v instanceof Set){var e=[];var i=0;v.forEach(function(x){if(++i>50){e.push('...');return;}e.push(_ser(x,d+1,s))});return'Set('+v.size+'){'+e.join(',')+'}';}
  var keys=Object.keys(v).slice(0,50);
  return'{'+keys.map(function(k){return k+':'+_ser(v[k],d+1,s)}).join(',')+(Object.keys(v).length>50?',...':'')+'}';
 }catch(_){return'[Object]';}
}
function _fmt(a){for(var i=0,r=[];i<a.length;i++)r.push(_ser(a[i],0,new WeakSet()));return r.join(' ');}
function _cln(l){l=l.trim().replace(/^at\s+/,'');
 // 清理 file:/// 和 http:// URL → 只留文件名
 l=l.replace(/(?:file:\/\/\/|https?:\/\/[^ )]+?\/)([^ )>:]+)/g,function(_,f){return f.replace(/\\/g,'/').split('/').pop();});
 var m=l.match(/^(.+)\s+\((.+):(\d+):\d+\)$/);if(m)return m[1]+' @ '+m[2]+':'+m[3];
 m=l.match(/^(.+):(\d+):\d+$/);if(m)return m[1]+':'+m[2];
 return l;}
function _cap(){
 try{var s=new Error().stack;if(!s)return{head:'?:?',trace:''};var ln=s.split('\n'),hd='',tr='';
  for(var i=3;i<ln.length;i++){var l=ln[i];if(!l||l.indexOf('(native)')>=0||l.indexOf('index.html')>=0&&l.indexOf('<anonymous>')>=0)continue;
   var c=_cln(l);if(!c)continue;if(!hd){var a=c.indexOf(' @ ');hd=a>=0?c.slice(a+3):c;}else{tr+=(tr?'\n':'')+'    '+c;}}
  return{head:hd||'?:?',trace:tr};}catch(_){return{head:'?:?',trace:''};}
}
var _orig={};
['log','warn','error','info','debug'].forEach(function(m){
 _orig[m]=console[m];console[m]=function(){
  var a=Array.prototype.slice.call(arguments);
  var stk=_cap(),hd=stk.head,txt=_fmt(a);
  L.push(hd+' '+txt);if(L.length>ML)L.splice(0,L.length-ML);
  if(m==='warn'||m==='error'){if(stk.trace)L.push(stk.trace);}
  _orig[m].apply(console,arguments);
 };
});
// 暴露项目根目录给主进程保存对话框
(function _sr(){
 try{var r=window._workspaceRoot;if(r){topWin.__qqq_project_root=r;return;}}catch(_){}
 setTimeout(_sr,1500);
})();
})();
</script>

<!-- ★ 双通道戳记机器 — __stamp.js 走SW缓存(可能陈旧) + _BUILD_STAMP.json 走直连(永远最新) → 比对=100%确定 -->
<script src="core/__stamp.js"></script>
<script>
// ★ 构建戳双通道比对机器 — SW缓存ID(__stamp.js) vs 磁盘(_BUILD_STAMP.json)
//   渲染到 #qqq-status-build（设置面板·重置窗口右侧）：旧缓存 → 按「重置窗口」
//   设置面板每次渲染时由 settings.js 调用 __qqqBuildStampRefresh()
(function(){
  var _last = null; // 上次渲染结果缓存，面板重开秒显不闪
  function _renderTo($el, res) {
    if (!$el) return;
    $el.textContent = res.text;
    $el.style.color = res.color || '';
    $el.style.fontWeight = res.bold ? 'bold' : '';
    $el.title = res.title;
  }
  function _apply(res) {
    _last = res;
    var els = document.querySelectorAll('#qqq-status-build');
    for (var i = 0; i < els.length; i++) _renderTo(els[i], res);
  }
  function _refresh() {
    var diskId = (window.__QQQ_BUILD_ID || '????');
    fetch('/qqqide/qqq/_BUILD_STAMP.json?_=' + Date.now(), {cache:'no-cache'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if (!data) {
          _apply({text: '\u274c 无', color: '#dc322f', title: '构建戳读取失败'});
        } else if (data.buildId === window.__QQQ_BUILD_ID) {
          _apply({text: '\u2705 ' + data.buildId.slice(0,8), title: '最新代码 \u2705 buildId=' + data.buildId});
        } else {
          _apply({text: '\u26a0\ufe0f ' + data.buildId.slice(0,8) + '\u2260' + diskId.slice(0,6), color: '#dc322f', bold: true, title: 'SW\u7f13\u5b58\u4e86\u65e7\u4ee3\u7801\uff01\u78c1\u76d8=' + data.buildId + ' \u6d4f\u89c8\u5668=' + diskId});
        }
      })
      .catch(function(){
        _apply({text: '\u274c fetch失败', color: '#dc322f', title: '构建戳 fetch 失败'});
      });
  }
  window.__qqqBuildStampRefresh = function(){
    if (_last) _apply(_last); // 有缓存先同步渲染，防面板重开闪 'stamp: --'
    _refresh();
  };
})();
</script>

<!-- ★ Quest 所有权同步注册表（父窗口级内存对象，零 TTL 零异步） -->
<script>
(function() {
  'use strict';
  if (parent !== window) return;
  // questId → panelId (0/1/2)。所有面板共享同一父窗口，同步读写无竞态。
  window.__qqq_questOwners = {};
  // 注册：面板 claim 一个 quest 时调用
  window.__qqq_claimQuest = function(questId, panelId) {
    if (!questId || typeof questId !== 'string') return;
    window.__qqq_questOwners[questId] = panelId;
  };
  // 释放：面板 release 一个 quest 时调用
  window.__qqq_releaseQuest = function(questId, panelId) {
    if (!questId || typeof questId !== 'string') return;
    if (window.__qqq_questOwners[questId] === panelId) {
      delete window.__qqq_questOwners[questId];
    }
  };
  // 查询：返回 panelId 或 undefined
  window.__qqq_getQuestOwner = function(questId) {
    if (!questId || typeof questId !== 'string') return undefined;
    return window.__qqq_questOwners[questId];
  };
  // ★ 原子申领：仅当 quest 无人持有时申领成功，返回 true；已被持有返回 false
  //   消灭「check-then-claim」竞态窗口 —— check 时无人，claim 时已被抢
  window.__qqq_tryClaimQuest = function(questId, panelId) {
    if (!questId || typeof questId !== 'string') return false;
    if (questId in window.__qqq_questOwners) return false;
    window.__qqq_questOwners[questId] = panelId;
    return true;
  };
  // questId → 是否正在建楼（跨面板共享，引用计数零竞态）
  window.__qqq_runningQuests = {};
  window.__qqq_setQuestRunning = function(questId, isRunning) {
    if (!questId || typeof questId !== 'string') return;
    if (isRunning) {
      window.__qqq_runningQuests[questId] = (window.__qqq_runningQuests[questId] || 0) + 1;
    } else {
      if (window.__qqq_runningQuests[questId]) {
        window.__qqq_runningQuests[questId]--;
        if (window.__qqq_runningQuests[questId] <= 0) {
          delete window.__qqq_runningQuests[questId];
        }
      }
    }
  };
  window.__qqq_getRunningQuests = function() {
    return Object.keys(window.__qqq_runningQuests);
  };

  // ★ 懒惰重命名扫描锁（B+ 方案）：只中面板做一次，侧面板轮询等待
  window.__qqq_renameScanDone = false;
  window.__qqq_renameScanInProgress = false;
  window.__qqq_renameScanResult = null;  // { fixed, failed, skipped, collisions }
})();
</script>

<!-- ★ 跨面板文件修改广播（防止 AI 基于过期内容生成无效 edit） -->
<script>
(function() {
  'use strict';
  if (parent !== window) return;
  var MAX = 200; // 环形缓冲区上限
  var _log = []; // [{path, panel, ts}]
  // 面板写文件成功后调用：记录谁在什么时候改了什么
  window.__qqq_fileModified = function(path, panelId) {
    if (!path) return;
    _log.push({ path: path, panel: panelId, ts: Date.now() });
    if (_log.length > MAX) _log = _log.slice(-100);
  };
  // 查询：返回 since 时间戳之后、被其他面板修改过的文件路径列表
  window.__qqq_getStaleFiles = function(myPanelId, sinceTs) {
    var paths = {};
    for (var i = _log.length - 1; i >= 0; i--) {

      if (e.panel !== myPanelId) paths[e.path] = true;
    }

  };
})();

<!-- AI 面板焦点同步：iframe postMessage → 视口文件附加目标 + 互斥焦点 + 翼板自动打开 -->
<script>
(function() {
  'use strict';
  if (parent !== window) return;
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqq-ai-panel-focused' && typeof e.data.panel === 'number') {
      if (window.__qqq_updateAiTarget) {
        window.__qqq_updateAiTarget(e.data.panel);
      } else {
        window.__qqq_aiTarget = e.data.panel;
      }
      // ★ 互斥焦点：通知所有其他 AI 面板失去焦点
      var allIframes = document.querySelectorAll('iframe');
      for (var i = 0; i < allIframes.length; i++) {
        var iframe = allIframes[i];
        if (iframe.contentWindow && e.source !== iframe.contentWindow) {
          try {
            iframe.contentWindow.postMessage({ type: 'qqq-ai-panel-defocus' }, '*');
          } catch (_) {}
        }
      }
    }
    // ★ 翼板自动打开：当 quest 已被侧面板持有时，自动打开对应翼板
    if (e.data && e.data.type === 'qqq-open-wing' && typeof e.data.panel === 'number') {
      var dotId = e.data.panel === 0 ? 'qqq-bulb-1' : 'qqq-bulb-2';
      var dot = document.getElementById(dotId);
      if (dot && !dot.classList.contains('on')) {
        dot.click();
      }
    }
    // ★ 网关线路状态指示：iframe 上报 → 更新状态栏色点
    if (e.data && e.data.type === 'qqq-gw-status' && typeof e.data.panel === 'number') {
      var gwDot = document.getElementById('qqq-gw-dot-' + e.data.panel);
      if (!gwDot) return;
      var names = ['左', '中', '右'];
      var name = names[e.data.panel] || '';
      var host = (e.data.url || '').replace('https://','').replace('http://','').split('/')[0];
      var mode = e.data.fallback ? '备用直连' : 'Worker 主线路';
      gwDot.className = 'qqq-gw-dot ' + (e.data.fallback ? 'fallback' : 'primary') + ' pulse';
      gwDot.title = name + '面板 · ' + mode + (host ? ' (' + host + ')' : '');
      setTimeout(function () {
        if (gwDot.classList.contains('pulse')) gwDot.classList.remove('pulse');
      }, 400);
    }
  });
})();
</script>
