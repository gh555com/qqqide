<!-- 控制台捕获：拦截一切 console 输出 → 环形缓冲区（必须在所有脚本之前） -->
<script>
(function() {
  'use strict';
  var MAX = 5000;
  var _buf = [];
  var _orig = {};
  ['log','warn','error','info','debug'].forEach(function(m) {
    _orig[m] = console[m];
    console[m] = function() {
      var args = Array.prototype.slice.call(arguments);
      var ts = new Date().toISOString().slice(11,23);
      var line = ts + ' [' + m.toUpperCase() + ']';
      for (var i = 0; i < args.length; i++) {
        try {
          if (typeof args[i] === 'object') line += ' ' + JSON.stringify(args[i]);
          else line += ' ' + String(args[i]);
        } catch(_) { line += ' [unserializable]'; }
      }
      _buf.push(line);
      if (_buf.length > MAX) _buf.shift();
      _orig[m].apply(console, arguments);
    };
  });
  window.__qqq_console_text = function() { return _buf.join('\n'); };
  window.__qqq_console_clear = function() { _buf.length = 0; };
})();
</script>

<div class="qqq-shell">

  <!-- ======== Menu Area (top, full width) ======== -->
  <div class="qqq-menu-area">
    <div class="qqq-menu-row qqq-menu-row-1">
      <div class="qqq-menubar" id="qqq-menubar"></div>
      <div id="qqq-ai-viewport"></div>
      <div class="qqq-spacer"></div>
      <button class="qqq-zoom-btn" id="qqq-zoom-out" data-i18n-title="shell.zoom.out" title="缩小 UI（Ctrl+-）">&#x2212;</button>
      <button class="qqq-zoom-btn" id="qqq-zoom-in" data-i18n-title="shell.zoom.in" title="放大 UI（Ctrl+=）">&#x002B;</button>
      <span class="qqq-zoom-label" id="qqq-zoom-label">0.85</span>
      <button class="qqq-lang-btn" id="qqq-lang-btn" data-i18n-title="shell.lang.switch" title="切换语言">中</button>
      <button class="qqq-theme-toggle" id="qqq-theme-toggle" data-i18n-title="shell.theme.toggle" title="切换亮色/暗色">&#x263C;</button>
      <div class="qqq-window-controls">
        <button class="qqq-wc-btn" id="qqq-wc-min" data-i18n-title="shell.window.minimize" title="最小化">&#x2014;</button>
        <button class="qqq-wc-btn" id="qqq-wc-max" data-i18n-title="shell.window.maximize" title="最大化">&#x25A1;</button>
        <button class="qqq-wc-btn qqq-wc-close" id="qqq-wc-close" data-i18n-title="shell.window.close" title="关闭">&#x2715;</button>
      </div>
    </div>
    <div class="qqq-menu-row qqq-menu-row-2">
      <div class="qqq-toolbar" id="qqq-toolbar" style="flex:1">
        <span class="qqq-toolbar-brand">qqq</span>
        <span class="qqq-goods-bar" id="qqq-goods-bar"></span>
        <span class="qqq-spacer"></span>
        <button class="qqq-update-btn" id="qqq-update-btn" data-i18n-title="shell.update.check" title="检查更新" style="display:none">&#x21BB;</button>
      </div>
      <span class="qqq-bulb" id="qqq-bulbs">
        <span class="qqq-bulb-dot" id="qqq-bulb-1" title="外嵌面板 1"></span>
        <span class="qqq-bulb-dot" id="qqq-bulb-2" title="外嵌面板 2"></span>
      </span>
    </div>
  </div>

  <!-- ======== Middle Area (A + X + AI) ======== -->
  <div class="qqq-middle">
    <!-- A Zone: gaea panel (q4 sidebar) -->
    <div class="qqq-a-zone" id="qqq-a-zone"></div>

    <!-- Sash: A | X -->
    <div class="qqq-sash qqq-sash-v" data-sash="a-right"></div>

    <!-- X Zone: tab groups (upper) + output (lower) -->
    <div class="qqq-x-zone" id="qqq-x-zone">
      <div class="qqq-x-upper" id="qqq-x-upper">
        <!-- tab groups injected dynamically by tab-manager.js -->
      </div>
      <div class="qqq-sash qqq-sash-h qqq-hidden" data-sash="output-top" id="qqq-sash-output"></div>
      <div class="qqq-x-output qqq-hidden" id="qqq-x-output">
        <div class="qqq-output-header">
          <span class="qqq-output-title" data-i18n="shell.output.title">产出</span>
          <span class="qqq-spacer"></span>
          <button class="qqq-output-close" id="qqq-output-close" data-i18n-title="shell.output.hide" title="隐藏产出">&#x2715;</button>
        </div>
        <div class="qqq-output-body" id="qqq-output-body"></div>
      </div>
    </div>

    <!-- AI Zone: fixed 389px -->
    <div class="qqq-ai-zone" id="qqq-ai-zone"></div>
  </div>

  <!-- ======== Status Area (bottom, full width) ======== -->
  <div class="qqq-status-area">
    <div class="qqq-status-row">
      <span class="qqq-status-item" id="qqq-status-version">v?</span>
      <span class="qqq-status-item" id="qqq-status-engine">engine ?</span>
      <span class="qqq-spacer"></span>
      <span class="qqq-status-item" id="qqq-status-clock"></span>
    </div>
  </div>

  <!-- Resize grip (bottom-right triangle) -->
  <div class="qqq-resize-grip" id="qqq-resize-grip"></div>

</div>

<!-- 僚机 bridge 代理：主窗口 shell 直接处理（不依赖 AI 面板 iframe 是否打开） -->
<script>
(function() {
  'use strict';
  // 仅主窗口（非僚机、非 iframe）运行
  if (parent !== window) return;
  if (window.location.search.indexOf('external=') !== -1) return;

  // ═══ IPC sync → postMessage 桥接 ═══
  // 僚机通过 IPC 发送 host-message → 主进程 → 本窗口 → postMessage → shell.js
  // 这样 shell.js 无需任何改动即可接收僚机的 UI 指令（文件打开、overlay 等）
  if (window.qqqideBridge && window.qqqideBridge.sync) {
    window.qqqideBridge.sync.onMessage(function(channel, data) {
      if (channel === 'host-message' && data) {
        try { window.postMessage(data, '*'); } catch(_) {}
      }
    });
  }

  // ═══ AI 面板自动跟焦：合 IPC 转发 + iframe postMessage 更新视口目标指示器 ═══
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqq-ai-panel-focused' && typeof e.data.panel === 'number') {
      if (window.__qqq_updateAiTarget) {
        window.__qqq_updateAiTarget(e.data.panel);
      } else {
        window.__qqq_aiTarget = e.data.panel;
      }
    }
  });
})();
</script>
