<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Git Diff</title>
<style>
/* ═══ 配色 ═══ */
:root{--bg:#fdf6e3;--card:#eee8d5;--text:#073642;--border:#d3cbb7;--green:#859900;--red:#dc322f;--yellow:#b58900;--accent:#cb4b16;--base01:#97978a;--base2:#eee8d5;--base3:#fdf6e3;--hover-bg:rgba(0,0,0,0.035)}
[data-theme="dark"]{--bg:#1e1e1e;--card:#2a2a2a;--text:#dcd8d0;--border:#333;--green:#8fbc5a;--red:#ff4444;--yellow:#d4a017;--accent:#b58900;--base01:#97978a;--base2:#2a2a2a;--base3:#1e1e1e;--hover-bg:rgba(255,255,255,0.05)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--base01);border-radius:0}
::selection{background:#ffd301;color:#000}

/* ═══ TITLE ROW ═══ */
#title-row{height:40px;background:var(--card);display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;-webkit-app-region:drag}
#title-row .title-text{flex:1;font-size:12px;font-family:ui-monospace,Consolas,monospace;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#title-row .title-text .path{color:var(--text)}
#title-row .title-text .sep{color:var(--red);font-weight:700}
#title-row .win-btn{-webkit-app-region:no-drag;width:28px;height:26px;border:none;background:transparent;color:var(--base01);font-size:14px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#title-row .win-btn:hover{background:var(--border)}

/* ═══ DIFF CONTAINER ═══ */
#diff-container{flex:1;overflow:hidden;position:relative}
#empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--base01);font-size:13px}

/* ═══ BOTTOM BUTTONS ═══ */
#big-close{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:2px solid var(--red);background:var(--card);color:var(--red);font-size:24px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all .15s;line-height:1;outline:none}
#big-close:hover{background:var(--red);color:#fff;transform:translateX(-50%) scale(1.1)}

#btn-diff-only{position:fixed;bottom:calc(16px + 4px);left:50%;transform:translateX(calc(-50% - 28px - 120px));height:48px;padding:0 20px;border-radius:6px;border:2px solid #4a4a4a;background:var(--card);color:var(--text);font-size:13px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all .15s;font-family:Tahoma,system-ui,-apple-system,sans-serif;white-space:nowrap;outline:none}
#btn-diff-only:hover{background:var(--bg)}
#btn-diff-only.on{font-weight:800}
#btn-diff-only.on::after{content:'';display:inline-block;width:5px;height:10px;border:solid var(--text);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:8px;margin-bottom:2px}
</style>
<script>
(function(){var p=new URLSearchParams(location.search);var t=p.get('theme');if(t)document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
</script>
</head>
<body>

<div id="title-row">
  <span style="font-size:13px;flex-shrink:0;-webkit-app-region:no-drag">📄</span>
  <div class="title-text">
    <span class="path" id="path-label">—</span>
    <span class="sep" id="commit-label"></span>
  </div>
  <button class="win-btn" id="btn-close" style="font-size:18px" title="关闭 (Esc)">✕</button>
</div>

<div id="diff-container"></div>
<div id="empty-state">加载中…</div>

<button id="btn-diff-only">仅差异</button>
<button id="big-close">✕</button>

<script src="../../min/vs/loader.js"></script>
<script>
'use strict';

// ═══ PARSE PARAMS ═══
var _params = new URLSearchParams(location.search);
var _filePath = _params.get('filePath') || '';
var _projectRoot = _params.get('projectRoot') || '';
var _commitHash = _params.get('commitHash') || '';
var _mode = _params.get('mode') || 'working'; // 'working' | 'commit'
var _staged = _params.get('staged') === '1';
var _fileName = _filePath.split(/[\\/]/).pop() || _filePath;

// ═══ BRIDGE ═══
var _bridge = null;
try { _bridge = window.qqqideBridge; } catch(_) {}
if (!_bridge) {
  try { _bridge = parent.qqqideBridge; } catch(_) {}
}

// ═══ GIT HELPERS ═══
var _gitBin = null;
async function _getGit() {
  if (_gitBin) return _gitBin;
  if (_bridge && _bridge.components) {
    try { _gitBin = await _bridge.components.getBin('git'); } catch(_) {}
  }
  if (!_gitBin) _gitBin = 'git';
  return _gitBin;
}

async function _git(args, opts) {
  opts = opts || {};
  var bin = await _getGit();
  try {
    if (_bridge && _bridge.qz) {
      return await _bridge.qz.spawn({ cmd: bin, args: args, cwd: opts.cwd || _projectRoot, timeout: opts.timeout || 15000, shell: false });
    }
  } catch(e) {}
  return { exitCode: -1, stdout: '', stderr: e.message || '' };
}

function _relPath(absPath) {
  if (!_projectRoot) return absPath;
  var r = _projectRoot.replace(/\\/g, '/');
  var a = absPath.replace(/\\/g, '/');
  if (a.startsWith(r + '/')) return a.slice(r.length + 1);
  return a;
}

async function _getBeforeContent() {
  var rel = _relPath(_filePath);
  if (_mode === 'commit' && _commitHash) {
    var r = await _git(['show', _commitHash + '^:' + rel]);
    return r.exitCode === 0 ? r.stdout : '';
  }
  if (_staged) {
    var r = await _git(['show', 'HEAD:' + rel]);
    return r.exitCode === 0 ? r.stdout : '';
  }
  // unstaged: try HEAD, empty if untracked
  var r = await _git(['show', 'HEAD:' + rel]);
  return r.exitCode === 0 ? r.stdout : '';
}

async function _getAfterContent() {
  var rel = _relPath(_filePath);
  if (_mode === 'commit' && _commitHash) {
    var r = await _git(['show', _commitHash + ':' + rel]);
    return r.exitCode === 0 ? r.stdout : '';
  }
  if (_staged) {
    var r = await _git(['show', ':0:' + rel]);
    return r.exitCode === 0 ? r.stdout : '';
  }
  // unstaged: git show :relPath gives working tree version
  var r = await _git(['show', ':' + rel]);
  return r.exitCode === 0 ? r.stdout : '';
}

// ═══ UI ═══
document.getElementById('path-label').textContent = _fileName;
if (_commitHash) {
  document.getElementById('commit-label').textContent = ' @ ' + _commitHash.slice(0, 8);
}

// ═══ CLOSE ═══
document.getElementById('big-close').addEventListener('click', function() { window.close(); });
document.getElementById('btn-close').addEventListener('click', function() { window.close(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') window.close(); });

// ═══ DIFF ONLY TOGGLE ═══
var _diffOnly = false;
var _btnDO = document.getElementById('btn-diff-only');
_btnDO.addEventListener('click', function() {
  _diffOnly = !_diffOnly;
  _btnDO.classList.toggle('on', _diffOnly);
  if (_editor) _editor.updateOptions({ renderSideBySide: !_diffOnly });
});

// ═══ MONACO DIFF ═══
var _editor = null;
require(['vs/editor/editor.main'], function() {
  initDiff();
});

async function initDiff() {
  var container = document.getElementById('diff-container');
  var empty = document.getElementById('empty-state');
  empty.textContent = '读取 Git 数据…';

  var before = await _getBeforeContent();
  var after = await _getAfterContent();

  if (!before && !after) {
    empty.textContent = '无内容可比较';
    return;
  }

  empty.style.display = 'none';
  container.style.display = '';

  var original = monaco.editor.createModel(before || '', 'plaintext');
  var modified = monaco.editor.createModel(after || '', 'plaintext');

  _editor = monaco.editor.createDiffEditor(container, {
    readOnly: true,
    renderSideBySide: true,
    glyphMargin: false,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    automaticLayout: true,
    renderIndicators: false,
    originalEditable: false,
    lineNumbers: 'on',
    theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'vs-dark' : 'vs',
    enableSplitViewResizing: false,
  });
  _editor.setModel({ original: original, modified: modified });
  _editor.getOriginalEditor().updateOptions({ readOnly: true });
  _editor.getModifiedEditor().updateOptions({ readOnly: true });
}
</script>
</body>
</html>
