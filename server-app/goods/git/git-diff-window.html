<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Git Diff</title>
<style>
:root{--bg:#fdf6e3;--card:#eee8d5;--text:#073642;--border:#d3cbb7;--green:#859900;--red:#dc322f;--yellow:#b58900;--base01:#97978a;--base2:#eee8d5}
[data-theme="dark"]{--bg:#1e1e1e;--card:#2a2a2a;--text:#dcd8d0;--border:#333;--green:#8fbc5a;--red:#ff4444;--yellow:#d4a017;--base01:#97978a;--base2:#2a2a2a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--base01);border-radius:0}
#title-row{height:36px;background:var(--card);display:flex;align-items:center;padding:0 8px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0;-webkit-app-region:drag}
#title-row span.file{flex:1;font-size:12px;font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#title-row .btn-close{-webkit-app-region:no-drag;width:26px;height:24px;border:none;background:none;color:var(--red);font-size:16px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#title-row .btn-close:hover{background:var(--red);color:#fff}
#diff-container{flex:1;overflow:hidden;position:relative}
#status-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--base01);font-size:13px;text-align:center;max-width:80%;line-height:1.6}
#bottom-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:999}
#bottom-bar button{height:40px;border-radius:6px;border:2px solid #666;background:var(--card);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);font-family:Tahoma,sans-serif;padding:0 14px}
#bottom-bar button.on{font-weight:800;border-color:var(--green)}
#bottom-bar button.close-btn{border-color:var(--red);color:var(--red);width:44px;border-radius:50%;font-size:22px;padding:0}
#bottom-bar button.close-btn:hover{background:var(--red);color:#fff}
</style>
<script>
(function(){var p=new URLSearchParams(location.search);var t=p.get('theme');if(t)document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
</script>
</head>
<body>

<div id="title-row">
  <span style="flex-shrink:0;font-size:13px">📄</span>
  <span class="file" id="label">—</span>
  <button class="btn-close" id="btn-x" title="关闭 (Esc)">✕</button>
</div>

<div id="diff-container">
  <div id="status-msg">正在读取 Git 数据…</div>
</div>

<div id="bottom-bar">
  <button id="btn-diff-only">仅差异</button>
  <button class="close-btn" id="btn-big-close" title="关闭 (Esc)">✕</button>
</div>

<script>
'use strict';

// ═══ Close ═══
document.getElementById('btn-x').addEventListener('click',function(){window.close();});
document.getElementById('btn-big-close').addEventListener('click',function(){window.close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')window.close();});

// ═══ Params ═══
var _p=new URLSearchParams(location.search);
var _filePath=_p.get('filePath')||'';
var _projectRoot=_p.get('projectRoot')||'';
var _commitHash=_p.get('commitHash')||'';
var _mode=_p.get('mode')||'working';
var _staged=_p.get('staged')==='1';
var _gitBin=_p.get('gitBin')||'git'; // embedded git binary path from main process
var _fileName=_filePath.replace(/[\\\/]/g,'/').split('/').pop()||_filePath;
var _msg=document.getElementById('status-msg');
document.getElementById('label').textContent=_fileName+(_commitHash?' @ '+_commitHash.slice(0,8):'');
console.log('[git-diff] init filePath='+_filePath+' projectRoot='+_projectRoot+' gitBin='+_gitBin+' commitHash='+_commitHash+' mode='+_mode+' staged='+_staged);

// ═══ Bridge ═══
var _bridge=null;
try{_bridge=window.qqqideBridge;}catch(_){}
if(!_bridge)try{_bridge=window.top.qqqideBridge;}catch(_){}
console.log('[git-diff] bridge:',!!_bridge,Object.keys(_bridge||{}).join(','));

// ═══ Git spawn ═══
async function _git(args){
  if(!_bridge||!_bridge.qz){
    console.log('[git-diff] _git FAIL: no bridge.qz');
    return {exitCode:-1,stdout:'',stderr:'bridge.qz missing'};
  }
  try{
    console.log('[git-diff] spawn:',_gitBin,args.join(' '),'cwd='+_projectRoot);
    var r=await _bridge.qz.spawn({cmd:_gitBin,args:args,cwd:_projectRoot,timeout:15000,shell:false});
    console.log('[git-diff] result exitCode='+r.exitCode+' stdoutLen='+(r.stdout||'').length+' stderrLen='+(r.stderr||'').length);
    if(r.stderr) console.log('[git-diff] stderr:',r.stderr.substring(0,200));
    return r;
  }catch(e){
    console.log('[git-diff] _git exception:',e&&e.message||e);
    return {exitCode:-1,stdout:'',stderr:String(e)};
  }
}

// ═══ Resolve git root (run rev-parse once, cache it) ═══
var _gitRoot=null;
async function _resolveGitRoot(){
  if(_gitRoot)return _gitRoot;
  var r=await _git(['rev-parse','--show-toplevel']);
  console.log('[git-diff] rev-parse --show-toplevel exitCode='+r.exitCode+' stdout='+((r.stdout||'').trim()));
  if(r.exitCode===0&&r.stdout&&r.stdout.trim()){
    _gitRoot=r.stdout.trim().replace(/[\\\/]/g,'/').replace(/\/+$/,'');
    return _gitRoot;
  }
  // Fallback: use passed _projectRoot
  _gitRoot=_projectRoot.replace(/[\\\/]/g,'/').replace(/\/+$/,'');
  return _gitRoot;
}

// ═══ Compute relative path from git root ═══
async function _relPath(){
  var root=await _resolveGitRoot();
  var fp=_filePath.replace(/[\\\/]/g,'/');
  var rootLow=root.toLowerCase();
  var fpLow=fp.toLowerCase();
  if(fpLow.startsWith(rootLow+'/')){
    var rel=fp.slice(root.length+1);
    console.log('[git-diff] _relPath root='+root+' fp='+fp+' -> rel='+rel);
    return rel;
  }
  console.log('[git-diff] _relPath root='+root+' fp='+fp+' -> NO MATCH, using basename');
  // Fallback: just use the basename (last resort)
  return _fileName;
}

// ═══ Get file content from git ═══
async function _gitCat(gitRef){
  var rel=await _relPath();
  var ref=gitRef+':'+rel;
  console.log('[git-diff] _gitCat ref='+ref);
  var r=await _git(['show',ref]);
  if(r.exitCode===0)return r.stdout||'';
  // Try without ref prefix (e.g. :0:path for staged)
  if(gitRef==='HEAD'){
    r=await _git(['show',':'+rel]);
    if(r.exitCode===0)return r.stdout||'';
  }
  console.log('[git-diff] _gitCat FAILED for '+ref+': exitCode='+r.exitCode);
  return '';
}

async function _getBefore(){
  if(_mode==='commit'&&_commitHash){
    // Before = parent commit
    var c=await _gitCat(_commitHash+'^');
    if(c)return c;
    // First commit: empty before is correct
    return '';
  }
  // Working tree or staged: before = HEAD version
  return await _gitCat('HEAD');
}

async function _getAfter(){
  if(_mode==='commit'&&_commitHash){
    // After = the commit itself
    return await _gitCat(_commitHash);
  }
  if(_staged){
    // Staged: after = index (:0)
    return await _gitCat(':0');
  }
  // Unstaged: read from disk
  if(_bridge&&_bridge.fs){
    try{
      var c=await _bridge.fs.read(_filePath);
      console.log('[git-diff] fs.read len='+(typeof c==='string'?c.length:'NOT STRING'));
      if(typeof c==='string'&&c)return c;
    }catch(e){console.log('[git-diff] fs.read error:',e);}
  }
  // Fallback: index version
  return await _gitCat(':0');
}

// ═══ Language detection ═══
function _langOf(fp){
  var n=fp.toLowerCase();
  if(/\.(js|mjs|cjs)$/.test(n))return'javascript';
  if(/\.(ts|tsx)$/.test(n))return'typescript';
  if(/\.(json)$/.test(n))return'json';
  if(/\.(html|htm)$/.test(n))return'html';
  if(/\.(css|scss|less)$/.test(n))return'css';
  if(/\.(md|markdown)$/.test(n))return'markdown';
  if(/\.(py)$/.test(n))return'python';
  if(/\.(go)$/.test(n))return'go';
  if(/\.(rs)$/.test(n))return'rust';
  if(/\.(sh|bash|zsh)$/.test(n))return'shell';
  if(/\.(bat|cmd)$/.test(n))return'bat';
  if(/\.(yml|yaml)$/.test(n))return'yaml';
  if(/\.(xml|svg)$/.test(n))return'xml';
  if(/\.(sql)$/.test(n))return'sql';
  if(/\.(java)$/.test(n))return'java';
  if(/\.(c|h)$/.test(n))return'c';
  if(/\.(cpp|cxx|cc|hpp)$/.test(n))return'cpp';
  return'plaintext';
}

// ═══ Solarized Monaco Theme (matches qqqide-theme.js) ═══
function _defineSolarizedThemes(monaco){
  if(!monaco)return;
  try{monaco.editor.defineTheme('solarized-dark',{
    base:'vs-dark',inherit:true,
    rules:[
      {token:'comment',foreground:'586e75',fontStyle:'italic'},
      {token:'keyword',foreground:'859900'},{token:'string',foreground:'2aa198'},
      {token:'number',foreground:'d33682'},{token:'type',foreground:'b58900'},
      {token:'function',foreground:'268bd2'},{token:'variable',foreground:'839496'},
      {token:'constant',foreground:'d33682'},{token:'regexp',foreground:'dc322f'},
    ],
    colors:{'editor.background':'#002b36','editor.foreground':'#839496','editor.lineHighlightBackground':'#073642'}
  });}catch(_){}
  try{monaco.editor.defineTheme('solarized-light',{
    base:'vs',inherit:true,
    rules:[
      {token:'comment',foreground:'93a1a1',fontStyle:'italic'},
      {token:'keyword',foreground:'859900'},{token:'string',foreground:'2aa198'},
      {token:'number',foreground:'d33682'},{token:'type',foreground:'b58900'},
      {token:'function',foreground:'268bd2'},{token:'variable',foreground:'657b83'},
      {token:'constant',foreground:'d33682'},{token:'regexp',foreground:'dc322f'},
    ],
    colors:{'editor.background':'#fdf6e3','editor.foreground':'#657b83','editor.lineHighlightBackground':'#eee8d5'}
  });}catch(_){}
}

// ═══ Monaco ═══
var _editor=null,_diffOnly=false;
document.getElementById('btn-diff-only').addEventListener('click',function(){
  _diffOnly=!_diffOnly;
  this.classList.toggle('on',_diffOnly);
  if(_editor)_editor.updateOptions({renderSideBySide:!_diffOnly});
});

function _loadMonaco(){
  return new Promise(function(resolve){
    if(window.monaco){resolve();return;}
    var base='qqqide-asset://monaco/vs';
    var s=document.createElement('script');
    s.src=base+'/loader.js';
    s.onload=function(){
      require.config({paths:{vs:base}});
      window.MonacoEnvironment={getWorker:function(){return new Worker('qqqide-asset://monaco/vs/base/worker/workerMain.js');}};
      require(['vs/editor/editor.main'],function(){
        _defineSolarizedThemes(window.monaco);
        resolve();
      },function(err){_msg.textContent='Monaco 加载失败: '+(err&&err.message||'unknown');resolve();});
    };
    s.onerror=function(){_msg.textContent='Monaco 加载失败';resolve();};
    document.head.appendChild(s);
  });
}

// ═══ Init ═══
(async function(){
  _msg.textContent='读取 Git 数据…';

  // Resolve git root first (validates git works)
  var root=await _resolveGitRoot();
  console.log('[git-diff] resolved git root:',root);

  var before=await _getBefore();
  var after=await _getAfter();
  console.log('[git-diff] beforeLen='+before.length+' afterLen='+after.length);

  if(!before&&!after){
    var extra='';
    if(_mode!=='commit'){
      extra='\n(文件可能未被 Git 跟踪，或不在仓库中)';
    }
    _msg.textContent='无差异内容可显示\n\n'+_fileName+extra;
    return;
  }

  _msg.textContent='加载 Monaco…';
  await _loadMonaco();
  if(!window.monaco){_msg.textContent='Monaco 加载失败 — 请关闭重试';return;}

  _msg.style.display='none';
  var container=document.getElementById('diff-container');
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  var theme=isDark?'solarized-dark':'solarized-light';
  var lang=_langOf(_fileName);

  var m1=monaco.editor.createModel(before||'',lang);
  var m2=monaco.editor.createModel(after||'',lang);

  _editor=monaco.editor.createDiffEditor(container,{
    renderSideBySide:true,
    readOnly:true,
    originalEditable:false,
    automaticLayout:true,
    minimap:{enabled:true,showSlider:'mouseover'},
    scrollbar:{vertical:'hidden',horizontal:'hidden'},
    wordWrap:'on',
    wordWrapColumn:0,
    renderIndicators:false,
    renderOverviewRuler:true,
    fontSize:14,
    lineNumbers:'on',
    lineNumbersMinChars:2,
    lineDecorationsWidth:10,
    scrollBeyondLastLine:20,
    theme:theme,
    enableSplitViewResizing:false
  });
  _editor.setModel({original:m1,modified:m2});
  _editor.getOriginalEditor().updateOptions({readOnly:true});
  _editor.getModifiedEditor().updateOptions({readOnly:true});
  _msg.style.display='none';
})();
</script>
</body>
</html>
