<style>

#diff-container{flex:1;overflow:hidden;position:relative}
#empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--base01);font-size:13px;text-align:center;max-width:80%;margin:0 auto;line-height:1.6}

#big-close{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:2px solid var(--red);background:var(--card);color:var(--red);font-size:24px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all .15s;line-height:1;outline:none}

#btn-diff-only{position:fixed;bottom:calc(16px + 4px);left:50%;transform:translateX(calc(-50% - 28px - 144px));height:48px;padding:0 24px;border-radius:6px;border:2px solid #4a4a4a;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all .15s;font-family:Tahoma,sans-serif;white-space:nowrap;outline:none}

#btn-diff-only.checked::after{content:'';display:inline-block;width:5px;height:10px;border:solid var(--text);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:8px;margin-bottom:2px}
</style>
<script>
(function(){var p=new URLSearchParams(location.search);var t=p.get('theme');if(t)document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
</script>

  <div id="drag-handle" title="拖拽移动窗口">
    <svg width="22" height="22" viewBox="0 0 22 22">
      <line x1="4" y1="11" x2="18" y2="11" stroke="var(--base01)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="11" y1="4" x2="11" y2="18" stroke="var(--base01)" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="6,8 4,11 6,14" fill="none" stroke="var(--base01)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  </div>
  <div id="input-wrap">

  </div>
</div>

<div id="diff-container"><div id="empty-state">正在读取 git 数据…</div></div>

<button id="btn-diff-only">仅差异</button>
<button id="big-close">✕</button>

<script>

async function _g(a){if(!_br||!_br.qz)return{exitCode:-1,stdout:'',stderr:'no qz'};try{return await _br.qz.spawn({cmd:_bin,args:a,cwd:_root,timeout:15000,shell:false});}catch(e){return{exitCode:-1,stdout:'',stderr:String(e)};}}

function _l(f){var m={js:'javascript',ts:'typescript',tsx:'typescript',json:'json',html:'html',htm:'html',css:'css',md:'markdown',py:'python',rs:'rust',go:'go',java:'java',sh:'shell',sql:'sql',xml:'xml',yml:'yaml',yaml:'yaml',bat:'bat'};return m[(f||'').split('.').pop().toLowerCase()]||'plaintext';}

function _se(ed){if(!ed)return;try{ed.updateOptions({scrollbar:{vertical:'hidden',horizontal:'hidden'},scrollBeyondLastLine:20,smoothScrolling:false,minimap:{enabled:false},glyphMargin:false,lineDecorationsWidth:0,renderLineHighlight:'none',occurrencesHighlight:false,selectionHighlight:false,matchBrackets:'never',renderValidationDecorations:'off',quickSuggestions:false,hover:{enabled:false},links:false,codeLens:false,folding:false,renderWhitespace:'none',contextmenu:false,dragAndDrop:false,lineNumbersMinChars:2,lineDecorationsWidth:10,stickyScroll:{enabled:false}});}catch(_){}}

var _ed=null,_ml=false,_do=false,_fs=13;
document.getElementById('btn-diff-only').onclick=function(){_do=!_do;var b=this;if(_do)b.classList.add('checked');else b.classList.remove('checked');_aha();setTimeout(_sfc,50);};
function _aha(){if(!_ed)return;var oe=_ed.getOriginalEditor(),me=_ed.getModifiedEditor();if(!_do){try{oe.setHiddenAreas([]);}catch(_){}try{me.setHiddenAreas([]);}catch(_){}return;}var c=_ed.getLineChanges();if(!c||!c.length)return;var mc=window.monaco;if(!mc)return;var om=oe.getModel(),mm=me.getModel(),ot=om?om.getLineCount():0,mt=mm?mm.getLineCount():0,oc=[],mc2=[];for(var i=0;i<c.length;i++){var cc=c[i];if(cc.originalEndLineNumber>0)oc.push({s:cc.originalStartLineNumber,e:cc.originalEndLineNumber});if(cc.modifiedEndLineNumber>0)mc2.push({s:cc.modifiedStartLineNumber,e:cc.modifiedEndLineNumber});}function inv(ch,total){if(!total)return[];var r=[],cur=1;for(var j=0;j<ch.length;j++){if(ch[j].s>cur)r.push({s:cur,e:ch[j].s-1});cur=ch[j].e+1;}if(cur<=total)r.push({s:cur,e:total});return r;}function sh(rr){var o=[];for(var k=0;k<rr.length;k++){var r=rr[k],len=r.e-r.s+1;if(len<3)continue;if(len<=6)continue;o.push({s:r.s+3,e:r.e-3});}return o;}var ou=sh(inv(oc,ot)),mu=sh(inv(mc2,mt));function tR(arr){return arr.map(function(r){return new mc.Range(r.s,1,r.e,1);});}try{oe.setHiddenAreas(tR(ou));}catch(_){}try{me.setHiddenAreas(tR(mu));}catch(_){}}
function _lm(){return new Promise(function(resolve){if(_ml&&window.monaco){resolve();return;}var s=document.createElement('script');s.src='qqqide-asset://monaco/vs/loader.js';s.onload=function(){require.config({paths:{vs:'qqqide-asset://monaco/vs'}});window.MonacoEnvironment={getWorker:function(){return new Worker('qqqide-asset://monaco/vs/base/worker/workerMain.js');}};require(['vs/editor/editor.main'],function(){_ml=true;_dmt(window.monaco);resolve();},function(){_msg.textContent='Monaco failed';resolve();});};s.onerror=function(){_msg.textContent='Monaco failed';resolve();};document.head.appendChild(s);});}

(async function(){
if(!_br||!_br.qz){_msg.textContent='Bridge not ready\n\nPlease restart IDE';return;}
try{_msg.textContent='Reading git data\u2026';await _rgr();var b='',a='';try{b=await _bf()||'';}catch(e){}try{a=await _af()||'';}catch(e){}
if(!b&&!a){_msg.textContent='No diff\n\n'+_fn+(_mode!=='commit'?'\n(file may not be tracked)':'');return;}

_msg.style.display='none';var dk=document.documentElement.getAttribute('data-theme')==='dark',th=dk?'solarized-dark':'solarized-light',lg=_l(_fn);

_ed.setModel({original:m1,modified:m2});_se(_ed.getOriginalEditor());_se(_ed.getModifiedEditor());
var fd=false;_ed.onDidUpdateDiff(function(){_aha();if(!fd){fd=true;_sfc();}});
if(_br&&_br.sync&&_br.sync.onMessage){_br.sync.onMessage(function(ch,data){if(ch!=='theme-change')return;var d=!!(data&&data.dark),t=d?'solarized-dark':'solarized-light';document.documentElement.setAttribute('data-theme',d?'dark':'light');if(_ed)try{_ed.updateOptions({theme:t});}catch(_){}});}
if(_br&&_br.zoom&&_br.zoom.onChanged){_br.zoom.onChanged(function(s){if(typeof s==='number'){_fs=Math.round(s);if(_ed)try{_ed.updateOptions({fontSize:_fs});}catch(_){}}});}
_msg.style.display='none';}catch(e){_msg.textContent='Error: '+(e&&e.message||e);}
})().catch(function(e){_msg.textContent='Crash: '+(e&&e.message||e);});
</script>
