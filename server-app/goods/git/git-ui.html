<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Git</title>
<style>
:root{--bg:#fdf6e3;--card:#eee8d5;--text:#595754;--border:#d3c6aa;--green:#859900;--red:#dc322f;--yellow:#b58900;--blue:#4078a0;--cyan:#2a9a78;--orange:#cb4b16;--base01:#777;--base1:#a8a6a2;--base2:#eee8d2;--base3:#fdf6e3;--added:rgba(133,153,0,0.08);--deleted:rgba(220,50,47,0.08)}
[data-theme="dark"]{--bg:#1e1e1e;--card:#2a2a2a;--text:#dcd8d0;--border:#333;--green:#8fbc5a;--red:#ff4444;--yellow:#d4a017;--blue:#60a0d0;--cyan:#5ab890;--orange:#e07020;--base01:#97978a;--base1:#6a6660;--base2:#2a2a2a;--base3:#1e1e1e;--added:rgba(143,188,90,0.1);--deleted:rgba(255,68,68,0.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::selection{background:#ffd301;color:#000}

/* header = tofu bar */
.header{display:flex;align-items:center;gap:3px;padding:4px 8px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;min-height:28px;flex-wrap:nowrap}
.tofu-bar{display:flex;gap:3px;flex:1;min-width:0;flex-wrap:wrap}
.header .tofu{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:3px;cursor:pointer;font-family:ui-monospace,monospace;font-size:11px;white-space:nowrap;border:1px solid transparent}
.header .tofu:hover{border-color:var(--border);background:var(--base2)}
.header .tofu.active{border-color:var(--blue);background:var(--added)}
.header .tofu .tf-name{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.header .tofu .tf-badge{font-size:9px;min-width:15px;height:14px;border-radius:7px;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}
.header .tofu .tf-nogit{font-size:9px;color:var(--base01)}
.header .branch{font-size:12px;color:var(--green);font-weight:700;font-family:ui-monospace,monospace;flex-shrink:0}
.header .pulls{font-size:11px;color:var(--blue);font-family:ui-monospace,monospace;margin-left:4px;flex-shrink:0}

/* toolbar */
.toolbar{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;flex-wrap:wrap}
.toolbar button{font-size:12px;padding:3px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer;font-family:ui-monospace,monospace}
.toolbar button:hover{background:var(--base2)}
.toolbar .sep{width:1px;background:var(--border);margin:0 4px}

/* content */
.content{flex:1;overflow:auto;padding:8px 12px}

/* sections */
.section{margin-bottom:10px}
.section h3{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--text);display:flex;align-items:center;gap:6px}
.section h3 .count{font-size:11px;color:var(--base01);font-weight:400}

/* file list */
.file-list{list-style:none}
.file-list li{padding:2px 4px;font-family:Tahoma,ui-monospace,monospace;font-size:12px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:4px}
.icon-btn{background:none;border:none;cursor:pointer;padding:2px 1px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);opacity:.65;border-radius:3px;width:20px;height:20px}
.icon-btn:hover{opacity:1;background:var(--base2)}
.file-list li:hover{background:var(--base2)}
.badge{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;flex-shrink:0;min-width:16px;text-align:center;line-height:14px}
.badge.M{background:var(--yellow)}
.badge.A{background:var(--green)}
.badge.D{background:var(--red)}
.badge.U{background:var(--orange)}
.badge.R{background:var(--cyan)}
.file-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file-actions{display:flex;gap:3px;margin-left:auto;flex-shrink:0}

/* inline diff */
.inline-diff{margin:4px 0 8px 0;border:1px solid var(--border);border-radius:3px;overflow:hidden;display:none}
.inline-diff .diff-header{padding:4px 8px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:11px}
.inline-diff .diff-header .dpath{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.inline-diff .diff-body{max-height:360px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.4}
.inline-diff .dline{display:flex;min-height:16px;white-space:pre}
.inline-diff .dline .dl{color:var(--green)}
.inline-diff .dline .dr{color:var(--red)}
.inline-diff .dline .dc{color:var(--base01)}
.inline-diff .dline .dh{color:var(--blue);font-weight:700}
.inline-diff .dline .hunk-sep{border-top:1px dashed var(--border);margin:4px 0}

/* commit form */
.commit-form{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.commit-form textarea{flex:1;min-width:0;height:52px;resize:none;font-family:ui-monospace,monospace;font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)}
.commit-form .commit-right{display:flex;flex-direction:column;gap:4px;justify-content:space-between;flex-shrink:0;min-width:110px}
.commit-form .commit-right button{padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
.commit-form .commit-right button:hover{opacity:.9}
.commit-options{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--base01)}
.commit-options label{display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap}
.commit-options input[type=checkbox]{display:none}
.commit-options .so-cb{width:14px;height:14px;border:1.5px solid var(--base01);border-radius:3px;flex-shrink:0;position:relative;display:inline-block}
.commit-options label.on .so-cb::after{content:'✓';position:absolute;top:-2px;left:2px;font-size:12px;font-weight:bold;color:var(--text)}

/* branch */
.branch-actions{display:flex;gap:3px;margin-left:auto}

/* stash */
.stash-item{display:flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;font-size:11px;padding:2px 6px}
.stash-ref{color:var(--yellow);font-weight:700;flex-shrink:0}
.stash-msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* clone */
.clone-dialog{display:none;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:4px;margin-bottom:8px}
.clone-dialog input{width:100%;font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);margin-bottom:6px;font-family:ui-monospace,monospace}
.clone-dialog .clone-row{display:flex;gap:4px}
.clone-dialog .clone-row button{flex:1;font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer}

/* progress */
.progress{display:none;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);font-family:ui-monospace,monospace;font-size:11px;color:var(--blue);white-space:pre-wrap;max-height:200px;overflow-y:auto}

/* empty */
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--base01);font-size:14px;flex-direction:column;gap:8px;padding:20px}

/* btn-mini */
.btn-mini{font-size:9px;padding:1px 6px;border:1px solid var(--border);border-radius:2px;background:var(--card);color:var(--blue);cursor:pointer;white-space:nowrap}
.btn-mini:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-mini.danger{color:var(--red);border-color:var(--red)}
.btn-mini.danger:hover{background:var(--red);color:#fff}
.btn-mini.staged{background:var(--green);color:#fff;border-color:var(--green)}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--base01)}

.hidden{display:none!important}

/* commit graph */
.graph-wrap{position:relative;flex:1;overflow:auto;min-height:0}
.graph-wrap canvas{position:absolute;top:0;left:0;z-index:1;pointer-events:none}
.graph-rows{position:relative;z-index:2;min-height:100%}
.graph-row{display:flex;align-items:center;height:28px;padding:0 8px;cursor:pointer;border-bottom:1px solid var(--border);font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:28px;white-space:nowrap}
.graph-row:hover{background:var(--base2)}
.graph-row .g-hash{color:var(--yellow);font-weight:700;min-width:0;margin-right:4px;flex-shrink:0;font-size:10px}
.graph-row .g-refs{display:flex;gap:2px;margin-right:5px;flex-shrink:0;align-items:center}
.graph-row .g-ref{font-size:9px;padding:1px 4px;border-radius:3px;font-weight:700;line-height:13px}
.graph-row .g-msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.graph-row .g-date{color:var(--base01);font-size:10px;margin-left:6px;flex-shrink:0;text-align:right;min-width:72px}
.graph-row .g-author{color:var(--base01);font-size:10px;margin-left:4px;flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.commit-detail{padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);font-family:ui-monospace,Consolas,monospace}
.commit-detail .cd-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:var(--base01);flex-wrap:wrap}
.commit-detail .cd-file{display:flex;align-items:center;padding:1px 0;gap:6px;font-size:11px}
.commit-detail .cd-file .cd-stat{font-size:10px;min-width:36px;text-align:right}
.cd-added{color:var(--green)}
.cd-deleted{color:var(--red)}

/* branch filter — Solarized checkbox (matches goods/search), tofu border unchanged */
.branch-filter{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:6px;font-size:10px;font-weight:400;vertical-align:middle}
.branch-filter label{font-size:10px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;padding:1px 6px;border-radius:3px;border:1px solid var(--border);white-space:nowrap;user-select:none;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.branch-filter label:hover{background:var(--base2)}
.branch-filter label input{display:none}
.branch-filter label .bf-cb{width:14px;height:14px;border:1.5px solid var(--base01);border-radius:3px;flex-shrink:0;position:relative}
.branch-filter label.on{border-color:var(--green);background:var(--added)}
.branch-filter label.on .bf-cb::after{content:'✓';position:absolute;top:-2px;left:1px;font-size:12px;font-weight:bold;color:var(--text)}
</style>
</head>
<body>
<div class="header" id="header">
  <div class="tofu-bar" id="tofu-bar"></div>
  <span class="branch" id="branch-name"></span>
  <span class="pulls" id="pulls-info"></span>
</div>

<div class="progress" id="progress"></div>

<div class="toolbar" id="toolbar">
  <button id="btn-refresh">刷新</button>
  <button id="btn-stage-all">全部暂存</button>
  <button id="btn-unstage-all">取消暂存</button>
  <span class="sep"></span>
  <button id="btn-pull">拉取</button>
  <button id="btn-push">推送</button>
  <button id="btn-fetch">获取</button>
  <span class="sep"></span>
  <button id="btn-log">日志</button>
  <span class="sep"></span>
  <button id="btn-branch">分支</button>
  <button id="btn-stash">贮藏</button>
  <span class="sep"></span>
  <button id="btn-clone">克隆</button>
  <button id="btn-init" style="display:none;background:var(--green);color:#fff;font-weight:700;">初始化仓库</button>
</div>

<div class="content" id="main-content">
  <div class="clone-dialog" id="clone-dialog">
    <input id="clone-url" placeholder="仓库 URL (https://...)">
    <input id="clone-dir" placeholder="目标目录名（可选）">
    <div class="clone-row">
      <button id="clone-start">开始克隆</button>
      <button id="clone-cancel">取消</button>
    </div>
  </div>

  <div id="status-view">
    <div class="commit-form">
      <textarea id="commit-msg" placeholder="提交信息..."></textarea>
      <div class="commit-right">
        <div class="commit-options">
          <label id="amend-lbl"><input type="checkbox" id="amend-check"><span class="so-cb"></span>amend</label>
          <label id="signoff-lbl"><input type="checkbox" id="signoff-check"><span class="so-cb"></span>sign-off</label>
        </div>
        <button id="btn-commit">提交</button>
      </div>
    </div>

    <div class="section">
      <h3>暂存区 <span class="count" id="staged-count"></span></h3>
      <ul class="file-list" id="staged-list"></ul>
    </div>
    <div class="section">
      <h3>工作区 <span class="count" id="unstaged-count"></span></h3>
      <ul class="file-list" id="unstaged-list"></ul>
    </div>
    <div class="section">
      <h3>未追踪 <span class="count" id="untracked-count"></span></h3>
      <ul class="file-list" id="untracked-list"></ul>
    </div>

    <div class="inline-diff" id="inline-diff">
      <div class="diff-header">
        <span class="dpath" id="inline-diff-path"></span>
        <button class="btn-mini" id="btn-close-diff">关闭</button>
      </div>
      <div class="diff-body" id="inline-diff-body"></div>
    </div>

    <div class="section">
      <h3>提交历史 <span class="count" id="log-count"></span>
        <span class="branch-filter" id="branch-filter">
          <label class="on" id="bf-all-lbl"><input type="checkbox" id="bf-all" checked><span class="bf-cb"></span>全部分支</label>
        </span>
      </h3>
      <div class="graph-wrap" id="graph-wrap">
        <canvas id="graph-canvas"></canvas>
        <div class="graph-rows" id="graph-rows"></div>
      </div>
    </div>
  </div>

  <div id="branch-view" class="hidden">
    <div class="section">
      <h3>分支管理</h3>
      <div style="display:flex;gap:4px;margin-bottom:6px">
        <input id="new-branch-name" placeholder="新分支名..." style="flex:1;font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text)">
        <button id="btn-create-branch" class="btn-mini" style="font-size:11px;padding:3px 10px;">新建</button>
      </div>
      <ul class="file-list" id="branch-list"></ul>
    </div>
  </div>

  <div id="stash-view" class="hidden">
    <div class="section">
      <h3>贮藏列表 <button class="btn-mini" id="btn-stash-save" style="margin-left:8px;">+ 贮藏当前</button></h3>
      <div id="stash-list"></div>
    </div>
  </div>

  <div id="conflict-view" class="hidden">
    <div class="section">
      <h3 style="color:var(--orange)">⚠ 合并冲突</h3>
      <ul class="file-list" id="conflict-list"></ul>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══ BRIDGE + THEME ═══
var bridge = null;
try { bridge = parent.qqqideBridge; } catch(_) {}
if (!bridge) { try { bridge = window.top.qqqideBridge; } catch(_) {} }

(function() {
  // 1. Try parent synchronously (instant, same-origin)
  try {
    var pt = parent.document.documentElement.getAttribute('data-theme');
    if (pt === 'light' || pt === 'dark') document.documentElement.setAttribute('data-theme', pt);
    else document.documentElement.setAttribute('data-theme', 'dark');
  } catch(_) { document.documentElement.setAttribute('data-theme', 'dark'); }
  // 2. Listen for theme-change broadcasts from parent
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqqide-theme-change') {
      document.documentElement.setAttribute('data-theme', (e.data.dark) ? 'dark' : 'light');
    }
  });
  // 3. Also request current theme from parent (in case sync read failed due to timing)
  parent.postMessage({ type: 'qqqide-theme-request' }, '*');
})();

function _esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══ GIT BINARY RESOLUTION ═══
var _gitExePath = '';
var _gitExeResolved = false;

async function _initGitExe() {
  if (_gitExeResolved) return _gitExePath;
  _gitExeResolved = true;
  if (!bridge || !bridge.qz) { _gitExePath = 'git'; return _gitExePath; }
  if (bridge.components && bridge.components.getBin) {
    try {
      var bin = await bridge.components.getBin('git');
      if (bin) {
        var probe = await bridge.qz.spawn({ cmd: bin, args: ['--version'], timeout: 4000, shell: false });
        if (probe.exitCode === 0 && (probe.stdout||'').indexOf('git version') >= 0) {
          _gitExePath = bin; _gitAvailable = true; return _gitExePath;
        }
      }
    } catch(_) {}
  }
  try {
    var probe2 = await bridge.qz.spawn({ cmd: 'git', args: ['--version'], timeout: 4000, shell: false });
    if (probe2.exitCode === 0 && (probe2.stdout||'').indexOf('git version') >= 0) {
      _gitExePath = 'git'; _gitAvailable = true; return _gitExePath;
    }
  } catch(_) {}
  _gitExePath = 'git'; return _gitExePath;
}

// ═══ CORE GIT SPAWN ═══
async function _gitCmd(args, opts) {
  opts = opts || {};
  if (!bridge || !bridge.qz) return { stdout: '', stderr: 'No bridge', exitCode: 1 };
  try {
    var result = await bridge.qz.spawn({
      cmd: _gitExePath || (await _initGitExe()),
      args: args, cwd: opts.cwd || _gitRoot, timeout: opts.timeout || 30000, shell: false
    });
    return result;
  } catch(e) {
    if (_gitExePath.indexOf('/components/git/') >= 0) {
      try { return await bridge.qz.spawn({ cmd: 'git', args: args, cwd: opts.cwd || _gitRoot, timeout: opts.timeout || 30000, shell: false }); } catch(e2) {}
    }
    return { stdout: '', stderr: e.message || String(e), exitCode: 1 };
  }
}

// ═══ GIT STATE ═══
var _gitRoot = '';
var _gitAvailable = null;
var _gitProgressEl = null;
var _autoRefreshTimer = null;
var _currentDiffFile = null;
var _currentDiffStaged = false;
var _allProjects = [];
var _repoStatusMap = {};

// ═══ PROGRESS ═══
function _showProgress(label) {
  _gitProgressEl = document.getElementById('progress');
  _gitProgressEl.style.color = 'var(--blue)';
  _gitProgressEl.textContent = '⏳ ' + label + ' ...';
  _gitProgressEl.style.display = '';
}

function _hideProgress() {
  var el = document.getElementById('progress');
  if (el) el.style.display = 'none';
}

// ═══ GIT AVAILABILITY ═══
async function _checkGitAvailable() {
  if (_gitAvailable !== null) return _gitAvailable;
  await _initGitExe();
  try {
    var r = await _gitCmd(['--version']);
    _gitAvailable = (r.exitCode === 0 && (r.stdout||'').indexOf('git version') >= 0);
  } catch(e) { _gitAvailable = false; }
  if (!_gitAvailable) _showGitUnavailable();
  return _gitAvailable;
}

function _showGitUnavailable() {
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('main-content').innerHTML =
    '<div class="empty"><span style="font-size:48px;">&#128256;</span>' +
    '<span>未检测到 Git</span>' +
    '<span style="font-size:11px;color:var(--base01);">内嵌 git 未安装且系统 PATH 中找不到。</span></div>';
}

// ═══ MULTI-REPO DETECTION ═══
function _getAllProjects() {
  try {
    if (parent.qqqideViewport) {
      var ps = parent.qqqideViewport.getProjects();
      if (ps && ps.length) return ps.map(function(p) {
        return { path: p.path.replace(/\\/g, '/'), name: p.name || p.path.split(/[\\/]/).pop() };
      });
    }
  } catch(_) {}
  return [];
}

async function _scanRepoStatus(projPath) {
  var r = await _gitCmd(['rev-parse', '--show-toplevel'], { cwd: projPath, timeout: 5000 });
  if (r.exitCode !== 0) { _repoStatusMap[projPath] = { isGit: false, badge: 0 }; return; }
  var root = r.stdout.trim().replace(/\\/g, '/');
  var sr = await _gitCmd(['status', '--porcelain'], { cwd: root, timeout: 8000 });
  var lines = (sr.stdout || '').split('\n').filter(Boolean);
  var count = 0;
  for (var i = 0; i < lines.length; i++) { if (lines[i].trim()) count++; }
  var br = await _gitCmd(['rev-parse', '--abbrev-ref', 'HEAD'], { cwd: root, timeout: 5000 });
  _repoStatusMap[projPath] = { isGit: true, root: root, badge: count, branch: (br.stdout || '').trim() || 'HEAD' };
}

async function _detectAllRepos() {
  _allProjects = _getAllProjects();
  if (!_allProjects.length) return;
  var tasks = _allProjects.map(function(p) { return _scanRepoStatus(p.path).catch(function(){}); });
  await Promise.all(tasks);
  for (var i = 0; i < _allProjects.length; i++) {
    var s = _repoStatusMap[_allProjects[i].path];
    if (s && s.isGit) { _gitRoot = s.root; break; }
  }
  if (!_gitRoot && _allProjects.length) _gitRoot = _allProjects[0].path;
}

function _pickRepo(path) {
  var s = _repoStatusMap[path];
  _gitRoot = (s && s.root) ? s.root : path;
  _currentDiffFile = null;
  _expandedCommit = null;
  document.getElementById('inline-diff').style.display = 'none';
  document.getElementById('status-view').classList.remove('hidden');

// ═══ REFRESH STATUS ═══
async function _refreshGitStatus() {
  if (!_gitRoot) return;
  var sr = await _gitCmd(['status', '--porcelain=v2', '--branch']);
  var lines = (sr.stdout || '').split('\n').filter(Boolean);
  var branchName = '', ahead = '', behind = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.startsWith('# branch.head ')) { branchName = line.slice('# branch.head '.length).trim(); if (branchName === '(detached)') branchName = 'HEAD detached'; }
    if (line.startsWith('# branch.ab ')) { var abParts = line.slice('# branch.ab '.length).trim().split(' '); ahead = abParts[0] || ''; behind = abParts[1] || ''; }
  }
  document.getElementById('branch-name').textContent = branchName || 'HEAD detached';
  var pulls = [];
  if (ahead) pulls.push('↑' + ahead); if (behind) pulls.push('↓' + behind);
  document.getElementById('pulls-info').textContent = pulls.join(' ');

  var staged = [], unstaged = [], untracked = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.startsWith('#')) continue;
    if (line.startsWith('?')) { untracked.push({ status: '?', path: line.slice(2) }); }
    else if (line.startsWith('1') || line.startsWith('2')) {
      var parts = line.split(' '), xy = parts[1] || '..', fpath = parts.slice(8).join(' ');
      if (line.startsWith('2')) { var rpaths = parts.slice(9).join(' ').split('\t'); fpath = rpaths[rpaths.length - 1] || fpath; }
      if (xy[0] !== '.') staged.push({ status: xy[0], path: fpath, xy: xy });
      if (xy[1] !== '.') unstaged.push({ status: xy[1], path: fpath, xy: xy });
    } else if (line.startsWith('u')) { var uparts = line.split(' '); unstaged.push({ status: 'U', path: uparts.slice(10).join(' '), xy: 'UU' }); }
  }

  _renderFileList('staged-list', staged, true);
  _renderFileList('unstaged-list', unstaged, false);
  _renderFileList('untracked-list', untracked, false);
  document.getElementById('staged-count').textContent = staged.length ? '(' + staged.length + ')' : '';
  document.getElementById('unstaged-count').textContent = unstaged.length ? '(' + unstaged.length + ')' : '';
  document.getElementById('untracked-count').textContent = untracked.length ? '(' + untracked.length + ')' : '';
  _detectConflicts();
  var total = staged.length + unstaged.length + untracked.length;
  for (var j = 0; j < _allProjects.length; j++) {
    var s2 = _repoStatusMap[_allProjects[j].path];
    if (s2 && s2.root === _gitRoot) { s2.badge = total; s2.branch = branchName; break; }
  }
  _buildRepoUI();
  for (var j = 0; j < _allProjects.length; j++) {
    var pj = _allProjects[j].path, sj = _repoStatusMap[pj];
    if (!sj || !sj.root || sj.root === _gitRoot) continue;
    (function(s, root) {
      _gitCmd(['status', '--porcelain'], { cwd: root, timeout: 5000 }).then(function(r) {
        s.badge = (r.stdout || '').split('\n').filter(Boolean).length;
        _buildRepoUI();
      }).catch(function(){});
    })(sj, sj.root);
  }
}

async function _toggleShowDiff(filePath, isStaged) {

  else { await _gitCmd(['add', '--', filePath]); }
  _refreshGitStatus();

  var nowStaged = !!(sr2.stdout && sr2.stdout.trim());
  _currentDiffFile = filePath; _currentDiffStaged = nowStaged;
  _renderInlineDiff(filePath, nowStaged);

async function _renderInlineDiff(filePath, staged) {
  var args = staged ? ['diff', '--cached', '-U3', '--', filePath] : ['diff', '-U3', '--', filePath];
  var r = await _gitCmd(args);
  var diffEl = document.getElementById('inline-diff'), pathEl = document.getElementById('inline-diff-path'), bodyEl = document.getElementById('inline-diff-body');
  pathEl.textContent = filePath; bodyEl.innerHTML = '';
  var diffOut = r.stdout || '';
  if (!diffOut.trim()) { bodyEl.innerHTML = '<div style="padding:8px;color:var(--base01);">无差异</div>'; }
  else {
    var hunks = _parseHunks(diffOut.split('\n')), html = '';
    for (var h = 0; h < hunks.length; h++) {
      var hunk = hunks[h];
      if (h > 0) html += '<div class="dline hunk-sep"></div>';
      html += '<div class="dline" style="display:flex;align-items:center;">' +
        '<span class="dh">' + _esc(hunk.header || '@@ ...') + '</span>' +
        '<span style="margin-left:auto;"><button class="btn-mini hunk-stage-btn" data-hunk="' + h + '" data-path="' + _esc(filePath) + '">' +
        (staged ? '取消暂存此块' : '暂存此块') + '</button></span></div>';
      for (var i = 0; i < hunk.lines.length; i++) {
        var l = hunk.lines[i], cls = 'dc';
        if (l.startsWith('+')) cls = 'dl'; else if (l.startsWith('-')) cls = 'dr';
        html += '<div class="dline"><span class="' + cls + '">' + _esc(l) + '</span></div>';
      }
    }
    bodyEl.innerHTML = html;
    var btns = bodyEl.querySelectorAll('.hunk-stage-btn');
    for (var b = 0; b < btns.length; b++) {
      (function(btn) {
        btn.addEventListener('click', function(e) { e.stopPropagation();
          var hIdx = parseInt(btn.getAttribute('data-hunk'), 10), fp = btn.getAttribute('data-path');
          _stageHunk(fp, hIdx, hunks[hIdx], btn);
        });
      })(btns[b]);
    }
  }
  diffEl.style.display = '';
}

function _parseHunks(diffLines) {
  var hunks = [], cur = null;
  for (var i = 0; i < diffLines.length; i++) {
    var l = diffLines[i];
    if (l.startsWith('@@')) { if (cur) hunks.push(cur); cur = { header: l, lines: [] }; }
    else if (cur && (l.startsWith('+') || l.startsWith('-') || l.startsWith(' '))) { cur.lines.push(l); }
  }
  if (cur) hunks.push(cur);
  return hunks;
}

async function _stageHunk(filePath, hunkIdx, hunk, btn) {
  btn.disabled = true; btn.textContent = '...';
  var patch = 'diff --git a/' + filePath + ' b/' + filePath + '\n--- a/' + filePath + '\n+++ b/' + filePath + '\n' + hunk.header + '\n';
  for (var i = 0; i < hunk.lines.length; i++) patch += hunk.lines[i] + '\n';
  try {
    var tmpPath = (_gitRoot + '/.git/tmp-hunk.patch').replace(/\\/g, '/');
    if (bridge && bridge.fs && bridge.fs.write) await bridge.fs.write(tmpPath, patch);
    else { btn.disabled = false; btn.textContent = '失败'; return; }
    if (_currentDiffStaged) {
      var r = await _gitCmd(['apply', '--cached', '--reverse', tmpPath]);
      if (r.exitCode !== 0) {
        await _gitCmd(['reset', 'HEAD', '--', filePath]);
        var allHunks = _parseHunks((await _gitCmd(['diff', '-U3', '--', filePath])).stdout.split('\n'));
        for (var h = 0; h < allHunks.length; h++) {
          if (h === hunkIdx) continue;
          var hp = 'diff --git a/' + filePath + ' b/' + filePath + '\n--- a/' + filePath + '\n+++ b/' + filePath + '\n' + allHunks[h].header + '\n';
          for (var li = 0; li < allHunks[h].lines.length; li++) hp += allHunks[h].lines[li] + '\n';
          await bridge.fs.write(tmpPath, hp); await _gitCmd(['apply', '--cached', tmpPath]);
        }
      }
    } else { await _gitCmd(['apply', '--cached', tmpPath]); }
    try { if (bridge && bridge.fs && bridge.fs.delete) bridge.fs.delete(tmpPath); } catch(_) {}
    _refreshGitStatus();
    setTimeout(function() {
      _gitCmd(['diff', '--cached', '--name-only', '--', filePath]).then(function(sr) {
        _renderInlineDiff(filePath, !!(sr.stdout && sr.stdout.trim()));
      });
    }, 300);
  } catch(e) { btn.disabled = false; btn.textContent = '失败'; btn.style.color = 'var(--red)'; }
}

// ═══ BRANCH FILTER ═══
var _branchBuilt = false;
async function _buildBranches() {
  if (_branchBuilt) return;
  var el = document.getElementById('branch-filter'); if (!el) return;
  try {
    var r = await _gitCmd(['branch']);
    var lines = (r.stdout || '').split('\n');
    var branches = [];
    for (var i = 0; i < lines.length; i++) {
      var name = lines[i].replace(/^\*?\s+/, '').trim();
      if (name) branches.push(name);
    }
    if (branches.length === 0) { _branchBuilt = true; return; }
    // Inject branch tofu labels after bf-all-lbl
    var html = '';
    for (var i = 0; i < branches.length; i++) {
      html += '<label class="on"><input type="checkbox" value="' + _escAttr(branches[i]) + '" checked><span class="bf-cb"></span>' + _esc(branches[i]) + '</label>';
    }
    el.insertAdjacentHTML('beforeend', html);

    var allLbl = document.getElementById('bf-all-lbl');
    var all    = document.getElementById('bf-all');
    var lbls   = el.querySelectorAll('label:not(#bf-all-lbl)');

    // _syncAll: if every branch is checked → check "全部分支"; else uncheck it
    function _syncAll() {
      var ok = true;
      for (var j = 0; j < lbls.length; j++) { if (!lbls[j].querySelector('input').checked) { ok = false; break; } }
      all.checked = ok;
      allLbl.classList.toggle('on', ok);
    }
    // _syncBr: set every branch to match "全部分支"
    function _syncBr() {
      var v = all.checked;
      for (var j = 0; j < lbls.length; j++) {
        lbls[j].querySelector('input').checked = v;
        lbls[j].classList.toggle('on', v);
      }
    }

    // "全部分支" — change handler (browser fires this when label click toggles checkbox)
    all.addEventListener('change', function() {
      allLbl.classList.toggle('on', all.checked);
      _syncBr();
      _refreshLogDebounced();
    });
    // Individual branch labels — browser click→input→change, so only need change handler
    for (var j = 0; j < lbls.length; j++) {
      (function(lbl, cb) {
        cb.addEventListener('change', function() {
          lbl.classList.toggle('on', cb.checked);
          _syncAll();
          _refreshLogDebounced();
        });
      })(lbls[j], lbls[j].querySelector('input'));
    }
  } catch(e) {}
  _branchBuilt = true;
}

// ═══ DEBOUNCED LOG REFRESH (blocks UI to prevent race) ═══
var _logBusy = false, _logPending = false;
function _refreshLogDebounced() {
  if (_logBusy) { _logPending = true; return; }
  _logBusy = true; _logPending = false;
  _showProgress('刷新提交历史...');
  _showGitLog().then(function() {
    _hideProgress();
    _logBusy = false;
    if (_logPending) { _logPending = false; _refreshLogDebounced(); }
  }).catch(function() {
    _hideProgress();
    _logBusy = false;
    if (_logPending) { _logPending = false; _refreshLogDebounced(); }
  });
}

// ═══ GIT LOG WITH CANVAS GRAPH ═══
document.getElementById('btn-log').addEventListener('click', function() { _showGitLog(); var el = document.getElementById('graph-wrap'); if (el) el.scrollIntoView({behavior:'smooth',block:'start'}); });

var _commitData = [], _commitGraph = [], _expandedCommit = null;
var _logPalette = ['#859900','#268bd2','#dc322f','#b58900','#6c71c4','#2aa198','#d33682','#cb4b16','#5c8a00','#1a6fb5','#c01c28','#a07400','#5551a4','#1d8e82','#b82e6c','#a04000'];

async function _showGitLog() {
  await _buildBranches();
  var bfAll = document.getElementById('bf-all');
  var useAll = bfAll ? bfAll.checked : true;
  var args = ['log', '--graph', '--date=short', '--format=__G__%H__G__%s__G__%ai__G__%an__G__%D', '-300'];
  if (!useAll) {
    var lbls = document.getElementById('branch-filter').querySelectorAll('label:not(#bf-all-lbl) input:checked');
    for (var bi = 0; bi < lbls.length; bi++) { args.splice(1, 0, lbls[bi].value); }
  } else { args.splice(1, 0, '--all'); }
  var r = await _gitCmd(args);
  var lines = (r.stdout || '').split('\n').filter(Boolean);
  _commitData = []; _commitGraph = []; _expandedCommit = null;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i], idx = line.indexOf('__G__'); if (idx < 0) continue;
    var graph = line.slice(0, idx), data = line.slice(idx + 5), parts = data.split('__G__');
    if (parts.length < 4) continue;
    _commitGraph.push(graph);
    _commitData.push({ hash: parts[0].trim(), msg: parts[1].trim(), date: parts[2].trim(), author: parts[3].trim(), refs: parts[4] ? parts[4].trim() : '' });
  }
  var el = document.getElementById('log-count'); if (el) el.textContent = ' (' + _commitData.length + ')';
  if (_commitData.length === 0) {
    document.getElementById('graph-rows').innerHTML = '<div style="padding:20px;color:var(--base01);text-align:center;">暂无提交</div>'; return;
  }

  var maxCol = 0, colW = 14, rowH = 28;
  for (var i = 0; i < _commitGraph.length; i++) { if (_commitGraph[i].length > maxCol) maxCol = _commitGraph[i].length; }
  var canvasW = (maxCol + 1) * colW + 6, canvasH = _commitData.length * rowH;
  var canvas = document.getElementById('graph-canvas'), dpr = window.devicePixelRatio || 1;
  canvas.width = canvasW * dpr; canvas.height = canvasH * dpr;
  canvas.style.width = canvasW + 'px'; canvas.style.height = canvasH + 'px';
  var ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  _drawGitGraph(ctx, _commitGraph, colW, rowH);

  var rowsEl = document.getElementById('graph-rows'), html = '';
  for (var i = 0; i < _commitData.length; i++) {
    var c = _commitData[i];
    var refsHtml = '';
    if (c.refs) {
      var refTokens = c.refs.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      for (var ri = 0; ri < refTokens.length; ri++) {
        var refStr = refTokens[ri], label = refStr, bg = 'var(--blue)';
        if (refStr.startsWith('tag: ')) { label = refStr.slice(5); bg = 'var(--cyan)'; }
        else if (refStr.startsWith('HEAD -> ')) { label = refStr.slice(7); bg = 'var(--green)'; }
        else if (refStr.indexOf('/') >= 0) { bg = 'var(--orange)'; }
        refsHtml += '<span class="g-ref" style="background:' + bg + ';color:#fff;">' + _esc(label) + '</span>';
      }
    }
    var dateStr = c.date.slice(0, 10);
    html += '<div class="graph-row" style="margin-left:' + canvasW + 'px;" data-i="' + i + '" title="' +
      _esc(c.hash.slice(0,8) + ': ' + c.msg + '\nCtrl+Click: Cherry-pick | Alt+Click: Revert') + '">' +
      '<span class="g-hash">' + _esc(c.hash.slice(0,8)) + '</span>' + refsHtml +
      '<span class="g-msg">' + _esc(c.msg.slice(0, 120)) + '</span>' +
      '<span class="g-author">' + _esc((c.author || '').split(' ')[0].slice(0, 15)) + '</span>' +
      '<span class="g-date">' + _esc(dateStr) + '</span></div>';
  }
  rowsEl.innerHTML = html;
  var rows = rowsEl.querySelectorAll('.graph-row');
  for (var ri = 0; ri < rows.length; ri++) {
    (function(row, hash) {
      row.addEventListener('click', function(e) {
        if (e.ctrlKey || e.metaKey) { _cherryPick(hash); return; }
        if (e.altKey) { _revertCommit(hash); return; }
        _toggleCommitDetail(hash, row);
      });
    })(rows[ri], _commitData[parseInt(rows[ri].getAttribute('data-i'))].hash);
  }
}

function _drawGitGraph(ctx, graphRows, colW, rowH) {
  var palette = _logPalette, hw = colW / 2, hh = rowH / 2;
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  for (var r = 0; r < graphRows.length; r++) {
    var graph = graphRows[r], cy = r * rowH + hh;
    for (var c = 0; c < graph.length; c++) {
      var ch = graph[c]; if (ch === ' ') continue;
      var cx = c * colW + hw, color = palette[c % palette.length];
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
      if (ch === '*') { ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
      else if (ch === '|') { ctx.beginPath(); ctx.moveTo(cx, cy-hh); ctx.lineTo(cx, cy+hh); ctx.stroke(); }
      else if (ch === '/') { ctx.beginPath(); ctx.moveTo(cx+hw, cy-hh); ctx.lineTo(cx-hw, cy+hh); ctx.stroke(); }
      else if (ch === '\\') { ctx.beginPath(); ctx.moveTo(cx-hw, cy-hh); ctx.lineTo(cx+hw, cy+hh); ctx.stroke(); }
      else if (ch === '-' || ch === '_') { ctx.beginPath(); ctx.moveTo(cx-hw, cy); ctx.lineTo(cx+hw, cy); ctx.stroke(); }
    }
  }
}

async function _toggleCommitDetail(hash, rowEl) {
  if (_expandedCommit) {
    var old = document.getElementById('cd-' + _expandedCommit);
    if (old) old.remove();
    if (_expandedCommit === hash) { _expandedCommit = null; return; }
  }
  var detail = document.createElement('div');
  detail.className = 'commit-detail'; detail.id = 'cd-' + hash;
  detail.innerHTML = '<div style="padding:4px;color:var(--base01);">⏳ 加载中...</div>';
  rowEl.insertAdjacentElement('afterend', detail);
  _expandedCommit = hash;
  try {
    var statR = await _gitCmd(['show', '--numstat', '--format=', hash]);
    var statLines = (statR.stdout || '').split('\n').filter(function(l) { return l.trim(); });
    var files = [];
    for (var i = 0; i < statLines.length; i++) {
      var parts = statLines[i].split('\t');
      if (parts.length >= 3) files.push({ added: parts[0], deleted: parts[1], path: parts[2] });
    }
    var totalAdd = 0, totalDel = 0;
    for (var i = 0; i < files.length; i++) {
      if (files[i].added !== '-') totalAdd += parseInt(files[i].added) || 0;
      if (files[i].deleted !== '-') totalDel += parseInt(files[i].deleted) || 0;
    }
    var h = '<div class="cd-header"><span>' + files.length + ' 个文件</span>' +
      '<span class="cd-added">+' + totalAdd + '</span><span class="cd-deleted">-' + totalDel + '</span>' +
      '<span style="margin-left:auto;"><button class="btn-mini cd-view-diff">查看完整 diff</button></span></div>';
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      h += '<div class="cd-file" data-hash="' + _esc(hash) + '" data-path="' + _esc(f.path) + '" style="cursor:pointer;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">' +
        _esc(f.path) + '</span><span class="cd-stat cd-added">+' + f.added + '</span>' +
        '<span class="cd-stat cd-deleted">-' + f.deleted + '</span></div>';
    }
    detail.innerHTML = h;
    var diffBtn = detail.querySelector('.cd-view-diff');
    if (diffBtn) { (function(hv) { diffBtn.addEventListener('click', function(e) { e.stopPropagation(); _showCommitDetail(hv); }); })(hash); }
    var fileEls = detail.querySelectorAll('.cd-file');
    for (var j = 0; j < fileEls.length; j++) {
      (function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          var fp = _gitRoot + '/' + el.getAttribute('data-path');
          var ch = el.getAttribute('data-hash');
          _gitOpenDiff(fp, ch, 'commit');
        });
      })(fileEls[j]);
    }
  } catch(e) { detail.innerHTML = '<div style="padding:4px;color:var(--red);">加载失败</div>'; }
}

async function _showCommitDetail(fullHash) {
  var diffR = await _gitCmd(['show', '--format=%B', fullHash]);
  var firstLine = ((diffR.stdout || '').split('\n')[0] || '').slice(0, 80);
  document.getElementById('branch-name').textContent = 'commit ' + fullHash.slice(0,8) + ': ' + _esc(firstLine);
  var diffEl = document.getElementById('inline-diff'), pathEl = document.getElementById('inline-diff-path'), bodyEl = document.getElementById('inline-diff-body');
  pathEl.textContent = 'commit ' + fullHash.slice(0,8); bodyEl.innerHTML = '';
  var diffOut = diffR.stdout || '';
  if (!diffOut.trim()) { bodyEl.innerHTML = '<div style="padding:8px;color:var(--base01);">无差异</div>'; }
  else {
    var dlines = diffOut.split('\n');
    for (var i = 0; i < dlines.length; i++) {
      var l = dlines[i], div = document.createElement('div'); div.className = 'dline';
      if (l.startsWith('@@') || l.startsWith('diff ') || l.startsWith('index ') || l.startsWith('---') || l.startsWith('+++')) div.innerHTML = '<span class="dh">' + _esc(l) + '</span>';
      else if (l.startsWith('+')) div.innerHTML = '<span class="dl">' + _esc(l) + '</span>';
      else if (l.startsWith('-')) div.innerHTML = '<span class="dr">' + _esc(l) + '</span>';
      else div.innerHTML = '<span class="dc">' + _esc(l) + '</span>';
      bodyEl.appendChild(div);
    }
  }
  diffEl.style.display = '';
  _backToStatus();
}

function _backToStatus() {
  var el = document.getElementById('inline-diff');
  if (el) el.style.display = 'none';
}

function _gitOpenDiff(filePath, commitHash, mode, staged) {
  if (!bridge) { _showProgress('Bridge 未连接 — 请重启 IDE'); return; }
  if (!bridge.git) { _showProgress('bridge.git 未找到 — 请重启 IDE'); return; }
  if (!bridge.git.openDiff || typeof bridge.git.openDiff !== 'function') { _showProgress('bridge.git.openDiff 缺失 — 请重启 IDE'); return; }
  bridge.git.openDiff({
    filePath: filePath,
    projectRoot: _gitRoot,
    commitHash: commitHash || undefined,
    mode: mode || 'working',
    staged: !!staged
  }).catch(function(e) { _showProgress('打开 Diff 失败: ' + (e.message || e)); });
}

async function _cherryPick(hash) {
  _showProgress('Cherry-pick ' + hash.slice(0,8));
  var r = await _gitCmd(['cherry-pick', hash]);
  if (r.exitCode === 0) { _hideProgress(); _refreshGitStatus(); }
  else { _showProgress('✕ 失败'); document.getElementById('progress').style.color = 'var(--red)'; }
}

async function _revertCommit(hash) {
  if (!confirm('Revert ' + hash.slice(0,8) + '？（将创建反向提交）')) return;
  _showProgress('Revert ' + hash.slice(0,8));
  var r = await _gitCmd(['revert', '--no-edit', hash]);
  if (r.exitCode === 0) { _hideProgress(); _refreshGitStatus(); }
  else { _showProgress('✕ 失败'); document.getElementById('progress').style.color = 'var(--red)'; }
}

// ═══ BRANCH MANAGEMENT ═══
document.getElementById('btn-branch').addEventListener('click', _showBranches);

async function _showBranches() {
  _hideAllViews('branch-view');
  var r = await _gitCmd(['branch', '-a', '--format=%(refname:short)|%(objectname:short)|%(upstream:short)|%(authorname)']);
  var list = document.getElementById('branch-list'); list.innerHTML = '';
  var lines = (r.stdout || '').split('\n').filter(Boolean);
  var sr = await _gitCmd(['status', '--porcelain=v2', '--branch']);
  var currentBranch = '';
  (sr.stdout || '').split('\n').forEach(function(l) { if (l.startsWith('# branch.head ')) currentBranch = l.slice('# branch.head '.length).trim(); });
  for (var i = 0; i < lines.length; i++) {
    var parts = lines[i].split('|'), name = parts[0] || '', hash = parts[1] || '', upstream = parts[2] || '', author = parts[3] || '';
    var isCurrent = (name === currentBranch), isRemote = name.startsWith('origin/');
    var li = document.createElement('li'), nameEl = document.createElement('span');
    nameEl.className = 'file-path'; nameEl.textContent = name;
    if (isCurrent) nameEl.style.cssText = 'color:var(--green);font-weight:700;';
    li.appendChild(nameEl);
    li.title = (hash ? hash.slice(0,8) : '') + (upstream ? ' → ' + upstream : '') + (author ? ' (' + author + ')' : '');
    if (isCurrent) { var curBadge = document.createElement('span'); curBadge.style.cssText = 'font-size:9px;color:var(--green);font-weight:700;'; curBadge.textContent = '●'; li.appendChild(curBadge); li.style.cursor = 'default'; }
    else if (!isRemote) {
      var acts = document.createElement('span'); acts.className = 'branch-actions';
      var switchBtn = document.createElement('button'); switchBtn.className = 'btn-mini'; switchBtn.textContent = '切换';
      (function(b) { switchBtn.addEventListener('click', function(e) { e.stopPropagation(); _switchBranch(b); }); })(name);
      acts.appendChild(switchBtn);
      var mergeBtn = document.createElement('button'); mergeBtn.className = 'btn-mini'; mergeBtn.textContent = '合并';
      (function(b) { mergeBtn.addEventListener('click', function(e) { e.stopPropagation(); _mergeBranch(b); }); })(name);
      acts.appendChild(mergeBtn);
      if (name !== 'main' && name !== 'master') {
        var delBtn = document.createElement('button'); delBtn.className = 'btn-mini danger'; delBtn.textContent = '删除';
        (function(b) { delBtn.addEventListener('click', function(e) { e.stopPropagation(); _deleteBranch(b); }); })(name);
        acts.appendChild(delBtn);
      }
      li.appendChild(acts); li.style.cursor = 'default';
    } else { li.style.cursor = 'default'; }
    list.appendChild(li);
  }
}

async function _switchBranch(name) { var r = await _gitCmd(['switch', name]); if (r.exitCode === 0) { _refreshGitStatus(); _showBranches(); } else _showProgress('切换失败'); }
async function _mergeBranch(name) { if (!confirm('将 ' + name + ' 合并到当前分支？')) return; _showProgress('合并中...'); var r = await _gitCmd(['merge', name]); if (r.exitCode === 0) { _hideProgress(); _refreshGitStatus(); _showBranches(); } else _showProgress('✕ 合并失败'); }
async function _deleteBranch(name) { if (!confirm('删除分支 ' + name + '？')) return; var r = await _gitCmd(['branch', '-d', name]); if (r.exitCode === 0) _showBranches(); else _showProgress('删除失败'); }

document.getElementById('btn-create-branch').addEventListener('click', async function() {
  var name = document.getElementById('new-branch-name').value.trim(); if (!name) return;
  var r = await _gitCmd(['checkout', '-b', name]);
  if (r.exitCode === 0) { document.getElementById('new-branch-name').value = ''; _refreshGitStatus(); _showBranches(); }
  else _showProgress('新建失败');
});

// ═══ STASH ═══
document.getElementById('btn-stash').addEventListener('click', function() { _hideAllViews('stash-view'); _showStashes(); });
document.getElementById('btn-stash-save').addEventListener('click', async function() { await _gitCmd(['stash', 'push', '-m', 'Quick stash ' + new Date().toLocaleString()]); _refreshGitStatus(); _showStashes(); });

async function _showStashes() {
  var r = await _gitCmd(['stash', 'list']), list = document.getElementById('stash-list'); list.innerHTML = '';
  var lines = (r.stdout || '').split('\n').filter(Boolean);
  if (lines.length === 0) { list.innerHTML = '<div style="color:var(--base01);font-size:11px;padding:4px 6px;">(空)</div>'; return; }
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i], match = line.match(/^(stash@\{\d+\}):\s*(.*)/), ref = match ? match[1] : line, desc = match ? match[2] : '';
    var item = document.createElement('div'); item.className = 'stash-item';
    item.innerHTML = '<span class="stash-ref">' + _esc(ref) + '</span><span class="stash-msg" title="' + _esc(desc) + '">' + _esc(desc.slice(0, 80)) + '</span>';
    var applyBtn = document.createElement('button'); applyBtn.className = 'btn-mini'; applyBtn.textContent = '应用';
    (function(n) { applyBtn.addEventListener('click', function(e) { e.stopPropagation(); _applyStash(n); }); })(ref); item.appendChild(applyBtn);
    var popBtn = document.createElement('button'); popBtn.className = 'btn-mini'; popBtn.textContent = '弹出';
    (function(n) { popBtn.addEventListener('click', function(e) { e.stopPropagation(); _popStash(n); }); })(ref); item.appendChild(popBtn);
    var dropBtn = document.createElement('button'); dropBtn.className = 'btn-mini danger'; dropBtn.textContent = '丢弃';
    (function(n) { dropBtn.addEventListener('click', function(e) { e.stopPropagation(); _dropStash(n); }); })(ref); item.appendChild(dropBtn);
    list.appendChild(item);
  }
}

async function _applyStash(ref) { var r = await _gitCmd(['stash', 'apply', ref]); if (r.exitCode === 0) { _refreshGitStatus(); _showStashes(); } else _showProgress('✕ stash 应用失败: ' + (r.stderr || '').slice(0, 200)); }
document.getElementById('btn-clone').addEventListener('click', function() { document.getElementById('clone-dialog').style.display = ''; });
document.getElementById('clone-cancel').addEventListener('click', function() { document.getElementById('clone-dialog').style.display = 'none'; document.getElementById('clone-url').value = ''; document.getElementById('clone-dir').value = ''; });
document.getElementById('clone-start').addEventListener('click', async function() {
  var url = document.getElementById('clone-url').value.trim(); if (!url) return;
  var dirName = document.getElementById('clone-dir').value.trim() || url.split('/').pop().replace('.git', '');
  var parentDir = _gitRoot ? _gitRoot.replace(/\/[^\/]+$/, '') : '.';
  var targetPath = parentDir + '/' + dirName;
  _showProgress('克隆 ' + url + ' → ' + targetPath);
  document.getElementById('clone-dialog').style.display = 'none';
  try {
    var result;
    if (bridge && bridge.qz && bridge.qz.spawnStream) {
      result = await bridge.qz.spawnStream({ cmd: _gitExePath || (await _initGitExe()), args: ['clone', '--progress', url, targetPath], cwd: parentDir, timeout: 600000, shell: false },
        function(channel, data) { var lines = data.split('\n').filter(Boolean), last = lines[lines.length-1]||''; var prog = document.getElementById('progress'); if (prog && last.trim()) prog.textContent = '⏳ ' + last.trim().slice(0,160); });
    } else { result = await _gitCmd(['clone', url, targetPath], { timeout: 600000 }); }
    if (result.exitCode === 0) { _hideProgress(); _gitRoot = targetPath; document.getElementById('clone-url').value = ''; document.getElementById('clone-dir').value = ''; _refreshGitStatus(); }
    else { _showProgress('✕ 克隆失败: ' + (result.stderr || '').slice(0,200)); document.getElementById('progress').style.color = 'var(--red)'; }
  } catch(e) { _showProgress('✕ 克隆失败: ' + (e.message || '').slice(0,200)); document.getElementById('progress').style.color = 'var(--red)'; }
});

// ═══ INIT REPO ═══
document.getElementById('btn-init').addEventListener('click', async function() {
  if (!_gitRoot) return;
  var rs = _repoStatusMap[_gitRoot];
  if (rs && rs.isGit) return; // already a repo
  _showProgress('初始化仓库...');
  var r = await _gitCmd(['init'], { cwd: _gitRoot, timeout: 15000 });
  if (r.exitCode === 0) {
    _hideProgress();
    await _scanRepoStatus(_gitRoot);
    _updateToolbarForRepo(true);
    _buildRepoUI();
    _refreshGitStatus().then(function() { _showGitLog(); });
    _startAutoRefresh();
  } else {
    _showProgress('✕ 初始化失败: ' + (r.stderr || r.stdout || '').slice(0, 200));
    document.getElementById('progress').style.color = 'var(--red)';
  }
});

// ═══ CONFLICT ═══
async function _detectConflicts() {
  var r = await _gitCmd(['diff', '--name-only', '--diff-filter=U']), files = (r.stdout || '').split('\n').filter(Boolean);
  var view = document.getElementById('conflict-view'), list = document.getElementById('conflict-list');
  if (files.length === 0) { view.classList.add('hidden'); return; }
  view.classList.remove('hidden'); list.innerHTML = '';
  for (var i = 0; i < files.length; i++) {
    var f = files[i], li = document.createElement('li');
    li.style.cssText = 'display:flex;align-items:center;gap:4px;cursor:default;';
    var pathEl = document.createElement('span'); pathEl.className = 'file-path'; pathEl.textContent = f; pathEl.title = f;
    li.appendChild(pathEl);
    var oursBtn = document.createElement('button'); oursBtn.className = 'btn-mini'; oursBtn.textContent = '用本地';
    (function(file) { oursBtn.addEventListener('click', function(e) { e.stopPropagation(); _resolveConflict(file, 'ours'); }); })(f); li.appendChild(oursBtn);
    var theirsBtn = document.createElement('button'); theirsBtn.className = 'btn-mini'; theirsBtn.textContent = '用远端';
    (function(file) { theirsBtn.addEventListener('click', function(e) { e.stopPropagation(); _resolveConflict(file, 'theirs'); }); })(f); li.appendChild(theirsBtn);
    list.appendChild(li);
  }
}

async function _resolveConflict(filePath, strategy) {
  var r = await _gitCmd(['checkout', '--' + strategy, '--', filePath]);
  if (r.exitCode === 0) { await _gitCmd(['add', '--', filePath]); _refreshGitStatus(); }
  else _showProgress('解决冲突失败');
}

// ═══ HELPERS ═══
function _hideAllViews(showId) {
  var ids = ['branch-view','stash-view','conflict-view'];
  for (var i = 0; i < ids.length; i++) { var el = document.getElementById(ids[i]); if (el) el.classList.add('hidden'); }
  var show = document.getElementById(showId); if (show) show.classList.remove('hidden');
}

// ═══ AUTO-REFRESH ═══
function _startAutoRefresh() {
  if (_autoRefreshTimer) return;
  _autoRefreshTimer = setInterval(function() {
    if (!_gitRoot || !_gitAvailable) return;
    var s = _repoStatusMap[_gitRoot];
    if (!s || !s.isGit) return;
    _refreshGitStatus(); _showGitLog();
  }, 15000);
}

// ═══ INIT ═══
function _init() {
  _checkGitAvailable().then(function(ok) {
    if (!ok) return;
    _detectAndBuild();
  });
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqq-ai-viewport-changed') { _detectAndBuild(); }
  });
}

async function _detectAndBuild() {
  for (var attempt = 0; attempt < 10; attempt++) {
    _allProjects = _getAllProjects();
    if (_allProjects.length > 0) break;
    await new Promise(function(r) { setTimeout(r, 500); });
  }
  if (!_allProjects.length) {
    window.addEventListener('message', function _onVp(e) {
      if (e.data && e.data.type === 'qqq-ai-viewport-changed') {
        window.removeEventListener('message', _onVp);
        _detectAndBuild();
      }
    });
    return;
  }
  await _detectAllRepos();
  _buildRepoUI();
  _buildBranches();
  if (_gitRoot) {
    var s = _repoStatusMap[_gitRoot];
    if (s && s.isGit) {
      _updateToolbarForRepo(true);
      _refreshGitStatus().then(function(){ _showGitLog(); });
      _startAutoRefresh();
    } else {
      _updateToolbarForRepo(false);
      document.getElementById('branch-name').textContent = '';
      document.getElementById('pulls-info').textContent = '';
    }
  } else { document.getElementById('branch-name').textContent = ''; }
}

_init();
</script>
