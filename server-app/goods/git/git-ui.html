<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Git</title>
<style>
:root{--bg:#fdf6e3;--card:#eee8d5;--text:#595754;--border:#d3c6aa;--green:#859900;--red:#dc322f;--yellow:#b58900;--blue:#4078a0;--cyan:#2a9a78;--orange:#cb4b16;--base01:#777;--base1:#a8a6a2;--base2:#eee8d2;--base3:#fdf6e3;--added:rgba(133,153,0,0.08);--deleted:rgba(220,50,47,0.08)}
[data-theme="dark"]{--bg:#1e1e1e;--card:#2a2a2a;--text:#dcd8d0;--border:#333;--green:#8fbc5a;--red:#ff4444;--yellow:#d4a017;--blue:#60a0d0;--cyan:#5ab890;--orange:#e07020;--base01:#97978a;--base1:#6a6660;--base2:#2a2a2a;--base3:#1e1e1e;--added:rgba(143,188,90,0.1);--deleted:rgba(255,68,68,0.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::selection{background:#ffd301;color:#000}

/* header */
.header{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;min-height:30px}
.header .repo{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);cursor:pointer}
.header .repo:hover{color:var(--blue)}
.header .branch{font-size:11px;color:var(--green);font-weight:700;font-family:ui-monospace,monospace}
.header .pulls{font-size:10px;color:var(--blue);font-family:ui-monospace,monospace;margin-left:4px}

/* toolbar */
.toolbar{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;flex-wrap:wrap}
.toolbar button{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer;font-family:ui-monospace,monospace}
.toolbar button:hover{background:var(--base2)}
.toolbar .sep{width:1px;background:var(--border);margin:0 4px}

/* content */
.content{flex:1;overflow:auto;padding:8px 12px}

/* sections */
.section{margin-bottom:10px}
.section h3{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--text);display:flex;align-items:center;gap:6px}
.section h3 .count{font-size:10px;color:var(--base01);font-weight:400}

/* file list */
.file-list{list-style:none}
.file-list li{padding:3px 6px;font-family:ui-monospace,monospace;font-size:12px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:6px}
.file-list li:hover{background:var(--base2)}
.badge{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;color:#fff;flex-shrink:0;min-width:18px;text-align:center}
.badge.M{background:var(--yellow)}
.badge.A{background:var(--green)}
.badge.D{background:var(--red)}
.badge.U{background:var(--orange)}
.badge.R{background:var(--cyan)}
.file-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file-actions{display:flex;gap:3px;margin-left:auto;flex-shrink:0}

/* inline diff */
.inline-diff{margin:4px 0 8px 0;border:1px solid var(--border);border-radius:3px;overflow:hidden;display:none}
.inline-diff .diff-header{padding:4px 8px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:11px}
.inline-diff .diff-header .dpath{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.inline-diff .diff-body{max-height:360px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.4}
.inline-diff .dline{display:flex;min-height:16px;white-space:pre}
.inline-diff .dline .dl{color:var(--green)}
.inline-diff .dline .dr{color:var(--red)}
.inline-diff .dline .dc{color:var(--base01)}
.inline-diff .dline .dh{color:var(--blue);font-weight:700}
.inline-diff .dline .hunk-sep{border-top:1px dashed var(--border);margin:4px 0}

/* commit form */
.commit-form{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.commit-form textarea{width:100%;height:52px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)}
.commit-form .commit-row{display:flex;align-items:center;gap:8px}
.commit-form .commit-row button{padding:4px 14px;border:1px solid var(--border);border-radius:4px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:12px}
.commit-form .commit-row button:hover{opacity:.9}
.commit-options{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--base01);margin-bottom:2px;flex-wrap:wrap}
.commit-options label{display:flex;align-items:center;gap:3px;cursor:pointer}
.commit-options input[type=checkbox]{accent-color:var(--blue)}

/* log */
.log-item{padding:3px 6px;border-bottom:1px solid var(--border);cursor:pointer;font-family:ui-monospace,monospace;font-size:11px}
.log-item:hover{background:var(--base2)}
.log-hash{color:var(--yellow);font-weight:700}
.log-msg{margin-left:6px}
.log-date{color:var(--base01);font-size:10px;margin-left:6px}

/* branch */
.branch-actions{display:flex;gap:3px;margin-left:auto}

/* stash */
.stash-item{display:flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;font-size:11px;padding:2px 6px}
.stash-ref{color:var(--yellow);font-weight:700;flex-shrink:0}
.stash-msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* clone */
.clone-dialog{display:none;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:4px;margin-bottom:8px}
.clone-dialog input{width:100%;font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);margin-bottom:6px;font-family:ui-monospace,monospace}
.clone-dialog .clone-row{display:flex;gap:4px}
.clone-dialog .clone-row button{flex:1;font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer}

/* progress */
.progress{display:none;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);font-family:ui-monospace,monospace;font-size:11px;color:var(--blue);white-space:pre-wrap;max-height:200px;overflow-y:auto}

/* empty */
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--base01);font-size:14px;flex-direction:column;gap:8px;padding:20px}

/* btn-mini */
.btn-mini{font-size:9px;padding:1px 6px;border:1px solid var(--border);border-radius:2px;background:var(--card);color:var(--blue);cursor:pointer;white-space:nowrap}
.btn-mini:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-mini.danger{color:var(--red);border-color:var(--red)}
.btn-mini.danger:hover{background:var(--red);color:#fff}
.btn-mini.staged{background:var(--green);color:#fff;border-color:var(--green)}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--base01)}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="header" id="header">
  <span class="repo" id="repo-name">Git</span>
  <span class="branch" id="branch-name"></span>
  <span class="pulls" id="pulls-info"></span>
</div>

<div class="progress" id="progress"></div>

<div class="toolbar" id="toolbar">
  <button id="btn-refresh">刷新</button>
  <button id="btn-stage-all">全部暂存</button>
  <button id="btn-unstage-all">取消暂存</button>
  <span class="sep"></span>
  <button id="btn-pull">拉取</button>
  <button id="btn-push">推送</button>
  <button id="btn-fetch">获取</button>
  <span class="sep"></span>
  <button id="btn-log">日志</button>
  <button id="btn-branch">分支</button>
  <button id="btn-stash">贮藏</button>
  <span class="sep"></span>
  <button id="btn-clone">克隆</button>
</div>

<div class="content" id="main-content">
  <div class="clone-dialog" id="clone-dialog">
    <input id="clone-url" placeholder="仓库 URL (https://...)">
    <input id="clone-dir" placeholder="目标目录名（可选）">
    <div class="clone-row">
      <button id="clone-start">开始克隆</button>
      <button id="clone-cancel">取消</button>
    </div>
  </div>

  <div id="status-view">
    <div class="commit-form">
      <div class="commit-options">
        <label><input type="checkbox" id="amend-check"> 修正上一次提交 (amend)</label>
        <label><input type="checkbox" id="signoff-check"> 签名 (sign-off)</label>
      </div>
      <textarea id="commit-msg" placeholder="提交信息..."></textarea>
      <div class="commit-row">
        <button id="btn-commit">提交</button>
      </div>
    </div>

    <div class="section">
      <h3>暂存区 <span class="count" id="staged-count"></span></h3>
      <ul class="file-list" id="staged-list"></ul>
    </div>
    <div class="section">
      <h3>工作区 <span class="count" id="unstaged-count"></span></h3>
      <ul class="file-list" id="unstaged-list"></ul>
    </div>
    <div class="section">
      <h3>未追踪 <span class="count" id="untracked-count"></span></h3>
      <ul class="file-list" id="untracked-list"></ul>
    </div>

    <div class="inline-diff" id="inline-diff">
      <div class="diff-header">
        <span class="dpath" id="inline-diff-path"></span>
        <button class="btn-mini" id="btn-close-diff">关闭</button>
      </div>
      <div class="diff-body" id="inline-diff-body"></div>
    </div>
  </div>

  <div id="log-view" class="hidden">
    <h3 style="margin-bottom:6px;">提交历史</h3>
    <div id="log-list"></div>
  </div>

  <div id="branch-view" class="hidden">
    <div class="section">
      <h3>分支管理</h3>
      <div style="display:flex;gap:4px;margin-bottom:6px">
        <input id="new-branch-name" placeholder="新分支名..." style="flex:1;font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text)">
        <button id="btn-create-branch" class="btn-mini" style="font-size:11px;padding:3px 10px;">新建</button>
      </div>
      <ul class="file-list" id="branch-list"></ul>
    </div>
  </div>

  <div id="stash-view" class="hidden">
    <div class="section">
      <h3>贮藏列表 <button class="btn-mini" id="btn-stash-save" style="margin-left:8px;">+ 贮藏当前</button></h3>
      <div id="stash-list"></div>
    </div>
  </div>

  <div id="conflict-view" class="hidden">
    <div class="section">
      <h3 style="color:var(--orange)">⚠ 合并冲突</h3>
      <ul class="file-list" id="conflict-list"></ul>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══ BRIDGE + THEME ═══
var bridge = null;
try { bridge = parent.qqqideBridge; } catch(_) {}

(function() {
  try {
    var pt = parent.document.documentElement.getAttribute('data-theme');
    if (pt) document.documentElement.setAttribute('data-theme', pt);
  } catch(_){}
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'qqqide-theme-change') {
      document.documentElement.setAttribute('data-theme', e.data.theme || '');
    }
  });
})();

function _esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══ GIT BINARY RESOLUTION ═══
var _gitExePath = '';
var _gitExeResolved = false;

async function _initGitExe() {
  if (_gitExeResolved) return _gitExePath;
  _gitExeResolved = true;
  if (!bridge || !bridge.qz) { _gitExePath = 'git'; return _gitExePath; }

  // 1. 尝试 bridge.components.getBin（主进程唯一真理源）
  if (bridge.components && bridge.components.getBin) {
    try {
      var bin = await bridge.components.getBin('git');
      if (bin) {
        var probe = await bridge.qz.spawn({ cmd: bin, args: ['--version'], timeout: 4000 });
        if (probe.exitCode === 0 && (probe.stdout||'').indexOf('git version') >= 0) {
          _gitExePath = bin;
          _gitAvailable = true;
          return _gitExePath;
        }
      }
    } catch(_) {}
  }

  // 2. 尝试系统 PATH
  try {
    var probe2 = await bridge.qz.spawn({ cmd: 'git', args: ['--version'], timeout: 4000 });
    if (probe2.exitCode === 0 && (probe2.stdout||'').indexOf('git version') >= 0) {
      _gitExePath = 'git';
      _gitAvailable = true;
      return _gitExePath;
    }
  } catch(_) {}

  _gitExePath = 'git';
  return _gitExePath;
}

// ═══ CORE GIT SPAWN ═══
async function _gitCmd(args, opts) {
  opts = opts || {};
  if (!bridge || !bridge.qz) return { stdout: '', stderr: 'No bridge', exitCode: 1 };
  try {
    var result = await bridge.qz.spawn({
      cmd: _gitExePath || (await _initGitExe()),
      args: args,
      cwd: opts.cwd || _gitRoot,
      timeout: opts.timeout || 30000
    });
    return result;
  } catch(e) {
    if (_gitExePath.indexOf('/components/git/') >= 0) {
      try {
        return await bridge.qz.spawn({
          cmd: 'git', args: args, cwd: opts.cwd || _gitRoot, timeout: opts.timeout || 30000
        });
      } catch(e2) {}
    }
    return { stdout: '', stderr: e.message || String(e), exitCode: 1 };
  }
}

// ═══ GIT STATE ═══
var _gitRoot = '';
var _gitAvailable = null;
var _gitProgressEl = null;
var _autoRefreshTimer = null;
var _currentDiffFile = null;   // file currently shown in inline diff
var _currentDiffStaged = false;

// ═══ PROGRESS ═══
function _showProgress(label) {
  _gitProgressEl = document.getElementById('progress');
  _gitProgressEl.style.color = 'var(--blue)';
  _gitProgressEl.textContent = '⏳ ' + label + ' ...';
  _gitProgressEl.style.display = '';
}

function _hideProgress() {
  var el = document.getElementById('progress');
  if (el) el.style.display = 'none';
}

// ═══ GIT AVAILABILITY ═══
async function _checkGitAvailable() {
  if (_gitAvailable !== null) return _gitAvailable;
  await _initGitExe();
  try {
    var r = await _gitCmd(['--version']);
    _gitAvailable = (r.exitCode === 0 && (r.stdout||'').indexOf('git version') >= 0);
  } catch(e) { _gitAvailable = false; }
  if (!_gitAvailable) _showGitUnavailable();
  return _gitAvailable;
}

function _showGitUnavailable() {
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('main-content').innerHTML =
    '<div class="empty">' +
    '<span style="font-size:48px;">&#128256;</span>' +
    '<span>未检测到 Git</span>' +
    '<span style="font-size:11px;color:var(--base01);">内嵌 MinGit 未安装且系统 PATH 中找不到 git。</span>' +
    '<span style="font-size:10px;color:var(--base01);">运行: <code style="background:var(--card);padding:2px 6px;border-radius:3px;">python op/components.py ensure git</code></span>' +
    '</div>';
}

// ═══ DETECT GIT ROOT ═══
async function _detectGitRoot() {
  try {
    if (parent.qqqideViewport) {
      var ps = parent.qqqideViewport.getProjects();
      if (ps && ps.length > 0) _gitRoot = ps[0].path.replace(/\\/g, '/');
    }
  } catch(_) {}
  if (!_gitRoot) return;
  var r = await _gitCmd(['rev-parse', '--show-toplevel']);
  if (r.exitCode === 0) {
    _gitRoot = r.stdout.trim().replace(/\\/g, '/');
    document.getElementById('repo-name').textContent = _gitRoot.split('/').pop() || _gitRoot;
  }
}

// ═══ REFRESH STATUS ═══
async function _refreshGitStatus() {
  if (!_gitRoot) { await _detectGitRoot(); }
  if (!_gitRoot) return;

  var sr = await _gitCmd(['status', '--porcelain=v2', '--branch']);
  var lines = (sr.stdout || '').split('\n').filter(Boolean);

  var branchName = '', ahead = '', behind = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.startsWith('# branch.head ')) {
      branchName = line.slice('# branch.head '.length).trim();
      if (branchName === '(detached)') branchName = 'HEAD detached';
    }
    if (line.startsWith('# branch.ab ')) {
      var abParts = line.slice('# branch.ab '.length).trim().split(' ');
      ahead = abParts[0] ? abParts[0] : '';
      behind = abParts[1] ? abParts[1] : '';
    }
  }
  document.getElementById('branch-name').textContent = branchName || 'HEAD detached';

  // Show ahead/behind info
  var pulls = [];
  if (ahead) pulls.push('↑' + ahead);
  if (behind) pulls.push('↓' + behind);
  document.getElementById('pulls-info').textContent = pulls.join(' ');

  var staged = [], unstaged = [], untracked = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.startsWith('#')) continue;
    if (line.startsWith('?')) {
      untracked.push({ status: '?', path: line.slice(2) });
    } else if (line.startsWith('1') || line.startsWith('2')) {
      var parts = line.split(' ');
      var xy = parts[1] || '..';
      var fpath = parts.slice(8).join(' ');
      if (line.startsWith('2')) {
        var rpaths = parts.slice(9).join(' ').split('\t');
        fpath = rpaths[rpaths.length - 1] || fpath;
      }
      if (xy[0] !== '.') staged.push({ status: xy[0], path: fpath, xy: xy });
      if (xy[1] !== '.') unstaged.push({ status: xy[1], path: fpath, xy: xy });
    } else if (line.startsWith('u')) {
      var uparts = line.split(' ');
      unstaged.push({ status: 'U', path: uparts.slice(10).join(' '), xy: 'UU' });
    }
  }

  _renderFileList('staged-list', staged, true);
  _renderFileList('unstaged-list', unstaged, false);
  _renderFileList('untracked-list', untracked, false);
  document.getElementById('staged-count').textContent = staged.length ? '(' + staged.length + ')' : '';
  document.getElementById('unstaged-count').textContent = unstaged.length ? '(' + unstaged.length + ')' : '';
  document.getElementById('untracked-count').textContent = untracked.length ? '(' + untracked.length + ')' : '';

  _detectConflicts();
}

function _renderFileList(elId, files, isStaged) {
  var ul = document.getElementById(elId);
  ul.innerHTML = '';
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var li = document.createElement('li');
    var badge = document.createElement('span');
    badge.className = 'badge ' + (f.status === '?' ? 'U' : f.status);
    badge.textContent = f.status === '?' ? 'U' : f.status;
    var pathEl = document.createElement('span');
    pathEl.className = 'file-path';
    pathEl.textContent = f.path;
    pathEl.title = f.path;
    li.appendChild(badge);
    li.appendChild(pathEl);

    // Actions for unstaged files: discard
    if (!isStaged && f.status !== '?') {
      var acts = document.createElement('span');
      acts.className = 'file-actions';
      var discardBtn = document.createElement('button');
      discardBtn.className = 'btn-mini danger';
      discardBtn.textContent = '丢弃';
      (function(fp) {
        discardBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          _discardFile(fp);
        });
      })(f.path);
      acts.appendChild(discardBtn);
      li.appendChild(acts);
    }
    // Actions for untracked files: stage
    if (f.status === '?') {
      var acts2 = document.createElement('span');
      acts2.className = 'file-actions';
      var addBtn = document.createElement('button');
      addBtn.className = 'btn-mini';
      addBtn.textContent = '跟踪';
      (function(fp) {
        addBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          _gitCmd(['add', '--', fp]).then(function() { _refreshGitStatus(); });
        });
      })(f.path);
      acts2.appendChild(addBtn);
      li.appendChild(acts2);
    }

    // Click: toggle + show diff
    (function(fp, staged) {
      li.addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON') return;
        _toggleShowDiff(fp, staged);
      });
    })(f.path, isStaged);

    ul.appendChild(li);
  }
  if (files.length === 0) {
    var empty = document.createElement('li');
    empty.style.cssText = 'color:var(--base01);cursor:default;';
    empty.textContent = '(空)';
    ul.appendChild(empty);
  }
}

// ═══ FILE DISCARD ═══
async function _discardFile(filePath) {
  if (!confirm('丢弃对 ' + filePath + ' 的修改？（不可恢复）')) return;
  await _gitCmd(['checkout', '--', filePath]);
  _refreshGitStatus();
  document.getElementById('inline-diff').style.display = 'none';
}

// ═══ SHOW DIFF + HUNK STAGING ═══
async function _toggleShowDiff(filePath, isStaged) {
  // Toggle staging
  if (isStaged) {
    await _gitCmd(['reset', 'HEAD', '--', filePath]);
  } else {
    await _gitCmd(['add', '--', filePath]);
  }
  _refreshGitStatus();
  // After toggle, show the appropriate diff
  // Now re-check whether the file is staged
  var sr2 = await _gitCmd(['diff', '--cached', '--name-only', '--', filePath]);
  var nowStaged = !!(sr2.stdout && sr2.stdout.trim());

  _currentDiffFile = filePath;
  _currentDiffStaged = nowStaged;
  _renderInlineDiff(filePath, nowStaged);
}

async function _renderInlineDiff(filePath, staged) {
  var args = staged ? ['diff', '--cached', '-U3', '--', filePath] : ['diff', '-U3', '--', filePath];
  var r = await _gitCmd(args);

  var diffEl = document.getElementById('inline-diff');
  var pathEl = document.getElementById('inline-diff-path');
  var bodyEl = document.getElementById('inline-diff-body');

  pathEl.textContent = filePath;
  bodyEl.innerHTML = '';

  var diffOut = r.stdout || '';
  if (!diffOut.trim()) {
    bodyEl.innerHTML = '<div style="padding:8px;color:var(--base01);">无差异</div>';
  } else {
    // Parse hunks and render with stage buttons
    var hunks = _parseHunks(diffOut.split('\n'));
    var html = '';

    for (var h = 0; h < hunks.length; h++) {
      var hunk = hunks[h];
      // Hunk separator with stage button
      if (h > 0) {
        html += '<div class="dline hunk-sep"></div>';
      }
      // Hunk header line
      html += '<div class="dline" style="display:flex;align-items:center;">' +
        '<span class="dh">' + _esc(hunk.header || '@@ ...') + '</span>' +
        '<span style="margin-left:auto;">' +
        '<button class="btn-mini hunk-stage-btn" data-hunk="' + h + '" data-path="' + _esc(filePath) + '">' +
        (staged ? '取消暂存此块' : '暂存此块') + '</button></span></div>';

      for (var i = 0; i < hunk.lines.length; i++) {
        var l = hunk.lines[i];
        var cls = 'dc';
        if (l.startsWith('+')) cls = 'dl';
        else if (l.startsWith('-')) cls = 'dr';
        html += '<div class="dline"><span class="' + cls + '">' + _esc(l) + '</span></div>';
      }
    }

    bodyEl.innerHTML = html;

    // Wire up hunk stage buttons
    var btns = bodyEl.querySelectorAll('.hunk-stage-btn');
    for (var b = 0; b < btns.length; b++) {
      (function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var hIdx = parseInt(btn.getAttribute('data-hunk'), 10);
          var fp = btn.getAttribute('data-path');
          _stageHunk(fp, hIdx, hunks[hIdx], btn);
        });
      })(btns[b]);
    }
  }
  diffEl.style.display = '';
}

// ─── HUNK PARSING ───
function _parseHunks(diffLines) {
  var hunks = [];
  var cur = null;

  for (var i = 0; i < diffLines.length; i++) {
    var l = diffLines[i];
    if (l.startsWith('@@')) {
      if (cur) hunks.push(cur);
      cur = { header: l, lines: [] };
    } else if (cur && (l.startsWith('+') || l.startsWith('-') || l.startsWith(' '))) {
      cur.lines.push(l);
    }
    // Skip diff/index/---/+++/Binary lines
  }
  if (cur) hunks.push(cur);
  return hunks;
}

// ─── HUNK STAGING ───
// Strategy: write the hunk as a patch, apply --cached (stage) or apply --cached --reverse (unstage)
// Fallback: if patch apply fails, unstage the whole file and re-stage remaining hunks
async function _stageHunk(filePath, hunkIdx, hunk, btn) {
  btn.disabled = true;
  btn.textContent = '...';

  var patch = 'diff --git a/' + filePath + ' b/' + filePath + '\n';
  patch += '--- a/' + filePath + '\n';
  patch += '+++ b/' + filePath + '\n';
  patch += hunk.header + '\n';
  for (var i = 0; i < hunk.lines.length; i++) {
    patch += hunk.lines[i] + '\n';
  }

  try {
    var tmpPath = _gitRoot + '/.git/tmp-hunk.patch';
    var tmpPathNorm = tmpPath.replace(/\\/g, '/');

    // Write patch via bridge.fs (main process atomic write)
    if (bridge && bridge.fs && bridge.fs.write) {
      await bridge.fs.write(tmpPathNorm, patch);
    } else {
      btn.disabled = false;
      btn.textContent = '失败';
      return;
    }

    var r;
    if (_currentDiffStaged) {
      // Unstage: apply reverse to index
      r = await _gitCmd(['apply', '--cached', '--reverse', tmpPathNorm]);
      if (r.exitCode !== 0) {
        // Fallback: unstage entire file, then re-add all hunks except this one
        await _gitCmd(['reset', 'HEAD', '--', filePath]);
        // Re-stage all original hunks except the one being removed
        var allHunks = _parseHunks((await _gitCmd(['diff', '-U3', '--', filePath])).stdout.split('\n'));
        for (var h = 0; h < allHunks.length; h++) {
          if (h === hunkIdx) continue;
          var hp = 'diff --git a/' + filePath + ' b/' + filePath + '\n';
          hp += '--- a/' + filePath + '\n+++ b/' + filePath + '\n';
          hp += allHunks[h].header + '\n';
          for (var li = 0; li < allHunks[h].lines.length; li++) hp += allHunks[h].lines[li] + '\n';
          await bridge.fs.write(tmpPathNorm, hp);
          await _gitCmd(['apply', '--cached', tmpPathNorm]);
        }
      }
    } else {
      // Stage: apply to index
      r = await _gitCmd(['apply', '--cached', tmpPathNorm]);
    }

    // Clean up temp patch
    try { if (bridge && bridge.fs && bridge.fs.delete) bridge.fs.delete(tmpPathNorm); } catch(_) {}

    _refreshGitStatus();
    setTimeout(function() {
      // Re-fetch status to know whether file is now staged
      _gitCmd(['diff', '--cached', '--name-only', '--', filePath]).then(function(sr) {
        var nowStaged = !!(sr.stdout && sr.stdout.trim());
        _renderInlineDiff(filePath, nowStaged);
      });
    }, 300);
  } catch(e) {
    try { if (bridge && bridge.fs && bridge.fs.delete) bridge.fs.delete((_gitRoot + '/.git/tmp-hunk.patch').replace(/\\/g, '/')); } catch(_) {}
    btn.disabled = false;
    btn.textContent = '失败';
    btn.style.color = 'var(--red)';
  }
}

async function _gitLongOp(args, label) {
  _showProgress(label);
  try {
    var useStream = !!(bridge && bridge.qz && bridge.qz.spawnStream);
    var result;
    if (useStream) {
      var lastLine = '';
      result = await bridge.qz.spawnStream({
        cmd: _gitExePath || (await _initGitExe()),
        args: args,
        cwd: _gitRoot,
        timeout: 300000
      }, function(channel, data) {
        var lines = data.split('\n').filter(Boolean);
        for (var i = 0; i < lines.length; i++) {
          var ln = lines[i].trim();
          if (ln) lastLine = ln;
        }
        var prog = document.getElementById('progress');
        if (prog && lastLine) prog.textContent = '⏳ ' + lastLine.slice(0, 160);
      });
    } else {
      result = await _gitCmd(args, { timeout: 300000 });
    }
    if (result.exitCode !== 0 && result.stderr) {
      _showProgress('✕ ' + label + ': ' + (result.stderr || 'failed').slice(0, 200));
      var prog = document.getElementById('progress');
      if (prog) prog.style.color = 'var(--red)';
      return;
    }
    _hideProgress();
    _refreshGitStatus();
  } catch(e) {
    _showProgress('✕ ' + label + ': ' + (e.message || String(e)).slice(0, 200));
    var prog = document.getElementById('progress');
    if (prog) prog.style.color = 'var(--red)';
  }
}

async function _showGitLog() {
  document.getElementById('status-view').classList.add('hidden');
  document.getElementById('log-view').classList.remove('hidden');
  document.getElementById('branch-view').classList.add('hidden');
  document.getElementById('stash-view').classList.add('hidden');

  var r = await _gitCmd(['log', '--graph', '--oneline', '--decorate', '-100', '--format=%H|%D|%s|%ai']);
  var list = document.getElementById('log-list');
  list.innerHTML = '';
  var lines = (r.stdout || '').split('\n').filter(Boolean);

  for (var i = 0; i < lines.length; i++) {
    var rest = lines[i];
    var graphEnd = 0;
    while (graphEnd < rest.length && (' *|/\\'.indexOf(rest[graphEnd]) >= 0)) graphEnd++;
    var graph = rest.slice(0, graphEnd).trim();
    var data = rest.slice(graphEnd);
    var parts = data.split('|');
    var fullHash = parts[0] || '';
    var decorate = parts[1] || '';
    var msg = parts[2] || '';
    var date = parts[3] || '';
    var hash = fullHash.slice(0, 8);

    var item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML =
      '<span style="color:var(--base01);font-size:10px;white-space:pre;margin-right:4px;">' + _esc(graph || '') + '</span>' +
      '<span class="log-hash">' + _esc(hash) + '</span>' +
      (decorate ? '<span style="color:var(--cyan);font-size:10px;margin-left:4px;">' + _esc(decorate) + '</span>' : '') +
      '<span class="log-msg">' + _esc(msg) + '</span>' +
      '<span class="log-date">' + _esc(date) + '</span>';
    item.title = '点击: 查看详情 | Ctrl+点击: Cherry-pick | Alt+点击: Revert';

    (function(h) {
      item.addEventListener('click', function(e) {
        if (e.ctrlKey || e.metaKey) { _cherryPick(h); return; }
        if (e.altKey) { _revertCommit(h); return; }
        _showCommitDetail(h);
      });
    })(fullHash);

    list.appendChild(item);
  }
}

async function _showCommitDetail(fullHash) {
  var r = await _gitCmd(['show', '--stat', '--format=%B', fullHash]);
  var firstLine = ((r.stdout || '').split('\n')[0] || '').slice(0, 80);
  document.getElementById('repo-name').textContent = 'Commit ' + fullHash.slice(0, 8) + ': ' + firstLine;

  var diffR = await _gitCmd(['diff', fullHash + '~1', fullHash]);
  var diffEl = document.getElementById('inline-diff');
  var pathEl = document.getElementById('inline-diff-path');
  var bodyEl = document.getElementById('inline-diff-body');
  pathEl.textContent = 'commit ' + fullHash.slice(0, 8);
  bodyEl.innerHTML = '';
  var diffOut = diffR.stdout || '';
  if (!diffOut.trim()) {
    bodyEl.innerHTML = '<div style="padding:8px;color:var(--base01);">无差异</div>';
  } else {
    var dlines = diffOut.split('\n');
    for (var i = 0; i < dlines.length; i++) {
      var l = dlines[i];
      var div = document.createElement('div');
      div.className = 'dline';
      if (l.startsWith('@@') || l.startsWith('diff ') || l.startsWith('index ') || l.startsWith('---') || l.startsWith('+++')) {
        div.innerHTML = '<span class="dh">' + _esc(l) + '</span>';
      } else if (l.startsWith('+')) {
        div.innerHTML = '<span class="dl">' + _esc(l) + '</span>';
      } else if (l.startsWith('-')) {
        div.innerHTML = '<span class="dr">' + _esc(l) + '</span>';
      } else {
        div.innerHTML = '<span class="dc">' + _esc(l) + '</span>';
      }
      bodyEl.appendChild(div);
    }
  }
  diffEl.style.display = '';

  document.getElementById('log-view').classList.add('hidden');
  document.getElementById('status-view').classList.remove('hidden');
}

async function _cherryPick(hash) {
  _showProgress('Cherry-pick ' + hash.slice(0, 8));
  var r = await _gitCmd(['cherry-pick', hash]);
  if (r.exitCode === 0) { _hideProgress(); _refreshGitStatus(); }
  else { _showProgress('✕ cherry-pick 失败: ' + (r.stderr || '').slice(0, 200)); document.getElementById('progress').style.color = 'var(--red)'; }

async function _revertCommit(hash) {
  if (!confirm('Revert ' + hash.slice(0, 8) + '？（将创建反向提交）')) return;
  _showProgress('Revert ' + hash.slice(0, 8));

}

document.getElementById('btn-branch').addEventListener('click', _showBranches);

async function _showBranches() {
  document.getElementById('status-view').classList.add('hidden');
  document.getElementById('log-view').classList.add('hidden');
  document.getElementById('branch-view').classList.remove('hidden');
  document.getElementById('stash-view').classList.add('hidden');

  var r = await _gitCmd(['branch', '-a', '--format=%(refname:short)|%(objectname:short)|%(upstream:short)|%(authorname)']);
  var list = document.getElementById('branch-list');
  list.innerHTML = '';
  var lines = (r.stdout || '').split('\n').filter(Boolean);

  var sr = await _gitCmd(['status', '--porcelain=v2', '--branch']);
  var currentBranch = '';
  (sr.stdout || '').split('\n').forEach(function(l) {
    if (l.startsWith('# branch.head ')) currentBranch = l.slice('# branch.head '.length).trim();
  });

  for (var i = 0; i < lines.length; i++) {
    var parts = lines[i].split('|');
    var name = parts[0] || '';
    var hash = parts[1] || '';
    var upstream = parts[2] || '';
    var author = parts[3] || '';
    var isCurrent = (name === currentBranch);
    var isRemote = name.startsWith('origin/');

    var li = document.createElement('li');
    var nameEl = document.createElement('span');
    nameEl.className = 'file-path';
    nameEl.textContent = name;
    if (isCurrent) nameEl.style.cssText = 'color:var(--green);font-weight:700;';
    li.appendChild(nameEl);
    li.title = (hash ? hash.slice(0, 8) : '') + (upstream ? ' → ' + upstream : '') + (author ? ' (' + author + ')' : '');

    if (isCurrent) {
      var curBadge = document.createElement('span');
      curBadge.style.cssText = 'font-size:9px;color:var(--green);font-weight:700;';
      curBadge.textContent = '●';
      li.appendChild(curBadge);
      li.style.cursor = 'default';
    } else if (!isRemote) {
      var acts = document.createElement('span');
      acts.className = 'branch-actions';
      var switchBtn = document.createElement('button');
      switchBtn.className = 'btn-mini';
      switchBtn.textContent = '切换';
      (function(b) { switchBtn.addEventListener('click', function(e) { e.stopPropagation(); _switchBranch(b); }); })(name);
      acts.appendChild(switchBtn);
      var mergeBtn = document.createElement('button');
      mergeBtn.className = 'btn-mini';
      mergeBtn.textContent = '合并';
      (function(b) { mergeBtn.addEventListener('click', function(e) { e.stopPropagation(); _mergeBranch(b); }); })(name);
      acts.appendChild(mergeBtn);
      if (name !== 'main' && name !== 'master') {
        var delBtn = document.createElement('button');
        delBtn.className = 'btn-mini danger';
        delBtn.textContent = '删除';
        (function(b) { delBtn.addEventListener('click', function(e) { e.stopPropagation(); _deleteBranch(b); }); })(name);
        acts.appendChild(delBtn);
      }
      li.appendChild(acts);
      li.style.cursor = 'default';
    } else {
      li.style.cursor = 'default';
    }
    list.appendChild(li);
  }
}

async function _switchBranch(name) {
  var r = await _gitCmd(['switch', name]);
  if (r.exitCode === 0) { _refreshGitStatus(); _showBranches(); }
  else _showProgress('切换失败: ' + (r.stderr || '').slice(0, 100));
}

async function _mergeBranch(name) {
  if (!confirm('将 ' + name + ' 合并到当前分支？')) return;
  _showProgress('合并 ' + name + ' ...');
  var r = await _gitCmd(['merge', name]);
  if (r.exitCode === 0) { _hideProgress(); _refreshGitStatus(); _showBranches(); }
  else { _showProgress('✕ 合并失败: ' + (r.stderr || '').slice(0, 200)); document.getElementById('progress').style.color = 'var(--red)'; }
}

async function _deleteBranch(name) {
  if (!confirm('删除分支 ' + name + '？（仅删指针，不删提交）')) return;
  var r = await _gitCmd(['branch', '-d', name]);
  if (r.exitCode === 0) _showBranches();
  else _showProgress('删除失败: ' + (r.stderr || '').slice(0, 100));
}

async function _showStashes() {
  var r = await _gitCmd(['stash', 'list']);
  var list = document.getElementById('stash-list');

  if (lines.length === 0) {
    list.innerHTML = '<div style="color:var(--base01);font-size:11px;padding:4px 6px;">(空)</div>';

  }

    var match = line.match(/^(stash@\{\d+\}):\s*(.*)/);

    var desc = match ? match[2] : '';

    var item = document.createElement('div');
    item.className = 'stash-item';
    item.innerHTML = '<span class="stash-ref">' + _esc(ref) + '</span><span class="stash-msg" title="' + _esc(desc) + '">' + _esc(desc.slice(0, 80)) + '</span>';

    var applyBtn = document.createElement('button');
    applyBtn.className = 'btn-mini'; applyBtn.textContent = '应用';

    var popBtn = document.createElement('button');
    popBtn.className = 'btn-mini'; popBtn.textContent = '弹出';
    (function(n) { popBtn.addEventListener('click', function(e) { e.stopPropagation(); _popStash(n); }); })(ref);
    item.appendChild(popBtn);

    var dropBtn = document.createElement('button');
    dropBtn.className = 'btn-mini danger'; dropBtn.textContent = '丢弃';
    (function(n) { dropBtn.addEventListener('click', function(e) { e.stopPropagation(); _dropStash(n); }); })(ref);
    item.appendChild(dropBtn);

    list.appendChild(item);
  }
}

// ═══ CONFLICT DETECTION ═══
async function _detectConflicts() {
  var r = await _gitCmd(['diff', '--name-only', '--diff-filter=U']);
  var files = (r.stdout || '').split('\n').filter(Boolean);
  var view = document.getElementById('conflict-view');
  var list = document.getElementById('conflict-list');
  if (files.length === 0) { view.classList.add('hidden'); return; }
  view.classList.remove('hidden');
  list.innerHTML = '';
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var li = document.createElement('li');
    li.style.cssText = 'display:flex;align-items:center;gap:4px;cursor:default;';
    var pathEl = document.createElement('span');
    pathEl.className = 'file-path';
    pathEl.textContent = f;
    pathEl.title = f;
    li.appendChild(pathEl);

    var oursBtn = document.createElement('button');
    oursBtn.className = 'btn-mini'; oursBtn.textContent = '用本地';
    (function(file) { oursBtn.addEventListener('click', function(e) { e.stopPropagation(); _resolveConflict(file, 'ours'); }); })(f);
    li.appendChild(oursBtn);

    var theirsBtn = document.createElement('button');
    theirsBtn.className = 'btn-mini'; theirsBtn.textContent = '用远端';
    (function(file) { theirsBtn.addEventListener('click', function(e) { e.stopPropagation(); _resolveConflict(file, 'theirs'); }); })(f);
    li.appendChild(theirsBtn);

    list.appendChild(li);
  }
}

async function _resolveConflict(filePath, strategy) {
  var r = await _gitCmd(['checkout', '--' + strategy, '--', filePath]);
  if (r.exitCode === 0) {
    await _gitCmd(['add', '--', filePath]);
    _refreshGitStatus();
  } else _showProgress('解决冲突失败: ' + (r.stderr || '').slice(0, 100));
}

// ═══ BACK TO STATUS ═══
document.getElementById('repo-name').addEventListener('click', function() {
  document.getElementById('status-view').classList.remove('hidden');
  document.getElementById('log-view').classList.add('hidden');
  document.getElementById('branch-view').classList.add('hidden');
  document.getElementById('stash-view').classList.add('hidden');
  document.getElementById('repo-name').textContent = _gitRoot.split('/').pop() || 'Git';
});

// ═══ AUTO-REFRESH ═══
function _startAutoRefresh() {
  if (_autoRefreshTimer) return;
  _autoRefreshTimer = setInterval(function() {
    if (_gitRoot && _gitAvailable) _refreshGitStatus();
  }, 15000);
}

// ═══ INIT ═══
function _init() {
  _detectGitRoot().then(function() {
    if (_gitRoot) {
      _checkGitAvailable().then(function(ok) {
        if (ok) { _refreshGitStatus(); _startAutoRefresh(); }
      });
    } else {
      document.getElementById('repo-name').textContent = '非 Git 仓库';
      document.getElementById('branch-name').textContent = '';
    }
  });
}

_init();
</script>
</body>
