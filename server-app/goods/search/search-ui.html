<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Search</title>
<style>
:root {
  --bg:#fdf6e3;--bg2:#eee8d5;--tx:#7a7874;--tx2:#97978a;--tx3:#a8a6a2;--bd:#eee8d5;--bd2:#a8a6a2;
  --yel:#b58900;--ora:#cb4b16;--red:#dc322f;--blu:#e8a030;--grn:#859900;
}
[data-theme="dark"] {--bg:#1e1e1e;--bg2:#2a2a2a;--tx:#dcd8d0;--tx2:#a8a49c;--tx3:#6a6660;--bd:#333;--bd2:#555}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font:13px Tahoma,sans-serif;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
::selection{background:rgb(255,211,2)!important;color:#000!important}
input,select{-webkit-user-select:text;user-select:text}

.tb{padding:6px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.tb-r{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.tb-r:last-child{margin-bottom:0}
.inp{flex:1;height:26px;padding:2px 7px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);color:var(--tx);font:13px Consolas,monospace;outline:none}
.inp:focus{border-color:var(--blu)}.inp::placeholder{color:var(--tx3);opacity:.22}
.scope{flex:1;height:24px;padding:2px 6px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);color:var(--tx);font:11px Consolas,monospace;outline:none}
.scope:focus{border-color:var(--blu)}.scope::placeholder{color:var(--tx3);opacity:.22}
.lbl{font-size:11px;color:var(--tx3);white-space:nowrap;min-width:28px}
.tog{width:26px;height:26px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font:bold 12px Tahoma;text-align:center;cursor:pointer;flex-shrink:0;line-height:26px}
.tog:hover{background:var(--bg2);color:var(--tx)}.tog.on{background:var(--blu);color:#1e1e1e;border-color:var(--blu)}
.btn{height:26px;padding:0 10px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx);font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}.btn.pri{background:var(--blu);color:#1e1e1e;border-color:var(--blu)}.btn.pri:hover{opacity:.9}
.chk{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:3px;margin-left:4px;cursor:pointer;white-space:nowrap}
.chk input{cursor:pointer}
.sort{height:24px;padding:0 4px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;outline:none}

.st{padding:3px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx2);flex-shrink:0;min-height:20px;display:flex;align-items:center;gap:6px}
.st .n{font-weight:bold;color:var(--tx)}
.rs{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0}
.rs::-webkit-scrollbar{width:5px}.rs::-webkit-scrollbar-thumb{background:var(--tx3);border-radius:2px}
.fg{margin-bottom:1px}
.fh{display:flex;align-items:center;padding:3px 10px;cursor:pointer;font-size:12px;gap:5px;background:var(--bg);user-select:none}
.fh:hover{background:var(--bg2)}.fh .ar{width:12px;font-size:10px;color:var(--tx3);flex-shrink:0}
.fh .fn{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .fp{color:var(--tx3);font-size:11px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fh .fp .pq{color:var(--red)}.fh .fc{color:var(--tx3);font-size:11px;flex-shrink:0}
.ceb{display:flex;gap:4px;padding:2px 10px;border-bottom:1px solid var(--bd)}
.ceb .cbtn{width:20px;height:20px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font-size:12px;line-height:18px;text-align:center;cursor:pointer;padding:0}
.ceb .cbtn:hover{background:var(--bg2);color:var(--tx)}
.ml{display:flex;align-items:baseline;padding:1px 4px 1px 6px;cursor:pointer;font:12px Consolas,monospace;line-height:1.45;min-height:18px}
.ml:hover{background:var(--bg2)}.ml .ln{width:36px;text-align:right;color:var(--tx3);margin-right:6px;flex-shrink:0;font:italic 11px Consolas,monospace}
.ml .ct{white-space:pre;overflow:hidden;text-overflow:ellipsis;flex:1}
.ml .ct .hl{background:#ffd301;color:#1e1e1e;border-radius:1px;padding:0 1px}
.ml .ct .pq{color:var(--red)}.fg.closed .ml{display:none}
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx3);gap:8px}
.emp .ic{font-size:42px;opacity:.25}.emp .ht{font-size:13px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100%">
  <div class="tb">
    <div class="tb-r"><input class="inp" id="q" placeholder="搜索..." autofocus spellcheck="false"><button class="tog" id="brx" title="正则">.*</button><button class="tog" id="bcs" title="大小写">Aa</button><button class="tog" id="bww" title="全字">ab</button></div>
    <div class="tb-r"><input class="inp" id="rp" placeholder="替换..." spellcheck="false"><button class="btn pri" id="bra">全部替换</button></div>
    <div class="tb-r"><span class="lbl">范围</span><input class="scope" id="sp" placeholder="搜索路径（点 🔍 自动填入）" spellcheck="false"></div>
    <div class="tb-r"><span class="lbl">仅限</span><input class="scope" id="inc" placeholder="*.js, src/" spellcheck="false"><span class="lbl" style="margin-left:8px">排除</span><input class="scope" id="exc" spellcheck="false"><span class="lbl" style="margin-left:8px">排序</span><select class="sort" id="srt"><option value="mtime" selected>修改时间↓</option><option value="mtime-asc">修改时间↑</option><option value="count">匹配数</option><option value="path">路径</option><option value="path-desc">路径倒序</option><option value="birthtime">创建时间↓</option><option value="birthtime-asc">创建时间↑</option><option value="size">大小↓</option><option value="size-asc">大小↑</option></select></div>
    <div class="tb-r"><label class="chk" id="lgi"><input type="checkbox" id="cgi"> 尊重 .gitignore</label></div>
  </div>
  <div class="st" id="st"><span id="stt">键入关键字开始搜索</span></div>
  <div class="rs" id="rc"><div class="ceb" id="ceb" style="display:none"><button class="cbtn" id="cba" title="全部展开">⊞</button><button class="cbtn" id="cbf" title="全部折叠">⊟</button></div><div class="emp" id="em"><span class="ic">🔍</span><span class="ht">键入关键字开始搜索</span></div></div>
</div>

<script>
(function(){
var INPS=[document.getElementById('q'),document.getElementById('rp'),document.getElementById('sp'),
  document.getElementById('inc'),document.getElementById('exc')];
var Q=INPS[0],RP=INPS[1],SP=INPS[2],IC=INPS[3],EX=INPS[4];
var bri=window.parent&&window.parent.qqqideBridge;
if(!bri)setTimeout(function(){bri=window.parent&&window.parent.qqqideBridge;},200);

// ── dropdown: rendered in PARENT window body (escapes iframe overflow:hidden clip) ──
var _openFid=null,_sel=-1;
var _hist=[[],[],[],[],[]];  // 5 inputs, JS arrays
// Seed fake data
var FAKE=[];
for(var i=1;i<=15;i++)FAKE.push('搜索历史示例条目 '+i);
for(var i=0;i<5;i++)if(!_hist[i].length)_hist[i]=FAKE.slice();

function _getPDD(){
  var d=window.parent.document.getElementById('srch-hist-dd');
  if(!d){
    d=window.parent.document.createElement('div');
    d.id='srch-hist-dd';
    d.style.cssText='position:fixed;z-index:9999999;background:var(--bg2,#eee8d5);border:1px solid var(--blu,#e8a030);border-radius:3px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-height:260px;overflow-y:auto;display:none;min-width:200px;font:13px Tahoma,sans-serif;';
    window.parent.document.body.appendChild(d);
  }
  return d;
}

function _show(fid){
  var d=_getPDD(),inp=INPS[fid],vals=_hist[fid];
  if(!vals||!vals.length)vals=FAKE;
  if(!vals.length)return;
  var ifr=window.frameElement;if(!ifr)return;
  var ir=ifr.getBoundingClientRect(),rr=inp.getBoundingClientRect();
  d.style.top=(ir.top+rr.bottom+2)+'px';
  d.style.left=(ir.left+rr.left)+'px';
  d.style.minWidth=rr.width+'px';
  d.innerHTML='';_sel=-1;
  for(var i=0;i<vals.length;i++){
    var r=document.createElement('div');
    r.style.cssText='padding:5px 10px;font:13px Consolas,monospace;color:var(--tx,#7a7874);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    r.textContent=vals[i].slice(0,120);
    r.onmouseenter=function(){this.style.background='var(--blu,#e8a030)';this.style.color='#1e1e1e'};
    r.onmouseleave=function(){this.style.background='';this.style.color='var(--tx,#7a7874)'};
    r.onmousedown=(function(v){return function(e){e.preventDefault();INPS[fid].value=v;_add(fid,v);_close();if(fid===0)dos();else trg()}})(vals[i]);
    d.appendChild(r);
  }
  d.style.display='';_openFid=fid;
}
function _close(){if(_openFid!==null){_getPDD().style.display='none';_openFid=null}}
function _nav(dir){
  if(_openFid===null)return;var d=_getPDD();_sel+=dir;
  if(_sel<0)_sel=_hist[_openFid].length-1;if(_sel>=_hist[_openFid].length)_sel=0;
  var rs=d.querySelectorAll('div');for(var i=0;i<rs.length;i++){rs[i].style.background=i===_sel?'var(--blu,#e8a030)':'';rs[i].style.color=i===_sel?'#1e1e1e':'var(--tx,#7a7874)'}
}
function _pick(){
  if(_openFid===null||_sel<0)return;
  INPS[_openFid].value=_hist[_openFid][_sel];_add(_openFid,_hist[_openFid][_sel]);_close();if(_openFid===0)dos();else trg();
}
function _add(fid,v){if(!v||!v.trim())return;v=v.trim();
  var h=_hist[fid];h=h.filter(function(x){return x!==v});h.unshift(v);if(h.length>15)h.length=15}

INPS.forEach(function(inp,fid){
  inp.addEventListener('focus',function(){_show(fid)});
  inp.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==_getPDD())_close()},150)});
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();_nav(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();_nav(-1)}
    else if(e.key==='Enter'){if(_openFid!==null){e.preventDefault();_pick()}else{if(fid===0)dos();else trg()}}
    else if(e.key==='Escape'){_close()}
    else _close()
  });
  inp.addEventListener('input',function(){_close()});
});

// cleanup on page unload
window.addEventListener('beforeunload',function(){try{var d=window.parent.document.getElementById('srch-hist-dd');if(d)d.remove()}catch(e){}});

// ── search engine ──
var _rx=false,_cs=false,_ww=false,_tmr=null,_last=null,_lastQ='',_hl=null,_scopePath='';
var SRT=document.getElementById('srt'),CGI=document.getElementById('cgi'),
  BRX=document.getElementById('brx'),BCS=document.getElementById('bcs'),BWW=document.getElementById('bww'),
  BRA=document.getElementById('bra'),ST=document.getElementById('st'),STT=document.getElementById('stt'),
  RC=document.getElementById('rc'),EM=document.getElementById('em'),CEB=document.getElementById('ceb');

SRT.onchange=function(){if(_last)rdr(_last)};CGI.onchange=function(){trg()};
function tg(b,k){return function(){if(k==='rx')_rx=!_rx;if(k==='cs')_cs=!_cs;if(k==='ww')_ww=!_ww;
  b.classList.toggle('on',k==='rx'?_rx:k==='cs'?_cs:_ww);trg()}}
BRX.onclick=tg(BRX,'rx');BCS.onclick=tg(BCS,'cs');BWW.onclick=tg(BWW,'ww');
function trg(){if(_tmr)clearTimeout(_tmr);_tmr=setTimeout(dos,200)}
Q.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();if(_tmr)clearTimeout(_tmr);dos()}};
IC.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();dos()}};
EX.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();dos()}};
SP.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();_scopePath=SP.value.trim();dos()}};
document.onkeydown=function(e){
  if(e.altKey&&e.key==='r'){e.preventDefault();BRX.click()}if(e.altKey&&e.key==='c'){e.preventDefault();BCS.click()}if(e.altKey&&e.key==='w'){e.preventDefault();BWW.click()}
  if(e.key==='Escape'){Q.value='';dos()}
};
document.getElementById('cba').onclick=function(){var fgs=RC.querySelectorAll('.fg');for(var i=0;i<fgs.length;i++)fgs[i].classList.remove('closed');var ars=RC.querySelectorAll('.fh .ar');for(var i=0;i<ars.length;i++)ars[i].textContent='▼'}
document.getElementById('cbf').onclick=function(){var fgs=RC.querySelectorAll('.fg');for(var i=0;i<fgs.length;i++)fgs[i].classList.add('closed');var ars=RC.querySelectorAll('.fh .ar');for(var i=0;i<ars.length;i++)ars[i].textContent='▶'}

async function dos(){
  var q=Q.value;if(!q){clr();STT.textContent='键入关键字开始搜索';return}
  var sp=SP.value.trim();
  if(!sp){try{var vp=window.parent&&window.parent.qqqideViewport;if(vp){var m=vp.getMainProject();if(m){sp=m.path;SP.value=sp}}}catch(_){}}
  if(!sp){STT.textContent='⚠️ 请指定搜索范围';return}
  _scopePath=sp;_add(0,q);_add(2,sp);_add(3,IC.value);_add(4,EX.value);
  if(_rx){try{_hl=new RegExp(q,_cs?'g':'gi');Q.classList.remove('err')}catch(e){Q.classList.add('err');STT.textContent='⚠️ 无效正则: '+e.message;_hl=null;return}}
  else{Q.classList.remove('err');var e2=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)e2='\\b'+e2+'\\b';_hl=new RegExp(e2,_cs?'g':'gi')}
  STT.textContent='🔍 搜索中...';
  try{if(!bri)bri=window.parent&&window.parent.qqqideBridge;if(!bri||!bri.search){STT.textContent='⚠️ 搜索引擎未就绪';return}
    var r=await bri.search.query({query:q,searchPath:sp,isRegex:_rx,caseSensitive:_cs,wholeWord:_ww,
      includePattern:IC.value.trim()||undefined,excludePattern:EX.value.trim()||undefined,
      contextLines:0,maxResults:5000,timeoutMs:60000,respectGitignore:CGI.checked});
    if(r.error){STT.textContent='⚠️ '+r.error;clr();return}
    _last=r;_lastQ=q;rdr(r);
    var fc=0;for(var i=0;i<r.results.length;i++){if(i===0||r.results[i].file!==r.results[i-1].file)fc++}
    ST.innerHTML='<span class="n">'+r.total+' 个匹配</span> · '+fc+' 个文件 <span style="color:var(--tx3);font-size:10px">('+r.elapsed+'ms / ripgrep / '+r.filesScanned+' 文件)</span>'+(r.truncated?' · <span style="color:var(--ora)">已截断</span>':'');
  }catch(e){STT.textContent='⚠️ 搜索出错: '+(e.message||e)}
}
function clr(){RC.innerHTML='';CEB.style.display='none';RC.appendChild(CEB);EM.style.display='';RC.appendChild(EM);_last=null}
function rdr(d){
  RC.innerHTML='';CEB.style.display='';RC.appendChild(CEB);EM.style.display='none';
  if(!d.results||d.results.length===0){EM.querySelector('.ht').textContent='无匹配结果';CEB.style.display='none';EM.style.display='';RC.appendChild(EM);return}
  var grp=new Map();
  for(var i=0;i<d.results.length;i++){var r=d.results[i];if(!grp.has(r.file))grp.set(r.file,[]);grp.get(r.file).push(r)}
  var sg=Array.from(grp.entries()),fs=d.fileStats||{},sm=SRT.value;
  sg.sort(function(a,b){
    if(sm==='path')return a[0].localeCompare(b[0]);if(sm==='path-desc')return b[0].localeCompare(a[0]);
    if(sm==='count')return b[1].length-a[1].length||a[0].localeCompare(b[0]);
    if(sm==='size')return(fs[b[0]]&&fs[b[0]].size||0)-(fs[a[0]]&&fs[a[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='size-asc')return(fs[a[0]]&&fs[a[0]].size||0)-(fs[b[0]]&&fs[b[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='mtime-asc')return(fs[a[0]]&&fs[a[0]].mtime||0)-(fs[b[0]]&&fs[b[0]].mtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime')return(fs[b[0]]&&fs[b[0]].birthtime||0)-(fs[a[0]]&&fs[a[0]].birthtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime-asc')return(fs[a[0]]&&fs[a[0]].birthtime||0)-(fs[b[0]]&&fs[b[0]].birthtime||0)||a[0].localeCompare(b[0]);
    return(fs[b[0]]&&fs[b[0]].mtime||0)-(fs[a[0]]&&fs[a[0]].mtime||0)||a[0].localeCompare(b[0]);
  });
  var frag=document.createDocumentFragment();
  for(var gi=0;gi<sg.length;gi++){
    var fp2=sg[gi][0],ms=sg[gi][1],fg=document.createElement('div');fg.className='fg';
    var fh=document.createElement('div'),ar=document.createElement('span'),fnE=document.createElement('span'),fpp=document.createElement('span'),fc2=document.createElement('span');
    fh.className='fh';ar.className='ar';ar.textContent='▶';fnE.className='fn';fnE.textContent=bn(fp2);
    fpp.className='fp';fpp.innerHTML='/'+pq(dn(fp2));fpp.title=fp2;fc2.className='fc';fc2.textContent=ms.length+' 匹配';
    fh.appendChild(ar);fh.appendChild(fnE);fh.appendChild(fpp);fh.appendChild(fc2);
    var fb=document.createElement('div');
    for(var k=0;k<ms.length;k++){
      var ml=document.createElement('div'),m2=ms[k];ml.className='ml';
      ml.innerHTML='<span class="ln">'+m2.line+'</span><span class="ct">'+pq(hlm(m2.text))+'</span>';
      ml.onclick=(function(f,l,c){return function(){opn(f,l,c)}})(fp2,m2.line,m2.col);fb.appendChild(ml);
    }
    fg.appendChild(fh);fg.appendChild(fb);
    fh.onclick=function(_fg,_ar){return function(){_fg.classList.toggle('closed');_ar.textContent=_fg.classList.contains('closed')?'▶':'▼'}}(fg,ar);
    fg.classList.add('closed');frag.appendChild(fg);
  }
  RC.appendChild(frag)
}
function hlm(t){if(!_hl)return eh(t);try{_hl.lastIndex=0;var p=[],li=0,m;while((m=_hl.exec(t))!==null){if(m.index>li)p.push(eh(t.slice(li,m.index)));p.push('<span class="hl">'+eh(m[0])+'</span>');li=m.index+m[0].length;if(m[0].length===0)_hl.lastIndex++}if(li<t.length)p.push(eh(t.slice(li)));return p.join('')}catch(_){return eh(t)}}
function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pq(s){return s.replace(/([qf]\d+)\./g,'<span class="pq">$1.</span>')}
function bn(p){var x=p.replace(/\\/g,'/').split('/');return x[x.length-1]||p}
function dn(p){var n=p.replace(/\\/g,'/');var i=n.lastIndexOf('/');return i>0?n.slice(0,i):''}
function opn(fp,l,c){try{var abs=_scopePath?(_scopePath.replace(/[\\/]$/,'')+'/'+fp.replace(/^[\\/]+/,'').replace(/\\/g,'/')):fp;window.parent._nextPaneOpts={line:l,col:c};window.parent.document.dispatchEvent(new CustomEvent('qqq-file-open',{detail:{path:abs}}))}catch(e){console.error('[search] openFile failed:',e)}}
BRA.onclick=async function(){
  if(!_last||!_last.results||_last.results.length===0)return;var rt=RP.value;
  if(!bri)bri=window.parent&&window.parent.qqqideBridge;if(!bri||!bri.search)return;
  var q2=_lastQ,p2=_rx?q2:q2.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)p2='\\b'+p2+'\\b';
  var fl=_cs?'g':'gi',re;try{re=new RegExp(p2,fl)}catch(_){return}
  var reps=[];
  for(var i=0;i<_last.results.length;i++){var r=_last.results[i];re.lastIndex=0;var m;while((m=re.exec(r.text))!==null){reps.push({file:r.file,line:r.line,col:m.index+1,matchLen:m[0].length,replacement:_rx?r.text.slice(m.index,m.index+m[0].length).replace(re,rt):rt});if(m[0].length===0)break}}
  if(reps.length===0)return;
  STT.textContent='🔄 替换中... ('+reps.length+' 处)';
  try{var res=await bri.search.replace({replacements:reps});STT.textContent='✅ 已替换 '+res.replaced+' 处';_add(1,rt);setTimeout(dos,500)}catch(e){STT.textContent='⚠️ 替换出错: '+(e.message||e)}
};
(function ts(){try{var pt=window.parent.document.documentElement.getAttribute('data-theme');if(pt)document.documentElement.setAttribute('data-theme',pt)}catch(_){}})();
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='qqqide-theme-change'){var t=e.data.theme||e.data.dark;if(t!==undefined)document.documentElement.setAttribute('data-theme',t?'dark':'');else ts()}
  if(e.data&&e.data.type==='qqqide-search-set-scope'){SP.value=e.data.path||'';_scopePath=SP.value.trim();if(Q.value)trg();Q.focus()}
});
setTimeout(function(){try{var vp=window.parent&&window.parent.qqqideViewport;if(vp&&!SP.value){var m=vp.getMainProject();if(m)SP.value=m.path}}catch(_){}},100);
})();
</script>
</body>
</html>
