<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Search</title>
<style>
:root {
  --base03:#002d20;--base02:#07362e;--base01:#777;--base00:#7a7874;--base0:#7a7874;--base1:#a8a6a2;
  --base2:#eee8d5;--base3:#fdf6e3;--yellow:#b58900;--orange:#cb4b16;--red:#dc322f;
  --magenta:#c83070;--violet:#7e6c8e;--blue:#e8a030;--cyan:#2a9a78;--green:#859900;
  --bg:#fdf6e3;--bg2:#eee8d5;--tx:#7a7874;--tx2:#97978a;--tx3:#a8a6a2;--bd:#eee8d5;--bd2:#a8a6a2;
}
[data-theme="dark"] {
  --bg:#1e1e1e;--bg2:#2a2a2a;--tx:#dcd8d0;--tx2:#a8a49c;--tx3:#6a6660;--bd:#333;--bd2:#555;
}
*{box-sizing:border-box;margin:0;padding:0;forced-color-adjust:none}
html,body{font:13px Tahoma,sans-serif;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
::selection{background:rgb(255,211,2)!important;color:#000!important}
input,select,textarea{-webkit-user-select:text;user-select:text}

/* toolbar */
.tb{padding:6px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.tb-r{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.tb-r:last-child{margin-bottom:0}
.inp{flex:1;height:26px;padding:2px 7px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);color:var(--tx);font:13px Consolas,monospace;outline:none}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--tx3);opacity:.22}
.inp.err{border-color:var(--red)}
.scope{flex:1;height:24px;padding:2px 6px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);color:var(--tx);font:11px Consolas,monospace;outline:none}
.scope:focus{border-color:var(--blue)}
.scope::placeholder{color:var(--tx3);opacity:.22}
.lbl{font-size:11px;color:var(--tx3);white-space:nowrap;min-width:28px}
.tog{width:26px;height:26px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font:bold 12px Tahoma;text-align:center;cursor:pointer;flex-shrink:0;line-height:26px}
.tog:hover{background:var(--bg2);color:var(--tx)}
.tog.on{background:var(--blue);color:#1e1e1e;border-color:var(--blue)}
.btn{height:26px;padding:0 10px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx);font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#1e1e1e;border-color:var(--blue)}
.btn.pri:hover{opacity:.9}
.chk{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:3px;margin-left:4px;cursor:pointer;white-space:nowrap}
.chk input{cursor:pointer}
.sort{height:24px;padding:0 4px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;outline:none}

/* status */
.st{padding:3px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx2);flex-shrink:0;min-height:20px;display:flex;align-items:center;gap:6px}
.st .n{font-weight:bold;color:var(--tx)}

/* results */
.rs{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0}
.rs::-webkit-scrollbar{width:5px}
.rs::-webkit-scrollbar-thumb{background:var(--base1);border-radius:2px}

/* file group */
.fg{margin-bottom:1px}
.fh{display:flex;align-items:center;padding:3px 10px;cursor:pointer;font-size:12px;gap:5px;position:sticky;top:0;background:var(--bg);z-index:2;user-select:none}
.fh:hover{background:var(--bg2)}
.fh .ar{width:12px;font-size:10px;color:var(--tx3);flex-shrink:0}
.fh .fn{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .fp{color:var(--tx3);font-size:10px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fh .fc{color:var(--tx3);font-size:11px;flex-shrink:0}

/* match line */
.ml{display:flex;align-items:baseline;padding:1px 10px 1px 28px;cursor:pointer;font:12px Consolas,monospace;line-height:1.45;min-height:18px}
.ml:hover{background:var(--bg2)}
.ml .ln{width:40px;text-align:right;color:var(--tx3);margin-right:7px;flex-shrink:0;font-size:11px}
.ml .ct{white-space:pre;overflow:hidden;text-overflow:ellipsis;flex:1}
.ml .ct .hl{background:var(--yellow);color:#1e1e1e;border-radius:1px;padding:0 1px}
[data-theme="dark"] .ml .ct .hl{background:#5a4a10;color:#ffe070}
.cl{padding:1px 10px 1px 28px;font:11px Consolas,monospace;color:var(--tx3);line-height:1.35}
.cl .ln{width:40px;text-align:right;display:inline-block;margin-right:7px}

.fg.closed .ml,.fg.closed .cl{display:none}

.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx3);gap:8px}
.emp .ic{font-size:42px;opacity:.25}
.emp .ht{font-size:13px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100%">
  <div class="tb">
    <div class="tb-r">
      <input class="inp" id="q" placeholder="搜索..." autofocus spellcheck="false">
      <button class="tog" id="brx" title="正则 (Alt+R)">.*</button>
      <button class="tog" id="bcs" title="大小写 (Alt+C)">Aa</button>
      <button class="tog" id="bww" title="全字 (Alt+W)">ab</button>
    </div>
    <div class="tb-r">
      <input class="inp" id="rp" placeholder="替换..." spellcheck="false">
      <button class="btn pri" id="bra">全部替换</button>
    </div>
    <div class="tb-r">
      <span class="lbl">范围</span>
      <input class="scope" id="sp" placeholder="搜索路径（点 🔍 自动填入）" spellcheck="false">
    </div>
    <div class="tb-r">
      <span class="lbl">仅限</span>
      <input class="scope" id="inc" placeholder="*.js, src/" spellcheck="false">
      <span class="lbl" style="margin-left:8px">排除</span>
      <input class="scope" id="exc" spellcheck="false">
      <span class="lbl" style="margin-left:8px">排序</span>
      <select class="sort" id="srt">
        <option value="mtime" selected>修改时间↓</option><option value="mtime-asc">修改时间↑</option>
        <option value="count">匹配数</option><option value="path">路径</option><option value="path-desc">路径倒序</option>
        <option value="birthtime">创建时间↓</option><option value="birthtime-asc">创建时间↑</option>
        <option value="size">大小↓</option><option value="size-asc">大小↑</option>
      </select>
    </div>
    <div class="tb-r">
      <label class="chk" id="lgi"><input type="checkbox" id="cgi"> 尊重 .gitignore</label>
    </div>
  </div>
  <div class="st" id="st"><span id="stt">键入关键字开始搜索</span></div>
  <div class="rs" id="rc"><div class="emp" id="em"><span class="ic">🔍</span><span class="ht">键入关键字开始搜索</span></div></div>
</div>

<script src="../../ai-panel/only-store.js"></script>
<script>
(function(){"use strict";
var bri=window.parent&&window.parent.qqqideBridge;
if(!bri)setTimeout(function(){bri=window.parent&&window.parent.qqqideBridge;},200);

var Q=document.getElementById('q'),RP=document.getElementById('rp'),SP=document.getElementById('sp'),
    IC=document.getElementById('inc'),EX=document.getElementById('exc'),SRT=document.getElementById('srt'),
    CGI=document.getElementById('cgi'),LGI=document.getElementById('lgi'),
    BRX=document.getElementById('brx'),BCS=document.getElementById('bcs'),BWW=document.getElementById('bww'),
    BRA=document.getElementById('bra'),ST=document.getElementById('st'),STT=document.getElementById('stt'),
    RC=document.getElementById('rc'),EM=document.getElementById('em');

var _rx=false,_cs=false,_ww=false,_tmr=null,_last=null,_lastQ='',_hl=null,_scopePath='';

// ═══════════ persistence via onlyStore (project-level, 家目录 qqq/alphal/only.sq3) ═══════════
// onlyStore 从 ai-panel/only-store.js 加载，调用 onlyStore.init(主项目路径) 绑定项目根目录
// 写入位置：{主项目}/qqq/alphal/only.sq3 — 项目级持久化，非程序目录全局数据库
var _storeReady=false;
function _initStore(){
  if(_storeReady)return;
  try{
    var vp=window.parent&&window.parent.qqqideViewport;
    if(!vp)return;
    var m=vp.getMainProject();
    if(!m||!m.path)return;
    if(typeof onlyStore!=='undefined'&&onlyStore.init){
      onlyStore.init(m.path);
      _storeReady=true;
    }
  }catch(e){}
}
function _ld(){
  if(!_storeReady)_initStore();
  if(!_storeReady)return;
  try{
    var v;(v=onlyStore.get('search.sort'))&&setTimeout(function(){var o=SRT.querySelector('option[value="'+v+'"]');if(o){o.selected=true;SRT.value=v}},0);
    (v=onlyStore.get('search.include'))&&(IC.value=v);
    (v=onlyStore.get('search.exclude'))&&(EX.value=v);if(!EX.value)EX.value='.git/, *.log';
    (typeof(v=onlyStore.get('search.gitignore'))==='boolean')&&(CGI.checked=v);
    (typeof(v=onlyStore.get('search.regex'))==='boolean')&&(_rx=v,BRX.classList.toggle('on',_rx));
    (typeof(v=onlyStore.get('search.caseSens'))==='boolean')&&(_cs=v,BCS.classList.toggle('on',_cs));
    (typeof(v=onlyStore.get('search.wholeWord'))==='boolean')&&(_ww=v,BWW.classList.toggle('on',_ww));
  }catch(e){}
}
function _sv(){
  if(!_storeReady){_initStore();if(!_storeReady)return}
  try{
    onlyStore.set('search.sort',SRT.value);onlyStore.set('search.include',IC.value);
    onlyStore.set('search.exclude',EX.value);onlyStore.set('search.gitignore',CGI.checked);
    onlyStore.set('search.regex',_rx);onlyStore.set('search.caseSens',_cs);onlyStore.set('search.wholeWord',_ww);
  }catch(e){}
}

// ── Init: load prefs ──
(function(){_ld();})();

// ── Save on user actions ──
SRT.onchange=function(){_sv();if(_last)rdr(_last)};
CGI.onchange=function(){_sv();trg()};
function tg(b,k){return function(){if(k==='rx')_rx=!_rx;if(k==='cs')_cs=!_cs;if(k==='ww')_ww=!_ww;
  b.classList.toggle('on',k==='rx'?_rx:k==='cs'?_cs:_ww);_sv();trg();}}
BRX.onclick=tg(BRX,'rx');BCS.onclick=tg(BCS,'cs');BWW.onclick=tg(BWW,'ww');

function trg(){if(_tmr)clearTimeout(_tmr);_tmr=setTimeout(dos,200)}
Q.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();if(_tmr)clearTimeout(_tmr);dos()}};
IC.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();dos()}};
EX.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();dos()}};
SP.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();_scopePath=SP.value.trim();_sv();dos()}};

document.onkeydown=function(e){
  if(e.altKey&&e.key==='r'){e.preventDefault();BRX.click()}
  if(e.altKey&&e.key==='c'){e.preventDefault();BCS.click()}
  if(e.altKey&&e.key==='w'){e.preventDefault();BWW.click()}
  if(e.key==='Escape'){Q.value='';dos()}
};

async function dos(){
  var q=Q.value;
  if(!q){clr();STT.textContent='键入关键字开始搜索';return}
  var sp=SP.value.trim();
  if(!sp){try{var vp=window.parent&&window.parent.qqqideViewport;if(vp){var m=vp.getMainProject();if(m){sp=m.path;SP.value=sp}}}catch(_){}}
  if(!sp){STT.textContent='⚠️ 请指定搜索范围';return}
  _scopePath=sp;_sv();

  if(_rx){try{_hl=new RegExp(q,_cs?'g':'gi');Q.classList.remove('err')}catch(e){Q.classList.add('err');STT.textContent='⚠️ 无效正则: '+e.message;_hl=null;return}}
  else{Q.classList.remove('err');var e2=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)e2='\\b'+e2+'\\b';_hl=new RegExp(e2,_cs?'g':'gi')}

  STT.textContent='🔍 搜索中...';

  try{
    if(!bri)bri=window.parent&&window.parent.qqqideBridge;
    if(!bri||!bri.search){STT.textContent='⚠️ 搜索引擎未就绪';return}
    var r=await bri.search.query({
      query:q,searchPath:sp,isRegex:_rx,caseSensitive:_cs,wholeWord:_ww,
      includePattern:IC.value.trim()||undefined,excludePattern:EX.value.trim()||undefined,
      contextLines:1,maxResults:5000,timeoutMs:60000,respectGitignore:CGI.checked
    });
    if(r.error){STT.textContent='⚠️ '+r.error;clr();return}
    _last=r;_lastQ=q;rdr(r);
    var fc=0,seen=new Set();for(var i=0;i<r.results.length;i++)seen.add(r.results[i].file);fc=seen.size;
    ST.innerHTML='<span class="n">'+r.total+' 个匹配</span> · '+fc+' 个文件 <span style="color:var(--tx3);font-size:10px">('+r.elapsed+'ms / ripgrep / '+r.filesScanned+' 文件)</span>'+(r.truncated?' · <span style="color:var(--orange)">已截断</span>':'');
  }catch(e){STT.textContent='⚠️ 搜索出错: '+(e.message||e)}
}

function clr(){RC.innerHTML='';EM.style.display='';RC.appendChild(EM);_last=null}

function rdr(d){
  RC.innerHTML='';EM.style.display='none';
  if(!d.results||d.results.length===0){EM.querySelector('.ht').textContent='无匹配结果';EM.style.display='';RC.appendChild(EM);return}
  var grp=new Map();
  for(var i=0;i<d.results.length;i++){var r=d.results[i];if(!grp.has(r.file))grp.set(r.file,[]);grp.get(r.file).push(r)}
  var sg=Array.from(grp.entries());var fs=d.fileStats||{};
  var sm=SRT.value;
  sg.sort(function(a,b){
    if(sm==='path')return a[0].localeCompare(b[0]);if(sm==='path-desc')return b[0].localeCompare(a[0]);
    if(sm==='count')return b[1].length-a[1].length||a[0].localeCompare(b[0]);
    if(sm==='size')return(fs[b[0]]&&fs[b[0]].size||0)-(fs[a[0]]&&fs[a[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='size-asc')return(fs[a[0]]&&fs[a[0]].size||0)-(fs[b[0]]&&fs[b[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='mtime-asc')return(fs[a[0]]&&fs[a[0]].mtime||0)-(fs[b[0]]&&fs[b[0]].mtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime')return(fs[b[0]]&&fs[b[0]].birthtime||0)-(fs[a[0]]&&fs[a[0]].birthtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime-asc')return(fs[a[0]]&&fs[a[0]].birthtime||0)-(fs[b[0]]&&fs[b[0]].birthtime||0)||a[0].localeCompare(b[0]);
    return(fs[b[0]]&&fs[b[0]].mtime||0)-(fs[a[0]]&&fs[a[0]].mtime||0)||a[0].localeCompare(b[0]);
  });

  var frag=document.createDocumentFragment();
  for(var gi=0;gi<sg.length;gi++){
    var fp2=sg[gi][0],ms=sg[gi][1];
    var fg=document.createElement('div');fg.className='fg';
    var fh=document.createElement('div');fh.className='fh';
    var ar=document.createElement('span');ar.className='ar';ar.textContent='▶';
    var fn=document.createElement('span');fn.className='fn';fn.textContent=bn(fp2);
    var fpp=document.createElement('span');fpp.className='fp';fpp.textContent=dn(fp2);fpp.title=fp2;
    var fc2=document.createElement('span');fc2.className='fc';fc2.textContent=ms.length+' 匹配';
    fh.appendChild(ar);fh.appendChild(fn);fh.appendChild(fpp);fh.appendChild(fc2);
    var fb=document.createElement('div');fb.className='';
    for(var k=0;k<ms.length;k++){
      var m2=ms[k];
      if(m2.before)for(var b=0;b<m2.before.length;b++){
        var cl=document.createElement('div');cl.className='cl';
        cl.innerHTML='<span class="ln">'+(m2.line-m2.before.length+b)+'</span><span style="white-space:pre;overflow:hidden;text-overflow:ellipsis">'+eh(m2.before[b])+'</span>';fb.appendChild(cl)
      }
      var ml=document.createElement('div');ml.className='ml';
      ml.innerHTML='<span class="ln">'+m2.line+'</span><span class="ct">'+hlm(m2.text)+'</span>';
      ml.onclick=(function(f,l,c){return function(){opn(f,l,c)}})(fp2,m2.line,m2.col);fb.appendChild(ml);
      if(m2.after)for(var a=0;a<m2.after.length;a++){
        var cl2=document.createElement('div');cl2.className='cl';
        cl2.innerHTML='<span class="ln">'+(m2.line+1+a)+'</span><span style="white-space:pre;overflow:hidden;text-overflow:ellipsis">'+eh(m2.after[a])+'</span>';fb.appendChild(cl2)
      }
    }
    fg.appendChild(fh);fg.appendChild(fb);
    fh.onclick=function(_fg,_ar){return function(){_fg.classList.toggle('closed');_ar.textContent=_fg.classList.contains('closed')?'▶':'▼'}}(fg,ar);
    fg.classList.add('closed');
    frag.appendChild(fg)
  }
  RC.appendChild(frag)
}

function hlm(t){if(!_hl)return eh(t);try{_hl.lastIndex=0;var p=[],li=0,m;while((m=_hl.exec(t))!==null){if(m.index>li)p.push(eh(t.slice(li,m.index)));p.push('<span class="hl">'+eh(m[0])+'</span>');li=m.index+m[0].length;if(m[0].length===0)_hl.lastIndex++}if(li<t.length)p.push(eh(t.slice(li)));return p.join('')}catch(_){return eh(t)}}
function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function bn(p){var x=p.replace(/\\/g,'/').split('/');return x[x.length-1]||p}
function dn(p){var n=p.replace(/\\/g,'/');var i=n.lastIndexOf('/');return i>0?n.slice(0,i):''}
function opn(fp,l,c){try{var abs=_scopePath?(_scopePath.replace(/[\\/]$/,'')+'/'+fp.replace(/^[\\/]+/,'').replace(/\\/g,'/')):fp;if(window.parent&&window.parent.qqqTabs&&window.parent.qqqTabs.openFile)window.parent.qqqTabs.openFile(abs,null,null,{line:l,col:c});else window.parent.document.dispatchEvent(new CustomEvent('qqq-file-open',{detail:{path:abs,line:l,col:c}}))}catch(e){console.error('[search] openFile failed:',e)}}

// Replace all
BRA.onclick=async function(){
  if(!_last||!_last.results||_last.results.length===0)return;var rt=RP.value;
  if(!bri)bri=window.parent&&window.parent.qqqideBridge;if(!bri||!bri.search)return;
  var q2=_lastQ,p2=_rx?q2:q2.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)p2='\\b'+p2+'\\b';
  var fl=_cs?'g':'gi',re;try{re=new RegExp(p2,fl)}catch(_){return}
  var reps=[];
  for(var i=0;i<_last.results.length;i++){var r=_last.results[i];re.lastIndex=0;var m;while((m=re.exec(r.text))!==null){reps.push({file:r.file,line:r.line,col:m.index+1,matchLen:m[0].length,replacement:_rx?r.text.slice(m.index,m.index+m[0].length).replace(re,rt):rt});if(m[0].length===0)break}}
  if(reps.length===0)return;
  STT.textContent='🔄 替换中... ('+reps.length+' 处)';
  try{var res=await bri.search.replace({replacements:reps});STT.textContent='✅ 已替换 '+res.replaced+' 处';setTimeout(dos,500)}catch(e){STT.textContent='⚠️ 替换出错: '+(e.message||e)}
};

// Theme sync
(function ts(){
  try{var pt=window.parent.document.documentElement.getAttribute('data-theme');if(pt)document.documentElement.setAttribute('data-theme',pt)}catch(_){}
})();
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='qqqide-theme-change'){var t=e.data.theme||e.data.dark;if(t!==undefined)document.documentElement.setAttribute('data-theme',t?'dark':'');else ts()}
  if(e.data&&e.data.type==='qqqide-search-set-scope'){SP.value=e.data.path||'';_scopePath=SP.value.trim();_initStore();_ld();if(Q.value)trg();Q.focus()}
});

// Init scope from viewport, then init store & load prefs
setTimeout(function(){
  try{var vp=window.parent&&window.parent.qqqideViewport;if(vp&&!SP.value){var m=vp.getMainProject();if(m){SP.value=m.path;_scopePath=m.path}}}_initStore();_ld()}catch(_){}
},100);

// Debounced save for text inputs
var _svt=null;
IC.oninput=function(){if(_svt)clearTimeout(_svt);_svt=setTimeout(_sv,1000)};
EX.oninput=function(){if(_svt)clearTimeout(_svt);_svt=setTimeout(_sv,1000)};
SP.oninput=function(){if(_svt)clearTimeout(_svt);_svt=setTimeout(function(){_scopePath=SP.value.trim();_sv()},1000)};

})();
</script>
</body>
</html>
