<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Search</title>
<style>
:root {
  --base03:#002d20;--base02:#07362e;--base01:#777;--base00:#7a7874;--base0:#7a7874;--base1:#a8a6a2;
  --base2:#eee8d5;--base3:#fdf6e3;--yellow:#b58900;--orange:#cb4b16;--red:#dc322f;
  --magenta:#c83070;--violet:#7e6c8e;--blue:#e8a030;--cyan:#2a9a78;--green:#859900;
  --bg:#fdf6e3;--bg2:#eee8d5;--tx:#7a7874;--tx2:#97978a;--tx3:#a8a6a2;--bd:#eee8d5;--bd2:#a8a6a2;
}
[data-theme="dark"] {
  --bg:#1e1e1e;--bg2:#2a2a2a;--tx:#dcd8d0;--tx2:#a8a49c;--tx3:#6a6660;--bd:#333;--bd2:#555;
}
*{box-sizing:border-box;margin:0;padding:0;forced-color-adjust:none}
html,body{font:13px Tahoma,sans-serif;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
::selection{background:rgb(255,211,2)!important;color:#000!important}
input,select,textarea{-webkit-user-select:text;user-select:text}

.tb{padding:6px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.tb-r{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.tb-r:last-child{margin-bottom:0}
.inp{flex:1;height:26px;padding:2px 7px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);color:var(--tx);font:13px Consolas,monospace;outline:none;position:relative}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--tx3);opacity:.22}
.inp.err{border-color:var(--red)}
.scope{flex:1;height:24px;padding:2px 6px;border:1px solid var(--bd);border-radius:3px;background:var(--bg2);color:var(--tx);font:11px Consolas,monospace;outline:none;position:relative}
.scope:focus{border-color:var(--blue)}
.scope::placeholder{color:var(--tx3);opacity:.22}
.lbl{font-size:11px;color:var(--tx3);white-space:nowrap;min-width:28px}
.tog{width:26px;height:26px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font:bold 12px Tahoma;text-align:center;cursor:pointer;flex-shrink:0;line-height:26px}
.tog:hover{background:var(--bg2);color:var(--tx)}
.tog.on{background:var(--blue);color:#1e1e1e;border-color:var(--blue)}
.btn{height:26px;padding:0 10px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx);font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--blue);color:#1e1e1e;border-color:var(--blue)}
.btn.pri:hover{opacity:.9}
.chk{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:3px;margin-left:4px;cursor:pointer;white-space:nowrap}
.chk input{cursor:pointer}
.sort{height:24px;padding:0 4px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;outline:none}

/* history dropdown */
.hd{position:fixed;z-index:999999;background:var(--bg2);border:1px solid var(--bd2);border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.15);max-height:260px;overflow-y:auto;display:none;min-width:200px}
.hd .hr{padding:4px 8px;font:12px Consolas,monospace;color:var(--tx);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .hr:hover,.hd .hr.sel{background:var(--blue);color:#1e1e1e}

.st{padding:3px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx2);flex-shrink:0;min-height:20px;display:flex;align-items:center;gap:6px}
.st .n{font-weight:bold;color:var(--tx)}

.rs{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0}
.rs::-webkit-scrollbar{width:5px}
.rs::-webkit-scrollbar-thumb{background:var(--base1);border-radius:2px}

/* file group */
.fg{margin-bottom:1px}
.fh{display:flex;align-items:center;padding:3px 10px;cursor:pointer;font-size:12px;gap:5px;position:sticky;top:0;background:var(--bg);z-index:3;user-select:none}
.fh:hover{background:var(--bg2)}
.fh .ar{width:12px;font-size:10px;color:var(--tx3);flex-shrink:0}
.fh .fn{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .fp{color:var(--tx3);font-size:11px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fh .fp .pq{color:var(--red)}
.fh .fc{color:var(--tx3);font-size:11px;flex-shrink:0}

/* collapse/expand bar */
.ceb{display:flex;gap:4px;padding:2px 10px;position:sticky;top:0;background:var(--bg);z-index:4;border-bottom:1px solid var(--bd)}
.ceb .cbtn{width:20px;height:20px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font-size:12px;line-height:18px;text-align:center;cursor:pointer;padding:0}
.ceb .cbtn:hover{background:var(--bg2);color:var(--tx)}

/* match line */
.ml{display:flex;align-items:baseline;padding:1px 4px 1px 6px;cursor:pointer;font:12px Consolas,monospace;line-height:1.45;min-height:18px}
.ml:hover{background:var(--bg2)}
.ml .ln{width:36px;text-align:right;color:var(--tx3);margin-right:6px;flex-shrink:0;font:italic 11px Consolas,monospace}
.ml .ct{white-space:pre;overflow:hidden;text-overflow:ellipsis;flex:1}
.ml .ct .hl{background:#ffd301;color:#1e1e1e;border-radius:1px;padding:0 1px}
[data-theme="dark"] .ml .ct .hl{background:#ffd301;color:#1e1e1e}
.ml .ct .pq{color:var(--red)}

.fg.closed .ml{display:none}

.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx3);gap:8px}
.emp .ic{font-size:42px;opacity:.25}
.emp .ht{font-size:13px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100%">
  <div class="tb">
    <div class="tb-r">
      <input class="inp" id="q" placeholder="搜索..." autofocus spellcheck="false">
      <button class="tog" id="brx" title="正则 (Alt+R)">.*</button>
      <button class="tog" id="bcs" title="大小写 (Alt+C)">Aa</button>
      <button class="tog" id="bww" title="全字 (Alt+W)">ab</button>
    </div>
    <div class="tb-r">
      <input class="inp" id="rp" placeholder="替换..." spellcheck="false">
      <button class="btn pri" id="bra">全部替换</button>
    </div>
    <div class="tb-r">
      <span class="lbl">范围</span>
      <input class="scope" id="sp" placeholder="搜索路径（点 🔍 自动填入）" spellcheck="false">
    </div>
    <div class="tb-r">
      <span class="lbl">仅限</span>
      <input class="scope" id="inc" placeholder="*.js, src/" spellcheck="false">
      <span class="lbl" style="margin-left:8px">排除</span>
      <input class="scope" id="exc" spellcheck="false">
      <span class="lbl" style="margin-left:8px">排序</span>
      <select class="sort" id="srt">
        <option value="mtime" selected>修改时间↓</option><option value="mtime-asc">修改时间↑</option>
        <option value="count">匹配数</option><option value="path">路径</option><option value="path-desc">路径倒序</option>
        <option value="birthtime">创建时间↓</option><option value="birthtime-asc">创建时间↑</option>
        <option value="size">大小↓</option><option value="size-asc">大小↑</option>
      </select>
    </div>
    <div class="tb-r">
      <label class="chk" id="lgi"><input type="checkbox" id="cgi"> 尊重 .gitignore</label>
    </div>
  </div>
  <div class="st" id="st"><span id="stt">键入关键字开始搜索</span></div>
  <div class="rs" id="rc"><div class="ceb" id="ceb" style="display:none"><button class="cbtn" id="cba" title="全部展开">⊞</button><button class="cbtn" id="cbf" title="全部折叠">⊟</button></div><div class="emp" id="em"><span class="ic">🔍</span><span class="ht">键入关键字开始搜索</span></div></div>
</div>

<div class="hd" id="hd"></div>

<script src="../../ai-panel/only-store.js"></script>
<script>
(function(){"use strict";
var bri=window.parent&&window.parent.qqqideBridge;
if(!bri)setTimeout(function(){bri=window.parent&&window.parent.qqqideBridge;},200);

var Q=document.getElementById('q'),RP=document.getElementById('rp'),SP=document.getElementById('sp'),
    IC=document.getElementById('inc'),EX=document.getElementById('exc'),SRT=document.getElementById('srt'),
    CGI=document.getElementById('cgi'),LGI=document.getElementById('lgi'),
    BRX=document.getElementById('brx'),BCS=document.getElementById('bcs'),BWW=document.getElementById('bww'),
    BRA=document.getElementById('bra'),ST=document.getElementById('st'),STT=document.getElementById('stt'),
    RC=document.getElementById('rc'),EM=document.getElementById('em'),HD=document.getElementById('hd'),CEB=document.getElementById('ceb');

var _rx=false,_cs=false,_ww=false,_tmr=null,_last=null,_lastQ='',_hl=null,_scopePath='';

// ═══════════ history: dual-layer (JS array primary, onlyStore backup) ═══════════
var _histMem=[null,null,null,null,null];
function _hydrateHist(){
  if(!_storeReady)return;
  for(var i=0;i<5;i++){
    if(_histMem[i])continue;
    try{var v=onlyStore.get('search.h'+i);if(v&&v.length)_histMem[i]=v}catch(e){}
  }
}

// ═══════════ persistence via onlyStore → {项目}/qqq/alphal/only.sq3 ═══════════
// onlyStore.init() is called ONCE (guarded by _storeReady).
// After init, .set() writes to in-memory cache + schedules SQLite flush.
// .get() reads from in-memory cache (zero I/O, synchronous).
// This is the same pipeline used by the AI panel.
var _storeReady=false,_storeTimer=null;
function _initStore(){
  if(_storeReady)return;
  try{
    if(typeof onlyStore==='undefined'||!onlyStore.init){_retryInit();return}
    var vp=window.parent&&window.parent.qqqideViewport;if(!vp){_retryInit();return}
    var m=vp.getMainProject();if(!m||!m.path){_retryInit();return}
    onlyStore.init(m.path);
    _storeReady=true;
    console.log('[search] onlyStore ready: '+m.path);
    _hydrateHist();
  }catch(e){_retryInit()}
}
function _retryInit(){if(!_storeTimer)_storeTimer=setTimeout(function(){_storeTimer=null;if(!_storeReady)_initStore()},300)}
function _ldPrefs(){
  if(!_storeReady)_initStore();if(!_storeReady)return;
  try{
    var v;(v=onlyStore.get('search.sort'))&&setTimeout(function(){var o=SRT.querySelector('option[value="'+v+'"]');if(o){o.selected=true;SRT.value=v}},0);
    (v=onlyStore.get('search.inc'))&&(IC.value=v);
    (v=onlyStore.get('search.exc'))&&(EX.value=v);if(!EX.value)EX.value='.git/, *.log';
    (typeof(v=onlyStore.get('search.gi'))==='boolean')&&(CGI.checked=v);
    (typeof(v=onlyStore.get('search.rx'))==='boolean')&&(_rx=v,BRX.classList.toggle('on',_rx));
    (typeof(v=onlyStore.get('search.cs'))==='boolean')&&(_cs=v,BCS.classList.toggle('on',_cs));
    (typeof(v=onlyStore.get('search.ww'))==='boolean')&&(_ww=v,BWW.classList.toggle('on',_ww));
  }catch(e){}
}
function _svPrefs(){
  if(!_storeReady){_initStore();if(!_storeReady)return}
  try{onlyStore.set('search.sort',SRT.value);onlyStore.set('search.inc',IC.value);
    onlyStore.set('search.exc',EX.value);onlyStore.set('search.gi',CGI.checked);
    onlyStore.set('search.rx',_rx);onlyStore.set('search.cs',_cs);onlyStore.set('search.ww',_ww);
  }catch(e){}
}

// ═══════════ history with dual-layer: JS array (instant) + onlyStore (persist) ═══════════
// onlyStore.get() is sync (mem cache), but _cache wipe on init can cause races.
// Dual-layer: _histMem[] is the primary truth, onlyStore is async backup.
var _histMem=[null,null,null,null,null]; // 5 inputs: 0=q 1=rp 2=sp 3=inc 4=exc
function _ldHist(fid){
  // Try to hydrate from onlyStore once
  if(!_histMem[fid]&&_storeReady){
    try{var v=onlyStore.get('search.h'+fid);if(v)_histMem[fid]=v}catch(e){}
  }
  return _histMem[fid]||[];
}
function _addHist(fid,val){
  if(!val||!val.trim())return;val=val.trim();
  var h=_histMem[fid]||[];
  h=h.filter(function(x){return x!==val});h.unshift(val);if(h.length>15)h.length=15;
  _histMem[fid]=h;
  if(_storeReady)try{onlyStore.set('search.h'+fid,h)}catch(e){}
  console.log('[search] hist'+fid+' =',h.slice(0,3));
}
function _showHist(inp,fid){
  var vals=_ldHist(fid);if(!vals.length){HD.style.display='none';return}
  HD.innerHTML='';var r=inp.getBoundingClientRect();
  var top=r.bottom+1,left=r.left,w=r.width;if(left+w>window.innerWidth-10)left=window.innerWidth-w-10;
  HD.style.left=left+'px';HD.style.top=top+'px';HD.style.minWidth=w+'px';HD.style.display='';
  var idx=-1;
  for(var i=0;i<vals.length;i++){
    var d=document.createElement('div');d.className='hr';d.textContent=vals[i].slice(0,120);
    (function(v,j){
      d.onmousedown=function(e){e.preventDefault();inp.value=v;_addHist(fid,v);HD.style.display='none';if(fid===0)dos();else trg()};
      d._hIdx=j;
    })(vals[i],i);
    HD.appendChild(d);
  }
  HD._hIdx=-1;HD._hVals=vals;HD._hInp=inp;HD._hFid=fid;
}
HD.onmousedown=function(e){e.preventDefault()};
function _navHist(dir){
  if(HD.style.display==='none')return;HD._hIdx+=dir;
  if(HD._hIdx<0)HD._hIdx=HD._hVals.length-1;if(HD._hIdx>=HD._hVals.length)HD._hIdx=0;
  var rows=HD.querySelectorAll('.hr');for(var i=0;i<rows.length;i++)rows[i].classList.toggle('sel',i===HD._hIdx);
}
function _pickHist(){
  if(HD.style.display==='none'||HD._hIdx<0)return;
  var v=HD._hVals[HD._hIdx];var inp=HD._hInp,fid=HD._hFid;
  inp.value=v;_addHist(fid,v);HD.style.display='none';if(fid===0)dos();else trg();
}

// Wire up all 5 inputs with history
[Q,RP,SP,IC,EX].forEach(function(inp,fid){
  inp.addEventListener('focus',function(){_showHist(inp,fid)});
  inp.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==HD)HD.style.display='none'},150)});
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();_navHist(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();_navHist(-1)}
    else if(e.key==='Enter'){if(HD.style.display!=='none'){e.preventDefault();_pickHist()}else{if(fid===0)dos();else trg()}}
    else if(e.key==='Escape')HD.style.display='none'
    else HD.style.display='none'
  });
});

// Collapse/expand all
document.getElementById('cba').onclick=function(){var fgs=RC.querySelectorAll('.fg');for(var i=0;i<fgs.length;i++)fgs[i].classList.remove('closed');var ars=RC.querySelectorAll('.fh .ar');for(var i=0;i<ars.length;i++)ars[i].textContent='▼'}
document.getElementById('cbf').onclick=function(){var fgs=RC.querySelectorAll('.fg');for(var i=0;i<fgs.length;i++)fgs[i].classList.add('closed');var ars=RC.querySelectorAll('.fh .ar');for(var i=0;i<ars.length;i++)ars[i].textContent='▶'}

// Init
_ldPrefs();
if(!EX.value)EX.value='.git/, *.log';
_initStore();_hydrateHist();

SRT.onchange=function(){_svPrefs();if(_last)rdr(_last)};
CGI.onchange=function(){_svPrefs();trg()};
function tg(b,k){return function(){if(k==='rx')_rx=!_rx;if(k==='cs')_cs=!_cs;if(k==='ww')_ww=!_ww;
  b.classList.toggle('on',k==='rx'?_rx:k==='cs'?_cs:_ww);_svPrefs();trg();}}
BRX.onclick=tg(BRX,'rx');BCS.onclick=tg(BCS,'cs');BWW.onclick=tg(BWW,'ww');

function trg(){if(_tmr)clearTimeout(_tmr);_tmr=setTimeout(dos,200)}

document.onkeydown=function(e){
  if(e.altKey&&e.key==='r'){e.preventDefault();BRX.click()}
  if(e.altKey&&e.key==='c'){e.preventDefault();BCS.click()}
  if(e.altKey&&e.key==='w'){e.preventDefault();BWW.click()}
  if(e.key==='Escape'){Q.value='';dos()}
};

async function dos(){
  var q=Q.value;
  if(!q){clr();STT.textContent='键入关键字开始搜索';return}
  var sp=SP.value.trim();
  if(!sp){try{var vp=window.parent&&window.parent.qqqideViewport;if(vp){var m=vp.getMainProject();if(m){sp=m.path;SP.value=sp}}}catch(_){}}
  if(!sp){STT.textContent='⚠️ 请指定搜索范围';return}
  _scopePath=sp;_svPrefs();_addHist(0,q);_addHist(2,sp);_addHist(3,IC.value);_addHist(4,EX.value);

  if(_rx){try{_hl=new RegExp(q,_cs?'g':'gi');Q.classList.remove('err')}catch(e){Q.classList.add('err');STT.textContent='⚠️ 无效正则: '+e.message;_hl=null;return}}
  else{Q.classList.remove('err');var e2=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)e2='\\b'+e2+'\\b';_hl=new RegExp(e2,_cs?'g':'gi')}

  STT.textContent='🔍 搜索中...';
  try{
    if(!bri)bri=window.parent&&window.parent.qqqideBridge;
    if(!bri||!bri.search){STT.textContent='⚠️ 搜索引擎未就绪';return}
    var r=await bri.search.query({
      query:q,searchPath:sp,isRegex:_rx,caseSensitive:_cs,wholeWord:_ww,
      includePattern:IC.value.trim()||undefined,excludePattern:EX.value.trim()||undefined,
      contextLines:0,maxResults:5000,timeoutMs:60000,respectGitignore:CGI.checked
    });
    if(r.error){STT.textContent='⚠️ '+r.error;clr();return}
    _last=r;_lastQ=q;rdr(r);
    var fc=0,seen=new Set();for(var i=0;i<r.results.length;i++){seen.add(r.results[i].file);if(i===0||r.results[i].file!==r.results[i-1].file)fc++}
    ST.innerHTML='<span class="n">'+r.total+' 个匹配</span> · '+fc+' 个文件 <span style="color:var(--tx3);font-size:10px">('+r.elapsed+'ms / ripgrep / '+r.filesScanned+' 文件)</span>'+(r.truncated?' · <span style="color:var(--orange)">已截断</span>':'');
  }catch(e){STT.textContent='⚠️ 搜索出错: '+(e.message||e)}
}

function clr(){RC.innerHTML='';CEB.style.display='none';RC.appendChild(CEB);EM.style.display='';RC.appendChild(EM);_last=null}

function rdr(d){
  RC.innerHTML='';CEB.style.display='';RC.appendChild(CEB);EM.style.display='none';
  if(!d.results||d.results.length===0){EM.querySelector('.ht').textContent='无匹配结果';CEB.style.display='none';EM.style.display='';RC.appendChild(EM);return}
  var grp=new Map();
  for(var i=0;i<d.results.length;i++){var r=d.results[i];if(!grp.has(r.file))grp.set(r.file,[]);grp.get(r.file).push(r)}
  var sg=Array.from(grp.entries());var fs=d.fileStats||{};
  var sm=SRT.value;
  sg.sort(function(a,b){
    if(sm==='path')return a[0].localeCompare(b[0]);if(sm==='path-desc')return b[0].localeCompare(a[0]);
    if(sm==='count')return b[1].length-a[1].length||a[0].localeCompare(b[0]);
    if(sm==='size')return(fs[b[0]]&&fs[b[0]].size||0)-(fs[a[0]]&&fs[a[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='size-asc')return(fs[a[0]]&&fs[a[0]].size||0)-(fs[b[0]]&&fs[b[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='mtime-asc')return(fs[a[0]]&&fs[a[0]].mtime||0)-(fs[b[0]]&&fs[b[0]].mtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime')return(fs[b[0]]&&fs[b[0]].birthtime||0)-(fs[a[0]]&&fs[a[0]].birthtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime-asc')return(fs[a[0]]&&fs[a[0]].birthtime||0)-(fs[b[0]]&&fs[b[0]].birthtime||0)||a[0].localeCompare(b[0]);
    return(fs[b[0]]&&fs[b[0]].mtime||0)-(fs[a[0]]&&fs[a[0]].mtime||0)||a[0].localeCompare(b[0]);
  });
  var frag=document.createDocumentFragment();
  for(var gi=0;gi<sg.length;gi++){
    var fp2=sg[gi][0],ms=sg[gi][1];
    var fg=document.createElement('div');fg.className='fg';
    var fh=document.createElement('div');fh.className='fh';
    var ar=document.createElement('span');ar.className='ar';ar.textContent='▶';
    var fn=document.createElement('span');fn.className='fn';fn.textContent=bn(fp2);
    var fpp=document.createElement('span');fpp.className='fp';fpp.innerHTML='/'+pq(dn(fp2));fpp.title=fp2;
    var fc2=document.createElement('span');fc2.className='fc';fc2.textContent=ms.length+' 匹配';
    fh.appendChild(ar);fh.appendChild(fn);fh.appendChild(fpp);fh.appendChild(fc2);
    var fb=document.createElement('div');fb.className='';
    // Only match lines, no context
    for(var k=0;k<ms.length;k++){
      var m2=ms[k];
      var ml=document.createElement('div');ml.className='ml';      ml.innerHTML='<span class="ln">'+m2.line+'</span><span class="ct">'+pq(hlm(m2.text))+'</span>';;
      ml.onclick=(function(f,l,c){return function(){opn(f,l,c)}})(fp2,m2.line,m2.col);fb.appendChild(ml);
    }
    fg.appendChild(fh);fg.appendChild(fb);
    fh.onclick=function(_fg,_ar){return function(){_fg.classList.toggle('closed');_ar.textContent=_fg.classList.contains('closed')?'▶':'▼'}}(fg,ar);
    fg.classList.add('closed');
    frag.appendChild(fg)
  }
  RC.appendChild(frag)
}

function hlm(t){if(!_hl)return eh(t);try{_hl.lastIndex=0;var p=[],li=0,m;while((m=_hl.exec(t))!==null){if(m.index>li)p.push(eh(t.slice(li,m.index)));p.push('<span class="hl">'+eh(m[0])+'</span>');li=m.index+m[0].length;if(m[0].length===0)_hl.lastIndex++}if(li<t.length)p.push(eh(t.slice(li)));return p.join('')}catch(_){return eh(t)}}
function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pq(s){return s.replace(/([qf]\d+)\./g,'<span class="pq">$1.</span>')}
function bn(p){var x=p.replace(/\\/g,'/').split('/');return x[x.length-1]||p}
function dn(p){var n=p.replace(/\\/g,'/');var i=n.lastIndexOf('/');return i>0?n.slice(0,i):''}
function opn(fp,l,c){try{var abs=_scopePath?(_scopePath.replace(/[\\/]$/,'')+'/'+fp.replace(/^[\\/]+/,'').replace(/\\/g,'/')):fp;window.parent._nextPaneOpts={line:l,col:c};window.parent.document.dispatchEvent(new CustomEvent('qqq-file-open',{detail:{path:abs}}))}catch(e){console.error('[search] openFile failed:',e)}}

BRA.onclick=async function(){
  if(!_last||!_last.results||_last.results.length===0)return;var rt=RP.value;
  if(!bri)bri=window.parent&&window.parent.qqqideBridge;if(!bri||!bri.search)return;
  var q2=_lastQ,p2=_rx?q2:q2.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)p2='\\b'+p2+'\\b';
  var fl=_cs?'g':'gi',re;try{re=new RegExp(p2,fl)}catch(_){return}
  var reps=[];
  for(var i=0;i<_last.results.length;i++){var r=_last.results[i];re.lastIndex=0;var m;while((m=re.exec(r.text))!==null){reps.push({file:r.file,line:r.line,col:m.index+1,matchLen:m[0].length,replacement:_rx?r.text.slice(m.index,m.index+m[0].length).replace(re,rt):rt});if(m[0].length===0)break}}
  if(reps.length===0)return;
  STT.textContent='🔄 替换中... ('+reps.length+' 处)';
  try{var res=await bri.search.replace({replacements:reps});STT.textContent='✅ 已替换 '+res.replaced+' 处';_addHist(1,rt);setTimeout(dos,500)}catch(e){STT.textContent='⚠️ 替换出错: '+(e.message||e)}
};

(function ts(){
  try{var pt=window.parent.document.documentElement.getAttribute('data-theme');if(pt)document.documentElement.setAttribute('data-theme',pt)}catch(_){}
})();
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='qqqide-theme-change'){var t=e.data.theme||e.data.dark;if(t!==undefined)document.documentElement.setAttribute('data-theme',t?'dark':'');else ts()}
  if(e.data&&e.data.type==='qqqide-search-set-scope'){SP.value=e.data.path||'';_scopePath=SP.value.trim();_ldPrefs();if(Q.value)trg();Q.focus()}
});

setTimeout(function(){
  try{var vp=window.parent&&window.parent.qqqideViewport;if(vp&&!SP.value){var m=vp.getMainProject();if(m){SP.value=m.path;_scopePath=m.path}}_ldPrefs();}catch(_){}
},100);

// Save prefs on text changes (debounced)
var _svt=null;
IC.oninput=function(){if(_svt)clearTimeout(_svt);_svt=setTimeout(_svPrefs,1000)};
EX.oninput=function(){if(_svt)clearTimeout(_svt);_svt=setTimeout(_svPrefs,1000)};
SP.oninput=function(){if(_svt)clearTimeout(_svt);_svt=setTimeout(function(){_scopePath=SP.value.trim();_svPrefs()},1000)};

})();
