<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>search</title>
<style>
:root{--bg:#fdf6e3;--bg2:#fbe9bc;--tx:#7a7874;--tx2:#97978a;--tx3:#a8a6a2;--bd:#eee8d5;--bd2:#a8a6a2;--yel:#b58900;--ora:#cb4b16;--red:#dc322f;--blu:#e8a030;--grn:#859900;--inp-bg:#fdf6e3;--inp-bd:#c9c0aa}
[data-theme="dark"]{--bg:#1e1e1e;--bg2:#2a2a2a;--tx:#dcd8d0;--tx2:#a8a49c;--tx3:#6a6660;--bd:#333;--bd2:#555;--inp-bg:#282828;--inp-bd:#555}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font:13px Tahoma,sans-serif;height:100%;background:var(--bg);color:var(--tx)}
::selection{background:rgb(255,211,2)!important;color:#000!important}
input,select{-webkit-user-select:text;user-select:text}
.tb{padding:6px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.tb-r{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.tb-r:last-child{margin-bottom:0}
.inp{flex:1;height:26px;padding:2px 7px;border:1px solid var(--inp-bd);border-radius:3px;background:var(--inp-bg);color:var(--tx);font:13px Consolas,monospace;outline:none}
.inp:focus{border-color:var(--blu)}.inp.err,.inp.err:focus{border-color:var(--red)}.inp::placeholder{color:var(--tx3);opacity:.55}
.scope{flex:1;height:24px;padding:2px 6px;border:1px solid var(--inp-bd);border-radius:3px;background:var(--inp-bg);color:var(--tx);font:12px Consolas,monospace;outline:none}
.scope:focus{border-color:var(--blu)}.scope::placeholder{color:var(--tx3);opacity:.55}
.lbl{font-size:11px;color:var(--tx3);white-space:nowrap;min-width:28px}
.tog{width:26px;height:26px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font:bold 12px Tahoma;text-align:center;cursor:pointer;flex-shrink:0;line-height:26px}
.tog:hover{background:var(--bg2);color:var(--tx)}.tog.on{background:var(--blu);color:#1e1e1e;border-color:var(--blu)}
.btn{height:26px;padding:0 10px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx);font-size:11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}.btn.pri{background:var(--blu);color:#1e1e1e;border-color:var(--blu)}.btn.pri:hover{opacity:.9}
.chk{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:3px;margin-left:6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chk input{display:none}
.chk .ckb{width:15px;height:15px;border:1.5px solid var(--tx3);border-radius:3px;flex-shrink:0;position:relative}
.chk.on .ckb::after{content:'✓';position:absolute;top:-1px;left:2px;font-size:12px;font-weight:bold;color:var(--tx)}[data-theme="dark"] .chk.on .ckb::after{color:#dcd8d0}
.sort{height:24px;padding:0 10px 0 4px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--tx);font-size:11px;cursor:pointer;outline:none;text-align:left;white-space:nowrap;position:relative;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sort::after{content:'▼';font-size:8px;position:absolute;right:3px;top:50%;margin-top:-4px;color:var(--tx3)}
.sort-wrap{position:relative;display:inline-block}
.sort-dd{display:none;position:absolute;top:100%;right:0;z-index:9999;background:var(--bg);border:1px solid var(--bd2);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:2px 0;min-width:130px;max-width:min(340px,calc(100vw - 24px))}
.sort-dd>div{padding:4px 10px;font-size:11px;color:var(--tx);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sort-dd>div:hover{background:var(--bg2)}
.sort-dd>div.sel{background:#eee8d5}[data-theme="dark"] .sort-dd>div.sel{background:#383838}
.iw{position:relative;flex:1;display:flex;min-width:0}
.iw .inp,.iw .scope{flex:1;min-width:0}
.hdd{display:none;position:absolute;left:0;top:100%;z-index:9999;background:var(--bg);border:1px solid var(--bd2);box-shadow:0 2px 8px rgba(0,0,0,.18);max-height:240px;overflow-y:auto;overflow-x:hidden;min-width:100%;white-space:nowrap}
.hdd>div{padding:5px 10px;font:13px Consolas,monospace;color:var(--tx);cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.hdd>div:hover{background:var(--bg2)}.hdd>div.sel{background:var(--blu);color:#1e1e1e}
.st{padding:3px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx2);flex-shrink:0;min-height:20px;display:flex;align-items:center;gap:6px}
.st .n{font-weight:bold;color:var(--tx)}
.rs{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0}
.rs::-webkit-scrollbar{width:5px}.rs::-webkit-scrollbar-thumb{background:var(--tx3);border-radius:2px}
.fg{margin-bottom:1px}
.fh{display:flex;align-items:center;padding:3px 10px;cursor:pointer;font-size:12px;gap:5px;background:var(--bg);user-select:none}
.fh:hover{background:var(--bg2)}.fh .ar{width:12px;font-size:10px;color:var(--tx3);flex-shrink:0}
.fh .fn{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh .fp{color:var(--tx3);font-size:11px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fh .fp .pq{color:var(--red)}.fh .fc{color:var(--tx3);font-size:11px;flex-shrink:0}
.cbtn{width:18px;height:18px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx3);font-size:11px;line-height:16px;text-align:center;cursor:pointer;padding:0;flex-shrink:0}
.cbtn:hover{background:var(--bg2);color:var(--tx)}
.ml{display:flex;align-items:baseline;padding:1px 4px 1px 6px;cursor:pointer;font:12px Consolas,monospace;line-height:1.45;min-height:18px}
.ml:hover{background:var(--bg2)}.ml .ln{width:36px;text-align:right;color:var(--tx3);margin-right:6px;flex-shrink:0;font:italic 11px Consolas,monospace}
.ml .ct{white-space:pre;overflow:hidden;text-overflow:ellipsis;flex:1}
.ml .ct .hl{background:#ffd301;color:#1e1e1e;border-radius:1px;padding:0 1px}
.ml .ct .pq{color:var(--red)}.fg.closed .ml{display:none}
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx3);gap:8px}
.emp .ic{font-size:42px;opacity:.25}.emp .ht{font-size:13px}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center}
.mo>div{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:16px 20px;max-width:640px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.mo h3{margin:0 0 10px;font-size:14px;color:var(--tx)}
.mo .stt2{font-size:12px;color:var(--tx2);margin-bottom:8px}
.mo .prv{font-size:11px;font-family:Consolas,monospace;max-height:200px;overflow-y:auto;border:1px solid var(--bd);border-radius:3px;padding:6px;margin-bottom:8px;background:var(--bg2);line-height:1.5;word-break:break-all}
.mo .prv .f2{color:var(--blu)}.mo .prv .ln2{color:var(--tx3);margin:0 4px}
.mo .prv .old{color:var(--red);text-decoration:line-through}.mo .prv .nw{color:var(--grn)}
.mo .prv .arw{color:var(--tx3);margin:0 4px}
.mo .btns{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.mo .prgo{height:6px;background:var(--bd);border-radius:3px;margin:8px 0;overflow:hidden}
.mo .prgi{height:100%;background:var(--blu);border-radius:3px;transition:width .15s}
.mo .prgt{font-size:11px;color:var(--tx2)}
.mo .prgf{font-size:10px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mo .errs{font-size:11px;color:var(--red);max-height:120px;overflow-y:auto;margin-top:6px}
/* ── v2 五态状态机（空闲/准备/搜索中/完成/出错 一眼可辨）── */
@keyframes qsrch-spin{to{transform:rotate(360deg)}}
@keyframes qsrch-flow{0%{background-position:0 0}100%{background-position:200px 0}}
.st{position:relative;overflow:hidden}
.st.searching::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--blu),transparent);background-size:200px 100%;animation:qsrch-flow 1.1s linear infinite}
.qs-spin{width:11px;height:11px;border:2px solid var(--bd2);border-top-color:var(--blu);border-radius:50%;animation:qsrch-spin .8s linear infinite;display:inline-block;flex-shrink:0;vertical-align:-1px}
.st .live{color:var(--tx3);font-size:11px;white-space:nowrap}
.st .cxl{height:18px;padding:0 8px;border:1px solid var(--bd);border-radius:3px;background:transparent;color:var(--tx2);font-size:11px;cursor:pointer;flex-shrink:0;margin-left:auto;line-height:16px}
.st .cxl:hover{background:var(--bg2);color:var(--tx)}
.st .done{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.badge{font-size:10px;padding:0 5px;border-radius:8px;border:1px solid var(--bd2);color:var(--tx3);white-space:nowrap;flex-shrink:0}
.badge.warn{color:var(--ora);border-color:var(--ora)}
.badge.cancel{color:var(--tx2)}
.emp .big{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--blu);border-radius:50%;animation:qsrch-spin .9s linear infinite}
.ml.name .ln{color:var(--tx3)}
.ml.name .ct{color:var(--tx2)}

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;height:100%">
  <div class="tb">
    <div class="tb-r"><span class="iw"><input class="inp" id="q" placeholder="搜索..." data-i18n-placeholder="goods.search.qPh" autofocus spellcheck="false"><div class="hdd" id="dd0"></div></span><button class="tog" id="brx" title="正则" data-i18n-title="goods.search.regex">.*</button><button class="tog" id="bcs" title="大小写" data-i18n-title="goods.search.case">Aa</button><button class="tog" id="bww" title="全字" data-i18n-title="goods.search.wholeWord">ab</button></div>
    <div class="tb-r"><span class="iw"><input class="inp" id="rp" placeholder="替换..." data-i18n-placeholder="goods.search.rpPh" spellcheck="false"><div class="hdd" id="dd1"></div></span><button class="btn pri" id="bra" data-i18n="goods.search.replaceAll">全部替换</button></div>
    <div class="tb-r"><span class="lbl" data-i18n="goods.search.scope">范围</span><span class="iw"><input class="scope" id="sp" placeholder="搜索路径（点 🔍 自动填入）" data-i18n-placeholder="goods.search.spPh" spellcheck="false"><div class="hdd" id="dd2"></div></span><label class="chk" id="lgi"><input type="checkbox" id="cgi"><span class="ckb"></span> .gitignore</label></div>
    <div class="tb-r"><span class="lbl" data-i18n="goods.search.only">仅限</span><span class="iw"><input class="scope" id="inc" placeholder="*.js, src/" spellcheck="false"><div class="hdd" id="dd3"></div></span><span class="lbl" style="margin-left:8px" data-i18n="goods.search.exclude">排除</span><span class="iw"><input class="scope" id="exc" value=".git/, *.log, *.json" spellcheck="false"><div class="hdd" id="dd4"></div></span><span class="lbl" style="margin-left:8px" data-i18n="goods.search.sort">排序</span><span class="sort-wrap"><button class="sort" id="srt_btn">修改时间↓</button><div class="sort-dd" id="srt_dd"></div></span></div>
  </div>
  <div class="st" id="st"><span class="qs-spin" id="stspin" style="display:none"></span><span id="stt" data-i18n="goods.search.typeToSearch">键入关键字开始搜索</span><span class="live" id="stlive" style="display:none"></span><span class="done" id="stdone" style="display:none"></span><button class="cxl" id="bcxl" style="display:none" title="Esc" data-i18n="goods.search.cancelBtn">取消</button></div>
  <div class="rs" id="rc"><div class="emp" id="em"><span class="ic">🔍</span><span class="ht" data-i18n="goods.search.typeToSearch">键入关键字开始搜索</span></div></div>
</div>

<script src="../../core/char-undo.js"></script>
<script src="../../core/i18n.js"></script>
<script>
(function(){
// i18n 小助手：_kk(key, fallback[, v0[, v1...]]) —— {0}/{1}... 用 split/join 替换（防 $ 特殊字符）
var _kk = function (key, fb) { var s = window._i ? window._i(key, fb) : fb; for (var i = 2; i < arguments.length; i++) { s = String(s).split('{' + (i - 2) + '}').join(arguments[i]); } return s; };
var INPS=[document.getElementById('q'),document.getElementById('rp'),document.getElementById('sp'),
  document.getElementById('inc'),document.getElementById('exc')];
var DDS=[document.getElementById('dd0'),document.getElementById('dd1'),document.getElementById('dd2'),
  document.getElementById('dd3'),document.getElementById('dd4')];
var Q=INPS[0],RP=INPS[1],SP=INPS[2],IC=INPS[3],EX=INPS[4];
var bri=window.parent&&window.parent.qqqideBridge;
if(!bri)setTimeout(function(){bri=window.parent&&window.parent.qqqideBridge;},200);
var _openFid=null,_sel=-1;
var _hist=[[],[],[],[],[]];
var HMAX=200;
var SHOWMAX=15;
var _prjRoot=null,_dbLoading=false,_dbLoaded=false,_migrated=false;

function _histKey(fid){return 'srch.h'+fid}
// ★ 2026-08-09 F6: 搜索记忆 OS 级单一真理源 %LOCALAPPDATA%/qqqide/search.sq3
//   不再依赖主项目/only.sq3（主项目未就绪历史也能读写）
function _initDB(){
  return !!(bri&&bri.searchState);
}
async function _ldHist(){
  if(_dbLoaded)return;
  if(!_initDB())return;
  _dbLoading=true;
  for(var i=0;i<5;i++){
    try{
      var v=await bri.searchState.get(_histKey(i));
      if(Array.isArray(v))_hist[i]=v;
      else if(typeof v==='string'){try{var p=JSON.parse(v);if(Array.isArray(p))_hist[i]=p}catch(_){}}
    }catch(_){}
  }
  _dbLoaded=true;_dbLoading=false;
  // Seed factory defaults (in-memory only, never persisted)
  // fid=4 exclude: factory default always on top
  var defEx='.git/, *.log, *.json';if(_hist[4].indexOf(defEx)===-1)_hist[4].unshift(defEx);
  // fid=3 include: factory default 'search_quest.txt' always on top (quest index files)
  var defIn='search_quest.txt';if(_hist[3].indexOf(defIn)===-1)_hist[3].unshift(defIn);
  _migrateFromOnly();
}
// ★ 一次性迁移 only.sq3 → OS search.sq3（2026-08-09 F6）: 逐 key 幂等（OS 已有该 key 跳过，
//   迁移一半崩溃不丢剩余）; 迁后删 only.sq3 旧 key 保持项目库纯净
async function _migrateFromOnly(){
  if(_migrated)return;
  if(!_prjRoot)return;
  _migrated=true;
  try{
    if(!window.parent.qgs||!window.parent.qgs.project)return;
    var oldDb=window.parent.qgs.project(_prjRoot+'/_qqq/alphal/only.sq3','qqq.only',{v:1,form:'doc'});
    var moved=0;
    for(var i=0;i<5;i++){
      var k=_histKey(i);
      try{
        var osV=await bri.searchState.get(k);
        if(Array.isArray(osV)&&osV.length)continue;
        var v=await oldDb.get(k);
        if(Array.isArray(v)&&v.length){await bri.searchState.setNow(k,v);await oldDb.del(k);moved++;}
      }catch(_){}
    }
    if(moved)console.log('[search] migrated '+moved+' key(s) only.sq3 → OS search.sq3');
  }catch(_){}
}
var _svRetry={};
function _svHist(fid){
  if(!_initDB()){_retrySv(fid);return}
  try{bri.searchState.setNow(_histKey(fid),_hist[fid]).catch(function(){_retrySv(fid)})}catch(_){_retrySv(fid)}
}
// ★ 写盘失败重试（2026-08-09）：瞬时失败时静默丢 → 排队重试最多 12 次
function _retrySv(fid){
  if((_svRetry[fid]||0)>=12)return;
  _svRetry[fid]=(_svRetry[fid]||0)+1;
  setTimeout(function(){_svRetry[fid]--;if(_initDB()){try{bri.searchState.setNow(_histKey(fid),_hist[fid]).catch(function(){_retrySv(fid)})}catch(_){_retrySv(fid)}}else{_retrySv(fid)}},1500);
}
// ★ 跨窗口/跨绿色包秒级同步（2026-08-09）: 别的窗口写了历史 → 本窗口内存刷新（多窗口大脑不分裂）
if(bri&&bri.searchState&&bri.searchState.onChanged){
  bri.searchState.onChanged(function(msg){
    if(!msg||!msg.key||msg.key.indexOf('srch.h')!==0)return;
    var fid=parseInt(msg.key.slice(6),10);
    if(isNaN(fid)||fid<0||fid>4)return;
    if(_openFid===fid)return;  // 正在展开编辑中的框不打断
    bri.searchState.get(msg.key).then(function(v){
      if(Array.isArray(v))_hist[fid]=v;
      else if(typeof v==='string'){try{var p=JSON.parse(v);if(Array.isArray(p))_hist[fid]=p}catch(_){}}
    }).catch(function(){});
  });
}
_ldHist();
function _add(fid,v){
  if(!v||!v.trim())return;v=v.trim();
  var h=_hist[fid];h=h.filter(function(x){return x!==v});h.unshift(v);if(h.length>HMAX)h.length=HMAX;
  _hist[fid]=h;_svHist(fid);
}
function _fuzzyMatch(haystack,needle){
  if(!needle)return true;
  var parts=needle.toLowerCase().split(/\s+/).filter(Boolean);
  var low=haystack.toLowerCase();
  for(var i=0;i<parts.length;i++){if(low.indexOf(parts[i])===-1)return false}
  return true;
}
function _show(fid){
  _close();
  if(!_dbLoaded){_ldHist()}
  var inp=INPS[fid],qv=(inp.value||'').trim();
  var vals=_hist[fid].slice();
  // Factory defaults always visible on top (in-memory only)
  // fid=4 exclude: .git/, *.log, *.json
  if(fid===4){
    var defEx='.git/, *.log, *.json';
    vals=vals.filter(function(x){return x!==defEx});
    vals.unshift(defEx);
  }
  // fid=3 include: search_quest.txt
  if(fid===3){
    var defIn='search_quest.txt';
    vals=vals.filter(function(x){return x!==defIn});
    vals.unshift(defIn);
  }
  if(qv){vals=vals.filter(function(x){return _fuzzyMatch(x,qv)})}else{vals=vals.slice(0,SHOWMAX)}
  if(!vals||!vals.length)return;
  var dd=DDS[fid];dd.innerHTML='';_sel=-1;
  for(var i=0;i<vals.length;i++){
    var r=document.createElement('div');r.textContent=vals[i].slice(0,120);
    r.onmousedown=(function(v){return function(e){e.preventDefault();INPS[fid].value=v;_add(fid,v);_close();if(fid===0)dos();else trg()}})(vals[i]);
    dd.appendChild(r);
  }
  dd.style.display='block';_openFid=fid;
}
function _close(){if(_openFid!==null){DDS[_openFid].style.display='none';_openFid=null}}
function _nav(dir){if(_openFid===null)return;var dd=DDS[_openFid];_sel+=dir;if(_sel<0)_sel=dd.childElementCount-1;if(_sel>=dd.childElementCount)_sel=0;var rs=dd.querySelectorAll('div');for(var i=0;i<rs.length;i++){rs[i].className=i===_sel?'sel':''}}
function _pick(){if(_openFid===null||_sel<0)return;var dd=DDS[_openFid],rs=dd.querySelectorAll('div');if(_sel>=rs.length)return;INPS[_openFid].value=rs[_sel].textContent;_add(_openFid,rs[_sel].textContent);_close();if(_openFid===0)dos();else trg()}
INPS.forEach(function(inp,fid){
  inp.addEventListener('focus',function(){_show(fid)});
  inp.addEventListener('blur',function(){var cf=fid;setTimeout(function(){var ae=document.activeElement;if(ae&&ae.closest&&ae.closest('.hdd'))return;if(_openFid===cf)_close()},200)});
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();if(_openFid===null)_show(fid);_nav(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();if(_openFid===null)_show(fid);_nav(-1)}
    else if(e.key==='Enter'){if(_openFid!==null){e.preventDefault();_pick()}else{if(fid===0)dos();else trg()}}
    else if(e.key==='Escape'){_close()}
  });
  inp.addEventListener('input',function(){if(_openFid===fid){_show(fid);return}if(inp.value.trim()){_show(fid)}});
});
document.addEventListener('mousedown',function(e){if(_openFid===null)return;var t=e.target;if(t.closest&&(t.closest('.iw')||t.closest('.hdd')))return;_close()});

var _rx=false,_cs=false,_ww=false,_tmr=null,_lastQ='',_hl=null,_scopePath='',_lastQuery='';
var CGI=document.getElementById('cgi'),LGI=document.getElementById('lgi'),
  BRX=document.getElementById('brx'),BCS=document.getElementById('bcs'),BWW=document.getElementById('bww'),
  BRA=document.getElementById('bra'),ST=document.getElementById('st'),STT=document.getElementById('stt'),
  RC=document.getElementById('rc'),EM=document.getElementById('em');

async function dos(){

  var hlQ=q,hasNl=q.indexOf('\\n')!==-1||q.indexOf('\n')!==-1;
  if(hasNl){
    var parts=q.replace(/\\n/g,'\n').split('\n').filter(Boolean);
    if(_rx){hlQ=parts.join('|')}else{hlQ=parts.map(function(p){return p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')}
    if(_ww)hlQ='\\b'+hlQ+'\\b'
  }else if(_rx){hlQ=q}else{hlQ=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(_ww)hlQ='\\b'+hlQ+'\\b'}
  try{_hl=new RegExp(hlQ,_cs?'g':'gi')}catch(e){Q.classList.add('err');_setSt('idle',_kk('goods.search.invalidRegex','⚠️ 无效正则: {0}',e.message));_hl=null;return}
  Q.classList.remove('err');

  if(!bri||!bri.search){_setSt('idle',_kk('goods.search.engineNotReady','⚠️ 搜索引擎未就绪'));return}

  var reqId=++_reqSeq;_activeReq=reqId;

    includePattern:IC.value.trim()||undefined,excludePattern:EX.value.trim()||undefined,
    maxResults:5000,timeoutMs:60000,respectGitignore:CGI.checked,clientId:_clientId,reqId:reqId};
  if(bri.search.start){

      if(!ack||!ack.ok){_finishDone({error:(ack&&ack.error)||_kk('goods.search.searchFail','⚠️ 搜索出错: {0}','')})}

  }
}

// 旧壳层回退：一次性 query，完成后一次性渲染
async function _legacyWait(reqId,opts){
  try{
    var r=await bri.search.query({query:opts.query,searchPath:opts.searchPath,isRegex:opts.isRegex,caseSensitive:opts.caseSensitive,wholeWord:opts.wholeWord,includePattern:opts.includePattern,excludePattern:opts.excludePattern,contextLines:0,maxResults:opts.maxResults,timeoutMs:opts.timeoutMs,respectGitignore:opts.respectGitignore});
    if(_activeReq!==reqId)return;
    if(r.error){_finishDone({error:r.error});return}
    var rows=[];for(var i=0;i<r.results.length;i++){var x=r.results[i];rows.push({k:'m',f:x.file,l:x.line,c:x.col,t:x.text})}
    _appendRows(rows);
    _fileStats=r.fileStats||{};_metaArrived=true;
    _finishDone({total:r.total,wallMs:r.elapsed,truncated:r.truncated,cancelled:false,timedOut:false,stats:null});
  }catch(e){if(_activeReq===reqId)_finishDone({error:(e&&e.message)||String(e)})}
}

// ── 流事件路由（reqId 最新优先；旧搜索事件全弃）+ listFiles 扫描通道 ──
function _onStream(msg){
  if(!msg)return;
  if(msg.clientId!==_clientId)return;
  if(_listScan&&msg.reqId===_listScan.reqId){_scanEvt(msg);return}
  if(msg.reqId!==_activeReq)return;
  if(msg.kind==='phase'){
    if(msg.stage==='queued'&&_phase==='running'){_setSt('queue',_kk('goods.search.queued','排队中…（其他搜索进行中）'))}
    else if(msg.stage==='run'&&_phase!=='running'){_stRunning()}
    return;
  }
  if(msg.kind==='batch'){_appendRows(msg.rows);return}
  if(msg.kind==='meta'){_fileStats=msg.fileStats||{};_metaArrived=true;if(_phase==='done')_applySort();return}
  if(msg.kind==='done'){if(_activeReq===msg.reqId)_finishDone(msg);return}
}
function _scanEvt(msg){
  var s=_listScan;if(!s)return;
  if(msg.kind==='batch'){var rows=msg.rows||[];for(var i=0;i<rows.length;i++){if(rows[i].k==='c'){s.files.push(rows[i].f);s.total+=rows[i].n||0}}return}
  if(msg.kind==='done'){
    _listScan=null;
    if(msg.error)s.resolve({error:msg.error});
    else if(msg.timedOut)s.resolve({error:_kk('goods.search.scanTimeout','⚠️ 完整扫描超时')});
    else s.resolve({files:s.files,total:s.total,truncated:!!msg.truncated});
  }
}
// listFiles 扫描（替换流程：rg -c 轻量清单，含精确计数）
function _listScanRun(opts){
  return new Promise(function(resolve){
    if(!bri||!bri.search||!bri.search.start){resolve({legacy:true});return}
    var reqId=++_reqSeq;
    var done=false;
    var fin=function(v){if(!done){done=true;clearTimeout(to);resolve(v)}};
    var to=setTimeout(function(){if(_listScan&&_listScan.reqId===reqId)_listScan=null;fin({error:_kk('goods.search.scanTimeout','⚠️ 完整扫描超时')})},150000);
    _listScan={reqId:reqId,files:[],total:0,resolve:fin};
    try{
      bri.search.start(Object.assign({clientId:_clientId,reqId:reqId,listFiles:true,maxResults:200000,timeoutMs:120000},opts)).catch(function(e){
        if(_listScan&&_listScan.reqId===reqId){_listScan=null;fin({error:(e&&e.message)||String(e)})}
      });
    }catch(e){_listScan=null;fin({error:(e&&e.message)||String(e)});}
  });
}

// ── 流接线（bridge 晚就绪重试；init 即清同 clientId 孤儿搜索；pagehide 收尸）──

function _appendRows(rows){

  for(var i=0;i<rows.length;i++){

    var ml=document.createElement('div');ml.className='ml'+(row.k==='n'?' name':'');
    var ln=document.createElement('span');ln.className='ln';ln.textContent=row.k==='n'?'':String(row.l||'');

    ml.appendChild(ln);ml.appendChild(ct);
    ml.onclick=(function(f,l,c){return function(){opn(f,l,c)}})(row.f,row.l,row.c);
    g.body.appendChild(ml);

function _applySort(){
  if(!_groups||_groups.size===0)return;

  sg.sort(function(a,b){
    if(sm==='path')return a[0].localeCompare(b[0]);if(sm==='path-desc')return b[0].localeCompare(a[0]);
    if(sm==='count')return b[1].cnt-a[1].cnt||a[0].localeCompare(b[0]);
    if(sm==='size')return(fs[b[0]]&&fs[b[0]].size||0)-(fs[a[0]]&&fs[a[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='size-asc')return(fs[a[0]]&&fs[a[0]].size||0)-(fs[b[0]]&&fs[b[0]].size||0)||a[0].localeCompare(b[0]);
    if(sm==='mtime-asc')return(fs[a[0]]&&fs[a[0]].mtime||0)-(fs[b[0]]&&fs[b[0]].mtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime')return(fs[b[0]]&&fs[b[0]].birthtime||0)-(fs[a[0]]&&fs[a[0]].birthtime||0)||a[0].localeCompare(b[0]);
    if(sm==='birthtime-asc')return(fs[a[0]]&&fs[a[0]].birthtime||0)-(fs[b[0]]&&fs[b[0]].birthtime||0)||a[0].localeCompare(b[0]);
    return(fs[b[0]]&&fs[b[0]].mtime||0)-(fs[a[0]]&&fs[a[0]].mtime||0)||a[0].localeCompare(b[0]);
  });

    if(scan.legacy){

      if(fullR.error){pm.style.display='none';_setSt('idle',_kk('goods.search.fullScanFail','⚠️ 完整扫描失败: {0}',fullR.error));return}

    }else{

      fileSet=new Set(scan.files);totalMatches=scan.total;fc3=fileSet.size;
    }

    if(totalMatches===0){_setSt('idle',_kk('goods.search.noMatchAfterFull','⚠️ 完整扫描后无匹配项（可能已被上次替换处理完）'));return}
  }

  var cm=document.getElementById('confirm-mo');
  var smText=_kk('goods.search.confirmSummary','即将在 {0} 个文件中替换 {1} 处匹配',fc3,totalMatches);

  document.getElementById('confirm-summary').innerHTML=smText;

  for(var i2=0;i2<Math.min(previewReps.length,8);i2++){var pv=previewReps[i2],ot=pv.oldText||'';if(ot.length>60)ot=ot.slice(0,60)+'...';var nt2=rt;if(nt2.length>60)nt2=nt2.slice(0,60)+'...';
    ph+='<div><span class="f2">'+eh(pv.file.split('/').pop())+'</span><span class="ln2">:'+pv.line+'</span> <span class="old">'+eh(ot)+'</span><span class="arw">→</span><span class="nw">'+eh(nt2)+'</span></div>'}
  if(previewReps.length<totalMatches)ph+='<div style="color:var(--tx3)">'+_kk('goods.search.andMore','... 及其他 {0} 处',(totalMatches-previewReps.length))+'</div>';
  document.getElementById('confirm-preview').innerHTML=ph;cm.style.display='flex';
  var ok=await new Promise(function(rs){
    document.getElementById('confirm-ok').onclick=function(){rs(true)};
    document.getElementById('confirm-cancel').onclick=function(){rs(false)};
    cm.onclick=function(e){if(e.target===cm)rs(false)};

  cm.style.display='none';if(!ok)return;

  pm.style.display='flex';pbar.style.width='0%';pt2.textContent=_kk('goods.search.replacingPrep','准备替换...');pf.textContent='';pe.innerHTML='';var lp=0;
  try{
    var fileList=Array.from(fileSet);
    pt2.textContent=_kk('goods.search.replacingNow','正在替换 {0} 处匹配（{1} 个文件）...',totalMatches,fc3);
    var res=await bri.search.replace({files:fileList,find:_lastQ,replace:rt,useRegex:_rx,caseSensitive:_cs,wholeWord:_ww,searchPath:_resultScope,onProgress:function(d){
      var pct=d.total>0?Math.round(d.current/d.total*100):0;

        pf.textContent=d.file||'';if(d.errors&&d.errors.length)pe.innerHTML=d.errors.map(function(e){return '<div>⚠️ '+eh(e)+'</div>'}).join('');
        lp=pct}
      // 编辑器即时刷新（外部修改机器：净自动刷新/脏冲突条）
      if(d.changed&&d.absPath){try{window.parent.postMessage({type:'qqq-file-written',path:d.absPath},'*')}catch(_){}}
    }});
    pbar.style.width='100%';var ec=res.errors?res.errors.length:0;
    pt2.innerHTML=_kk('goods.search.replaceDone','✅ 已完成: <b>{0}</b> 处替换, <b>{1}</b> 个文件',res.replaced,res.files)+(ec>0?_kk('goods.search.errCount',', ⚠️ {0} 个错误',ec):'');
    if(ec>0&&res.errors){pe.innerHTML=res.errors.map(function(e){return '<div>⚠️ '+eh(e)+'</div>'}).join('')}
    _add(1,rt);setTimeout(function(){pm.style.display='none';setTimeout(dos,300)},2500)
  }catch(e){pt2.textContent=_kk('goods.search.replaceFail','⚠️ 替换出错: {0}',(e.message||e));pm.onclick=function(ev){if(ev.target===pm)pm.style.display='none'}}
};

<!-- ★ F2/Tab 非编辑态转发父窗口 → 激活 roam（同 ai-panel 模式：iframe 内按键不冒泡父窗口，必须显式 postMessage） -->
<script>
(function () {
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'F2' && e.key !== 'Tab' && e.key !== 'x') return;
    var el = document.activeElement;
    var tag = el && el.tagName ? el.tagName.toUpperCase() : '';
    var editing = el && (el.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA');
    if (editing) return;
    if (e.repeat) return; // ★ 2026-09-27: 按住自动重复不转发（x 短按/长按由父窗口机器 600ms 计时，重复会破坏判定）
    var accel = e.key === 'F2' ? 'F2' : (e.key === 'Tab' ? 'Tab' : 'X');
    try { parent.postMessage({ type: 'qqq-key', accel: accel, scope: 'window' }, '*'); } catch (_) {}
    e.preventDefault();
  }, true);
  // ★ 2026-09-27: x 抬起转发 → 父窗口 x 键呈递机器（600ms 内抬起=短按→kmd；超时=长按→qmd）
  document.addEventListener('keyup', function (e) {
    if (e.key !== 'x' && e.key !== 'X') return;
    try { parent.postMessage({ type: 'qqq-key', accel: 'X', scope: 'window', up: true }, '*'); } catch (_) {}
  }, true);
})();
</script>
