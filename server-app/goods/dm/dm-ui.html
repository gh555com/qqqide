<!DOCTYPE html>
<html lang="zh-CN" style="height:100%;margin:0;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>inbox</title>
<link rel="stylesheet" href="dm-ui.css">
</head>
<body>
<div id="app">
  <!-- ═══ SIDEBAR ═══ -->
  <div id="sidebar">
    <!-- bed 入口 2×2（2026-09-14）：左 = bed + 箱子图标；右 = 文件数 / 占用（消费入 tooltip）→ 点击打开 bed（folder=inbox） -->
    <div id="bed-entry" title="打开 bed 我的文件" data-i18n-title="goods.dm.bedOpen">
      <div id="bed-left">
        <div id="bed-title">bed</div>
        <div id="bed-icon"><span class="qqi qqi-zip"></span></div>
      </div>
      <div id="bed-body">
        <div id="bed-files" data-i18n="common.loading">加载中…</div>
        <div id="bed-size"></div>
      </div>
    </div>
    <div id="sidebar-search">
      <div id="sidebar-search-wrap">
        <input type="text" id="search-input" placeholder="find" autocomplete="off">
      </div>
    </div>
    <div id="conv-list"></div>
    <div id="new-dm-bar">
      <input type="text" id="new-peer-input" placeholder="键入完整手机号（带国家码），如正版关怀：8615802858204" data-i18n-placeholder="goods.dm.peerPh" maxlength="20" autocomplete="off">
    </div>
    <div id="sidebar-footer">
      <button id="btn-new-msg" data-i18n="goods.dm.newMsg">+ 新建消息</button>
      <button id="btn-new-group" data-i18n="goods.dm.newGroup">+ 新建群</button>
    </div>
    <span id="connection-label"><span id="connection-dot"></span><span id="connection-text" data-i18n="goods.dm.connecting">连接中…</span></span>
  </div>

  <!-- 弹窗（新建群 / 群成员管理） -->
  <div id="modal-mask" class="modal-mask" style="display:none">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn" data-i18n="common.cancel">取消</button>
        <button id="modal-ok" class="modal-btn primary" data-i18n="common.confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 分割线：可拖动调整左右比例 -->
  <div id="splitter" title="拖动调整左右比例" data-i18n-title="goods.dm.splitterTip"></div>

  <!-- ═══ MAIN PANEL ═══ -->
  <div id="main">
    <div id="empty-state">
      <div id="empty-icon"><span class="qqi qqi-chat"></span></div>
      <div id="empty-title" data-i18n="goods.dm.emptyTitle">选择一条对话</div>
      <div id="empty-sub" data-i18n="goods.dm.emptySub">从左侧选择一个联系人，或搜索手机号开始新对话</div>
    </div>
    <div id="chat-header">
      <div>
        <div id="chat-header-name"></div>
        <div id="chat-header-status"></div>
      </div>
    </div>
    <div id="msg-list"></div>
    <div id="input-area">
      <div id="attach-bar"></div>
      <div id="input-row">
        <textarea id="msg-input" placeholder="键入消息… (Enter 发送，Shift+Enter 换行；文件直接 Ctrl+V 粘贴，或拖入窗口)" data-i18n-placeholder="goods.dm.inputPh" maxlength="2000" rows="1"></textarea>
        <button id="send-btn" title="发送 (Enter)" data-i18n-title="goods.dm.sendTip">▶</button>
      </div>
    </div>
  </div>
</div>

<!-- 图片灯箱（点击图片 = 本面板查看；保存走下载机器） -->
<div id="img-lb">
  <img id="img-lb-img" alt="">
  <div id="img-lb-bar">
    <span id="img-lb-dl" title="保存图片（Shift+点击 = 另存为）" data-i18n-title="goods.dm.imgSaveTip"><span data-i18n="goods.dm.imgSave">⬇ 保存</span></span>
    <span id="img-lb-close" title="关闭 (Esc)" data-i18n-title="common.close">✕</span>
  </div>
</div>

<script src="../../core/char-undo.js"></script>
<script src="../../core/i18n.js"></script>
<!-- ★ 外拖文本提取机（唯一真理源 core/drag-text.js；AI 面板/inbox 共享） -->
<script src="../../core/drag-text.js"></script>
<script src="../../core/qqq-icons.js"></script>
<script src="dm-ui.js"></script>
<!-- ★ F2/Tab 非编辑态转发父窗口 → 激活 roam（同 ai-panel 模式：iframe 内按键不冒泡父窗口，必须显式 postMessage） -->
<script>
(function () {
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'F2' && e.key !== 'Tab' && e.key !== 'x') return;
    var el = document.activeElement;
    var tag = el && el.tagName ? el.tagName.toUpperCase() : '';
    var editing = el && (el.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA');
    if (editing) return;
    if (e.repeat) return; // ★ 2026-09-27: 按住自动重复不转发（x 短按/长按由父窗口机器 600ms 计时，重复会破坏判定）
    var accel = e.key === 'F2' ? 'F2' : (e.key === 'Tab' ? 'Tab' : 'X');
    try { parent.postMessage({ type: 'qqq-key', accel: accel, scope: 'window' }, '*'); } catch (_) {}
    e.preventDefault();
  }, true);
  // ★ 2026-09-27: x 抬起转发 → 父窗口 x 键呈递机器（600ms 内抬起=短按→kmd；超时=长按→qmd）
  document.addEventListener('keyup', function (e) {
    if (e.key !== 'x' && e.key !== 'X') return;
    try { parent.postMessage({ type: 'qqq-key', accel: 'X', scope: 'window', up: true }, '*'); } catch (_) {}
  }, true);
})();
</script>
</body>
</html>
