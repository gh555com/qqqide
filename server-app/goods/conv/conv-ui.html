<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上下文格子</title>
<style>
:root {
    --bg: #fdf6e3;
    --bg2: #eee8d5;
    --fg: #586e75;
    --fg2: #839496;
    --border: #d3cbb7;
    --blue: #268bd2;
    --cyan: #2aa198;
    --green: #859900;
    --yellow: #b58900;
    --orange: #cb4b16;
    --red: #dc322f;
    --magenta: #d33682;
    --violet: #6c71c4;
    --base03: #002b36;
    --base02: #073642;
    --base2: #eee8d5;
    --base3: #fdf6e3;
}
[data-theme="dark"], .dark {
    --bg: #002b36;
    --bg2: #073642;
    --fg: #839496;
    --fg2: #586e75;
    --border: #1a4a54;
    --base03: #fdf6e3;
    --base2: #073642;
    --base3: #002b36;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
}

/* ── 顶栏 ── */
.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
}
.topbar-title {
    font-weight: 700;
    font-size: 13px;
    color: var(--fg);
    margin-right: auto;
}
.topbar-stat {
    font-size: 11px;
    color: var(--fg2);
    white-space: nowrap;
}
.topbar-stat b { color: var(--fg); }
.topbar-refresh {
    padding: 3px 10px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
}
.topbar-refresh:hover { background: var(--base2); }

/* ── 工具栏 ── */
.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
}
.toolbar button {
    padding: 4px 12px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg2);
    color: var(--fg);
    cursor: pointer;
    white-space: nowrap;
}
.toolbar button:hover { background: var(--base2); }
.toolbar button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.toolbar button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.toolbar button.danger { background: var(--red); color: #fff; border-color: var(--red); }
.toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* ── 搜索 ── */
.toolbar input {
    padding: 4px 8px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    color: var(--fg);
    outline: none;
    width: 180px;
}
.toolbar input:focus { border-color: var(--blue); }

/* ── 格子列表 ── */
.cells {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
}
.cells::-webkit-scrollbar { width: 5px; }
.cells::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── 格子卡片 ── */
.cell {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
}
.cell.selected { background: rgba(38,139,210,0.08); }
.cell-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    cursor: pointer;
    min-height: 32px;
}
.cell-header:hover { background: var(--bg2); }
.cell-check {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    font-size: 10px;
    color: transparent;
    transition: all 0.15s;
}
.cell-check.checked { background: var(--blue); border-color: var(--blue); color: #fff; }
.cell-role {
    font-weight: 700;
    font-size: 11px;
    min-width: 70px;
    flex-shrink: 0;
}
.cell-role.user { color: var(--blue); }
.cell-role.assistant { color: var(--cyan); }
.cell-role.tool { color: var(--red); }
.cell-role.system { color: var(--violet); }
.cell-role.guard { color: var(--magenta); }
.cell-role.toolsdef { color: var(--yellow); }
.cell-preview {
    flex: 1;
    font-size: 11px;
    color: var(--fg2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
}
.cell-meta {
    font-size: 10px;
    color: var(--fg2);
    flex-shrink: 0;
    white-space: nowrap;
}
.cell-meta .chars { color: var(--fg2); }
.cell-meta .tokens { color: var(--yellow); font-weight: 600; }
.cell-expand {
    font-size: 14px;
    color: var(--fg2);
    width: 18px;
    text-align: center;
    flex-shrink: 0;
    transition: transform 0.2s;
}
.cell.open .cell-expand { transform: rotate(90deg); }

/* ── 格子内容（展开） ── */
.cell-body {
    display: none;
    padding: 0 10px 8px 10px;
    border-top: 1px solid var(--border);
    margin: 0 10px;
}
.cell.open .cell-body { display: block; }
.cell-content {
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 11px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 360px;
    overflow-y: auto;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-top: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    user-select: text;
}
.cell-content::-webkit-scrollbar { width: 5px; }
.cell-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.cell-content.editing {
    border-color: var(--blue);
    outline: none;
    max-height: none;
}

/* ── 底栏 ── */
.bottombar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}
.bottombar .count {
    font-size: 11px;
    color: var(--fg2);
    margin-right: auto;
}
.bottombar .count b { color: var(--fg); }

/* ── toast ── */
.toast {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 18px;
    background: var(--base03);
    color: var(--base3);
    border-radius: 4px;
    font-size: 12px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}
.toast.show { opacity: 1; }

/* ── 空状态 ── */
.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--fg2);
    font-size: 13px;
    flex-direction: column;
    gap: 8px;
}
.empty-icon { font-size: 40px; opacity: 0.3; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
    <span class="topbar-title">📋 上下文格子</span>
    <span class="topbar-stat" id="stat-cells">格子: <b>0</b></span>
    <span class="topbar-stat" id="stat-chars">字符: <b>0</b></span>
    <span class="topbar-stat" id="stat-tokens">估算: <b>0</b>k</span>
    <span class="topbar-stat" id="stat-api">API: <b>--</b></span>
    <button class="topbar-refresh" onclick="refresh()">🔄 刷新</button>
</div>

<div class="toolbar" id="toolbar">
    <button onclick="selectAll()">☑ 全选</button>
    <button onclick="clearSelection()">☐ 取消</button>
    <span class="sep"></span>
    <button onclick="expandAll()">▸ 全部展开</button>
    <button onclick="collapseAll()">▹ 全部折叠</button>
    <span class="sep"></span>
    <input type="text" id="searchInput" placeholder="搜索格子内容…" oninput="onSearch(this.value)">
    <span class="sep"></span>
    <button class="primary" id="btnNewQuest" disabled onclick="openNewQuest()">🚀 选中格子开新对话</button>
    <button onclick="exportSelected()">📋 复制选中内容</button>
</div>

<div class="cells" id="cells"></div>

<div class="bottombar">
    <span class="count" id="selCount">已选 <b>0</b> 格</span>
    <span style="font-size:10px;color:var(--fg2)">💡 点击格子展开查看完整内容 · 勾选后可用「开新对话」</span>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

var CPT = 2.5;
var _cells = [];
var _selected = {};
var _expanded = {};
var _questId = '';
var _panelId = 1;
var _agent = null;

// ── 透传颜色变量（跟随父窗口主题） ──
function syncTheme() {
    try {
        var p = window.parent;
        // 读父窗口 data-theme
        var theme = p.document.documentElement.getAttribute('data-theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        else document.documentElement.removeAttribute('data-theme');
        // 读 CSS 变量
        var styles = getComputedStyle(p.document.documentElement);
        var vars = ['--bg','--bg2','--fg','--fg2','--border','--blue','--cyan','--green','--yellow','--orange','--red','--violet','--magenta','--base03','--base2','--base3'];
        var root = document.documentElement.style;
        for (var i = 0; i < vars.length; i++) {
            var v = vars[i];
            var val = styles.getPropertyValue(v).trim();
            if (val) root.setProperty(v, val);
        }
    } catch (e) {}
}

// ── 从 parent 拿 agent 数据 ──
function getAgent() {
    try {
        var pool = window.parent.__qqq_agentPool;
        var qid = window.parent.__qqq_convQuestId || '';
        if (!pool || !qid) return null;
        _questId = qid;
        _panelId = window.parent.__qqq_convPanelId || 1;
        // agentPool key: questId (主面板) 或 _draft_pN (draft)
        var ag = pool[qid];
        if (!ag) {
            // try draft keys
            for (var k in pool) {
                if (pool[k]._questId === qid || pool[k].questId === qid) { ag = pool[k]; break; }
            }
        }
        return ag || null;
    } catch (e) { return null; }
}

// ── 构建格子列表 ──
function buildCells(ag) {
    var cells = [];
    if (!ag) return cells;
    var conv = ag.conversation || [];
    var ctx = ag._ctx || null;

    // Cell 0: Server Guard
    cells.push({
        id: 'guard',
        type: 'guard',
        role: 'guard',
        label: 'Server Guard（服务端甲壳提示词）',
        content: '[此内容由服务端 Go 程序注入到 messages[0] 之前，客户端不可见。]\n[文件: gaea/guard/system-prompt.txt — 约 14964 字符]',
        chars: 14964,
        editable: false,
        group: '注入'
    });

    // Cell 1: Tools Definition（从 AI 面板 iframe 取 getTools）
    var toolsChars = 0;
    var toolsContent = '';
    try {
        var tools = null;
        var aiFrame = window.parent.document.getElementById('qqq-ai-iframe-p' + _panelId);
        if (aiFrame && aiFrame.contentWindow && typeof aiFrame.contentWindow.getTools === 'function') {
            tools = aiFrame.contentWindow.getTools();
        }
        if (tools && tools.length) {
            toolsContent = JSON.stringify(tools, null, 2);
            toolsChars = toolsContent.length;
        }
    } catch (_) {}
    cells.push({
        id: 'toolsdef',
        type: 'toolsdef',
        role: 'toolsdef',
        label: 'Tools Definition（工具定义 JSON）',
        content: toolsContent || '[无法读取工具定义]',
        chars: toolsChars,
        editable: false,
        group: '注入'
    });

    // Cells from conversation
    for (var i = 0; i < conv.length; i++) {
        var m = conv[i];
        if (!m) continue;
        var isPersistent = !!m._persistent;
        var role = m.role || 'unknown';
        var content = typeof m.content === 'string' ? m.content : (m.content ? JSON.stringify(m.content) : '');
        var chars = content.length;
        var cellId = 'msg-' + i;
        var label = '';
        var group = '';

        if (isPersistent) {
            group = '客户端规则';
            label = 'msg[0] · Client Rules & Docs（第 ' + i + ' 条）';
        } else if (role === 'user') {
            group = '用户消息';
            label = 'User · 第 ' + i + ' 条';
        } else if (role === 'assistant') {
            if (m._error) {
                group = '错误';
                label = 'AI Error · 第 ' + i + ' 条';
                role = 'error';
            } else {
                group = 'AI 回复';
                if (m.tool_calls) {
                    label = 'AI tool_calls · 第 ' + i + ' 条';
                    // Show both content and tool_calls
                    var tcJson = '';
                    try { tcJson = JSON.stringify(m.tool_calls, null, 2); } catch (_) {}
                    if (content) {
                        content = '── text ──\n' + content + '\n\n── tool_calls ──\n' + tcJson;
                    } else {
                        content = tcJson;
                    }
                    chars = content.length;
                } else {
                    label = 'AI text · 第 ' + i + ' 条';
                }
            }
        } else if (role === 'tool') {
            group = '工具结果';
            label = 'Tool Result · 第 ' + i + ' 条';
        } else if (role === 'system') {
            group = '系统消息';
            label = 'System · 第 ' + i + ' 条';
            if (m._dynamic) {
                label += ' (动态上下文)';
                group = '压缩上下文';
            }
        } else {
            group = '其他';
            label = role + ' · 第 ' + i + ' 条';
        }

        cells.push({
            id: cellId,
            type: role,
            role: role,
            label: label,
            content: content,
            chars: chars,
            editable: !isPersistent,
            group: group,
            _msg: m,
            _index: i
        });
    }

    // Compressed summary (from agent._ctx)
    if (ctx) {
        var narrativeChars = (ctx.narrative || '').length;
        if (narrativeChars > 0) {
            cells.push({
                id: 'comp-narrative',
                type: 'system',
                role: 'system',
                label: '压缩摘要 · 叙事',
                content: ctx.narrative,
                chars: narrativeChars,
                editable: false,
                group: '压缩上下文'
            });
        }
        if (ctx.facts && ctx.facts.length > 0) {
            var factsText = '';
            for (var fi = 0; fi < ctx.facts.length; fi++) {
                var f = ctx.facts[fi];
                factsText += '[' + (f.type || 'fact') + '] ' + (f.content || '') + '\n';
            }
            cells.push({
                id: 'comp-facts',
                type: 'system',
                role: 'system',
                label: '压缩摘要 · 事实 × ' + ctx.facts.length,
                content: factsText,
                chars: factsText.length,
                editable: false,
                group: '压缩上下文'
            });
        }
    }

    return cells;
}

// ── 渲染 ──
function render() {
    var container = document.getElementById('cells');
    var apiPrompt = _agent ? (_agent._lastApiPromptTokens || 0) : 0;
    var totalChars = 0;
    var totalTok = 0;
    for (var i = 0; i < _cells.length; i++) {
        totalChars += _cells[i].chars;
        totalTok += Math.round(_cells[i].chars / CPT);
    }

    // stats
    document.getElementById('stat-cells').innerHTML = '格子: <b>' + _cells.length + '</b>';
    document.getElementById('stat-chars').innerHTML = '字符: <b>' + (totalChars >= 1000 ? (totalChars/1000).toFixed(0)+'k' : totalChars) + '</b>';
    document.getElementById('stat-tokens').innerHTML = '估算: <b>' + (totalTok >= 1000 ? (totalTok/1000).toFixed(0)+'k' : totalTok) + '</b>';
    document.getElementById('stat-api').innerHTML = 'API: <b>' + (apiPrompt > 0 ? (apiPrompt/1000).toFixed(0)+'k' : '--') + '</b>';

    if (_cells.length === 0) {
        container.innerHTML = '<div class="empty"><span class="empty-icon">📭</span><span>没有格子数据</span><span style="font-size:11px">请先打开一个对话，然后点击 AI 面板右下角"上下文"→"管理"</span></div>';
        return;
    }

    var html = '';
    var lastGroup = '';
    for (var i = 0; i < _cells.length; i++) {
        var cell = _cells[i];
        var tok = Math.round(cell.chars / CPT);
        var isOpen = !!_expanded[cell.id];
        var isSel = !!_selected[cell.id];

        // group header
        if (cell.group && cell.group !== lastGroup) {
            html += '<div style="padding:6px 10px;font-size:10px;font-weight:700;color:var(--fg2);background:var(--bg2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.5px">' + esc(cell.group) + '</div>';
            lastGroup = cell.group;
        }

        var roleClass = cell.role === 'user' ? 'user' : cell.role === 'assistant' ? 'assistant' : cell.role === 'tool' ? 'tool' : cell.role === 'system' ? 'system' : cell.role === 'guard' ? 'guard' : cell.role === 'toolsdef' ? 'toolsdef' : cell.role === 'error' ? 'tool' : '';
        var charsStr = cell.chars >= 1000 ? (cell.chars/1000).toFixed(1)+'k' : cell.chars;
        var tokStr = tok >= 1000 ? (tok/1000).toFixed(0)+'k' : tok;

        html += '<div class="cell' + (isOpen ? ' open' : '') + (isSel ? ' selected' : '') + '" data-id="' + cell.id + '">';
        html += '<div class="cell-header" onclick="toggleCell(\'' + cell.id + '\')">';
        html += '<span class="cell-check' + (isSel ? ' checked' : '') + '" onclick="event.stopPropagation();toggleSelect(\'' + cell.id + '\')">' + (isSel ? '✓' : '') + '</span>';
        html += '<span class="cell-role ' + roleClass + '">' + esc(cell.role) + '</span>';
        html += '<span class="cell-preview">' + esc(truncate(cell.content, 80)) + '</span>';
        html += '<span class="cell-meta"><span class="chars">' + charsStr + '</span> · <span class="tokens">~' + tokStr + ' tok</span></span>';
        html += '<span class="cell-expand">▶</span>';
        html += '</div>';
        html += '<div class="cell-body"><div class="cell-content' + (cell.editable ? ' editable' : '') + '" data-cell="' + cell.id + '"' + (cell.editable ? ' contenteditable="false"' : '') + '>' + esc(cell.content) + '</div>';
        if (cell.editable) {
            html += '<div style="margin-top:4px;display:flex;gap:6px">';
            html += '<button style="padding:2px 8px;font-size:10px;border:1px solid var(--border);border-radius:3px;background:var(--bg2);color:var(--fg);cursor:pointer" onclick="event.stopPropagation();toggleEdit(\'' + cell.id + '\')" data-editbtn="' + cell.id + '">✎ 编辑</button>';
            html += '<button style="padding:2px 8px;font-size:10px;border:1px solid var(--border);border-radius:3px;background:var(--bg2);color:var(--fg);cursor:pointer" onclick="event.stopPropagation();copyCell(\'' + cell.id + '\')">📋 复制</button>';
            html += '</div>';
        }
        html += '</div>';
        html += '</div>';
    }

    container.innerHTML = html;
    updateSelectionUI();
}

function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function truncate(s, n) {
    if (!s) return '';
    var t = s.replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
}

// ── 交互 ──
function toggleCell(id) {
    _expanded[id] = !_expanded[id];
    render();
    // scroll to cell
    var el = document.querySelector('.cell[data-id="' + id + '"]');
    if (el && _expanded[id]) {
        setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
    }
}

function toggleSelect(id) {
    _selected[id] = !_selected[id];
    render();
}

function selectAll() {
    for (var i = 0; i < _cells.length; i++) _selected[_cells[i].id] = true;
    render();
}

function clearSelection() {
    _selected = {};
    render();
}

function expandAll() {
    for (var i = 0; i < _cells.length; i++) _expanded[_cells[i].id] = true;
    render();
}

function collapseAll() {
    _expanded = {};
    render();
}

function toggleEdit(id) {
    var el = document.querySelector('.cell-content[data-cell="' + id + '"]');
    if (!el) return;
    var isEditing = el.getAttribute('contenteditable') === 'true';
    if (isEditing) {
        // save
        el.setAttribute('contenteditable', 'false');
        el.classList.remove('editing');
        var btn = document.querySelector('[data-editbtn="' + id + '"]');
        if (btn) btn.textContent = '✎ 编辑';
        // update cell data
        var cell = findCell(id);
        if (cell) { cell.content = el.textContent || ''; cell.chars = cell.content.length; }
        toast('已保存');
    } else {
        el.setAttribute('contenteditable', 'true');
        el.classList.add('editing');
        el.focus();
        var btn = document.querySelector('[data-editbtn="' + id + '"]');
        if (btn) btn.textContent = '✓ 完成';
    }
}

function findCell(id) {
    for (var i = 0; i < _cells.length; i++) { if (_cells[i].id === id) return _cells[i]; }
    return null;
}

function copyCell(id) {
    var cell = findCell(id);
    if (!cell) return;
    try {
        navigator.clipboard.writeText(cell.content).then(function () { toast('已复制到剪贴板'); });
    } catch (e) {
        // fallback
        var ta = document.createElement('textarea');
        ta.value = cell.content;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toast('已复制到剪贴板');
    }
}

function onSearch(q) {
    if (!q || !q.trim()) {
        // reset all visibility
        var allCells = document.querySelectorAll('.cell');
        for (var i = 0; i < allCells.length; i++) allCells[i].style.display = '';
        return;
    }
    q = q.toLowerCase();
    for (var i = 0; i < _cells.length; i++) {
        var cell = _cells[i];
        var el = document.querySelector('.cell[data-id="' + cell.id + '"]');
        if (!el) continue;
        var match = cell.label.toLowerCase().indexOf(q) >= 0 || cell.content.toLowerCase().indexOf(q) >= 0;
        el.style.display = match ? '' : 'none';
        if (match) {
            _expanded[cell.id] = true;
        }
    }
    // re-render to show expanded state
    if (q.trim()) render();
}

// ── 选中格子开新对话 ──
function openNewQuest() {
    var selIds = Object.keys(_selected).filter(function (k) { return _selected[k]; });
    if (selIds.length === 0) return;
    
    // 收集选中格子的内容
    var selectedCells = [];
    for (var i = 0; i < _cells.length; i++) {
        if (_selected[_cells[i].id]) selectedCells.push(_cells[i]);
    }

    // 构建初始上下文
    var instructions = [
        '═══ 以下是从对话「' + (_questId || '未知') + '」中提取的上下文格子 ═══',
        '这些内容来自之前的对话。请基于这些上下文来回答问题。',
        ''
    ];
    for (var i = 0; i < selectedCells.length; i++) {
        var c = selectedCells[i];
        instructions.push('── ' + c.label + ' ──');
        instructions.push(c.content);
        instructions.push('');
    }

    // 通过 postMessage 直接投递给 AI 面板 iframe
    try {
        var aiFrameId = 'qqq-ai-iframe-p' + _panelId;
        var aiFrame = window.parent.document.getElementById(aiFrameId);
        if (aiFrame && aiFrame.contentWindow) {
            aiFrame.contentWindow.postMessage({
                type: 'qqq-conv-new-quest',
                panelId: _panelId,
                context: instructions.join('\n'),
                questId: _questId
            }, '*');
            toast('已发送到新对话');
        } else {
            // fallback: set on parent and hope AI panel polls it
            window.parent.__qqq_convNewQuestCtx = instructions.join('\n');
            window.parent.postMessage({ type: 'qqq-conv-new-quest', panelId: _panelId, context: instructions.join('\n'), questId: _questId }, '*');
            toast('已发送（请切换到 AI 面板查看）');
        }
    } catch (e) {
        toast('失败: ' + e.message);
    }
}

function exportSelected() {
    var selIds = Object.keys(_selected).filter(function (k) { return _selected[k]; });
    if (selIds.length === 0) { toast('请先选中格子'); return; }
    var lines = [];
    for (var i = 0; i < _cells.length; i++) {
        if (_selected[_cells[i].id]) {
            lines.push('═══ ' + _cells[i].label + ' ═══');
            lines.push(_cells[i].content);
            lines.push('');
        }
    }
    try {
        navigator.clipboard.writeText(lines.join('\n')).then(function () { toast('已复制 ' + selIds.length + ' 个格子'); });
    } catch (e) {
        var ta = document.createElement('textarea');
        ta.value = lines.join('\n');
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toast('已复制 ' + selIds.length + ' 个格子');
    }
}

function updateSelectionUI() {
    var selCount = Object.keys(_selected).filter(function (k) { return _selected[k]; }).length;
    document.getElementById('selCount').innerHTML = '已选 <b>' + selCount + '</b> 格';
    var btn = document.getElementById('btnNewQuest');
    btn.disabled = selCount === 0;
}

function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(function () { el.classList.remove('show'); }, 2000);
}

// ── 刷新 ──
function refresh() {
    _agent = getAgent();
    _cells = buildCells(_agent);
    _selected = {};
    syncTheme();
    render();
}

// ── 初始化 ──
syncTheme();
_agent = getAgent();
_cells = buildCells(_agent);
render();

// 监听父窗口主题变化
try {
    var observer = new MutationObserver(function () {
        syncTheme();
        render();
    });
    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch (e) {}

// 监听来自 AI 面板的刷新消息
window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'qqq-conv-refresh') {
        refresh();
    }
});

// 定时刷新（每 2s 检查 agent 数据是否变化）
setInterval(function () {
    var ag = getAgent();
    if (ag !== _agent) {
        _agent = ag;
        _cells = buildCells(_agent);
        render();
    }
}, 2000);
</script>
</body>
</html>
