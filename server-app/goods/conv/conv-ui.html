<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="goods.conv.title">上下文背包</title>
<style>
:root {
    --bg: #fdf6e3; --bg2: #eee8d5; --fg: #586e75; --fg2: #839496;
    --border: #d3cbb7; --blue: #268bd2; --cyan: #2aa198; --green: #859900;
    --yellow: #b58900; --orange: #cb4b16; --red: #dc322f; --magenta: #d33682;
    --violet: #6c71c4; --base03: #002b36; --base02: #073642;
}
[data-theme="dark"], .dark {
    --bg: #002b36; --bg2: #073642; --fg: #839496; --fg2: #586e75;
    --border: #1a4a54; --base03: #fdf6e3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 12px; line-height: 1.5; background: var(--bg); color: var(--fg);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none;
}

/* ── 顶栏 ── */
.topbar {
    display: flex; align-items: center; gap: 12px; padding: 6px 10px;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
}
.topbar-title { font-weight: 700; font-size: 13px; color: var(--fg); margin-right: auto; }
.topbar-stat { font-size: 11px; color: var(--fg2); white-space: nowrap; }
.topbar-stat b { color: var(--fg); }
.topbar button {
    padding: 3px 10px; font-size: 11px; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg); color: var(--fg); cursor: pointer;
}
.topbar button:hover { background: var(--bg2); }

/* ── 工具栏 ── */
.toolbar {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
}
.toolbar button {
    padding: 4px 12px; font-size: 11px; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg2); color: var(--fg); cursor: pointer; white-space: nowrap;
}
.toolbar button:hover { background: var(--bg); }
.toolbar button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.toolbar button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.toolbar input {
    padding: 4px 8px; font-size: 11px; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg); color: var(--fg); outline: none; width: 180px;
}
.toolbar input:focus { border-color: var(--blue); }

/* ── 格子列表 ── */
.cells {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.cells::-webkit-scrollbar { width: 5px; }
.cells::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── 分组标题 ── */
.group-hd {
    padding: 6px 10px; font-size: 10px; font-weight: 700; color: var(--fg2);
    background: var(--bg2); border-bottom: 1px solid var(--border);
    text-transform: uppercase; letter-spacing: 0.5px;
}

/* ── 卡片 ── */
.cell { border-bottom: 1px solid var(--border); transition: background 0.1s; }
.cell.selected { background: rgba(38,139,210,0.08); }
.cell-header {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px;
    cursor: pointer; min-height: 32px;
}
.cell-header:hover { background: var(--bg2); }
.cell-check {
    width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    cursor: pointer; font-size: 10px; color: transparent; transition: all 0.15s;
}
.cell-check.checked { background: var(--blue); border-color: var(--blue); color: #fff; }
.cell-role { font-weight: 700; font-size: 11px; min-width: 70px; flex-shrink: 0; }
.cell-role.user { color: var(--blue); }
.cell-role.assistant { color: var(--cyan); }
.cell-role.tool { color: var(--red); }
.cell-role.system { color: var(--violet); }
.cell-role.guard { color: var(--magenta); }
.cell-role.toolsdef { color: var(--yellow); }
.cell-preview {
    flex: 1; font-size: 11px; color: var(--fg2); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.cell-meta {
    font-size: 10px; color: var(--fg2); flex-shrink: 0; white-space: nowrap;
    display: flex; gap: 6px; align-items: center;
}
.cell-meta .tok { color: var(--yellow); font-weight: 600; }
.cell-expand {
    font-size: 14px; color: var(--fg2); width: 18px; text-align: center;
    flex-shrink: 0; transition: transform 0.2s;
}
.cell.open .cell-expand { transform: rotate(90deg); }

/* ── 展开内容 ── */
.cell-body { display: none; padding: 0 10px 6px 10px; margin: 0 10px; }
.cell.open .cell-body { display: block; }
.cell-content {
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 11px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    max-height: 400px; overflow-y: auto; padding: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent; user-select: text;
}
.cell-content::-webkit-scrollbar { width: 5px; }
.cell-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.cell-actions { display: flex; gap: 6px; margin-top: 4px; }
.cell-actions button {
    padding: 2px 10px; font-size: 10px; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg2); color: var(--fg); cursor: pointer;
}
.cell-actions button:hover { background: var(--bg); }

/* ── 底栏 ── */
.bottombar {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0;
}
.bottombar .count { font-size: 11px; color: var(--fg2); margin-right: auto; }
.bottombar .count b { color: var(--fg); }

/* ── toast ── */
.toast {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    padding: 6px 18px; background: var(--base03); color: var(--bg);
    border-radius: 4px; font-size: 12px; z-index: 999; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ── 空状态 ── */
.empty {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--fg2); font-size: 13px; flex-direction: column; gap: 8px;
}
.empty-icon { font-size: 40px; opacity: 0.3; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
    <span class="topbar-title">📋 <span data-i18n="goods.conv.title">上下文背包</span> <span id="quest-label"></span></span>
    <span class="topbar-stat" id="stat-cells"><span data-i18n="goods.conv.cells">格子</span>: <b>0</b></span>
    <span class="topbar-stat" id="stat-chars"><span data-i18n="goods.conv.chars">字符</span>: <b>0</b></span>
    <span class="topbar-stat" id="stat-tokens"><span data-i18n="goods.conv.estimate">估算</span>: <b>0</b>k</span>
    <span class="topbar-stat" id="stat-api"><span data-i18n="goods.conv.api">API</span>: <b>--</b></span>
    <button onclick="refresh()">🔄 <span data-i18n="goods.conv.refresh">刷新</span></button>
</div>

<div class="toolbar" id="toolbar">
    <button onclick="selectAll()">☑ <span data-i18n="goods.conv.selectAll">全选</span></button>
    <button onclick="clearSelection()">☐ <span data-i18n="goods.conv.clearSel">取消</span></button>
    <span class="sep"></span>
    <button onclick="expandAll()">▸ <span data-i18n="goods.conv.expandAll">全部展开</span></button>
    <button onclick="collapseAll()">▹ <span data-i18n="goods.conv.collapseAll">全部折叠</span></button>
    <span class="sep"></span>
    <input type="text" id="searchInput" data-i18n-placeholder="goods.conv.searchPlaceholder" placeholder="搜索格子…" oninput="onSearch(this.value)">
    <span class="sep"></span>
    <button class="primary" id="btnNewQuest" disabled onclick="openNewQuest()">🚀 <span data-i18n="goods.conv.openNewQuest">选中格子 → 新对话</span></button>
</div>

<div class="cells" id="cells"></div>

<div class="bottombar">
    <span class="count" id="selCount">已选 <b>0</b> 格</span>
    <span style="font-size:10px;color:var(--fg2)">💡 <span data-i18n="goods.conv.hint">勾选格子 → 「选中格子→新对话」会把格子内容作为新对话上下文</span></span>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── i18n helper ──
function _i(key, fallback) {
    try { if (parent && parent._i) return parent._i(key, fallback); } catch (_) {}
    try { if (parent && parent.parent && parent.parent._i) return parent.parent._i(key, fallback); } catch (_) {}
    return fallback;
}

var CPT = 2.5;
var _cells = [];
var _selected = {};
var _expanded = {};
var _questId = '';
var _panelId = 1;
var _agent = null;

// ── 从 URL 参数读 questId ──
(function() {
    try {
        var qs = location.search.substring(1);
        var parts = qs.split('&');
        for (var pi = 0; pi < parts.length; pi++) {
            var kv = parts[pi].split('=');
            if (kv[0] === 'quest') { _questId = decodeURIComponent(kv[1] || ''); }
            if (kv[0] === 'panel') { _panelId = parseInt(kv[1], 10) || 1; }
        }
    } catch(_) {}
})();

// ── 主题同步 ──
function syncTheme() {
    try {
        var p = window.parent;
        var theme = p.document.documentElement.getAttribute('data-theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        else document.documentElement.removeAttribute('data-theme');
        var styles = getComputedStyle(p.document.documentElement);
        var vars = ['--bg','--bg2','--fg','--fg2','--border','--blue','--cyan','--green','--yellow','--orange','--red','--violet','--magenta','--base03'];
        var root = document.documentElement.style;
        for (var i = 0; i < vars.length; i++) {
            var v = vars[i]; var val = styles.getPropertyValue(v).trim();
            if (val) root.setProperty(v, val);
        }
    } catch (e) {}
}

// ── 获取 agent ──
function getAgent() {
    try {
        var pool = window.parent.__qqq_agentPool;
        // ★ 优先 URL 参数，兜底全局变量
        var qid = _questId || window.parent.__qqq_convQuestId || '';
        if (!pool || !qid) return null;
        if (!_questId) _questId = qid;
        if (!_panelId) _panelId = window.parent.__qqq_convPanelId || 1;
        var ag = pool[qid];
        if (!ag) {
            for (var k in pool) {
                if (pool[k]._questId === qid || pool[k].questId === qid) { ag = pool[k]; break; }
            }
        }
        return ag || null;
    } catch (e) { return null; }
}

// ── 构建格子（零遗漏）──
function buildCells(ag) {
    var cells = [];
    if (!ag) return cells;
    var conv = ag.conversation || [];
    var ctx = ag._ctx || null;

    // ═══ 服务端甲壳 ═══
    cells.push({
        id: 'guard', type: 'guard', role: 'guard',
        label: 'Server Guard', group: '注入',
        content: '[服务端 Go 注入到 messages[0] 之前，客户端不可见]\n[文件: gaea/guard/system-prompt.txt，14964 字符]',
        chars: 14964
    });

    // ═══ 工具定义 ═══
    // X 区 iframe 的 parent 是主窗口，getTools 在 AI iframe 里
    var toolsChars = 0, toolsContent = '', toolsCount = 0;
    try {
        var _toolsFn = null;
        var _topWin = window.top || window.parent;
        // 先按 _panelId 找，找不到则遍历所有面板
        for (var pid = _panelId; pid >= 0; pid--) {
            var _aiIframe = _topWin.document.getElementById('qqq-ai-iframe-p' + pid);
            if (_aiIframe && _aiIframe.contentWindow && typeof _aiIframe.contentWindow.getTools === 'function') {
                _toolsFn = _aiIframe.contentWindow.getTools;
                break;
            }
        }
        if (_toolsFn) {
            var tools = _toolsFn();
            if (tools && tools.length) {
                toolsContent = JSON.stringify(tools, null, 2);
                toolsChars = toolsContent.length;
                toolsCount = tools.length;
            }
        }
    } catch (_) {}
    cells.push({
        id: 'toolsdef', type: 'toolsdef', role: 'toolsdef',
        label: (toolsCount > 0) ? ('Tools Definition (' + toolsCount + ' tools)') : 'Tools Definition',
        group: '注入',
        content: toolsContent || '[工具定义尚未加载，请稍后刷新]', chars: toolsChars || 4200
    });

    // ═══ 对话消息 ═══
    for (var i = 0; i < conv.length; i++) {
        var m = conv[i]; if (!m) continue;
        var isPersistent = !!m._persistent;
        var role = m.role || 'unknown';
        var content = typeof m.content === 'string' ? m.content : (m.content ? JSON.stringify(m.content) : '');
        var chars = content.length;
        var cellId = 'msg-' + i;
        var label = '', group = '';

        if (isPersistent) {
            group = '客户端规则';
            label = 'msg[0] · Client Rules';
        } else if (role === 'user') {
            group = '用户消息';
            label = 'User #' + (i + 1);
        } else if (role === 'assistant') {
            if (m._error) {
                group = '错误'; label = 'AI Error #' + (i + 1); role = 'error';
            } else {
                group = 'AI 回复';
                if (m.tool_calls) {
                    label = 'AI tool_calls #' + (i + 1);
                    var tcJson = '';
                    try { tcJson = JSON.stringify(m.tool_calls, null, 2); } catch (_) {}
                    content = content ? ('── text ──\n' + content + '\n\n── tool_calls ──\n' + tcJson) : tcJson;
                    chars = content.length;
                } else {
                    label = 'AI text #' + (i + 1);
                }
            }
        } else if (role === 'tool') {
            group = '工具结果';
            label = 'Tool Result #' + (i + 1);
            if (typeof m.tool_call_id === 'string') chars += m.tool_call_id.length;
            if (typeof m.name === 'string') chars += m.name.length;
        } else if (role === 'system') {
            if (m._biscuit) {
                group = '压缩上下文';
                label = '压缩饼干 (biscuit)';
            } else if (m._deBlock) {
                group = '压缩上下文';
                label = 'DE 格子 (K+C)';
            } else {
                group = m._dynamic ? '压缩上下文' : '系统消息';
                label = 'System #' + (i + 1) + (m._dynamic ? ' (动态)' : '');
            }
        }
        // ★ 推入格子
        cells.push({
            id: cellId, type: role, role: role,
            label: label, group: group,
            content: content, chars: chars
        });
    }

    // ═══ V12 压缩摘要 ═══
    if (ctx) {
        if (ctx.biscuitLines && ctx.biscuitLines.length > 0) {
            var blSummary = ctx.biscuitLines.length + ' floors compressed, ';
            var totalChars = 0;
            for (var bi = 0; bi < ctx.biscuitLines.length; bi++) {
                totalChars += (ctx.biscuitLines[bi].text || '').length;
            }
            blSummary += '~' + Math.round(totalChars / 1000) + 'k chars total. See biscuit message in conversation for full content.';
            cells.push({
                id: 'comp-biscuit', type: 'system', role: 'system',
                label: '压缩饼干 × ' + ctx.biscuitLines.length + ' floors', group: '压缩上下文',
                content: blSummary, chars: blSummary.length
            });
        }
        if (ctx.deEntries && ctx.deEntries.length > 0) {
            var deChars = 0;
            for (var di = 0; di < ctx.deEntries.length; di++) {
                deChars += (ctx.deEntries[di].content || '').length;
            }
            cells.push({
                id: 'comp-de', type: 'system', role: 'system',
                label: 'DE 格子 × ' + ctx.deEntries.length + ' entries', group: '压缩上下文',
                content: ctx.deEntries.length + ' entries, ~' + Math.round(deChars / 1000) + 'k chars. See DE message for full content.', chars: 80
            });
        }
    }
    if (ctx && ctx.facts && ctx.facts.length) {
        var ft = '';
        for (var fi = 0; fi < ctx.facts.length; fi++) {
            ft += (fi > 0 ? '\n' : '') + ctx.facts[fi];
        }
        cells.push({
            id: 'comp-facts', type: 'system', role: 'system',
            label: '压缩 · 事实 × ' + ctx.facts.length, group: '压缩上下文',
            content: ft, chars: ft.length
        });
    }

    return cells;
}

// ── 渲染 ──
function render() {
    var container = document.getElementById('cells');
    var apiPrompt = _agent ? (_agent._lastApiPromptTokens || 0) : 0;
    var totalChars = 0, totalTok = 0;
    for (var i = 0; i < _cells.length; i++) {
        totalChars += _cells[i].chars;
        totalTok += Math.round(_cells[i].chars / CPT);
    }

    document.getElementById('stat-cells').innerHTML = _i('goods.conv.cells', '格子') + ': <b>' + _cells.length + '</b>';
    document.getElementById('stat-chars').innerHTML = _i('goods.conv.chars', '字符') + ': <b>' + fmtNum(totalChars) + '</b>';
    document.getElementById('stat-tokens').innerHTML = _i('goods.conv.estimate', '估算') + ': <b>' + fmtNum(totalTok) + '</b>';
    document.getElementById('stat-api').innerHTML = _i('goods.conv.api', 'API') + ': <b>' + (apiPrompt > 0 ? fmtNum(apiPrompt) : '--') + '</b>';

    if (_cells.length === 0) {
        container.innerHTML = '<div class="empty"><span class="empty-icon">📭</span><span>' + _i('goods.conv.noData', '没有格子数据') + '</span><span style="font-size:11px">' + _i('goods.conv.noDataHint', '打开对话后，点击 AI 面板右下角「上下文」→「管理」') + '</span></div>';
        return;
    }

    var html = '', lastGroup = '';
    for (var i = 0; i < _cells.length; i++) {
        var cell = _cells[i];
        var tok = Math.round(cell.chars / CPT);
        var isOpen = !!_expanded[cell.id];
        var isSel = !!_selected[cell.id];

        if (cell.group && cell.group !== lastGroup) {
            html += '<div class="group-hd">' + esc(cell.group) + '</div>';
            lastGroup = cell.group;
        }

        var rc = cell.role;
        var roleClass = (rc === 'user' || rc === 'assistant' || rc === 'tool' || rc === 'system' || rc === 'guard' || rc === 'toolsdef') ? rc : '';
        var charsStr = fmtNum(cell.chars);
        var tokStr = fmtNum(tok);

        html += '<div class="cell' + (isOpen ? ' open' : '') + (isSel ? ' selected' : '') + '" data-id="' + cell.id + '">';
        html += '<div class="cell-header" onclick="toggleCell(\'' + cell.id + '\')">';
        html += '<span class="cell-check' + (isSel ? ' checked' : '') + '" onclick="event.stopPropagation();toggleSelect(\'' + cell.id + '\')">' + (isSel ? '✓' : '') + '</span>';
        html += '<span class="cell-role ' + roleClass + '">' + esc(rc) + '</span>';
        html += '<span class="cell-preview">' + esc(truncate(cell.content, 80)) + '</span>';
        html += '<span class="cell-meta"><span>' + charsStr + '</span><span class="tok">~' + tokStr + '</span></span>';
        html += '<span class="cell-expand">▶</span>';
        html += '</div>';
        html += '<div class="cell-body">';
        html += '<div class="cell-content">' + esc(cell.content) + '</div>';
        html += '<div class="cell-actions">';
        html += '<button onclick="event.stopPropagation();copyCell(\'' + cell.id + '\')">📋 ' + _i('goods.conv.copyCell', '复制此格') + '</button>';
        html += '<button onclick="event.stopPropagation();selectAndGo(\'' + cell.id + '\')">🚀 ' + _i('goods.conv.singleGo', '单格开新对话') + '</button>';
        html += '</div>';
        html += '</div></div>';
    }

    container.innerHTML = html;
    updateSelectionUI();
}

function fmtNum(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'm';
    if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
    return String(n);
}
function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function truncate(s, n) {
    if (!s) return ''; var t = s.replace(/\s+/g,' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
}

// ── 交互 ──
function toggleCell(id) { _expanded[id] = !_expanded[id]; render(); }
function toggleSelect(id) { _selected[id] = !_selected[id]; render(); }
function selectAll() { for (var i = 0; i < _cells.length; i++) _selected[_cells[i].id] = true; render(); }
function clearSelection() { _selected = {}; render(); }
function expandAll() { for (var i = 0; i < _cells.length; i++) _expanded[_cells[i].id] = true; render(); }
function collapseAll() { _expanded = {}; render(); }

function copyCell(id) {
    var cell = findCell(id); if (!cell) return;
    copyText(cell.content); toast(_i('goods.conv.toastCopied', '已复制'));
}

function selectAndGo(id) {
    clearSelection();
    _selected[id] = true;
    render();
    openNewQuest();
}

function findCell(id) {
    for (var i = 0; i < _cells.length; i++) { if (_cells[i].id === id) return _cells[i]; }
    return null;
}

function onSearch(q) {
    if (!q || !q.trim()) { render(); return; }
    q = q.toLowerCase();
    for (var i = 0; i < _cells.length; i++) {
        var cell = _cells[i];
        var match = cell.label.toLowerCase().indexOf(q) >= 0 || cell.content.toLowerCase().indexOf(q) >= 0;
        if (match) _expanded[cell.id] = true;
    }
    render();
    // 隐藏不匹配的
    q = q.toLowerCase();
    var all = document.querySelectorAll('.cell');
    for (var i = 0; i < _cells.length; i++) {
        var el = all[i]; if (!el) continue;
        var cell = _cells[i];
        var match = cell.label.toLowerCase().indexOf(q) >= 0 || cell.content.toLowerCase().indexOf(q) >= 0;
        el.style.display = match ? '' : 'none';
    }
}

// ── 核心：选中格子 → 开新对话 ──
function openNewQuest() {
    var selIds = Object.keys(_selected).filter(function (k) { return _selected[k]; });
    if (selIds.length === 0) return;

    var selectedCells = [];
    for (var i = 0; i < _cells.length; i++) {
        if (_selected[_cells[i].id]) selectedCells.push(_cells[i]);
    }

    // 构建新对话上下文（格子内容原样注入）
    var lines = [
        '═══ 从对话 ' + (_questId || '?') + ' 提取的上下文格子（共 ' + selectedCells.length + ' 格） ═══',
        ''
    ];
    for (var i = 0; i < selectedCells.length; i++) {
        var c = selectedCells[i];
        lines.push('── ' + c.label + ' ──');
        lines.push(c.content);
        lines.push('');
    }

    // 投递给 AI 面板 iframe
    try {
        var aiFrameId = 'qqq-ai-iframe-p' + _panelId;
        var aiFrame = window.parent.document.getElementById(aiFrameId);
        if (aiFrame && aiFrame.contentWindow) {
            aiFrame.contentWindow.postMessage({
                type: 'qqq-conv-new-quest',
                panelId: _panelId,
                context: lines.join('\n'),
                questId: _questId
            }, '*');
            toast(_i('goods.conv.toastNewQuest', '已创建新对话，切换到 AI 面板查看'));
        } else {
            window.parent.__qqq_convNewQuestCtx = lines.join('\n');
            window.parent.postMessage({
                type: 'qqq-conv-new-quest', panelId: _panelId,
                context: lines.join('\n'), questId: _questId
            }, '*');
            toast(_i('goods.conv.toastSent', '已发送（切换到 AI 面板查看）'));
        }
    } catch (e) { toast(_i('goods.conv.toastFailed', '失败') + ': ' + e.message); }
}

function copyText(text) {
    try {
        // ★ 优先走 IPC bridge（绕过 iframe 剪贴板权限限制），降级到 document.execCommand
        var p = window.parent;
        if (p && p.qqqideBridge && p.qqqideBridge.clipboard && p.qqqideBridge.clipboard.writeText) {
            p.qqqideBridge.clipboard.writeText(text).catch(function() {
                _fallbackCopy(text);
            });
            return;
        }
        _fallbackCopy(text);
    } catch (e) { _fallbackCopy(text); }
    function _fallbackCopy(t) {
        var ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
}

function updateSelectionUI() {
    var selCount = Object.keys(_selected).filter(function (k) { return _selected[k]; }).length;
    document.getElementById('selCount').innerHTML = '已选 <b>' + selCount + '</b> 格';
    document.getElementById('btnNewQuest').disabled = selCount === 0;
}

function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(function () { el.classList.remove('show'); }, 2000);
}

// ── 刷新 ──
function refresh() {
    _agent = getAgent();
    _cells = buildCells(_agent);
    _selected = {};
    syncTheme();
    // 更新标题栏 quest 标签
    var ql = document.getElementById('quest-label');
    if (ql) ql.textContent = _questId ? ('· ' + _questId) : '';
    render();
}

// ── 初始化 ──
syncTheme();
// i18n DOM 更新
try { if (parent && parent.window && parent.window.i18n && parent.window.i18n.updateDom) parent.window.i18n.updateDom(document); } catch (_) {}
_agent = getAgent();
_cells = buildCells(_agent);
render();

// 主题监听
try {
    new MutationObserver(function () { syncTheme(); render(); })
        .observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch (e) {}

// 刷新消息（支持 questId 更新 — 同一 tab 切到不同 quest）
window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'qqq-conv-refresh') {
        if (e.data.questId) { _questId = e.data.questId; if (e.data.panelId) _panelId = e.data.panelId; }
        refresh();
    }
});

// 定时检查 agent 变化 + 工具定义就绪
var _toolsReady = false;
setInterval(function () {
    var ag = getAgent();
    var needsRebuild = (ag !== _agent);
    // 工具定义首次加载时可能还没就绪，定时重试
    if (!_toolsReady && !needsRebuild) {
        var hasTools = false;
        try {
            if (window.parent && typeof window.parent.getTools === 'function') {
                var t = window.parent.getTools();
                if (t && t.length) hasTools = true;
            }
        } catch (_) {}
        if (hasTools) { _toolsReady = true; needsRebuild = true; }
    }
    if (needsRebuild) { _agent = ag; _cells = buildCells(_agent); render(); }
}, 2000);
</script>
