<!-- goods/kmd/kmd-ui.html — kmd 终端 UI（v1 行模式，分裂架构） -->
<!-- 招牌能力：键入行 = 原生 input → 点击任意位置移动光标（零成本） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>kmd</title>
<style>
:root{--bg:#fdf6e3;--text:#595754;--border:#d3c6aa;--card:#eee8d5;--card-focus:#fdf6e3;--accent:#859900;--err:#dc322f;--dim:#93a1a1;--prompt:#268bd2;--ph:#b58900;--icon:#535b61}
[data-theme="dark"]{--bg:#1e1e1e;--text:#dcd8d0;--border:#333;--card:#2a2a2a;--card-focus:#3a3a3a;--accent:#8fbc5a;--err:#ff4444;--dim:#6a6660;--prompt:#60a0d0;--ph:#c9a227;--icon:#e8e5dc}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13px;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;user-select:text;-webkit-user-select:text;position:relative}
/* 工具栏 */
#bar{display:flex;gap:4px;padding:3px 8px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;align-items:center;flex-wrap:nowrap}
#bar button{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit}
#bar button:hover{background:var(--border)}
#bar .sep{width:1px;height:16px;background:var(--border);margin:0 4px}
/* shell 三按钮（2026-08-16 定案：下拉 → 按钮，选中态 accent 底一眼可辨） */
.shell-btn{font-size:11px;padding:2px 9px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit;flex-shrink:0}
.shell-btn:hover{background:var(--border)}
.shell-btn.active{background:var(--accent);border-color:var(--accent);color:#fdf6e3;font-weight:700}
[data-theme="dark"] .shell-btn.active{color:#1e1e1e}
#bar-left{display:flex;align-items:center;gap:4px;min-width:0;flex-shrink:0}
#bar-spacer{flex:1;min-width:0}
#bar-right{display:flex;gap:4px;flex-shrink:0}
#terminate-menu-wrap{position:relative;display:flex;flex-shrink:0}
#terminate-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:500;min-width:112px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,.35)}
#terminate-menu.hidden{display:none}
#terminate-menu button{display:block;width:100%;padding:4px 9px;border:0;border-radius:3px;background:transparent;color:var(--text);font:inherit;font-size:11px;text-align:left;white-space:nowrap}
#terminate-menu button:hover{background:var(--border)}
/* 窄窗策略：只压缩弹性空隙；右侧 Clear + 正方形菜单始终存在，贴上左侧三按钮为终点（2026-08-16 定案） */
#bar .bar-action{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#bar .bar-action .bar-icon{display:block;width:14px;height:14px;flex:0 0 14px;color:var(--icon)}
#bar .bar-action.icon-only{width:26px;height:22px;padding:2px 5px;justify-content:center;gap:0}
#bar .bar-action.icon-only .bar-icon{width:15px;height:15px;flex-basis:15px}
/* 命名输入框（2026-08-18）：标签标题实时同步，多 kmd 窗口的基础；
   边界保护双层——maxlength(UTF-16) + JS 按 code point 截断(emoji/中文按字符) */
#name-input{width:110px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:11px;padding:2px 6px;outline:none;flex-shrink:0}
#name-input:focus{border-color:var(--accent)}
#name-input::placeholder{color:var(--dim)}
/* #kmd-tip removed 2026-08-17: user wants no hover text on square button */
/* 输出区 — 纯文本日志式渲染器（2026-08-13：行内 SGR 彩色 span 整体放弃，每行单一文本节点——
   选中/复制/检索零干扰；ANSI 序列剥离；颜色降级为行级 class）
   ★ contenteditable="plaintext-only" 只读编辑器化——点击任意位置出闪烁光标（原生）、
     Shift+左键选区、任意拖选复制；键盘拦截禁编辑（仅放行导航/选区/Ctrl+A/Ctrl+C）
   ★ .wrap hover 背景 = 命令召回行暗示（gitbash ❯ 回显行带 data-cmd），点击 ❯ 箭头填入键入行
   ★ 双击 = 原生扩选单词 → selectionchange → 全局匹配高亮（editor 同款） */
#out{flex:1;overflow-y:auto;padding:6px 8px;line-height:1.45;white-space:pre-wrap;word-break:break-all;user-select:text;outline:none;caret-color:var(--accent)}
/* here 指示牌（2026-08-25）——q 位置浮层：红底白字实体豆腐块，锚定最后一行行尾（提示符右侧）。
   浮层在 #out 外（body 相对定位）+ pointer-events:none + user-select:none + ::after 生成文本
   （不进 DOM）→ 百分百不可选中不可复制；Ctrl+F 检索范围是 #out 内 TreeWalker，天然搜不到 */
#here-marker{position:absolute;z-index:300;display:none;pointer-events:none;user-select:none;-webkit-user-select:none;background:#dc322f;color:#fdf6e3;font-size:11px;font-weight:700;line-height:1;padding:2px 8px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap}
#here-marker::after{content:'here'}
/* 滚动条刻度层（2026-08-25）— 对齐 AI 面板：全文匹配项在滑轨上打刻度（Ctrl+F + 选区匹配两套合并）。
   JS 每帧同步几何到 #out 右缘 5px 滚动条区；pointer-events:none 零交互；颜色同高亮黄色系 */
#out-marks{position:absolute;display:none;pointer-events:none;user-select:none;z-index:150}
#out-marks .kmd-mark{position:absolute;right:1px;width:3px;height:5px;border-radius:1px;background:#b58900}
[data-theme="dark"] #out-marks .kmd-mark{background:#c9a227}
.line{min-height:1.45em;white-space:pre-wrap;word-break:break-all}
.line.self{color:var(--prompt)}
.line.err{color:var(--err)}
.line.dim{color:var(--dim)}
.line .gbpath{color:var(--dim)} /* gitbash 路径抬头 — 命令回显行内的当前目录（dim 灰，命令本体保持蓝） */
.line.wrap:hover{background:var(--border)}
.self-arrow{padding:0 2px}
/* 键入行 — 真编辑器控件：点击任意位置移动光标（招牌能力）
   ★ 2026-08-13: input → textarea（默认 3 行高 / 最大 8 行高 / 自动换行，长命令多行显示）
   行高 1.45 与输出区一致：min-height=3行, max-height=8行（calc 固定，JS autoResize 读取 clamp） */
#line-wrap{display:flex;align-items:flex-start;border-top:1px solid var(--border);background-color:var(--card);padding:4px 8px;gap:6px;flex-shrink:0}
/* ★ 2026-08-25 可输入态：kmd tab 可见 && 窗口聚焦 → 背景变亮 + 四边滚动虚线（repeating-linear-gradient 四条边 + background-position 动画，10px=虚线周期无缝循环；2026-08-25 换回 accent 绿，粗细保持 2px） */
#line-wrap.active{background-color:var(--card-focus);background-image:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 10px),repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 10px),repeating-linear-gradient(0deg,var(--accent) 0 4px,transparent 4px 10px),repeating-linear-gradient(0deg,var(--accent) 0 4px,transparent 4px 10px);background-size:100% 2px,100% 2px,2px 100%,2px 100%;background-repeat:no-repeat;background-position:0 0,0 100%,0 0,100% 0;animation:kmd-dash .6s linear infinite}
@keyframes kmd-dash{from{background-position:0 0,0 100%,0 0,100% 0}to{background-position:10px 0,-10px 100%,0 10px,100% -10px}}
#prompt{color:var(--accent);font-weight:700;white-space:nowrap;user-select:none;font-size:13px;line-height:1.45;margin-top:3px}
#input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13px;line-height:1.45;caret-color:var(--accent);padding:2px 0;min-width:0;resize:none;overflow-y:hidden;min-height:calc(1.45em * 3 + 4px);max-height:calc(1.45em * 8 + 4px)}
/* placeholder — 淡黄色（solarized yellow 系：亮 #b58900 / 暗 #c9a227，经 opacity 呈淡黄，弱于正文可见于背景） */
/* 换行按钮 — 对齐 AI 聊天编辑框 newline-btn 形态（⏎ 字符，点击光标处插入换行；kmd 主题化：border/dim 色） */
#newline-btn{align-self:flex-start;flex-shrink:0;width:24px;height:18px;margin-top:3px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);font-size:13px;line-height:1;padding:0}
#newline-btn:hover{background:var(--border);color:var(--text)}
#input::placeholder{color:var(--ph);opacity:.5}
[data-theme="dark"] #input::placeholder{opacity:.7}
/* 选区颜色 — 对齐 X 区 editor（solarized 官方 editor.selectionBackground）：light #d6d6d6 / dark #274642 */
::selection{background:#d6d6d6;color:#073642}
[data-theme="dark"]::selection{background:#274642;color:#fdf6e3}
/* Ctrl+F 查找条 — solar 配色浮动条（editor find widget 同款语义） */
#find-bar{position:absolute;top:36px;right:8px;display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,.35);z-index:200;font-size:11px}
#find-bar.hidden{display:none}
#find-input{width:150px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:11px;padding:2px 6px;outline:none}
#find-input:focus{border-color:var(--accent)}
#find-count{color:var(--dim);min-width:36px;text-align:center;font-size:10px}
#find-bar button{font-size:11px;padding:1px 6px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit}
#find-bar button:hover{background:var(--border)}
#find-aa.active{color:var(--accent);border-color:var(--accent);font-weight:700}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="bar">
  <div id="bar-left">
    <!-- shell 三按钮（2026-08-16：下拉 → 按钮，选中态 accent 底；点击即切换；Clear/正方形菜单在右侧） -->
    <button class="shell-btn active" data-shell="cmd">cmd</button>
    <button class="shell-btn" data-shell="powershell">PowerShell</button>
    <button class="shell-btn" data-shell="gitbash">Git Bash</button>
  </div>
  <span id="bar-spacer"></span>
  <div id="bar-right">
    <input id="name-input" maxlength="40" spellcheck="false" autocomplete="off" placeholder="命名此终端" title="命名此终端（实时同步标签标题）">
    <div id="terminate-menu-wrap">
      <button id="btn-kill" class="bar-action icon-only" aria-label="Terminate menu" aria-haspopup="menu" aria-expanded="false">
        <svg class="bar-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="4.2" y="4.2" width="11.6" height="11.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <div id="terminate-menu" class="hidden" role="menu">
        <button id="clear-item" type="button" role="menuitem">Clear</button>
        <button id="interrupt-item" type="button" role="menuitem">Ctrl+C</button>
        <button id="terminate-item" type="button" role="menuitem">Terminate</button>
      </div>
    </div>
  </div>
</div>
<div id="out" contenteditable="plaintext-only" spellcheck="false"></div>
<div id="here-marker"></div>
<div id="out-marks"></div>
<div id="find-bar" class="hidden">
  <input id="find-input" placeholder="查找（Enter 下一个 / Shift+Enter 上一个）" spellcheck="false">
  <span id="find-count"></span>
  <button id="find-aa" title="区分大小写">Aa</button>
  <button id="find-prev" title="上一个（Shift+Enter）">↑</button>
  <button id="find-next" title="下一个（Enter）">↓</button>
  <button id="find-close" title="关闭（Esc）">✕</button>
</div>
<div id="line-wrap">
  <span id="prompt">❯</span>
  <textarea id="input" rows="3" wrap="soft" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
         placeholder="键入命令回车执行 · Shift+Enter 换行 · 点击键入行任意位置移动光标 · ↑↓ 历史"></textarea>
  <button id="newline-btn" title="插入换行" data-no-cd>&#8629;</button>
</div>
<script>
(function () {
    'use strict';

    var bridge = null;
    try { bridge = parent.qqqideBridge; } catch (_) { }

    var sessionId = null, cwd = '', shellType = 'cmd';
    var outEl = document.getElementById('out');
    var inputEl = document.getElementById('input');
    var promptEl = document.getElementById('prompt');
    var shellBtns = {};
    var _sb = document.querySelectorAll('#bar .shell-btn');
    for (var si = 0; si < _sb.length; si++) shellBtns[_sb[si].dataset.shell] = _sb[si];

    var history = [];
    var histIdx = -1;
    var lastSentCmd = ''; // gitbash：bash 自身回显匹配（UI 已有 ❯ 蓝色行 → 丢弃重复回显）
    var lineCount = 0;
    var MAX_LINES = 5000; // DOM 行上限，超出删最老（防内存膨胀）
    var autoScroll = true;
    var running = false;
    var outBuf = ''; // 未完成行缓冲
    var curLine = null; // 流式行封行标记（null = 下一段无 \n 输出开新行）
    var gbPrompt = 0;   // gitbash：OSC 标题（\x1b]0;）出现 = 提示符块开始 → 丢弃直到 $ 行（2026-08-13 提示符三行噪音根治）
    var escPending = false; // cleanAnsi：未闭合 OSC 序列跨 chunk 状态
    var gbCwd = '';     // gitbash 当前目录（从 OSC 标题 \x1b]0;MINGW64:/path\x07 提取——2026-08-15 提示符块丢弃后路径抬头回归）
    var gbOscBuf = '', gbOscPending = false; // OSC 标题跨 chunk 切碎状态（与 escPending 同款，但工作在 cleanAnsi 之前）
    // ★ 2026-08-25 可输入态（焦点态/here 指示牌，零轮询事件驱动）：
    //   kmdActive = tab 可见性（tab-manager.activateTab 唯一中心 → kmd.js → kmd:active 消息；
    //   kmd:init 带 active 兜底快速切走窗口期）；winFocus = 窗口聚焦（iframe 原生 focus/blur，
    //   父窗口失焦/最小化/切走同步触发）。双信号 AND = 可输入。
    var kmdActive = true; // 初始 true：openFileCustomTab 先 activateTab 后 renderFn，创建即激活
    var winFocus = document.hasFocus();
    var hereMarker = document.getElementById('here-marker');
    var hereRaf = null;

    // ★ 2026-08-18 全局 x 键召回：kmd 自转发携带自身 cwd → 新 kmd 继承当前目录（转发块读此 getter）
    window.__kmdCwdGet = function () { return cwd; };

    // ── 主题（父窗口同步） ──
    try {
        var pt = parent.document.documentElement.getAttribute('data-theme');
        if (pt === 'light' || pt === 'dark') document.documentElement.setAttribute('data-theme', pt);
    } catch (_) { }
    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'qqqide-theme-change') {
            document.documentElement.setAttribute('data-theme', e.data.dark ? 'dark' : 'light');
            applyHlTheme();
        }
    });

    // ── 主窗口协议 ──
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d) return;
        if (d.type === 'kmd:init') {
            kmdActive = d.active !== false; // tab 可见性初始态（快速切走时 _onVisible 消息丢失 → 此处兜底）
            updateInputState();
            sessionId = d.sessionId;
            cwd = d.cwd || '';
            shellType = d.shellType || 'cmd';
            gbCwd = winToMsys(cwd); // 会话初始目录 → gitbash 路径抬头（OSC 首到后自动校正）
            nameInput.value = d.title || ''; // 命名输入框初始值 = 当前标签标题（用户可立即改名）
            setShellUI(shellType);
            start();
            // ★ 2026-08-25 roam 单文件选中 + x：文件名预填键入行（不带路径，任何类型都填）——用户补命令/解释器即回车
            if (d.fileName) {
                inputEl.value = String(d.fileName);
                autoResize();
                try { inputEl.focus(); inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length); } catch (_) { }
                // ★ 2026-08-25 双保险：下一帧若 value 为空（被任何同步/微任务覆盖）则补回——
                //   用户已输入内容则不动，成本一次 rAF，零冲突
                requestAnimationFrame(function () {
                    if (!inputEl.value) {
                        inputEl.value = String(d.fileName);
                        autoResize();
                    }
                });
            }
        } else if (d.type === 'kmd:active') {
            // tab 切走/切回（tab-manager activateTab 事件驱动，零轮询）
            kmdActive = !!d.active;
            updateInputState();
        } else if (d.type === 'kmd:out') {
            appendOut(d.stream, d.data);
        } else if (d.type === 'kmd:exit') {
            running = false;
            appendLine('dim', '── 进程已退出 (code=' + d.code + ')' + (d.error ? ' · ' + d.error : '') + ' ──');
        } else if (d.type === 'kmd:restarted') {
            clearOut();
            appendLine('dim', '── 会话已原地重启 ──');
            running = true;
        } else if (d.type === 'kmd:cd') {
            // roam 空区 x 键/右键：原地切目录（kill + 重 spawn，同 shell 切换模式）
            gbPrompt = 0;
            cwd = d.cwd || cwd;
            gbCwd = winToMsys(cwd);
            if (bridge && bridge.kmd && sessionId) {
                bridge.kmd.kill(sessionId, { restart: false }).then(function () {
                    return bridge.kmd.spawn(sessionId, shellType, cwd);
                }).then(function (r) {
                    if (r && r.ok) {
                        running = true;
                        appendLine('dim', '── 已切换目录 ' + cwd + ' ──');
                    } else {
                        appendLine('err', '[切换目录失败] ' + ((r && r.error) || 'unknown'));
                    }
                }).catch(function (err) {
                    appendLine('err', '[切换目录异常] ' + String(err && err.message || err));
                });
            }
        }
    });

    // ── gitbash 路径抬头 ──
    // Windows 路径 → MSYS 风格（E:\s\wol\py\qqq-shell-v2 → /e/s/wol/py/qqq-shell-v2）
    function winToMsys(p) {
        if (!p) return '';
        p = String(p).replace(/\\/g, '/');
        var m = /^([A-Za-z]):(\/.*)$/.exec(p);
        return m ? '/' + m[1].toLowerCase() + m[2] : p;
    }

    // 从原始字节流提取 OSC 0 标题（bash 每次提示符前必写 \x1b]0;MINGW64:/path\x07）→ 更新 gbCwd。
    // 必须在 cleanAnsi 之前调用（cleanAnsi 会把 OSC 内容剥掉，路径就丢了）；跨 chunk 切碎用 gbOscBuf 续接。
    function extractOscTitle(raw) {
        var s = String(raw || '');
        if (gbOscPending) { s = gbOscBuf + s; gbOscBuf = ''; gbOscPending = false; }
        var i = 0;
        while (i < s.length) {
            var j = s.indexOf('\x1b', i);
            if (j === -1) break;
            if (s.charCodeAt(j + 1) === 93 /* ] */) {
                var t = s.indexOf('\x07', j + 2);
                var te = s.indexOf('\x1b\\', j + 2);
                var end = -1;
                if (t !== -1 && (te === -1 || t < te)) end = t;
                else if (te !== -1) end = te + 1;
                if (end === -1) { gbOscBuf = s.slice(j); gbOscPending = true; break; }
                var body = s.slice(j + 2, end).replace(/\x1b\\$/, '');
                if (body.charAt(0) === '0' && body.charAt(1) === ';') {
                    var title = body.slice(2);
                    var m = /^[A-Za-z0-9_]+:(.+)$/.exec(title); // MINGW64:/path → /path
                    var path = m ? m[1] : title;
                    if (/^[\/~]/.test(path)) gbCwd = path; // 仅接受 MSYS 路径形态，防其他程序设标题污染
                }
                i = end + 1;
            } else {
                i = j + 1;
            }
        }
    }

    parent.postMessage({ type: 'kmd:ready' }, '*');

    // ── 会话启动 ──
    function start() {
        gbPrompt = 0;
        if (!bridge || !bridge.kmd) {
            appendLine('err', '[错误] 无法访问主进程桥（bridge.kmd 不存在）');
            return;
        }
        appendLine('dim', 'kmd · 行模式终端 · ' + shellType + (cwd ? ' · ' + cwd : ''));
        appendLine('dim', '键入行是原生编辑器控件 → 点击任意位置即可移动光标');
        bridge.kmd.spawn(sessionId, shellType, cwd).then(function (r) {
            if (r && r.ok) {
                running = true;
            } else {
                appendLine('err', '[会话启动失败] ' + ((r && r.error) || 'unknown'));
            }
        }).catch(function (err) {
            appendLine('err', '[会话启动异常] ' + String(err && err.message || err));
        });
    }

    // ── 输出渲染（2026-08-13 纯文本化） ──
    // 行内 SGR 彩色 span 结构整体放弃 → 每行单一文本节点：
    // ① 选中/拖选/复制零干扰（::selection solar 色直接生效，无需跨 span 拼选区）
    // ② Ctrl+F 检索 = 每行一个文本节点，indexOf 映射简单可靠（跨行匹配自动切分）
    // ③ ANSI 序列（CSI/OSC/单 ESC）全部剥离，不残留乱码控制符
    // 颜色语义降级为行级 class：.err(红) / .self(蓝 ❯) / .dim(灰)
    function stripAnsi(text) {
        return String(text)
            .replace(/\x1b\][^\x07]*\x07/g, '')     // OSC（bash 设标题等）
            .replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '') // CSI（SGR/光标控制等）
            .replace(/\x1b[()][0-9A-B]/g, '')       // 字符集选择
            .replace(/\x1b[=>]/g, '')               // 模式设置
            .replace(/\x1b./g, '');                 // 其余单字符 ESC 序列
    }

    // cleanAnsi：逐 chunk 剥离 ANSI，OSC 序列跨 chunk 未闭合时状态保持（bash 提示符标题可能被管道切碎）
    function cleanAnsi(data) {
        var s = String(data);
        if (escPending) {
            var te = s.search(/\x07|\x1b\\/);
            if (te === -1) return '';
            s = s.slice(te + (s.charCodeAt(te) === 0x1b ? 2 : 1));
            escPending = false;
        }
        var out = '', rest = s;
        while (rest.length) {
            var i = rest.indexOf('\x1b]');
            if (i === -1) { out += rest; break; }
            out += rest.slice(0, i);
            var tail = rest.slice(i + 2);
            var t2 = tail.search(/\x07|\x1b\\/);
            if (t2 === -1) { escPending = true; break; }
            rest = tail.slice(t2 + (tail.charCodeAt(t2) === 0x1b ? 2 : 1));
        }
        return stripAnsi(out);
    }

    // 解析片段并渲染到 el（纯文本追加，零 span）
    function segInto(el, text) {
        if (text) el.appendChild(document.createTextNode(text));
    }

    // gitbash 行过滤（2026-08-13）：bash 无 TTY 交互模式把提示符/回显/警告全写 stderr →
    // ① 启动警告两行（cannot set terminal process group / no job control）纯噪音，每次启动必出 → 丢弃
    // ② bash 自身回显（=== lastSentCmd）与 UI 蓝色 ❯ 行重复 → 丢弃
    // cmd/powershell 的 stderr 是真报错 → 不参与过滤
    function shouldSkipGitBashLine(stream, line) {
        if (shellType !== 'gitbash' || stream !== 'err') return false;
        var t = String(line).trim();
        if (!t) return false;
        if (t.indexOf('cannot set terminal process group') !== -1) return true;
        if (t.indexOf('no job control in this shell') !== -1) return true;
        if (t === lastSentCmd) { if (gbPrompt) gbPrompt = 0; return true; }
        // ★ 提示符块（2026-08-13）：MSYS bash 默认 PS1 恒以 OSC 标题 \x1b]0; 前导（appendOut 检测置位），
        //   随后是彩色 PS1 行 + $ 行——全部丢弃只留 UI 蓝色 ❯ 行（每回车一行，提示符噪音归零）
        if (gbPrompt) {
            if (/^(\([^)]*\)\s*)?[#$]$/.test(t)) gbPrompt = 0;
            return true;
        }
        return false;
    }

    // 当前流式行：curLine 标记非空且仍在 DOM → 复用；否则新建（封行后开新行）
    // ★ gitbash 的 err 流 = 提示符/回显/警告（非报错）→ 不加红色，防满屏红（cmd/PS 的 stderr 是真报错，保留红）
    function curLineEl(stream) {
        if (curLine && curLine.classList && curLine.classList.contains('stream') && curLine.parentNode === outEl) {
            return curLine;
        }
        var el = document.createElement('div');
        el.className = 'line stream' + (stream === 'err' && shellType !== 'gitbash' ? ' err' : '');
        outEl.appendChild(el);
        lineCount++;
        trimLines();
        curLine = el;
        return el;
    }

    function trimLines() {
        if (lineCount <= MAX_LINES) return;
        var extra = lineCount - MAX_LINES;
        for (var i = 0; i < extra; i++) {
            var f = outEl.firstElementChild;
            if (f) f.remove();
        }
        lineCount = MAX_LINES;
    }

    function scrollToBottom() {
        if (autoScroll) outEl.scrollTop = outEl.scrollHeight;
    }

    // 流式输出入口：\n 封行、\r 覆盖、无 \n 追加当前行
    function appendOut(stream, data) {
        var raw = String(data || '');
        // gitbash err 流出现 OSC 标题 = 提示符块开始（MSYS bash 每次提示前必写窗口标题）
        if (shellType === 'gitbash' && stream === 'err' && raw.indexOf('\x1b]') !== -1) {
            gbPrompt = 1;
            extractOscTitle(raw); // ★ 2026-08-15 路径抬头回归：cleanAnsi 之前拦截 OSC 标题 → 提取当前目录（gbCwd）
        }
        raw = cleanAnsi(raw);
        outBuf += raw;
        while (true) {
            var idx = outBuf.indexOf('\n');
            if (idx === -1) break;
            var line = outBuf.slice(0, idx);
            outBuf = outBuf.slice(idx + 1);
            if (!shouldSkipGitBashLine(stream, line)) renderStreamLine(stream, line);
            curLine = null; // 封行
        }
        if (outBuf) {
            var rest = outBuf;
            outBuf = '';
            if (!shouldSkipGitBashLine(stream, rest)) renderStreamLine(stream, rest);
        }
        scrollToBottom();
        updateHereMarker(); // 流式追加后重锚（可输入态 + 滚到底才真正计算，其余零开销早退）
    }

    function renderStreamLine(stream, line) {
        var parts = String(line).split('\r');
        for (var i = 0; i < parts.length; i++) {
            var seg = parts[i];
            if (!seg) continue;
            if (i > 0) {
                // \r 覆盖：清空当前流式行再写
                var cur = outEl.lastElementChild;
                if (cur && cur.classList.contains('line') && cur.classList.contains('stream')) {
                    cur.innerHTML = '';
                }
            }
            segInto(curLineEl(stream), seg);
        }
    }

    // UI 自身消息行（非流式）：封掉流式行后新建
    // gpath（可选）= gitbash 路径抬头：渲染为 dim 灰 span 置于命令前（❯ [路径] 命令，cmd/PS 提示符同款形态）
    function appendLine(kind, text, dataCmd, gpath) {
        curLine = null;
        var el = document.createElement('div');
        el.className = 'line ui' + (kind === 'err' ? ' err' : kind === 'dim' ? ' dim' : kind === 'self' ? ' self' : '') + (dataCmd ? ' wrap' : '');
        if (dataCmd) {
            // ❯ 箭头独立 span（点击召回目标）——双击/拖选让位原生选区，召回不再劫持文本
            var arrow = document.createElement('span');
            arrow.className = 'self-arrow';
            arrow.dataset.cmd = dataCmd;
            arrow.textContent = '❯ ';
            el.appendChild(arrow);
        }
        if (gpath) {
            var ps = document.createElement('span');
            ps.className = 'gbpath';
            ps.textContent = gpath + ' ';
            el.appendChild(ps);
        }
        el.appendChild(document.createTextNode(stripAnsi(text)));
        outEl.appendChild(el);
        lineCount++;
        trimLines();
        scrollToBottom();
        updateHereMarker();
    }

    function clearOut() {
        outEl.innerHTML = '';
        lineCount = 0;
        outBuf = '';
        curLine = null;
        findRanges = [];
        selHlRanges = [];
        if (hasHighlightAPI()) CSS.highlights.delete('kmd-sel-hits');
        renderMarks();
        updateHereMarker();
    }

    // 滚动暂停跟随（用户上滚看历史 → 停止自动滚动）
    outEl.addEventListener('scroll', function () {
        autoScroll = (outEl.scrollTop + outEl.clientHeight >= outEl.scrollHeight - 8);
        // here 指示牌跟随滚动（rAF 节流：避免 scroll 高频回调内强制 layout，每帧最多一次）
        if (hereRaf) return;
        hereRaf = requestAnimationFrame(function () { hereRaf = null; updateHereMarker(); });
    });

    // ── 可输入态（2026-08-25）：kmd tab 可见 && 窗口聚焦 → 编辑框亮背景+滚动虚线 + here 指示牌 ──
    function updateInputState() {
        var lw = document.getElementById('line-wrap');
        if (lw) lw.classList.toggle('active', kmdActive && winFocus);
        updateHereMarker();
    }

    // 锚定行尾：非 collapsed range 的 getClientRects() 最后一个 line box 的右缘 = 行尾字符右缘。
    // ★ 2026-08-25 二次修复：collapsed range 在无尾随空白的行尾返回零矩形（Chrome 已知行为）→
    //   旧 fallback 用整行元素 rect（.line 是 block 宽 100%）→ right=容器右缘 → marker 贴右边界。
    //   getClientRects 对 selectNodeContents 返回真实 line box 矩形，短行右缘精确落在 > 右侧。
    function lineEndRect(lineEl) {
        try {
            var r = document.createRange();
            r.selectNodeContents(lineEl);
            var rects = r.getClientRects();
            if (rects && rects.length) {
                var lr = rects[rects.length - 1]; // 最后一行 line box（长行 break-all 换行时取末行）
                if (lr && lr.width > 0 && lr.height > 0) return lr;
            }
        } catch (_) { }
        // 兜底：collapsed 到最后一个非空文本节点末尾（仍零矩形 → 返回 null → 隐藏）
        try {
            var lastTn = null;
            var w = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT);
            while (w.nextNode()) {
                if (w.currentNode.nodeValue && w.currentNode.nodeValue.trim() !== '') lastTn = w.currentNode;
            }
            if (lastTn) {
                var r2 = document.createRange();
                r2.setStart(lastTn, lastTn.length);
                r2.setEnd(lastTn, lastTn.length);
                var cr = r2.getBoundingClientRect();
                if (cr && cr.height > 0) return cr;
            }
        } catch (_) { }
        return null;
    }

    // here 指示牌：仅 可输入态 + 滚动到底（autoScroll，最后一行必在可视区底部）时，锚定最后一行行尾
    // （q 位置 = 提示符右侧）。浮层在 #out 外 → 不在 contenteditable 内：Ctrl+F 检索不到（TreeWalker
    // 范围是 #out）、选区/复制不可达（user-select:none + pointer-events:none）、文本 ::after 生成
    // （不进 DOM 双保险）——百分百不可选中不可复制。
    function updateHereMarker() {
        if (!hereMarker) return;
        if (!(kmdActive && winFocus) || !autoScroll) { hereMarker.style.display = 'none'; return; }
        // ★ 2026-08-25 修复：锚定最后一个【非空】行——末尾空行（流式空壳/空 .line）无行框，
        //   Chrome 对空 range 返回 (0,0,0,0) 全零矩形 → marker 定位到 body 原点 (6,0) =
        //   左上角 cmd 按钮处（实锤截图）。从后往前找最后一个非空行。
        var last = null;
        for (var i = outEl.children.length - 1; i >= 0; i--) {
            var el = outEl.children[i];
            if (el.textContent && el.textContent.trim() !== '') { last = el; break; }
        }
        if (!last) { hereMarker.style.display = 'none'; return; }
        var er = lineEndRect(last);
        if (!er) { hereMarker.style.display = 'none'; return; }
        var br = document.body.getBoundingClientRect();
        hereMarker.style.display = 'block';
        hereMarker.style.left = (er.right - br.left + 3) + 'px';
        hereMarker.style.top = (er.top - br.top ) + 'px';  
    }

    // 窗口聚焦信号（iframe 原生 focus/blur：父窗口失焦/最小化/切走时 iframe 同步 blur）
    window.addEventListener('focus', function () { winFocus = true; updateInputState(); });
    window.addEventListener('blur', function () { winFocus = false; updateInputState(); });

    // ── 输出区 = 只读编辑器（contenteditable plaintext-only） ──
    // 单击 → 浏览器原生放光标（闪烁）+ 拖选/Shift 选区/复制；双击 → 原生扩选单词
    //   （selectionchange → 全局匹配高亮，editor 同款）
    // 命令召回：点击 ❯ 箭头（.self-arrow）→ 填入键入行（只填不执行；旧双击召回让位选词）
    outEl.addEventListener('click', function (e) {
        var ar = e.target && e.target.closest ? e.target.closest('.self-arrow') : null;
        if (!ar || !ar.dataset || !ar.dataset.cmd) return;
        inputEl.value = ar.dataset.cmd;
        autoResize();
        inputEl.focus();
        setCaretEnd();
    });

    // 键盘只读拦截：放行导航（方向/Home/End/PageUp/PageDown，含 Shift 选区）、Ctrl+A/C/V；Ctrl+C 只复制。
    // 禁编辑（字符/退格/删除/粘贴/剪切）；IME 组合中只拦不转移焦点
    outEl.addEventListener('keydown', function (e) {
        if (e.isComposing || e.keyCode === 229) { e.preventDefault(); return; }
        var k = e.key;
        var nav = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'];
        if (nav.indexOf(k) !== -1) return; // 光标移动 / Shift 选区 / Ctrl+Shift 按词选区
        if (e.ctrlKey || e.metaKey) {
            var kk = k.toLowerCase();
            if (kk === 'a' || kk === 'v') return; // 全选 / 粘贴（粘贴由 paste 事件转发键入行）
            if (kk === 'c') {
                var os = window.getSelection();
                var hasOutSelection = !!(os && !os.isCollapsed && outEl.contains(os.anchorNode) && outEl.contains(os.focusNode));
                if (!hasOutSelection) e.preventDefault(); // 输出区无选区：Ctrl+C 只执行空操作，不发送中断
                return;
            }
            e.preventDefault(); // Ctrl+X 等禁
            return;
        }
        if (k === 'Tab' || k === 'Enter') { e.preventDefault(); inputEl.focus(); return; }
        if (k.length === 1 && !e.altKey) {
            // 可打印字符 → 注入键入行并聚焦（用户打字自动回到输入框，首字符不丢）
            e.preventDefault();
            inputEl.focus();
            var v = inputEl.value;
            var s = inputEl.selectionStart != null ? inputEl.selectionStart : v.length;
            var en = inputEl.selectionEnd != null ? inputEl.selectionEnd : v.length;
            inputEl.value = v.slice(0, s) + k + v.slice(en);
            try { inputEl.setSelectionRange(s + 1, s + 1); } catch (_) { }
            return;
        }
        e.preventDefault(); // Backspace/Delete/其余修饰键全拦
    });
    // 粘贴 → 指令编辑区（焦点在输出区时 Ctrl+V / 右键菜单粘贴均走此路；clipboardData 同步可用零 IPC）
    outEl.addEventListener('paste', function (e) {
        e.preventDefault();
        var t = e.clipboardData && e.clipboardData.getData('text/plain');
        if (t) insertToInput(t);
    });
    outEl.addEventListener('drop', function (e) { e.preventDefault(); });

    // 插入键入行（光标位插入，保留多行文本；粘贴后焦点 + 光标末尾）
    function insertToInput(t) {
        if (!t) return;
        inputEl.focus();
        var v = inputEl.value;
        var s = inputEl.selectionStart != null ? inputEl.selectionStart : v.length;
        var en = inputEl.selectionEnd != null ? inputEl.selectionEnd : v.length;
        inputEl.value = v.slice(0, s) + t + v.slice(en);
        autoResize();
        try { inputEl.setSelectionRange(s + t.length, s + t.length); } catch (_) { }
    }

    function setCaretEnd() {
        try {
            var v = inputEl.value;
            inputEl.setSelectionRange(v.length, v.length);
        } catch (_) { }
    }

    // ── 键入行（真编辑器控件：点击定位光标为浏览器原生能力） ──
    // textarea 高度自适应：内容 1→8 行自动增高，超 8 行滚动；提交/历史填充/清空后重置
    function autoResize() {
        inputEl.style.height = 'auto';
        var h = inputEl.scrollHeight;
        var maxH = parseFloat(getComputedStyle(inputEl).maxHeight) || 200;
        inputEl.style.height = Math.min(h, maxH) + 'px';
        inputEl.style.overflowY = h > maxH ? 'auto' : 'hidden';
    }
    inputEl.addEventListener('input', autoResize);

    // 换行按钮（2026-08-25，对齐 AI 聊天编辑框）：光标处插入换行，回车仍是发送
    var nlBtn = document.getElementById('newline-btn');
    if (nlBtn) {
        nlBtn.addEventListener('click', function (e) {
            e.preventDefault();
            inputEl.focus();
            var v = inputEl.value;
            var s = inputEl.selectionStart != null ? inputEl.selectionStart : v.length;
            var en = inputEl.selectionEnd != null ? inputEl.selectionEnd : v.length;
            inputEl.value = v.slice(0, s) + '\n' + v.slice(en);
            autoResize();
            try { inputEl.setSelectionRange(s + 1, s + 1); } catch (_) { }
        });
    }

    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { // Shift+Enter 放行原生换行（textarea 默认行为）
            e.preventDefault();
            var v = inputEl.value;
            inputEl.value = '';
            autoResize();
            if (v.trim()) {
                history.push(v);
                histIdx = history.length;
                exec(v);
            }
        } else if (e.key === 'ArrowUp') {
            if (history.length && running) {
                e.preventDefault();
                histIdx = Math.max(0, histIdx - 1);
                inputEl.value = history[histIdx] || '';
                autoResize();
                setCaretEnd();
            }
        } else if (e.key === 'ArrowDown') {
            if (history.length && running) {
                e.preventDefault();
                histIdx = Math.min(history.length, histIdx + 1);
                inputEl.value = histIdx >= history.length ? '' : (history[histIdx] || '');
                autoResize();
                setCaretEnd();
            }
        } else if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
            // Ctrl+C 只专注复制（2026-08-16 定案）：有选区 = 浏览器原生复制；无选区 = 空操作。
            // 中断功能唯一入口 = 正方形菜单第一成员（Ctrl+C）——键盘路径永不发中断字节。
            return;
        } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            clearOut();
        }
    });

    function exec(v) {
        if (!sessionId || !running) {
            appendLine('err', '[会话未就绪]');
            return;
        }
        // 回显策略：cmd（2026-08-12 去 /q 后原生回显）+ PS 自带提示符回显；gitbash 自身会回显（stderr）
        // → UI 蓝色 ❯ 行（带 data-cmd 召回）+ bash 回显去重（shouldSkipGitBashLine 按 lastSentCmd 丢弃）
        // ★ 2026-08-15：gitbash 回显行带路径抬头（gbCwd，dim 灰）——❯ /e/s/wol/py/qqq-shell-v2 命令，cd 后 OSC 自动更新
        if (shellType === 'gitbash') {
            lastSentCmd = v.trim();
            gbPrompt = 0;
            appendLine('self', v, v, gbCwd || winToMsys(cwd));
        }
        if (bridge && bridge.kmd) {
            bridge.kmd.write(sessionId, v + '\n').catch(function (err) {
                appendLine('err', '[写入失败] ' + String(err && err.message || err));
            });
        }
    }

    // ── 工具栏：shell 三按钮（选中态 accent 底，setShellUI 维护） ──
    function setShellUI(t) {
        shellType = t;
        promptEl.textContent = t === 'gitbash' ? '❯' : (t === 'powershell' ? 'PS>' : 'C>');
        for (var k in shellBtns) shellBtns[k].classList.toggle('active', k === t);
    }

    function switchShell(t) {
        if (t === shellType || !sessionId) return;
        gbPrompt = 0;
        if (t === 'gitbash') gbCwd = winToMsys(cwd); // 切到 gitbash 先给初始路径抬头，OSC 首到后校正
        setShellUI(t);
        if (bridge && bridge.kmd) {
            bridge.kmd.kill(sessionId, { restart: false }).then(function () {
                return bridge.kmd.spawn(sessionId, t, cwd);
            }).then(function (r) {
                if (r && r.ok) {
                    running = true;
                    appendLine('dim', '── 已切换 ' + t + ' ──');
                 if (t === 'gitbash') {
                    var p = gbCwd || winToMsys(cwd);
                    if (p) appendLine('dim', ' ❯ ' + p);
                }
                } else {
                    appendLine('err', '[切换失败] ' + ((r && r.error) || 'unknown'));
                }
            }).catch(function (err) {
                appendLine('err', '[切换异常] ' + String(err && err.message || err));
            });
        }
    }

    // shell 三按钮：点击即切换（选中态由 setShellUI 维护；终止/清屏不在 .shell-btn 内，closest 自然忽略）
    document.getElementById('bar').addEventListener('click', function (e) {
        var b = e.target && e.target.closest ? e.target.closest('.shell-btn') : null;
        if (!b) return;
        switchShell(b.dataset.shell);
    });

    // ── 命名输入框：输入即同步标签标题（多 kmd 窗口基础） ──
    // 边界保护双层：① maxlength=40（UTF-16 长度，浏览器级）② 此处按 code point 截断（emoji/中文按字符计数）
    var nameInput = document.getElementById('name-input');
    nameInput.addEventListener('input', function () {
        var t = nameInput.value;
        var cps = Array.from(t);
        if (cps.length > 40) {
            t = cps.slice(0, 40).join('');
            nameInput.value = t;
        }
        parent.postMessage({ type: 'kmd:title', title: t }, '*'); // kmd.js → setCustomTabTitle（空标题忽略）
    });
    nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); inputEl.focus(); } // 命名完回车直接回命令框
    });

    // ── 危险操作菜单：正方形按钮只展开，不直接终止 ──
    var killBtn = document.getElementById('btn-kill');
    var killWrap = document.getElementById('terminate-menu-wrap');
    var killMenu = document.getElementById('terminate-menu');
    var interruptItem = document.getElementById('interrupt-item');
    var killItem = document.getElementById('terminate-item');
    var clearItem = document.getElementById('clear-item');
    var killMenuOpen = false;

    function setKillMenu(open) {
        killMenuOpen = !!open;
        killMenu.classList.toggle('hidden', !killMenuOpen);
        killBtn.setAttribute('aria-expanded', killMenuOpen ? 'true' : 'false');
        // tooltip removed 2026-08-17
    }
    var killHoverTimer = null;

    // 菜单 Ctrl+C：明确向当前 shell 发送中断字节；键盘 Ctrl+C 的复制语义不受影响
    function sendInterrupt() {
        if (!bridge || !bridge.kmd || !sessionId || !running) return;
        bridge.kmd.write(sessionId, '\x03').catch(function (err) {
            appendLine('err', '[Ctrl+C 发送失败] ' + String(err && err.message || err));
        });
    }

    // 强杀进程树 + 原地重启；会话已死时选择 Terminate = 重启
    function runKill() {
        if (!bridge || !bridge.kmd || !sessionId) return;
        if (!running) {
            bridge.kmd.spawn(sessionId, shellType, cwd).then(function (r) {
                if (r && r.ok) {
                    running = true;
                } else {
                    appendLine('err', '[会话启动失败] ' + ((r && r.error) || 'unknown'));
                }
            }).catch(function () { });
            return;
        }
        bridge.kmd.kill(sessionId, { restart: true }).catch(function () { });
    }

    // hover 即展开（不用点两次）；离开范围 0.5s 自动收起
    killWrap.addEventListener('mouseenter', function () {
        if (killHoverTimer) { clearTimeout(killHoverTimer); killHoverTimer = null; }
        setKillMenu(true);
    });
    killWrap.addEventListener('mouseleave', function () {
        if (killHoverTimer) clearTimeout(killHoverTimer);
        killHoverTimer = setTimeout(function () {
            killHoverTimer = null;
            setKillMenu(false);
        }, 500);
    });
    interruptItem.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        setKillMenu(false);
        sendInterrupt();
    });
    killItem.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        setKillMenu(false);
        runKill();
    });
    clearItem.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        setKillMenu(false);
        clearOut();
        inputEl.focus();
    });
    document.addEventListener('mousedown', function (e) {
        if (killMenuOpen && !killWrap.contains(e.target)) setKillMenu(false);
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && killMenuOpen) {
            e.preventDefault();
            setKillMenu(false);
            killBtn.focus();
        }
    });

    // tooltip for square button removed 2026-08-17 (user request)
    // btn-clear removed 2026-08-18: Clear 收进正方形菜单第一项，原位改为命名输入框

    // ── Ctrl+F 全文检索高亮（editor 那一套：全文匹配高亮 + 导航 + 选区自动填入） ──
    // 实现: CSS Custom Highlight API（Chromium 105+，Electron 22=108 原生）——不改 DOM，contenteditable 安全；
    // 高亮颜色由 JS 注入 <style>（::highlight 内不依赖 var()/属性前缀，主题切换 100% 可控）
    var findOpen = false, findQuery = '', findRanges = [], findIdx = 0, findRecomputeTimer = null;
    var caseSensitive = false;
    var findBar = document.getElementById('find-bar');
    var findInput = document.getElementById('find-input');
    var findCount = document.getElementById('find-count');
    var findAa = document.getElementById('find-aa');
    var hlStyle = document.createElement('style');
    hlStyle.id = 'kmd-hl-style';
    document.head.appendChild(hlStyle);

    function applyHlTheme() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        hlStyle.textContent = dark
            ? '::highlight(kmd-find-all){background:#4a4412;color:#fdf6e3}::highlight(kmd-find-cur){background:#b58900;color:#1e1e1e}::highlight(kmd-sel-hits){background:#c9a227;color:#1e1e1e}'
            : '::highlight(kmd-find-all){background:#ffe792;color:#073642}::highlight(kmd-find-cur){background:#b58900;color:#fdf6e3}::highlight(kmd-sel-hits){background:#b6c04a}';
    }
    applyHlTheme();

    function hasHighlightAPI() { return !!(window.CSS && CSS.highlights && window.Highlight); }

    function setHighlights(ranges, curRange) {
        if (!hasHighlightAPI()) return;
        CSS.highlights.delete('kmd-find-all');
        CSS.highlights.delete('kmd-find-cur');
        if (!ranges || !ranges.length) return;
        var hl = new Highlight();
        for (var i = 0; i < ranges.length; i++) hl.add(ranges[i]);
        CSS.highlights.set('kmd-find-all', hl);
        if (curRange) {
            var hc = new Highlight();
            hc.add(curRange);
            CSS.highlights.set('kmd-find-cur', hc);
        }
    }

    // 全文 indexOf → 映射回文本节点 Range 数组（跨 SGR span 匹配自动切分，行内彩色 span 安全）
    function findAllRanges(q, cs) {
        if (!q) return []; // ★ 空查询守卫：indexOf('', pos) 恒返回 pos → 死循环（2026-08-13 回归测试暴露）
        var nodes = [], walker = document.createTreeWalker(outEl, NodeFilter.SHOW_TEXT);
        var n, total = '', starts = [];
        while ((n = walker.nextNode())) {
            if (!n.nodeValue) continue;
            nodes.push(n); // ★ 2026-08-13 F39 漏写实锤：节点从未收集 → 检索恒空（Ctrl+F 外壳根因）
            starts.push(total.length);
            total += n.nodeValue;
            total += '\n'; // ★ 行分隔符：DOM 文本拼接不含换行，跨行查询（含 \n）必须能匹配（2026-08-13 纯文本化配套）
        }
        if (!total) return [];
        var cs2 = (cs === undefined) ? caseSensitive : cs; // 选区高亮 = 精确大小写（editor 同款语义）
        var hay = cs2 ? total : total.toLowerCase();
        var needle = cs2 ? q : q.toLowerCase();
        var out = [], pos = 0, nodeIdx = 0, ql = needle.length;
        while (nodeIdx < nodes.length && (pos = hay.indexOf(needle, pos)) !== -1) {
            var end = pos + ql, p = pos;
            while (p < end) {
                while (nodeIdx < nodes.length - 1 && starts[nodeIdx + 1] <= p) nodeIdx++;
                var nodeEnd = starts[nodeIdx] + nodes[nodeIdx].nodeValue.length;
                if (p >= nodeEnd) { nodeIdx++; continue; } // 命中行分隔符 → 推进下一节点（防零长段死循环）
                var segEnd = Math.min(end, nodeEnd);
                var startOff = Math.max(0, p - starts[nodeIdx]); // 分隔符吞并：p 落在合成分隔符位 → 段起点归零（负偏移会毁 Range）
                var r = document.createRange();
                r.setStart(nodes[nodeIdx], startOff);
                r.setEnd(nodes[nodeIdx], segEnd - starts[nodeIdx]);
                out.push(r);
                p = segEnd;
            }
            pos = end;
        }
        return out;
    }

    function updateFind(resetIdx, doScroll) {
        findQuery = findInput.value;
        findRanges = findQuery ? findAllRanges(findQuery) : [];
        if (resetIdx || findIdx >= findRanges.length) findIdx = findRanges.length ? 0 : 0;
        setHighlights(findRanges, findRanges.length ? findRanges[findIdx] : null);
        findCount.textContent = findRanges.length ? (findIdx + 1) + '/' + findRanges.length : '0/0';
        if (doScroll && findRanges.length) scrollToRange(findRanges[findIdx]);
        renderMarks();
    }

    function scrollToRange(r) {
        var rect;
        try { rect = r.getBoundingClientRect(); } catch (_) { return; }
        if (!rect || (!rect.width && !rect.height)) return;
        var or = outEl.getBoundingClientRect();
        if (rect.top < or.top || rect.bottom > or.bottom) {
            outEl.scrollTop += (rect.top - or.top) - outEl.clientHeight / 2;
        }
    }

    function openFind(prefill) {
        findOpen = true;
        findBar.classList.remove('hidden');
        if (prefill) {
            var t = '';
            try {
                var sel = window.getSelection();
                if (sel && sel.rangeCount) t = sel.toString().trim();
                if (!t && sel && sel.anchorNode && sel.anchorNode.nodeType === 3) {
                    var v = sel.anchorNode.nodeValue || '', o = sel.anchorOffset;
                    var bm = /[\w\u4e00-\u9fa5./\-_]+$/.exec(v.slice(0, o));
                    var am = /^[\w\u4e00-\u9fa5./\-_]+/.exec(v.slice(o));
                    t = (bm ? bm[0] : '') + (am ? am[0] : '');
                }
            } catch (_) { }
            if (!t) {
                var s = inputEl.selectionStart, en = inputEl.selectionEnd;
                if (s != null && en != null && en > s) t = inputEl.value.slice(s, en).trim();
            }
            findInput.value = t;
        }
        findInput.focus();
        try { findInput.select(); } catch (_) { }
        updateFind(true, true);
    }

    function closeFind() {
        findOpen = false;
        findBar.classList.add('hidden');
        setHighlights(null, null);
        findInput.value = '';
        findCount.textContent = '';
        inputEl.focus();
    }

    function findStep(delta) {
        if (!findOpen || !findRanges.length) return;
        findIdx = (findIdx + delta + findRanges.length) % findRanges.length;
        setHighlights(findRanges, findRanges[findIdx]);
        findCount.textContent = (findIdx + 1) + '/' + findRanges.length;
        scrollToRange(findRanges[findIdx]);
    }

    findInput.addEventListener('input', function () { updateFind(true, true); });
    findInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
        else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    });
    document.getElementById('find-next').addEventListener('click', function () { findStep(1); });
    document.getElementById('find-prev').addEventListener('click', function () { findStep(-1); });
    document.getElementById('find-close').addEventListener('click', closeFind);
    findAa.addEventListener('click', function () {
        caseSensitive = !caseSensitive;
        findAa.classList.toggle('active', caseSensitive);
        updateFind(true, true);
    });

    // 全局 Ctrl+F / F3（capture 阶段拦截——焦点在输出区/键入行/任意处均生效，阻止 Electron 原生 find bar）
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            e.stopPropagation();
            openFind(true);
        } else if (e.key === 'F3') {
            if (findOpen) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
        }
    }, true);

    // ★ 全局 Ctrl+V → 指令编辑区（2026-08-16）：只要 kmd 获焦点，无论焦点在输出区/工具栏/空白处，
    //   命令直接粘贴进键入行。输入框与查找框保留原生粘贴语义（不劫持）。
    //   路径：document capture 拦截 → bridge.clipboard.readText()（主进程读剪贴板，零权限问题）→ insertToInput
    document.addEventListener('keydown', function (e) {
        if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'v') return;
        var el = document.activeElement;
        if (el && (el === inputEl || el === findInput)) return; // textarea 原生粘贴（多行/选中替换语义）
        e.preventDefault();
        e.stopPropagation();
        if (bridge && bridge.clipboard && bridge.clipboard.readText) {
            bridge.clipboard.readText().then(function (t) { insertToInput(t); }).catch(function () { });
        }
    }, true);

    // 输出流式追加/清屏 → 防抖 120ms 重算（保 idx 不跳动；不主动滚动，让位输出流）
    var findObserver = new MutationObserver(function () {
        if (findRecomputeTimer) clearTimeout(findRecomputeTimer);
        findRecomputeTimer = setTimeout(function () {
            findRecomputeTimer = null;
            if (findOpen) updateFind(false, false);
            if (selHlRanges.length) updateSelHl(); // 流式追加后选区高亮坐标已失效 → 重算
            else renderMarks(); // 流式追加 → scrollHeight 变化 → 刻度比例重算
        }, 120);
    });
    findObserver.observe(outEl, { childList: true, subtree: true, characterData: true });

    // ── 选区全局匹配高亮（editor 同款：框选/双击单词 → 全文同串高亮） ──
    // 独立 Highlight 集 kmd-sel-hits，与 Ctrl+F 的 kmd-find-* 互不干扰；精确大小写匹配
    var selHlRanges = [], selHlTimer = null;
    function updateSelHl() {
        if (!hasHighlightAPI()) return;
        var txt = '';
        try {
            var sel = window.getSelection();
            if (sel && sel.rangeCount && !sel.isCollapsed) {
                var r = sel.getRangeAt(0);
                if (outEl.contains(r.commonAncestorContainer)) txt = sel.toString();
            }
        } catch (_) { }
        txt = txt.trim();
        selHlRanges = (txt && txt.length <= 500) ? findAllRanges(txt, true) : [];
        CSS.highlights.delete('kmd-sel-hits');
        if (selHlRanges.length) {
            var hl = new Highlight();
            for (var i = 0; i < selHlRanges.length; i++) hl.add(selHlRanges[i]);
            CSS.highlights.set('kmd-sel-hits', hl);
        }
        renderMarks();
    }
    document.addEventListener('selectionchange', function () {
        if (selHlTimer) clearTimeout(selHlTimer);
        selHlTimer = setTimeout(updateSelHl, 250); // 拖选防抖；双击扩选（原生）→ 同一路径
    });

    // ── 滚动条刻度（2026-08-25，AI 面板同款）──
    // 合并 Ctrl+F（findRanges）+ 选区匹配（selHlRanges）全部命中 → 在右侧 5px 滚动条区打刻度；
    // 比例 = 匹配项内容坐标 / scrollHeight，滚动不重算（全文比例固定）；流式追加/清屏/resize 重算。
    var marksRaf = null;
    function renderMarks() {
        if (marksRaf) { cancelAnimationFrame(marksRaf); marksRaf = null; }
        var m = document.getElementById('out-marks');
        if (!m) return;
        var ranges = [];
        if (findRanges && findRanges.length) for (var i = 0; i < findRanges.length; i++) ranges.push(findRanges[i]);
        if (selHlRanges && selHlRanges.length) for (var j = 0; j < selHlRanges.length; j++) ranges.push(selHlRanges[j]);
        if (!ranges.length) { m.style.display = 'none'; return; }
        var oRect = outEl.getBoundingClientRect();
        var sh = outEl.scrollHeight, ch = outEl.clientHeight;
        if (!sh || !ch) { m.style.display = 'none'; return; }
        // 几何同步：贴 #out 右缘 5px（滚动条占位区），与 here 指示牌同款视口坐标算法
        m.style.display = 'block';
        m.style.left = (oRect.left + oRect.width - 5) + 'px';
        m.style.top = oRect.top + 'px';
        m.style.width = '5px';
        m.style.height = oRect.height + 'px';
        var tickH = 5;
        var frag = document.createDocumentFragment();
        for (var k = 0; k < ranges.length; k++) {
            try {
                var rr = ranges[k].getBoundingClientRect();
                if (!rr || rr.height === 0) continue; // 零矩形（空行/离屏未布局）跳过
                var top = rr.top - oRect.top + outEl.scrollTop; // 内容坐标
                var ratio = top / sh;
                var t = document.createElement('div');
                t.className = 'kmd-mark';
                t.style.top = Math.max(0, Math.min(1, ratio)) * (ch - tickH) + 'px';
                frag.appendChild(t);
            } catch (_) { }
        }
        m.appendChild(frag);
    }
    window.addEventListener('resize', function () {
        if (marksRaf) return;
        marksRaf = requestAnimationFrame(function () { marksRaf = null; renderMarks(); });
    });

    // 首次聚焦
    inputEl.focus();
})();
</script>
<!-- ★ F2/Tab 非编辑态转发父窗口 → 激活 roam（同 ai-panel/conv-ui 模式：iframe 内按键不冒泡父窗口）
     编辑态 = 焦点在 #input（终端键入框，Tab/F2 保留终端语义）；输出区/工具栏/空白处 → 召回 roam -->
<script>
(function () {
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'F2' && e.key !== 'Tab' && e.key !== 'x') return;
    var el = document.activeElement;
    var tag = el && el.tagName ? el.tagName.toUpperCase() : '';
    var editing = el && (el.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA');
    if (editing) return;
    // F2/Tab → 召回 roam；x → 打开一个新 kmd 并继承当前会话 cwd（2026-08-18）
    var accel = e.key === 'F2' ? 'F2' : (e.key === 'Tab' ? 'Tab' : 'X');
    var path = e.key === 'x' && typeof window.__kmdCwdGet === 'function' ? (window.__kmdCwdGet() || '') : undefined;
    try { parent.postMessage({ type: 'qqq-key', accel: accel, scope: 'window', path: path }, '*'); } catch (_) {}
    e.preventDefault();
  }, true);
})();
</script>
</body>
</html>
