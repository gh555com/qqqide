<!-- 引擎: core/secret-guard.js（parent 后台事件驱动）→ dsecret.js 中转 → 本页 -->
<!-- 协议: dsecret:*（消息类型清单见 goods/dsecret/dsecret.js 头注释） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsecret</title>
<style>
:root{--bg:#fdf6e3;--text:#595754;--border:#d3c6aa;--card:#eee8d5;--accent:#859900;--err:#dc322f;--dim:#93a1a1;--orange:#cb4b16}
[data-theme="dark"]{--bg:#1e1e1e;--text:#dcd8d0;--border:#333;--card:#2a2a2a;--accent:#8fbc5a;--err:#ff4444;--dim:#6a6660;--orange:#e07b39}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:ui-monospace,Consolas,"Microsoft YaHei",sans-serif,Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,qd-emoji;font-size:12px;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;user-select:text;-webkit-user-select:text;position:relative}
::selection{background:#d6d6d6;color:#073642}
[data-theme="dark"]::selection{background:#274642;color:#fdf6e3}
/* 工具条 */
#bar{display:flex;gap:4px;padding:3px 8px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;align-items:center;flex-wrap:nowrap}
/* 项目下拉（自绘 qd 风格；禁原生 select） */
#bar .dd{position:relative;flex-shrink:0}
#bar .dd-btn{display:inline-flex;align-items:center;gap:6px;max-width:230px}
#bar .dd-btn.open{border-color:var(--accent);color:var(--accent)}
#proj-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid currentColor;opacity:.55;flex-shrink:0}
.dd-list{display:none;position:absolute;top:100%;left:0;margin-top:3px;min-width:100%;max-width:320px;max-height:240px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:60;padding:3px}
.dd-list.show{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:3px 8px;font-size:11px;border-radius:3px;color:var(--text)}
.dd-item .dd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item .dd-count{flex-shrink:0;font-size:10px;min-width:12px;text-align:right;color:var(--dim);font-weight:400}
.dd-item .dd-count.hot{color:var(--err);font-weight:700}
.dd-item.dd-all{border-bottom:1px solid var(--border);margin-bottom:2px;padding-bottom:4px}
.dd-item:hover{background:var(--border)}
.dd-item.sel{color:var(--accent);font-weight:700}
.dd-item.dd-empty{color:var(--dim)}
#bar button{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit}
#bar button:hover{background:var(--border)}
#bar button.active{background:var(--accent);border-color:var(--accent);color:#fdf6e3;font-weight:700}
[data-theme="dark"] #bar button.active{color:#1e1e1e}
#bar .sep{width:1px;height:16px;background:var(--border);margin:0 4px}
#btn-scan{background:var(--accent);border-color:var(--accent);color:#fdf6e3;font-weight:700}
[data-theme="dark"] #btn-scan{color:#1e1e1e}
.toggle{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text);white-space:nowrap;cursor:default}
.toggle input{accent-color:var(--accent);margin:0}
#bar-spacer{flex:1;min-width:0}
/* 底部确认框（iframe 内自绘，禁原生 modal） */
#cf-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
#cf-ov.show{display:flex}
#cf-panel{width:470px;max-width:88vw;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5);padding:20px 22px 14px;font-size:12.5px;line-height:1.85;color:var(--text)}
#cf-text{white-space:pre-wrap;word-break:break-word}
#cf-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#cf-btns button{font-family:inherit;font-size:12px;padding:5px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text)}
#cf-btns button:hover{background:var(--border)}
#cf-ok{border-color:var(--err);color:var(--err)}
/* 状态条 */
#stats{display:flex;gap:14px;padding:4px 12px;border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;font-size:11px;flex-wrap:wrap}
#stats .stat{color:var(--dim);white-space:nowrap}
#stats .stat b{color:var(--text);font-weight:700}
#stats .stat.t1 b{color:var(--accent)}
#stats .stat.t2 b{color:var(--orange)}
#stats .stat.t3 b{color:var(--err)}
#st-msg{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;margin-left:auto}
/* Tab 栏 */
#tabs{display:flex;gap:2px;padding:2px 8px 0;border-bottom:1px solid var(--border);flex-shrink:0}
#tabs .tab{font-size:11px;padding:4px 12px;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;background:transparent;color:var(--dim);font-family:inherit}
#tabs .tab.active{background:var(--card);color:var(--text);font-weight:700}
/* 内容 */
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:8px 10px}
.view.active{display:block}
.view h3{font-size:12px;color:var(--dim);margin:8px 0 6px;font-weight:700}
/* 命中条目 */
.item{margin-bottom:8px;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card)}
.item .head{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;word-break:break-all}
.item .loc{font-weight:700;color:var(--text)}
.item .tag{color:var(--orange);white-space:nowrap}
.item .tag.t1{color:var(--accent)}
.item .tag.t2{color:var(--orange)}
.item .tag.t3{color:var(--err)}
.item .tag.proj{color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:0 6px;font-size:10px}
.item .val{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%}
.item .badge{font-size:10px;padding:0 6px;border:1px solid var(--orange);color:var(--orange);border-radius:8px;white-space:nowrap;flex-shrink:0}
.item .ctx.clickable{cursor:pointer}
.item .ctx.clickable:hover{border-color:var(--accent)}
.item .ctx{font-family:Consolas,monospace,Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,qd-emoji;font-size:11px;color:var(--text);background:var(--bg);border:1px solid var(--border);padding:5px 7px;border-radius:3px;white-space:pre-wrap;word-break:break-all;margin-bottom:6px}
.item .btns{display:flex;gap:6px}
.item .btns button{font-size:11px;padding:2px 10px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-family:inherit}
.item .btns button:hover{background:var(--border)}
.item .btns button.danger{color:var(--err);border-color:var(--err)}
.item .btns button.ok{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--dim);text-align:center;padding:30px 0;font-size:12px}
/* 底部批量按钮 */
.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:6px 10px;display:flex;gap:8px;align-items:center;margin-top:8px}
.foot button{font-size:11px;padding:3px 14px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-family:inherit}
.foot button.danger{color:var(--err);border-color:var(--err)}
.foot button:hover{background:var(--border)}
.foot .hint{margin-left:auto;font-size:10px;color:var(--dim)}
/* 日志 */
#log-list .l{font-family:Consolas,monospace,Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,qd-emoji;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--dim)}
#log-list .l.redact{color:var(--accent)}
#log-list .l.skip{color:var(--dim)}
#log-list .l.error{color:var(--err)}
#log-list .l.user{color:var(--accent)}
/* 白名单 */
.wl-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px;word-break:break-all}
.wl-row .k{flex:1;color:var(--text)}
.wl-row .when{color:var(--dim);white-space:nowrap;font-size:10px}
.wl-row button{font-size:10px;padding:1px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--err);font-family:inherit}
.wl-row button:hover{background:var(--border)}
/* 忽略与暴露 */
#ignore-list .ig-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px;word-break:break-all}
#ignore-list .ig-row .p{flex:1;color:var(--text)}
#ignore-list .ig-row button{font-size:10px;padding:1px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit;white-space:nowrap}
#ignore-list .ig-row button:hover{background:var(--border)}
#expose-row{display:flex;gap:6px;margin:8px 0}
#expose-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:11px;padding:3px 8px;outline:none}
#expose-row button{font-size:11px;padding:2px 12px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit}
#expose-row button:hover{background:var(--border)}
#expose-result{font-family:Consolas,monospace,Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,qd-emoji;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:4px;padding:8px 10px;margin-top:4px}
#expose-result.safe{color:var(--accent)}
#expose-result.danger{color:var(--err)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>

</head>
<body>
<div id="bar">
  <div class="dd" id="proj-dd">
    <button type="button" class="dd-btn" id="proj-btn" data-i18n-title="goods.dsecret.targetProject">
      <span id="proj-name">—</span><span class="dd-caret"></span>
    </button>
    <div class="dd-list" id="proj-list"></div>
  </div>
  <button class="mode-btn active" data-mode="dirty" data-i18n="goods.dsecret.modeDirty">未提交</button>
  <button class="mode-btn" data-mode="full" data-i18n="goods.dsecret.modeFull">全量体检</button>
  <button id="btn-scan"><span class="qqi qqi-search" style="margin-right:4px"></span><span data-i18n="goods.dsecret.scanBtn">扫描</span></button>
  <span class="sep"></span>
  <label class="toggle" title="后台自动脱敏总开关（设置→高级→协助密钥脱敏 同键）" data-i18n-title="goods.dsecret.toggleTip"><input type="checkbox" id="chk-enabled"> <span data-i18n="goods.dsecret.assist">协助脱敏</span></label>
  <span id="bar-spacer"></span>
</div>
<div id="stats">
  <span class="stat t1"><span data-i18n="goods.dsecret.stT1">T1 强签名</span> <b id="st-t1">0</b></span>
  <span class="stat t2"><span data-i18n="goods.dsecret.stT2">T2 高熵</span> <b id="st-t2">0</b></span>
  <span class="stat t3"><span data-i18n="goods.dsecret.stT3">T3 待协同</span> <b id="st-t3">0</b></span>
  <span class="stat"><span data-i18n="goods.dsecret.stFiles">已扫文件</span> <b id="st-files">0</b></span>

</div>
<div id="tabs">
  <button class="tab active" data-tab="queue" data-i18n="goods.dsecret.tabQueue">处理队列</button>
  <button class="tab" data-tab="log" data-i18n="goods.dsecret.tabLog">审计日志</button>
  <button class="tab" data-tab="wl" data-i18n="goods.dsecret.tabWl">白名单</button>
  <button class="tab" data-tab="ignore" data-i18n="goods.dsecret.tabIgnore">忽略与暴露</button>
</div>
<div id="content">
  <div id="view-queue" class="view active"></div>
  <div id="view-log" class="view"></div>
  <div id="view-wl" class="view"></div>
  <div id="view-ignore" class="view"></div>
</div>

<div id="cf-ov">
  <div id="cf-panel">
    <div id="cf-text"></div>
    <div id="cf-btns">
      <button type="button" id="cf-cancel" data-i18n="goods.dsecret.cancel">取消</button>
      <button type="button" id="cf-ok" data-i18n="goods.dsecret.confirm">确定</button>
    </div>
  </div>
</div>

<script src="../../core/i18n.js"></script>
<script src="../../core/qqq-icons.js"></script>
<script>
(function () {
  'use strict';

  // ── 主题（kmd 同款：父窗口 data-theme + qqqide-theme-change 监听）──
  try {
    var pt = parent.document.documentElement.getAttribute('data-theme');
    if (pt === 'light' || pt === 'dark') document.documentElement.setAttribute('data-theme', pt);
  } catch (_) {}
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'qqqide-theme-change') {
      document.documentElement.setAttribute('data-theme', e.data.dark ? 'dark' : 'light');
    }
  });

  // ── i18n：本 iframe i18n.js 实例优先（独立窗口也可用），父窗口 _i 兑底；{0}/{1} 插值 ──
  function _t(k, fb) {
    var s = fb;
    try { s = window._i ? window._i(k, fb) : ((window.parent && window.parent._i) ? window.parent._i(k, fb) : fb); } catch (_) { s = fb; }
    for (var i = 2; i < arguments.length; i++) { s = String(s).split('{' + (i - 2) + '}').join(arguments[i]); }
    return s;
  }

  // ── 状态 ──
  var _state = {
    enabled: true,
    projects: [],          // [{path,name,orphan}]
    current: null,         // 主项目路径（★ 标记）
    target: null,          // 下拉选中项（ALL 哨兵 或 归一化项目路径）
    mode: 'dirty',         // dirty | full
    scanning: false,
    lastResult: null,      // 最近一次 scan-result
    busy: false,           // act 防连点
    inited: false,
    rows: [],              // 引擎快照：各项目待协同数（含孤儿）
    allCount: 0            // 各行之和（引擎同一次算出）
  };
  var _pendSeq = 0;        // 待协同快照请求序号（丢过期回复）

  var $ = function (id) { return document.getElementById(id); };

  function post(type, extra) {
    try { parent.postMessage(Object.assign({ type: type }, extra || {}), '*'); } catch (_) {}
  }

  // ── 项目下拉（qd 自绘，禁原生 select）──
  //   每行右侧的「待协同数」与 ALL 总数同源同算（引擎 pendingView 一次算出）→ 下方之和 ≡ ALL。
  var ALL = '__all__';   // 与引擎 secret-guard 的 PENDING_ALL 同值（禁单侧改）

  function norm(p) { return String(p || '').replace(/\\/g, '/').replace(/\/+$/, ''); }
  function baseName(p) { var n = norm(p); var i = n.lastIndexOf('/'); return i === -1 ? n : n.slice(i + 1); }
  function realPath() { return (_state.target && _state.target !== ALL) ? _state.target : null; }
  function projList() {
    return _state.projects.map(function (p) { return { path: norm(p.path), name: p.name }; });
  }
  function ensureProjectRow(path, name) {
    var k = norm(path);
    if (!k || k === ALL) return;
    for (var i = 0; i < _state.projects.length; i++) { if (norm(_state.projects[i].path) === k) return; }
    _state.projects.push({ path: k, name: name || baseName(k), orphan: true });
  }
  function countOf(path) {
    if (path === ALL) return _state.allCount || 0;
    var k = norm(path);
    for (var i = 0; i < _state.rows.length; i++) { if (_state.rows[i].path === k) return _state.rows[i].count || 0; }
    return 0;
  }
  function projLabel(p) {
    return p.name + (norm(p.path) === _state.current ? ' ★' : '') + (p.orphan ? ' ' + _t('goods.dsecret.orphanTag', '（已移出 AI 视口）') : '');
  }

  function ddRow(label, count, sel, title) {
    var it = document.createElement('div');
    it.className = 'dd-item' + (sel ? ' sel' : '');
    var nm = document.createElement('span');
    nm.className = 'dd-name';
    nm.textContent = label;
    var ct = document.createElement('span');
    ct.className = 'dd-count' + (count > 0 ? ' hot' : '');
    ct.textContent = String(count);
    ct.title = _t('goods.dsecret.pendingN', '待协同 {0}', count);
    it.appendChild(nm);
    it.appendChild(ct);
    if (title) it.title = title;
    return it;
  }

  function renderProjects() {
    var list = $('proj-list');
    var nameEl = $('proj-name');
    list.innerHTML = '';
    if (!_state.projects.length && !(_state.allCount > 0)) {
      nameEl.textContent = _t('goods.dsecret.noProject', '（无项目 — 先添加 AI 视口项目）');
      var e = document.createElement('div');
      e.className = 'dd-item dd-empty';
      e.textContent = nameEl.textContent;
      list.appendChild(e);
      return;
    }
    // 目标失效兜底（项目列表换了 / 孤儿行被清）
    if (_state.target !== ALL) {
      var valid = false;
      for (var k = 0; k < _state.projects.length; k++) { if (norm(_state.projects[k].path) === _state.target) { valid = true; break; } }
      if (!valid) _state.target = _state.current || (_state.projects[0] ? norm(_state.projects[0].path) : ALL);
    }
    // ALL 行（数字 = 各行之和，由引擎同一次计算给出）
    var allRow = ddRow(_t('goods.dsecret.allProjects', 'ALL（所有项目）'), _state.allCount || 0, _state.target === ALL,
      _t('goods.dsecret.allHint', 'ALL = 汇总各项目已发现的待协同（不扫盘、不写盘）'));
    allRow.classList.add('dd-all');
    allRow.onclick = function () { selectProject(ALL); };
    list.appendChild(allRow);

    var curLabel = _t('goods.dsecret.allProjects', 'ALL（所有项目）');
    for (var i = 0; i < _state.projects.length; i++) {
      var p = _state.projects[i];
      var pp = norm(p.path);
      var lbl = projLabel(p);
      var row = ddRow(lbl, countOf(pp), _state.target === pp, pp);
      row.onclick = (function (path) { return function () { selectProject(path); }; })(pp);
      list.appendChild(row);
      if (_state.target === pp) curLabel = lbl;
    }
    nameEl.textContent = curLabel + ' · ' + countOf(_state.target);
    $('proj-btn').title = _state.target === ALL ? _t('goods.dsecret.allHint', 'ALL = 汇总各项目已发现的待协同（不扫盘、不写盘）') : (_state.target || '');
  }

  function openProjList() { $('proj-list').classList.add('show'); $('proj-btn').classList.add('open'); }
  function closeProjList() { $('proj-list').classList.remove('show'); $('proj-btn').classList.remove('open'); }

  // 切项目 = 换一台机器扫：先清旧结果再立即重扫；ALL = 只汇总已有待协同（不扫盘）
  function selectProject(path) {
    closeProjList();
    path = (path === ALL) ? ALL : norm(path);
    if (!path || path === _state.target) return;
    _state.target = path;
    renderProjects();
    resetView();
    if (path === ALL) { enterAll(); return; }
    setAllModeUI(false);
    scan();
  }

  function curPath() { return _state.target || null; }

  // ── ALL 模式：汇总引擎里已挂起的待协同（零 IO、零写盘）──
  function setAllModeUI(on) {
    var bs = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < bs.length; i++) {
      bs[i].disabled = !!on;
      bs[i].title = on ? _t('goods.dsecret.allNoScan', 'ALL 模式不扫盘 — 只汇总引擎已发现的待协同') : '';
    }
    var sb = $('btn-scan');
    if (sb) {
      sb.disabled = !!on;
      sb.title = on ? _t('goods.dsecret.allNoScan', 'ALL 模式不扫盘 — 只汇总引擎已发现的待协同') : '';
    }
  }

  function enterAll() {
    setAllModeUI(true);
    $('st-t1').textContent = '—';
    $('st-t2').textContent = '—';
    $('st-files').textContent = '—';
    $('st-msg').textContent = _t('goods.dsecret.allHint', 'ALL = 汇总各项目已发现的待协同（不扫盘、不写盘）');
    loadPending(true);
  }

  // 拉引擎待协同快照（纯内存）；render=true 时同时把队列铺成该快照
  function loadPending(render) {
    var seq = ++_pendSeq;
    post('dsecret:pending', { path: _state.target || null, projects: projList(), seq: seq });
    _pendRender = { seq: seq, render: !!render };
  }
  var _pendRender = { seq: 0, render: false };

      renderActResult(d);
      return;
    }
    if (d.type === 'dsecret:data') {
      _state.lastData = d.data;   // ★ 缓存供语言切换重渲染（日志/白名单标题随语言）
      renderLog(d.data.log);
      renderWl(d.data);
      return;
    }
    if (d.type === 'dsecret:data-updated') {
      if (realPath()) post('dsecret:data', { path: realPath() });
      return;
    }
    if (d.type === 'dsecret:git-log-result') {
      var r = document.getElementById('expose-result');
      if (!r) return;
      r.className = d.result.found ? 'danger' : 'safe';
      r.textContent = d.result.detail;
      return;
    }
    if (d.type === 'dsecret:gitignore-result') {
      $('st-msg').textContent = d.result.ok ? (d.relPath + ' → ' + d.result.msg) : _t('goods.dsecret.opFailShort', '失败: {0}', d.result.msg);
      return;
    }
    if (d.type === 'dsecret:enabled') {
      var changed = (!!d.on !== _state.enabled);
      _state.enabled = !!d.on;
      $('chk-enabled').checked = _state.enabled;
      if (changed) scan();
      return;
    }
    if (d.type === 'dsecret:git-dirty') {
      // 事件桥：后台 badge 发现未提交变化 → 下拉计数即时跟随（零 IO）
      loadPending(_state.target === ALL);
      if (_state.target === ALL) return;          // ALL 不扫盘
      if (norm(d.path) !== curPath()) return;
      if (_dirtyTimer) clearTimeout(_dirtyTimer);
      _dirtyTimer = setTimeout(function () {
        if (_state.mode === 'dirty') scan();
      }, 500);
    }
  });

  // ── 控件绑定 ──
  $('btn-scan').onclick = scan;
  $('chk-enabled').onchange = function () {
    _state.enabled = this.checked;
    post('dsecret:toggle', { on: this.checked });
    if (_state.target === ALL) { loadPending(true); return; }
    scan();   // 开关 = 抹除策略，而非扫不扫 —— 勾上/取消立即重扫，结果当场体现
  };
  $('proj-btn').onclick = function (e) {
    e.stopPropagation();
    if ($('proj-list').classList.contains('show')) closeProjList(); else openProjList();
  };
  document.addEventListener('click', function (e) {
    if (!$('proj-dd').contains(e.target)) closeProjList();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (_cfResolve) { e.preventDefault(); _cfResolve(false); return; }
    closeProjList();
  });
  $('cf-ok').onclick = function () { if (_cfResolve) _cfResolve(true); };
  $('cf-cancel').onclick = function () { if (_cfResolve) _cfResolve(false); };
  $('cf-ov').addEventListener('click', function (e) { if (e.target === this && _cfResolve) _cfResolve(false); });
  var modeBtns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < modeBtns.length; i++) {
    modeBtns[i].onclick = function () {
      if (_state.target === ALL) return;
      for (var j = 0; j < modeBtns.length; j++) modeBtns[j].classList.remove('active');
      this.classList.add('active');
      _state.mode = this.dataset.mode;
      scan();
    };
  }

  // 标签切换（唯一入口；焦点接力/手动点击同路由）
  function switchTab(id) {
    var tabsEls = document.querySelectorAll('#tabs .tab');
    for (var i = 0; i < tabsEls.length; i++) tabsEls[i].classList.toggle('active', tabsEls[i].dataset.tab === id);
    var views = document.querySelectorAll('.view');
    for (var j = 0; j < views.length; j++) views[j].classList.toggle('active', views[j].id === 'view-' + id);
    if ((id === 'log' || id === 'wl') && realPath()) post('dsecret:data', { path: realPath() });
  }

  var tabs = document.querySelectorAll('#tabs .tab');
  for (var k = 0; k < tabs.length; k++) {
    tabs[k].onclick = function () { switchTab(this.dataset.tab); };
  }

  // ── ready ──
  post('dsecret:ready');

  // ★ 语言切换：当前视图重渲染（项目下拉/状态栏/处理队列/忽略清单按新语言重取——禁旧语言快照残留）
  try {
    window.addEventListener('qqq-lang-change', function () {
      try { renderProjects(); } catch (_) { }
      try { if (!_state.scanning && _state.lastScanMsg) { renderScanResult(_state.lastScanMsg); } } catch (_) { }
      try { if (_state.lastData) { renderLog(_state.lastData.log); renderWl(_state.lastData); } } catch (_) { }
    });
  } catch (_) { }
})();
</script>
</body>
</html>
