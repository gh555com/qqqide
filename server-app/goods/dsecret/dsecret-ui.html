<!-- 引擎: core/secret-guard.js（parent 后台事件驱动）→ dsecret.js 中转 → 本页 -->
<!-- 协议: dsecret:*（消息类型清单见 goods/dsecret/dsecret.js 头注释） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsecret</title>
<style>
:root{--bg:#fdf6e3;--text:#595754;--border:#d3c6aa;--card:#eee8d5;--accent:#859900;--err:#dc322f;--dim:#93a1a1;--orange:#cb4b16}
[data-theme="dark"]{--bg:#1e1e1e;--text:#dcd8d0;--border:#333;--card:#2a2a2a;--accent:#8fbc5a;--err:#ff4444;--dim:#6a6660;--orange:#e07b39}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:ui-monospace,Consolas,"Microsoft YaHei",sans-serif;font-size:12px;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;user-select:text;-webkit-user-select:text;position:relative}
::selection{background:#d6d6d6;color:#073642}
[data-theme="dark"]::selection{background:#274642;color:#fdf6e3}
/* 工具条 */
#bar{display:flex;gap:4px;padding:3px 8px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;align-items:center;flex-wrap:nowrap}
/* 项目下拉（自绘 qd 风格；禁原生 select） */
#bar .dd{position:relative;flex-shrink:0}
#bar .dd-btn{display:inline-flex;align-items:center;gap:6px;max-width:230px}
#bar .dd-btn.open{border-color:var(--accent);color:var(--accent)}
#proj-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid currentColor;opacity:.55;flex-shrink:0}
.dd-list{display:none;position:absolute;top:100%;left:0;margin-top:3px;min-width:100%;max-width:320px;max-height:240px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:60;padding:3px}
.dd-list.show{display:block}
.dd-item{padding:3px 8px;font-size:11px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.dd-item:hover{background:var(--border)}
.dd-item.sel{color:var(--accent);font-weight:700}
.dd-item.dd-empty{color:var(--dim)}
#bar button{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit}
#bar button:hover{background:var(--border)}
#bar button.active{background:var(--accent);border-color:var(--accent);color:#fdf6e3;font-weight:700}
[data-theme="dark"] #bar button.active{color:#1e1e1e}
#bar .sep{width:1px;height:16px;background:var(--border);margin:0 4px}
#btn-scan{background:var(--accent);border-color:var(--accent);color:#fdf6e3;font-weight:700}
[data-theme="dark"] #btn-scan{color:#1e1e1e}
.toggle{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text);white-space:nowrap;cursor:default}
.toggle input{accent-color:var(--accent);margin:0}
#bar-spacer{flex:1;min-width:0}
/* 底部确认框（iframe 内自绘，禁原生 modal） */
#cf-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
#cf-ov.show{display:flex}
#cf-panel{width:470px;max-width:88vw;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5);padding:20px 22px 14px;font-size:12.5px;line-height:1.85;color:var(--text)}
#cf-text{white-space:pre-wrap;word-break:break-word}
#cf-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#cf-btns button{font-family:inherit;font-size:12px;padding:5px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text)}
#cf-btns button:hover{background:var(--border)}
#cf-ok{border-color:var(--err);color:var(--err)}
/* 状态条 */
#stats{display:flex;gap:14px;padding:4px 12px;border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;font-size:11px;flex-wrap:wrap}
#stats .stat{color:var(--dim);white-space:nowrap}
#stats .stat b{color:var(--text);font-weight:700}
#stats .stat.t1 b{color:var(--accent)}
#stats .stat.t2 b{color:var(--orange)}
#stats .stat.t3 b{color:var(--err)}
#st-msg{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;margin-left:auto}
/* Tab 栏 */
#tabs{display:flex;gap:2px;padding:2px 8px 0;border-bottom:1px solid var(--border);flex-shrink:0}
#tabs .tab{font-size:11px;padding:4px 12px;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;background:transparent;color:var(--dim);font-family:inherit}
#tabs .tab.active{background:var(--card);color:var(--text);font-weight:700}
/* 内容 */
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:8px 10px}
.view.active{display:block}
.view h3{font-size:12px;color:var(--dim);margin:8px 0 6px;font-weight:700}
/* 命中条目 */
.item{margin-bottom:8px;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card)}
.item .head{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;word-break:break-all}
.item .loc{font-weight:700;color:var(--text)}
.item .tag{color:var(--orange);white-space:nowrap}
.item .tag.t1{color:var(--accent)}
.item .tag.t2{color:var(--orange)}
.item .tag.t3{color:var(--err)}
.item .val{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%}
.item .badge{font-size:10px;padding:0 6px;border:1px solid var(--orange);color:var(--orange);border-radius:8px;white-space:nowrap;flex-shrink:0}
.item .ctx.clickable{cursor:pointer}
.item .ctx.clickable:hover{border-color:var(--accent)}
.item .ctx{font-family:Consolas,monospace;font-size:11px;color:var(--text);background:var(--bg);border:1px solid var(--border);padding:5px 7px;border-radius:3px;white-space:pre-wrap;word-break:break-all;margin-bottom:6px}
.item .btns{display:flex;gap:6px}
.item .btns button{font-size:11px;padding:2px 10px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-family:inherit}
.item .btns button:hover{background:var(--border)}
.item .btns button.danger{color:var(--err);border-color:var(--err)}
.item .btns button.ok{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--dim);text-align:center;padding:30px 0;font-size:12px}
/* 底部批量按钮 */
.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:6px 10px;display:flex;gap:8px;align-items:center;margin-top:8px}
.foot button{font-size:11px;padding:3px 14px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-family:inherit}
.foot button.danger{color:var(--err);border-color:var(--err)}
.foot button:hover{background:var(--border)}
.foot .hint{margin-left:auto;font-size:10px;color:var(--dim)}
/* 日志 */
#log-list .l{font-family:Consolas,monospace;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--dim)}
#log-list .l.redact{color:var(--accent)}
#log-list .l.skip{color:var(--dim)}
#log-list .l.error{color:var(--err)}
#log-list .l.user{color:var(--accent)}
/* 白名单 */
.wl-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px;word-break:break-all}
.wl-row .k{flex:1;color:var(--text)}
.wl-row .when{color:var(--dim);white-space:nowrap;font-size:10px}
.wl-row button{font-size:10px;padding:1px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--err);font-family:inherit}
.wl-row button:hover{background:var(--border)}
/* 忽略与暴露 */
#ignore-list .ig-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px;word-break:break-all}
#ignore-list .ig-row .p{flex:1;color:var(--text)}
#ignore-list .ig-row button{font-size:10px;padding:1px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit;white-space:nowrap}
#ignore-list .ig-row button:hover{background:var(--border)}
#expose-row{display:flex;gap:6px;margin:8px 0}
#expose-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:11px;padding:3px 8px;outline:none}
#expose-row button{font-size:11px;padding:2px 12px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);font-family:inherit}
#expose-row button:hover{background:var(--border)}
#expose-result{font-family:Consolas,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:4px;padding:8px 10px;margin-top:4px}
#expose-result.safe{color:var(--accent)}
#expose-result.danger{color:var(--err)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="bar">
  <div class="dd" id="proj-dd">
    <button type="button" class="dd-btn" id="proj-btn" data-i18n-title="goods.dsecret.targetProject">
      <span id="proj-name">—</span><span class="dd-caret"></span>
    </button>
    <div class="dd-list" id="proj-list"></div>
  </div>
  <button class="mode-btn active" data-mode="dirty" data-i18n="goods.dsecret.modeDirty">未提交</button>
  <button class="mode-btn" data-mode="full" data-i18n="goods.dsecret.modeFull">全量体检</button>
  <button id="btn-scan"><span class="qqi qqi-search" style="margin-right:4px"></span><span data-i18n="goods.dsecret.scanBtn">扫描</span></button>
  <span class="sep"></span>
  <label class="toggle" title="后台自动脱敏总开关（设置→高级→协助密钥脱敏 同键）" data-i18n-title="goods.dsecret.toggleTip"><input type="checkbox" id="chk-enabled"> <span data-i18n="goods.dsecret.assist">协助脱敏</span></label>
  <span id="bar-spacer"></span>
</div>
<div id="stats">
  <span class="stat t1"><span data-i18n="goods.dsecret.stT1">T1 强签名</span> <b id="st-t1">0</b></span>
  <span class="stat t2"><span data-i18n="goods.dsecret.stT2">T2 高熵</span> <b id="st-t2">0</b></span>
  <span class="stat t3"><span data-i18n="goods.dsecret.stT3">T3 待协同</span> <b id="st-t3">0</b></span>
  <span class="stat"><span data-i18n="goods.dsecret.stFiles">已扫文件</span> <b id="st-files">0</b></span>
  <span id="st-msg"></span>
</div>
<div id="tabs">
  <button class="tab active" data-tab="queue" data-i18n="goods.dsecret.tabQueue">处理队列</button>
  <button class="tab" data-tab="log" data-i18n="goods.dsecret.tabLog">审计日志</button>
  <button class="tab" data-tab="wl" data-i18n="goods.dsecret.tabWl">白名单</button>
  <button class="tab" data-tab="ignore" data-i18n="goods.dsecret.tabIgnore">忽略与暴露</button>
</div>
<div id="content">
  <div id="view-queue" class="view active"></div>
  <div id="view-log" class="view"></div>
  <div id="view-wl" class="view"></div>
  <div id="view-ignore" class="view"></div>
</div>

<div id="cf-ov">
  <div id="cf-panel">
    <div id="cf-text"></div>
    <div id="cf-btns">
      <button type="button" id="cf-cancel" data-i18n="goods.dsecret.cancel">取消</button>
      <button type="button" id="cf-ok" data-i18n="goods.dsecret.confirm">确定</button>
    </div>
  </div>
</div>

<script src="../../core/i18n.js"></script>
<script src="../../core/qqq-icons.js"></script>
<script>
(function () {
  'use strict';

  // ── 主题（kmd 同款：父窗口 data-theme + qqqide-theme-change 监听）──
  try {
    var pt = parent.document.documentElement.getAttribute('data-theme');
    if (pt === 'light' || pt === 'dark') document.documentElement.setAttribute('data-theme', pt);
  } catch (_) {}
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'qqqide-theme-change') {
      document.documentElement.setAttribute('data-theme', e.data.dark ? 'dark' : 'light');
    }
  });

  // ── i18n：本 iframe i18n.js 实例优先（独立窗口也可用），父窗口 _i 兑底；{0}/{1} 插值 ──
  function _t(k, fb) {
    var s = fb;
    try { s = window._i ? window._i(k, fb) : ((window.parent && window.parent._i) ? window.parent._i(k, fb) : fb); } catch (_) { s = fb; }
    for (var i = 2; i < arguments.length; i++) { s = String(s).split('{' + (i - 2) + '}').join(arguments[i]); }
    return s;
  }

  // ── 状态 ──
  var _state = {
    enabled: true,
    projects: [],          // [{path,name}]
    current: null,         // 主项目路径（★ 标记）
    target: null,          // 本次扫描目标（下拉选中项）
    mode: 'dirty',         // dirty | full
    scanning: false,
    lastResult: null,      // 最近一次 scan-result
    busy: false            // act 防连点
  };

  var $ = function (id) { return document.getElementById(id); };

  function post(type, extra) {
    try { parent.postMessage(Object.assign({ type: type }, extra || {}), '*'); } catch (_) {}
  }

  // ── 项目下拉（qd 自绘，禁原生 select）──
  function projLabel(p) { return p.name + (p.path === _state.current ? ' ★' : ''); }

  function renderProjects() {
    var list = $('proj-list');
    var nameEl = $('proj-name');
    list.innerHTML = '';
    if (!_state.projects.length) {
      nameEl.textContent = _t('goods.dsecret.noProject', '（无项目 — 先添加 AI 视口项目）');
      var e = document.createElement('div');
      e.className = 'dd-item dd-empty';
      e.textContent = nameEl.textContent;
      list.appendChild(e);
      return;
    }
    var valid = false;
    for (var k = 0; k < _state.projects.length; k++) { if (_state.projects[k].path === _state.target) { valid = true; break; } }
    if (!valid) _state.target = _state.current || _state.projects[0].path;
    var curLabel = _state.target;
    for (var i = 0; i < _state.projects.length; i++) {
      var p = _state.projects[i];
      var it = document.createElement('div');
      it.className = 'dd-item' + (p.path === _state.target ? ' sel' : '');
      it.textContent = projLabel(p);
      it.title = p.path;
      it.onclick = (function (path) { return function () { selectProject(path); }; })(p.path);
      list.appendChild(it);
      if (p.path === _state.target) curLabel = projLabel(p);
    }
    nameEl.textContent = curLabel;
    $('proj-btn').title = _state.target || '';
  }

  function openProjList() { $('proj-list').classList.add('show'); $('proj-btn').classList.add('open'); }
  function closeProjList() { $('proj-list').classList.remove('show'); $('proj-btn').classList.remove('open'); }

  // 切项目 = 换一台机器扫：先清旧结果再立即重扫（旧实现只换下拉值，点了看着没反应）
  function selectProject(path) {
    closeProjList();
    if (!path || path === _state.target) return;
    _state.target = path;
    renderProjects();
    resetView();
    scan();
  }

  function curPath() { return _state.target || null; }

  function resetView() {
    _state.lastResult = null;
    _state.lastScanMsg = null;
    $('st-t1').textContent = '0';
    $('st-t2').textContent = '0';
    $('st-t3').textContent = '0';
    $('st-files').textContent = '0';
    $('st-msg').textContent = '';
    $('view-queue').innerHTML = '';
    $('view-ignore').innerHTML = '';
  }

  // ── qd 风格确认框（iframe 内自绘；禁原生系统 modal）──
  var _cfResolve = null;
  function askConfirm(text) {
    return new Promise(function (resolve) {
      $('cf-text').textContent = text;
      $('cf-ov').classList.add('show');
      _cfResolve = function (ok) {
        $('cf-ov').classList.remove('show');
        _cfResolve = null;
        resolve(ok);
      };
    });
  }

  // ── 扫描 ──
  function scan() {
    var p = curPath();
    if (!p || _state.scanning) return;
    _state.scanning = true;
    $('btn-scan').disabled = true;
    $('st-msg').textContent = _t('goods.dsecret.scanning', '扫描中…');
    post('dsecret:scan', { path: p, mode: _state.mode });
  }

  function renderScanResult(msg) {
    _state.scanning = false;
    $('btn-scan').disabled = false;
    // 扫描期间切了项目 → 丢弃旧项目结果，补扫当前目标（否则新项目永远停在空白）
    if (msg.path && msg.path !== curPath()) { scan(); return; }
    if (msg.error) { $('st-msg').textContent = _t('goods.dsecret.scanFail', '扫描失败: {0}', msg.error); return; }
    _state.lastResult = msg.result;
    var r = msg.result;
    var auto = r.auto || [];
    var t1 = r.t1 || [], t2 = r.t2 || [], t3 = r.t3 || [];
    var t3n = t3.length;
    $('st-t1').textContent = msg.mode === 'full' ? t1.length : auto.filter(function (a) { return a.tier === 1; }).length;
    $('st-t2').textContent = msg.mode === 'full' ? t2.length : auto.filter(function (a) { return a.tier === 2; }).length;
    $('st-t3').textContent = t3n;
    $('st-files').textContent = r.fileCount || 0;
    $('st-msg').textContent = r.disabled ? _t('goods.dsecret.disabledHint', '（协助脱敏已关闭 — 本次只做人工协同，不自动抹除）') : (msg.mode === 'full' ? _t('goods.dsecret.fullDone', '全量体检完成') : _t('goods.dsecret.dirtyDone', '未提交扫描完成') + (r.skip && r.skip.length ? _t('goods.dsecret.skipN', '，跳过 {0} 个忽略目录文件', r.skip.length) : ''));
    renderQueue(msg.mode, auto, t1, t2, t3);
    renderIgnoreList(auto, t3, r.skip);
  }

  // ── 处理队列视图 ──
  function itemEl(it, isT3) {
    var row = document.createElement('div');
    row.className = 'item';
    var head = document.createElement('div');
    head.className = 'head';
    var loc = document.createElement('span');
    loc.className = 'loc';
    loc.textContent = it.file + ':' + it.line;
    var tag = document.createElement('span');
    tag.className = 'tag ' + (isT3 ? 't3' : (it.tier === 1 ? 't1' : 't2'));
    tag.textContent = it.name || (isT3 ? _t('goods.dsecret.t3Edge', 'T3 边界') : 'T' + it.tier);
    head.appendChild(loc); head.appendChild(tag);
    if (it.blocked === 'editor-dirty') {
      var bd = document.createElement('span');
      bd.className = 'badge';
      bd.textContent = _t('goods.dsecret.skipDirty', '未保存改动 · 已跳过抹除');
      bd.title = _t('goods.dsecret.skipDirtyTip', '该文件在编辑器里有未保存的修改，自动抹除会跳过它（否则你一保存就把明文盖回来）。保存后再扫一次即生效。');
      head.appendChild(bd);
    }
    if (it.value) {
      var val = document.createElement('span');
      val.className = 'val';
      val.textContent = it.value;
      val.title = it.value;
      head.appendChild(val);
    }
    row.appendChild(head);
    // 第二行（完整原文）= 唯一可点击行：右侧编辑器只读预览 + 跳行（第一行不动）
    var ctx = document.createElement('div');
    ctx.className = 'ctx clickable';
    ctx.textContent = it.context || '';
    ctx.title = _t('goods.dsecret.ctxTip', '点击在右侧编辑器打开该文件并跳到这一行（只读预览，不改文件）');
    ctx.onclick = function () { post('dsecret:open-file', { path: curPath(), relPath: it.file, line: it.line }); };
    row.appendChild(ctx);
    return row;
  }

  function renderQueue(mode, auto, t1, t2, t3) {
    var v = $('view-queue');
    v.innerHTML = '';
    var autoList = mode === 'full' ? t1.concat(t2) : auto;
    if (autoList.length) {
      var h = document.createElement('h3');
      h.textContent = mode === 'full' ? _t('secretGuard.fullHit', 'T1/T2 命中（全量体检 · 只读未处理）') : _t('secretGuard.autoRedacted', '自动抹除（配置类 T1 已替换为 ***REDACTED***）');
      v.appendChild(h);
      for (var i = 0; i < autoList.length; i++) v.appendChild(itemEl(autoList[i], false));
    }
    if (t3.length) {
      var h3 = document.createElement('h3');
      h3.textContent = _t('goods.dsecret.t3Title', 'T3 待协同 — 无法自动确认，请人工判断（{0} 条）', t3.length);
      v.appendChild(h3);
      for (var j = 0; j < t3.length; j++) {
        var it = t3[j];
        var row = itemEl(it, true);
        var btns = document.createElement('div');
        btns.className = 'btns';
        var bErase = document.createElement('button');
        bErase.className = 'danger';
        bErase.textContent = _t('secretGuard.btnErase', '抹除');
        bErase.onclick = function (item) { return function () { act('erase', item); }; }(it);
        var bKeep = document.createElement('button');
        bKeep.className = 'ok';
        bKeep.textContent = _t('secretGuard.btnKeep', '保留');
        bKeep.onclick = function (item) { return function () { act('keep', item); }; }(it);
        var bIg = document.createElement('button');
        bIg.textContent = _t('secretGuard.btnIgnoreFile', '忽略此文件');
        bIg.onclick = function (item) { return function () {
          askConfirm(_t('goods.dsecret.ignoreConfirm', '「保留」和「忽略此文件」都会写进白名单，并且两者都能在「白名单」tab 里点「移除」来撤销。\n\n区别：同文件别的值、或值换了（换成新 key）→「保留」之后还会重新报；「忽略此文件」则永远不报（当前 + 未来所有命中全跳过、这份文件我认了，整份别管）。')).then(function (ok) {
            if (ok) act('ignoreFile', item);
          });
        }; }(it);
        btns.appendChild(bErase); btns.appendChild(bKeep); btns.appendChild(bIg);
        row.appendChild(btns);
        v.appendChild(row);
      }
      var foot = document.createElement('div');
      foot.className = 'foot';
      var bAllErase = document.createElement('button');
      bAllErase.className = 'danger';
      bAllErase.textContent = _t('secretGuard.btnEraseAll', '全部抹除');
      bAllErase.onclick = function () { act('eraseAll', null); };
      var bAllKeep = document.createElement('button');
      bAllKeep.textContent = _t('secretGuard.btnKeepAll', '全部保留');
      bAllKeep.onclick = function () { act('keepAll', null); };
      foot.appendChild(bAllErase); foot.appendChild(bAllKeep);
      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = _t('secretGuard.editorOpenHint', '提示：文件有未保存修改时会跳过抹除（保存后重扫即生效）；干净打开的文件照常抹除并自动刷新显示');
      foot.appendChild(hint);
      v.appendChild(foot);
    }
    if (!autoList.length && !t3.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = _state.lastResult ? _t('goods.dsecret.noSecrets', '✅ 未发现疑似密钥') : _t('goods.dsecret.clickScan', '点击「扫描」开始检查（或等待后台自动检测）');
      v.appendChild(e);
    }
  }

  // ── 协同动作 ──
  function act(action, item) {
    if (_state.busy) return;
    _state.busy = true;
    post('dsecret:act', { path: curPath(), action: action, item: item });
  }

  function renderActResult(msg) {
    _state.busy = false;
    if (msg.error) { $('st-msg').textContent = _t('goods.dsecret.opFail', '操作失败: {0}', msg.error); return; }
    $('st-msg').textContent = _t('goods.dsecret.updated', '已更新（剩余 {0} 条待协同）', msg.pending.length);
    // 重扫以同步最新状态（auto 计数 / t3 队列）
    scan();
  }

  // ── 审计日志 ──
  function renderLog(log) {
    var v = $('view-log');
    v.innerHTML = '';
    if (!log) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = _t('goods.dsecret.noLog', '暂无审计日志');
      v.appendChild(e);
      return;
    }
    var wrap = document.createElement('div');
    wrap.id = 'log-list';
    var lines = log.split('\n').filter(Boolean);
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var d = document.createElement('div');
      d.className = 'l';
      if (ln.indexOf('REDACT[') !== -1) d.className = 'l redact';
      else if (ln.indexOf('SKIP') !== -1) d.className = 'l skip';
      else if (ln.indexOf('ERROR') !== -1) d.className = 'l error';
      else if (ln.indexOf('(user-confirmed)') !== -1) d.className = 'l user';
      d.textContent = ln;
      wrap.appendChild(d);
    }
    v.appendChild(wrap);
  }

  // ── 白名单 ──
  function renderWl(data) {
    var v = $('view-wl');
    v.innerHTML = '';
    var files = Object.keys(data.wlFiles || {});
    var values = Object.keys(data.wlValues || {});
    if (!files.length && !values.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = _t('goods.dsecret.wlEmpty', '白名单为空 — 处理队列里点「保留 / 忽略此文件」会记录在这里');
      v.appendChild(e);
      return;
    }
    if (files.length) {
      var hf = document.createElement('h3');
      hf.textContent = _t('goods.dsecret.fileLevel', '文件级忽略（{0}）', files.length);
      v.appendChild(hf);
      for (var i = 0; i < files.length; i++) {
        v.appendChild(wlRow('files', files[i], data.wlFiles[files[i]]));
      }
    }
    if (values.length) {
      var hv = document.createElement('h3');
      hv.textContent = _t('goods.dsecret.valueLevel', '值级保留（{0}）', values.length);
      v.appendChild(hv);
      for (var j = 0; j < values.length; j++) {
        var key = values[j];
        var disp = key;
        var sep = key.indexOf('\u0000');
        if (sep !== -1) disp = key.slice(0, sep) + '  #' + key.slice(sep + 1);
        v.appendChild(wlRow('values', key, data.wlValues[key], disp));
      }
    }
  }

  function wlRow(kind, key, ts, disp) {
    var row = document.createElement('div');
    row.className = 'wl-row';
    var k = document.createElement('span');
    k.className = 'k';
    k.textContent = disp || key;
    var when = document.createElement('span');
    when.className = 'when';
    when.textContent = ts ? new Date(ts).toLocaleString() : '';
    var del = document.createElement('button');
    del.textContent = _t('goods.dsecret.remove', '移除');
    del.onclick = function () { post('dsecret:wl-remove', { path: curPath(), kind: kind, key: key }); };
    row.appendChild(k); row.appendChild(when); row.appendChild(del);
    return row;
  }

  // ── 忽略与暴露 ──
  function renderIgnoreList(auto, t3, skip) {
    var v = $('view-ignore');
    v.innerHTML = '';
    var files = [];
    var seen = {};
    var push = function (f) { if (f && !seen[f]) { seen[f] = 1; files.push(f); } };
    (auto || []).forEach(function (a) { push(a.file); });
    (t3 || []).forEach(function (t) { push(t.file); });
    (skip || []).forEach(push);

    var h = document.createElement('h3');
    h.textContent = _t('goods.dsecret.igTitle', '敏感文件忽略（上次扫描命中 + 跳过目录）');
    v.appendChild(h);
    if (!files.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = _t('goods.dsecret.igEmpty', '暂无命中文件 — 先扫描一次');
      v.appendChild(e);
    } else {
      var wrap = document.createElement('div');
      wrap.id = 'ignore-list';
      for (var i = 0; i < files.length; i++) {
        var row = document.createElement('div');
        row.className = 'ig-row';
        var p = document.createElement('span');
        p.className = 'p';
        p.textContent = files[i];
        var b1 = document.createElement('button');
        b1.textContent = _t('goods.dsecret.addGitignore', '加入 .gitignore');
        b1.onclick = (function (rel) { return function () { gitignore(rel, false); }; })(files[i]);
        var b2 = document.createElement('button');
        b2.textContent = _t('goods.dsecret.ignoreUntrack', '忽略并取消跟踪');
        b2.title = _t('goods.dsecret.ignoreUntrackTip', '追加 .gitignore + git rm --cached（本地保留，历史仍在）');
        b2.onclick = (function (rel) { return function () { gitignore(rel, true); }; })(files[i]);
        row.appendChild(p); row.appendChild(b1); row.appendChild(b2);
        wrap.appendChild(row);
      }
      v.appendChild(wrap);
    }

    var h2 = document.createElement('h3');
    h2.textContent = _t('goods.dsecret.exposeTitle', '历史暴露检查（git log --all -S 全历史搜索）');
    v.appendChild(h2);
    var row2 = document.createElement('div');
    row2.id = 'expose-row';
    var inp = document.createElement('input');
    inp.placeholder = _t('goods.dsecret.exposePh', '键入疑似暴露的密钥值 / 前缀，检查是否进过 git 历史');
    inp.id = 'expose-input';
    var btn = document.createElement('button');
    btn.textContent = _t('goods.dsecret.checkBtn', '检查');
    btn.onclick = function () {
      var val = inp.value.trim();
      if (!val) return;
      var r = document.getElementById('expose-result');
      if (r) r.textContent = _t('goods.dsecret.checking', '检查中…（全历史搜索，可能较慢）');
      post('dsecret:git-log', { path: curPath(), value: val });
    };
    row2.appendChild(inp); row2.appendChild(btn);
    v.appendChild(row2);
    var res = document.createElement('div');
    res.id = 'expose-result';
    res.className = 'safe';
    res.textContent = _t('goods.dsecret.notChecked', '（未检查）');
    v.appendChild(res);
  }

  function gitignore(relPath, rmCached) {
    post('dsecret:gitignore', { path: curPath(), relPath: relPath, rmCached: rmCached });
  }

  // ── 事件 ──
  var _dirtyTimer = null;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.type || d.type.indexOf('dsecret:') !== 0) return;
    if (d.type === 'dsecret:init') {
      _state.enabled = !!d.enabled;
      _state.projects = d.projects || [];
      _state.current = d.current || null;
      _state.target = d.current || null;
      $('chk-enabled').checked = _state.enabled;
      renderProjects();
      if (curPath()) scan(); // 打开即扫（懒惰）
      return;
    }
    if (d.type === 'dsecret:scan-result') {
      _state.lastScanMsg = d;   // ★ 缓存整条消息供语言切换重渲染（msg.mode 参与文案）
      renderScanResult(d);
      return;
    }
    if (d.type === 'dsecret:act-result') {
      renderActResult(d);
      return;
    }
    if (d.type === 'dsecret:data') {
      _state.lastData = d.data;   // ★ 缓存供语言切换重渲染（日志/白名单标题随语言）
      renderLog(d.data.log);
      renderWl(d.data);
      return;
    }
    if (d.type === 'dsecret:data-updated') {
      post('dsecret:data', { path: curPath() });
      return;
    }
    if (d.type === 'dsecret:git-log-result') {
      var r = document.getElementById('expose-result');
      if (!r) return;
      r.className = d.result.found ? 'danger' : 'safe';
      r.textContent = d.result.detail;
      return;
    }
    if (d.type === 'dsecret:gitignore-result') {
      $('st-msg').textContent = d.result.ok ? (d.relPath + ' → ' + d.result.msg) : _t('goods.dsecret.opFailShort', '失败: {0}', d.result.msg);
      return;
    }
    if (d.type === 'dsecret:enabled') {
      var changed = (!!d.on !== _state.enabled);
      _state.enabled = !!d.on;
      $('chk-enabled').checked = _state.enabled;
      if (changed) scan();
      return;
    }
    if (d.type === 'dsecret:git-dirty') {
      // 事件桥：后台 badge 发现未提交变化 → 若当前项目匹配则自动重扫（防抖 500ms）
      if (d.path !== curPath()) return;
      if (_dirtyTimer) clearTimeout(_dirtyTimer);
      _dirtyTimer = setTimeout(function () {
        if (_state.mode === 'dirty') scan();
      }, 500);
    }
  });

  // ── 控件绑定 ──
  $('btn-scan').onclick = scan;
  $('chk-enabled').onchange = function () {
    _state.enabled = this.checked;
    post('dsecret:toggle', { on: this.checked });
    scan();   // 开关 = 抹除策略，而非扫不扫 —— 勾上/取消立即重扫，结果当场体现
  };
  $('proj-btn').onclick = function (e) {
    e.stopPropagation();
    if ($('proj-list').classList.contains('show')) closeProjList(); else openProjList();
  };
  document.addEventListener('click', function (e) {
    if (!$('proj-dd').contains(e.target)) closeProjList();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (_cfResolve) { e.preventDefault(); _cfResolve(false); return; }
    closeProjList();
  });
  $('cf-ok').onclick = function () { if (_cfResolve) _cfResolve(true); };
  $('cf-cancel').onclick = function () { if (_cfResolve) _cfResolve(false); };
  $('cf-ov').addEventListener('click', function (e) { if (e.target === this && _cfResolve) _cfResolve(false); });
  var modeBtns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < modeBtns.length; i++) {
    modeBtns[i].onclick = function () {
      for (var j = 0; j < modeBtns.length; j++) modeBtns[j].classList.remove('active');
      this.classList.add('active');
      _state.mode = this.dataset.mode;
      scan();
    };
  }
  var tabs = document.querySelectorAll('#tabs .tab');
  for (var k = 0; k < tabs.length; k++) {
    tabs[k].onclick = function () {
      for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
      this.classList.add('active');
      var id = 'view-' + this.dataset.tab;
      var views = document.querySelectorAll('.view');
      for (var v = 0; v < views.length; v++) views[v].classList.remove('active');
      var tgt = document.getElementById(id);
      if (tgt) tgt.classList.add('active');
      if (this.dataset.tab === 'log' || this.dataset.tab === 'wl') {
        post('dsecret:data', { path: curPath() });
      }
    };
  }

  // ── ready ──
  post('dsecret:ready');

  // ★ 语言切换：当前视图重渲染（项目下拉/状态栏/处理队列/忽略清单按新语言重取——禁旧语言快照残留）
  try {
    window.addEventListener('qqq-lang-change', function () {
      try { renderProjects(); } catch (_) { }
      try { if (!_state.scanning && _state.lastScanMsg) { renderScanResult(_state.lastScanMsg); } } catch (_) { }
      try { if (_state.lastData) { renderLog(_state.lastData.log); renderWl(_state.lastData); } } catch (_) { }
    });
  } catch (_) { }
})();
</script>
</body>
</html>
