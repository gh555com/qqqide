<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>qqq-shell - offline</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #fdf6e3; color: #586e75;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .box {
    text-align: center;
    max-width: 540px;
    padding: 32px;
    background: #eee8d5;
    border: 1px solid #93a1a1;
    border-radius: 4px;
  }
  h1 { color: #073642; margin: 0 0 16px; font-weight: 500; font-size: 20px; }
  p  { margin: 8px 0; font-size: 14px; line-height: 1.6; }
  .url { color: #268bd2; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; word-break: break-all; }
  .reason { color: #cb4b16; font-size: 12px; margin-top: 4px; }
  .row { margin-top: 20px; display: flex; justify-content: center; gap: 8px; }
  button {
    padding: 8px 24px;
    background: #268bd2; color: #fdf6e3;
    border: 0; border-radius: 3px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #2aa198; }
  button[disabled] { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: #586e75; border: 1px solid #93a1a1; }
  .small { color: #93a1a1; font-size: 12px; margin-top: 24px; }
  .countdown { color: #859900; font-weight: 600; }
  .status { margin-top: 12px; min-height: 18px; font-size: 12px; color: #859900; }
  .status.err { color: #dc322f; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .connecting-msg::after { content:'…'; animation:pulse 1.2s steps(4) infinite; display:inline-block; }
  @keyframes __qqq_spin{to{transform:rotate(360deg)}}
  .connecting .spinner {
    width: 36px; height: 36px; margin: 0 auto 20px;
    border: 3px solid #eee8d5; border-top-color: #268bd2;
    border-radius: 50%; animation: __qqq_spin .8s linear infinite;
  }
  .connecting .box { background: transparent; border: 0; }
  .progress-wrap { margin: 16px auto 0; max-width: 280px; }
  .bar-bg { background: #eee8d5; border-radius: 6px; height: 6px; overflow: hidden; }
  .bar-fg { background: linear-gradient(90deg, #268bd2, #2aa198); height: 100%; width: 0%; transition: width .4s ease; border-radius: 6px; }
  .pct-text { color: #93a1a1; font-size: 11px; margin-top: 4px; text-align: center; }
  .stage-text { color: #586e75; font-size: 13px; margin: 12px 0 4px; min-height: 18px; }
</style>
</head>
<body>
<div class="box" id="box">
  <h1>qqq-shell offline</h1>
  <p id="msg" data-k="main.boot.noServer">无法连接服务器，可能网络中断或服务器未就绪。</p>
  <p class="url" id="url"></p>
  <p class="reason" id="reason" style="display:none"></p>
  <div class="row" id="retry-row">
    <button id="btn-retry" data-k="main.boot.retry">立即重试</button>
  </div>
  <p class="status" id="status"></p>
  <p class="small" id="small-hint" data-k="main.boot.portableHint">壳保持便携模式。所有数据仅写入应用目录。</p>
</div>
<script>
  (function () {
    const params = new URLSearchParams(location.search);
    document.getElementById('url').textContent = params.get('url') || '';
    const reason = params.get('reason') || '';

    // ── 主进程 i18n 注入（main-i18n.ts miDict → window.__qqqApplyLang）──
    // 无注入时全部中文回退原样；注入后按用户语言覆盖
    window.__qqqDict = window.__qqqDict || {};
    function _t(k, fb) { var v = window.__qqqDict[k]; return (typeof v === 'string' && v) ? v : fb; }
    function _applyDict() {
      document.querySelectorAll('[data-k]').forEach(function (el) {
        var v = window.__qqqDict[el.getAttribute('data-k')];
        if (typeof v === 'string' && v) el.textContent = v;
      });
      var sEl = document.getElementById('boot-stage');
      if (sEl) sEl.textContent = _t('main.boot.connecting', sEl.textContent);
      var rEl = document.getElementById('reason');
      if (rEl && rEl.style.display !== 'none') rEl.textContent = _t('main.boot.reason', '原因：{r}').replace('{r}', reason);
    }
    window.__qqqApplyLang = function (dict) {
      try { if (dict) { for (var k in dict) { if (dict[k]) window.__qqqDict[k] = dict[k]; } } } catch (e) { /* ignore */ }
      try { _applyDict(); } catch (e) { /* ignore */ }
    };

    // ── 连接中（首次加载、无错误） ──
    if (!reason || reason === 'connecting') {
      document.body.className = 'connecting';
      document.getElementById('box').innerHTML =
        '<div class="spinner"></div>' +
        '<p class="stage-text" id="boot-stage" data-k="main.boot.connecting">正在连接服务器…</p>' +
        '<div class="progress-wrap">' +
        '<div class="bar-bg"><div class="bar-fg" id="boot-bar"></div></div>' +
        '<div class="pct-text" id="boot-pct">0%</div>' +
        '</div>' +
        '<p style="font-size:12px;color:#93a1a1;margin:8px 0 0" data-k="main.boot.firstWait">首次连接可能需要稍等…</p>';
      _applyDict();
      // ★ 监听主进程注入的进度更新
      window.__qqqBootUpdate = function(stage, pct) {
        var sEl = document.getElementById('boot-stage');
        var bEl = document.getElementById('boot-bar');
        var pEl = document.getElementById('boot-pct');
        if (sEl) sEl.textContent = stage;
        if (bEl) bEl.style.width = pct + '%';
        if (pEl) pEl.textContent = pct + '%';
      };
      return;
    }

    // ── 错误状态 ──
    if (reason) {
      document.getElementById('reason').textContent = _t('main.boot.reason', '原因：{r}').replace('{r}', reason);
    }

    const cdEl = document.getElementById('cd');
    const statusEl = document.getElementById('status');
    const btnRetry = document.getElementById('btn-retry');

    let countdown = 10;
    let timer = null;
    let busy = false;

    function setStatus(msg, isErr) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (isErr ? ' err' : '');
    }

    async function tryRetry() {
      if (busy) { return; }
      busy = true;
      btnRetry.disabled = true;
      setStatus(_t('main.boot.retrying', '正在重试…'), false);
      try {
        if (window.qqqide && window.qqqide.boot && typeof window.qqqide.boot.retry === 'function') {
          const ok = await window.qqqide.boot.retry();
          if (!ok) {
            setStatus(_t('main.boot.stillFail', '仍无法连接，请稍后再试…'), true);
          }
        } else {
          location.reload();
        }
      } catch (e) {
        setStatus(_t('main.boot.retryFail', '重试失败：{e}').replace('{e}', (e && e.message) || ''), true);
      } finally {
        busy = false;
        btnRetry.disabled = false;
      }
    }

    btnRetry.addEventListener('click', () => tryRetry());
  })();
</script>
</body>
</html>
